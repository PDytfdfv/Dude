فتتحا متجرًا صغيرًا وعملا معًا لبناء مستقبل مشرق."}, {"type": "p", "text": "وقد تزوجا وكانا يعيشان لحظات من السعادة والبناء، يتشاركان الأحلام والطموحات، ويتعلمان الاعتماد على بعضهما البعض في كل جانب من جوانب الحياة."}, {"type": "p", "text": "بعد سنوات، أصبح لديهما عائلة وأصدقاء جدد، واستطاعا بناء حياة مليئة بالحب والسلام، تذكر منصور وزمرد دائمًا تلك الأيام الخوالي وبداية قصتهما، وكيف تغلبا على الصعوبات معًا بسبب التمسك ببعضهما والإصرار."}, {"type": "p", "text": "جلسا معًا في حديقة منزلهما، ينظران إلى غروب الشمس ويتحدثان عن مستقبلهم وحبهم الذي أثمر عن حياة جديدة ومليئة بالفرح والأمل، وانتهت قصتهما بأجمل نهاية."}, {"type": "p", "text": "--؛؛---"}, {"type": "p", "text": "ثم استيقظ منصور من نومه وتحين للرجوع إلى موطنه نعم عزيزي القارئ لم تنته القصة بعد فقد كان حلما سعيدا تمناه منصور والحقيقة غير ذلك؛ فتعال معي لنعرف تفاصيل الحقيقة."}, {"type": "p", "text": "نعم كل تلك المشاعر الجميلة ما كانت إلا حلما كان بمثابة الهدوء الذي يسبق العاصفة."}, {"type": "p", "text": "ذهب منصور إلى بيت زمرد لكي يخبرها بأن تأتي معه تاركًا تلك الأرض؛ وفي حزن وهمٍّ وقف أمام البيت ونادى، فخرجت زمرد من بيتها ممسكة بطرف الباب وعلى لسانها أطراف الحديث، ثم نظرت إليه فعلمت أنه سوف يرحل؛ وفي حزن"}, {"type": "p", "text": "قالت:"}, {"type": "p", "text": "سوف تذهب؟!"}, {"type": "p", "text": "لقد حان موعد الرحيل يا زمرد؛ قالها في حزن."}, {"type": "p", "text": "فقالت: الان؟!"}, {"type": "p", "text": "قال: نعم، هل تودين الإتيان معي فسوف أذهب ولن أعود؟!."}, {"type": "p", "text": "لكن زمرد ما كانت لتترك المكان الذي تربت به، حيث منعها من الذهاب أمر آخر لا يعلمه منصور، ولم تفصح به،"}, {"type": "p", "text": "تريدين شيئا قبل أن أرحل."}, {"type": "p", "text": "قالها منصور بعد أن رأى الحزن في عينيها وعدم قدرتها على الكلام، ثم تحاملت على نفسها وقالت له:"}, {"type": "p", "text": "أريد أن اطمئن عليك."}, {"type": "p", "text": "فقال: اطمئني علي ولا تخافي فاني على دراية في تدبير أموري فقط......."}, {"type": "p", "text": "طرئت لحظة من الصمت ، ثم نظر إليها وقال:"}, {"type": "p", "text": "فقط لا أريد إلا أن تكوني بخير وفي أمان."}, {"type": "p", "text": "فقالت: لا تقلق علي إن شاء الله سوف اكون على ما يرام، لا تقلق بشأني."}, {"type": "p", "text": "ثم انصرف وهو حزين وفي عجل، لا يريدها أن تشعر بحزن الفقد اتجاهه وهو يذهب، ولعله لن يلتقيها ثانيا."}, {"type": "p", "text": "لم تنظر ورائها وهي ترجع للوراء مغلقة الباب وجلست وظهرها يستند عليه وهي تبكي على ذهابه."}, {"type": "p", "text": "\\\" أحبب من شئت فانك مفارقه؛ هكذا هي الدنيا لن تدوم لك ولن يدوم لك احد فيها. ولن تدوم أنت لأحد؛ فالكل راحل في نهاية المطاف.\\\""}], "section": "story"}, {"id": 11, "title": "مدينة أنقرة التركية: (3/3)", "paras": [{"type": "divider"}, {"type": "p", "text": "فتحت الباب ثانيا نظرت إليه وهو يذهب امام ناظريها ثم اذرفت الدمع في حزن وقالت:"}, {"type": "p", "text": "سوف انتظر عودتك."}, {"type": "divider"}, {"type": "p", "text": "على مشارف الوطن كل شيء يبدو قاحلا، ضوء الشمس حارق وشعاعه في الأفق مسترسلا في الأزقة والحواري والطرقات، في نهار سماءه صافية، ويوم جديد قد أطلع فيه منصور بنايات المدينة من بعيد، وتزاحمت في فؤاده مشاعر الشوق مختلطة بالحزن وشعور الفقد؛ شوقها على والدته التي قد افتقدها منذ زمن وقد شغله العمل عنها."}, {"type": "divider"}, {"type": "p", "text": "عاد منصور تاركا وراءه كل شيء: صديق عمره الذي لم يجد إلا إياه أنيس غربته على أرض تلك المدينة، بضاعته التي سرقت والفتاة التي قد أحبها وتعلق بها."}, {"type": "p", "text": "ولما وصل منصور إلى قريته استوقفه احد الاطفال عندما اقترب من بيتهم، فاخبره بأن أمه مريضه، ما أن سمع الخبر حتى جرى بكل قوته لكي يرى ماذا حدث، دخل البيت وبحث عن أمه فوجدها في غرفتها وهي طريحة الفراش، ووجد أباه واقف فوق رأسها."}, {"type": "p", "text": "لما راها اغرورقت بالدموع عيناه دونما ارادة منه، أمسك بيديها فقبلها ثم وضع قبلة على جبينها."}, {"type": "p", "text": "نظرت إليه ثم قالت:"}, {"type": "p", "text": "عدت يا بني!"}, {"type": "p", "text": "- نعم عدت يا أماه، وليتني ما عدت لكي لا أراك في مثل هذه الحال."}, {"type": "p", "text": ": لا باس عليك يا بني فأنا بخير والحمد لله."}, {"type": "p", "text": "ثم نظرت إليه مبتسمة وربتت على رأسه وقالت:"}, {"type": "p", "text": "يا عزيزي إنما المرض آلة الطهر التي صنعها الله لنا لكي تنقينا وتنتشلنا من بحر معاصينا؛ هي الممحاة التي تجلو الآثام من قلوبنا، وإنما موطني هذا موطن سرور فافرح لي؛ لأن الله يحبني ولولا أنه يحبني ما ابتلاني، فكن راضيا غير قلق عليَّ."}, {"type": "p", "text": "ـــــــــــ"}, {"type": "p", "text": "\" قد يتحمل الانسان ضربة أو اثنين ولكن اذا توالت الضربات في وقت واحد فإنه حتما سيسقط أرضا؛ من ضعف النفس وحيرة العقل وتشتت الذهن، لا يجد ملجأ أو مدخلا يولي إليه وجهه، فيظل قابعًا في همومه تلك ما لم يقصد طريق النجاة؛ وأن للنجاة طريقا ميسرا سهلا، قد يكون أمام الواحد منا ولكن قد عميت البصيرة بسبب تعلقه بغيره؛ فلا تتعلق بالفاني لكي لا تفنى وتعلق بالباقي لتحيا.\""}, {"type": "p", "text": "«جميلة»"}, {"type": "p", "text": "تدعى أم منصورفي منطقتها واسمها جميلة هي امرأة كبيرة في السن، تتميز بطولها المعتدل وجسمها الممتلئ قليلاً، تشع بشعرها الفضي الطويل الذي يتدلى على كتفيها، وعيناها الخضراوان اللتان تحكيان قصص الزمن الغابر، وجهها مليء بالتجاعيد التي تروي حكايات سنوات من الكفاح والعمل الشاق."}, {"type": "p", "text": "في شبابها، كانت جميلة معروفة بجمالها اللافت، ولكن مع مرور الزمن، اكتسبت ملامحها قوة ووقارًا يعكسان تجاربها وحكمتها، ترتدي عادة ملابس تقليدية بسيطة مصنوعة من القطن، وغالبًا ما تغطي رأسها بوشاح حريري مزخرف بألوان زاهية."}, {"type": "p", "text": "تُعرف جميلة بين أهل قريتها بحنانها وكرمها، فدائمًا ما تكون حاضرة لمساعدة الآخرين وتقديم النصائح بحكمة، هي امرأة قوية وشجاعة، لم تنكسر أمام صعوبات الحياة، بل واجهتها بثبات وإصرار، تُرى دائماً وهي تعمل في الحقول أو تطبخ لأفراد أسرتها، حيث تتقن إعداد الأطباق التقليدية ببراعة."}, {"type": "p", "text": "جميلة تتحدث بصوت هادئ ومريح، لكن كلامها يحمل قوة وعمقًا، تستخدم لهجة أهل قريتها وتعابيرها التقليدية التي تنقل حكمة الأجيال، في حديثها، تذكر قصصاً من الماضي وأمثالاً شعبية تعكس ثقافة وتراث منطقتها."}, {"type": "p", "text": "داخلها، تحمل جميلة خليطاً من الفخر والحنان، وخوفاً على مستقبل ابنها منصور. لطالما كانت تفكر في كيفية تأمين حياة أفضل له، وتريد أن يتزوج وينجب وترى أطفاله، متذكرة سنوات الفقر والجوع التي عانتها في شبابها، مشاعرها الداخلية تتراوح بين الأمل والقلق، وبين الذكريات السعيدة والأوقات العصيبة."}, {"type": "p", "text": "نشأت جميلة في أسرة فقيرة، واضطرت للعمل منذ صغرها لتساعد في تأمين لقمة العيش. تجربة الفقر والجوع صنعت منها امرأة قوية ومستقلة. تزوجت صغيرة، ما جعلها تتحمل مسؤولية تربية ابنها وحدها."}, {"type": "p", "text": "جميلة تُظهر حنانها ورعايتها من خلال تفاعلها مع الآخرين، فهي تستمع إلى مشاكلهم وتقدم يد العون دون تردد. مع ابنها منصور؛ كانت دائمًا مثالاً للأم الصبورة والمضحية، وعلّمته قيم العمل الجاد والكرم."}, {"type": "divider"}, {"type": "p", "text": "نترك منصور وأمه ونتجه لمدينة قونيا حيث نرى الشيخ علاء الدين وهو جالس بعد صلاة العصر يعظ الناس ويذكرهم بتقوى الله؛ ثم شرع في ما كان قد بدأ:"}, {"type": "p", "text": "جزيرة الدجال"}, {"type": "p", "text": "بعد مغرب الشمس"}, {"type": "p", "text": "وفي ليل سماءه ظلماء وقمره مختفٍ تماماً؛ وفي مشهد مهيب يجعل الناظر يتوقف من الصدمة، ذلك الدخان الذي يحاوط المكان، الرائحة غريبة، لا نرى شيئا من حيث نستمع لخطوات تتسارع، شعرنا بالخوف قليلا وكنا نريد الرجوع ولكن الجو لا يسمح بذلك."}, {"type": "p", "text": "ها قد توقفنا جميعا في ذهول عندما رأين تلك الدابة الغريبة، وخفنا أن تكون شيطانة أو حيوانا مفترسا."}, {"type": "p", "text": "فقلنا: ويلك ما أنت؟!"}, {"type": "p", "text": "أجابت في صوت غريب مخيف:"}, {"type": "p", "text": "- أنا الجساسة"}, {"type": "p", "text": "قلنا وما الجساسة؟!"}, {"type": "p", "text": "لم تعرب عن نفسها ولم تجبنا في ماهيتها بشيء نطمئن به ولكنها دلتنا على شخص ينتظرنا داخل الدير فقالت:"}, {"type": "p", "text": "- أيها القوم انطلقوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق."}, {"type": "p", "text": "لما سمت لنا ذلك الرجل بالدير فرقنا^18، منها أن تكون شيطانة."}, {"type": "p", "text": "فانطلقنا مسرعين اتقاء ذلك الكائن الغريب، حتى دخلنا الدير،"}, {"type": "p", "text": "كنا خائفين محتارين مما شهدنا وفي ذهول من ذلك المكان، حتى دخلنا الدير، كهف داخل جزيرة، يشبه بعض الأديرة من الداخل، له اتساع كبير ولكنه يبدو مهجورا، قلت في نفسي كيف يجلس إنسان في هذا المكان القديم المتروك."}, {"type": "p", "text": "وإذا بنا في عالم من التفكير فيما نحن فيه، ومن ذا يكون الذي يطلبنا في هذا المكان ونحن كذلك إذا فيه أعظم إنسان رأيناه قط خلقًا وأشده وثاقًا."}, {"type": "p", "text": "رجل عظيم الجسد، ممسوخ الخلقة ذا وجهة فظ كبير، عيناه بهما عور، اي بهما عيبا في كلتاهما، عينه اليمنى ممسوحة غير ناتئة، مطموسة لا يرى بها، والاخرى ناتئة بارزة طافية كعنقود عنب برزت منه حبة؛ فهي بمجموعها كبلورة زجاجة لونها أخضر، وعليها ظفرة غليظة^19 ولا يرى إلا بها."}, {"type": "p", "text": "وذا رأس كأنه أصلة^20، وشعر رأسه كأنه أغصان شجرة وهو جفال الشعر^21 وهو حبك^22، قطط^23 ، متكسر نازلا على جسده."}, {"type": "p", "text": "ولونه اقمر^24 هجانا^25"}, {"type": "p", "text": "جسده فيلمانيا او بيلمانيا اي ضخم الجثة، قصير الطول وافحج بين رجليه اي اذا مشى قدميه بعيدة عن بعض."}, {"type": "p", "text": "خلقته رجس على رجس، مجموعة يداه إلى عنقه ما بين ركبتيه إلى كعبيه بالحديد."}, {"type": "p", "text": "\\\"\\\" \\\"\\\" \\\"\\'\\'\\'\\'\\'\\'"}, {"type": "p", "text": "نترك قونيا والشيخ علاء الدين لننطلق إلى أنقرة لنعرف ما فعل منصور وما مصير الأحداث آن ذاك فلتتابع عزيزي القارئ:"}], "section": "story"}, {"id": 12, "title": "في مدينة أنقرة التركية الساعة الثالثة عصرا", "paras": [{"type": "p", "text": "كانت أنقرة تغرق في وهج الظهيرة، والشمس تنثر أشعتها الحارقة بلا هوادة، بدا الغمام في الأفق كظل باهت يراوغ عين الناظر، ولكنه لم يخفف من وطأة الحر، وسط هذا الجو اللاهب، ومن طرف الطريق، ظهر رجل يسعى ببطء، متعثر الخطى، كأنه يحمل ثقل العالم على كتفيه."}, {"type": "p", "text": "منصور، الذي كان واقفًا تحت شجرة قليلة الظل، رأى الرجل قادمًا من بعيد. خيل إليه أنه يعرف تلك الخطى المتعبة، وأنها تحمل في طياتها قصة قديمة. ظن أنه أمير، صديقه الذي فارقه منذ زمن، ولكنه لم يصدق عينيه حتى اقترب الرجل أكثر. وعندما تأكد من هويته، تملكه شعور عارم بالفرح، عانقه بحرارة، وكأن الزمن لم يمر بينهما."}, {"type": "p", "text": "قال منصور، وهو يحاول أن يلتقط أنفاسه من شدة التأثر:"}, {"type": "p", "text": "\\\"كيف حالك يا أمير؟ طمئنني عليك؟\\\""}, {"type": "p", "text": "صمت أمير قليلاً، وعيناه تبحثان في الأفق عن شيء مفقود، ثم قال بصوت هادئ مشوب بالحزن:"}, {"type": "p", "text": "\\\"إنني بخير، والحمد لله.\\\""}, {"type": "p", "text": "لكن منصور، الذي عرف صديقه منذ زمن، شعر أن ثمة أمرًا خفيًا يثقل كاهله. فاقترب منه أكثر، وقال بلهفة:"}, {"type": "p", "text": "\\\"ماذا هناك يا أمير؟ ماذا حدث؟ هل حدث مكروه لأحد؟ وكيف حال زمرد؟ هل رأيتها؟\\\""}, {"type": "p", "text": "أجاب أمير بصوت متهدج، وقد ارتسمت على وجهه علامات الحزن والضيق:"}, {"type": "p", "text": "\\\"قتلت!!\\\""}, {"type": "p", "text": "تسمر منصور في مكانه، غير مصدق لما سمع. قال بصوت مرتجف:"}, {"type": "p", "text": "\\\"أعد عليَّ ما قلت.\\\""}, {"type": "p", "text": "أجاب أمير بنبرة حزن وقلق:"}, {"type": "p", "text": "\\\"لقد قتلها اللصوص الذين سرقونا قبل ذلك. لما تيقنوا أنها لم تعد كما كانت معهم في السابق، وأنها أصبحت تعرفنا ولها علاقة بنا. ولكن سبب القتل غير ذلك.\\\""}, {"type": "p", "text": "أمسك منصور بذراعي أمير، وقال بانفعال:"}, {"type": "p", "text": "\\\"وما السبب يا أمير؟ ما السبب يا صديقي؟!\\\""}, {"type": "p", "text": "تنهد أمير وقال:"}, {"type": "p", "text": "\\\"ضغطوا عليها لتعود للعمل معهم، فرفضت. حذروها، فتمادت في الهروب منهم. أمسكوا بها وقتلوها.\\\""}, {"type": "p", "text": "تركه منصور وابتعد، يمشي بخطى مثقلة بالصدمة والحزن، وقال لنفسه بصوت مسموع:"}, {"type": "p", "text": "\\\"ماتت؟!!!... كل ذلك بسببي، ما كان ينبغي عليَّ أن أتركها وأرحل.\\\""}, {"type": "p", "text": "لحق به أمير، وأمسك بذراعيه وقال:"}, {"type": "p", "text": "\\\"كادوا يقتلونني أو يحبسوني عندهم أنا الآخر لولا أني جئت فارًا من هناك. لا مال لدي، فما كان مني إلا أن تحسست طريق العودة.\\\""}, {"type": "p", "text": "لم يرد منصور، ومضى في طريقه، شارد الذهن، غير منتبه لما قاله أمير."}, {"type": "divider"}, {"type": "p", "text": "\\\"لا بد أن تفقد في هذه الحياة بعض الأشياء، أو الأشخاص؛ هذه رسالة لك فحواها: لا يجب أن تتعلق بأحد؛ فأحبب من تشاء وما تشاء، ولكن عليك أن تعرف أن ثمة يومًا وكل شيء راحل.\\\""}, {"type": "divider"}, {"type": "p", "text": "كان منصور جالسًا ناحية الضفة، يتأمل البحر، صامتًا، يغمره الحزن. أثناء ذلك، أتى صديقه أمير، فنظر إليه من مجلسه، فقام واحتضنه، ثم بكى وقال:"}, {"type": "p", "text": "\\\"إن حالي لا يسر أحدًا، كما تراني حزينًا.\\\""}, {"type": "p", "text": "فقال له أمير:"}, {"type": "p", "text": "\\\"ارفق بحالك، فإلى متى تظل هكذا؟!\\\""}, {"type": "p", "text": "أجابه منصور:"}, {"type": "p", "text": "\\\"لا أعرف، ولكن ما مررت به كان صعبًا عليَّ.\\\""}, {"type": "p", "text": "قال له أمير:"}, {"type": "p", "text": "\\\"لا عليك، دعك من كل ذلك. عليك أن تخرج مما أنت فيه من الكآبة والحزن. كلنا مهما طال بنا المكوث فسوف نرحل لا محالة.\\\""}, {"type": "divider"}, {"type": "p", "text": "نترك منصور قابعا في حزنه على فقد زمرد ونذهب إلى قونيا لكي نسمع ذلك الكلام العجيب الذي ذكره الشيخ علاء الدين على لسان الصحابي تميم الداري:"}], "section": "story"}, {"id": 13, "title": "وسط البحر - جزيرة الدجال — فجرًا", "paras": [{"type": "p", "text": "ذهول يبدو على أعين القوم، تساؤلات تسقط على الأفئدة كالسهام، ولحظات من الصمت يقطعها أحدنا بقوله لذلك الكائن ونحن في إثره:"}, {"type": "p", "text": "قلنا: ويلك ما أنت؟"}, {"type": "p", "text": "لم يجب عن سؤالنا كما فعلت الدابة من قبل، ولكنه نظر إلينا ولولا انه مقيد لما استطعنا محاورته من خوفنا على أنفسنا:"}, {"type": "p", "text": "قال: قد قدرتم على خبري، فأخبروني ما أنتم؟"}, {"type": "p", "text": "قلنا: نحن أناس من العرب، ركبنا في سفينة بحرية، فصادفنا البحر حين «اغتلم» هاج واضطربت أمواجه"}, {"type": "p", "text": "فلعب بنا الموج شهرًا، ثم «أرفأنا» قرَّبنا إلى جزيرتك هذه،"}, {"type": "p", "text": "فجلسنا في أقربها، ولما دخلنا الجزيرة استقبلتنا دابة كثير الشعر، لا يدري ما قُبله من دبره من كثرة الشعر."}, {"type": "p", "text": "فقلنا: ويلك ما أنت؟"}, {"type": "p", "text": "فقالت: أنا الجساسة."}, {"type": "p", "text": "قلنا: وما الجساسة؟"}, {"type": "p", "text": "قالت: اعمدوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق."}, {"type": "p", "text": "فأقبلنا إليك سراعًا، وفزعنا منها، ولم نأمن أن تكون شيطانة."}, {"type": "p", "text": "فقال: أخبروني عن نخل بيسان."}, {"type": "p", "text": "قلنا: عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال: أسألكم عن نخلها، هل يثمر؟"}, {"type": "p", "text": "قلنا له: نعم."}, {"type": "p", "text": "فلما أخبرناه بذلك، وثب وثبة كاد أن يخرج من الجدار"}, {"type": "p", "text": "ثم قال : أما لو قد أذن لي في الخروج"}, {"type": "p", "text": "لوطئت البلاد كلها غير طيبة، ثم نظر إلينا بعد أن هدأ من وثبته وقال:"}, {"type": "p", "text": ": أما إنه يوشك أن لا تثمر."}, {"type": "p", "text": "قال: أخبروني عن بحيرة الطبرية."}, {"type": "p", "text": "قلنا: عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال: هل فيها ماء؟"}, {"type": "p", "text": "قالوا: هي كثيرة الماء."}, {"type": "p", "text": "قال: أما إن ماءها يوشك أن يذهب."}, {"type": "p", "text": "فقال: أخبروني عن عين زغر."}, {"type": "p", "text": "قالوا: عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال: هل في العين ماء؟ وهل يزرع أهلها بماء العين؟"}, {"type": "p", "text": "قلنا له: نعم، هي كثيرة الماء، وأهلها يزرعون من مائها."}, {"type": "p", "text": "فلما أخبرناه عن شأنها وثب وثبة كاد أن يخرج من وراء الجدار."}, {"type": "p", "text": "قال: أخبروني عن نبي الأميين ما فعل؟"}, {"type": "p", "text": "قالوا: قد خرج من مكة ونزل يثرب."}, {"type": "p", "text": "قال: أقاتله العرب؟"}, {"type": "p", "text": "قلنا: نعم."}, {"type": "p", "text": "قال: كيف صنع بهم؟"}, {"type": "p", "text": "فأخبرناه أنه قد ظهر على من يليه من العرب وأطاعوه."}, {"type": "p", "text": "قال لهم: قد كان ذلك؟"}, {"type": "p", "text": "قلنا: نعم."}, {"type": "p", "text": "قال: أما إن ذلك خير لهم أن يطيعوه."}, {"type": "p", "text": "وإني مخبركم عني، إني أنا المسيح، وإني أوشك أن يؤذن لي في الخروج، فأخرج فأسير في الأرض، فلا أدع قرية إلا هبطتها في أربعين ليلة، غير مكة وطيبة."}, {"type": "p", "text": "فهما محرمتان علي كلتاهما، كلما أردت أن أدخل واحدة أو واحدًا منهما استقبلني ملك بيده السيف صلتًا يصدني عنها، وإن على كل نقب منها ملائكة يحرسونها."}, {"type": "divider"}, {"type": "p", "text": "ها قد طلعت الشمس وفج الضوء من كل مكان، وكانت السماء صافية والجو صافٍ"}, {"type": "p", "text": "لقد ركبنا سفينتنا وانطلقنا سراعا كما عدنا تاركينا ورائنا ذلك المخلوق العجيب، وتلك الجزيرة الغريبة ونحن لا ندري كيف يكون طريق العودة."}, {"type": "divider"}, {"type": "p", "text": "لقد وقع في نفسي إيما إيقاع وتملك قلبي ذلك الخبر حتى طغى على عقلي التفكير فيه حيث لا مكان لغيره ليجد طريقه ليزاحم ذلك الذي حدث."}, {"type": "p", "text": "أما وإنه قد حدث ما حدث فأن ذلك كان برهان على صدق ذلك النبي؛ رسول الاميين، وإنني إن لم أصدق به لأكونن من الخاسرين."}, {"type": "p", "text": "عزمت أمري واستقر على الذهاب نحو المدينة لأسلم أمري لرسول الله وذا إن قدر الله لي الرجوع إلى بلادي."}, {"type": "divider"}, {"type": "p", "text": "اخذ منا طريق العودة أقل مما أخذت الرحلة وقد وصلنا بعد أيام قلائل، وكانت تلك الأيام غير التي عهدناها قبل انتهاء تلك الرحلة، أيام لا رعود فيها ولا برق والموج هادئ، ولكنا لم نقدر على تمييز الطريق، فلا ندري من أي الطرق جئنا ويكأننا خرجنا من فوهة زمنية."}, {"type": "p", "text": "وصلنا الوطن بعد رحلة طويلة، قد رأينا فيها عجائب الأمور وغرائبها، بعد ذاك جمعت امتعتي وخرجت باتجاه المدينة لأبايع «النبي صلى الله عليه وسلم» وأسلم وأتبع هذا الدين."}, {"type": "divider"}, {"type": "p", "text": "انتهى الشيخ علاء من درس اليوم الذي أخبرهم فيه بعضا من قصة تميم الداري وقومه، ولكن كيف ستتغير الأمور بعد هذه اللحظة؟!"}, {"type": "p", "text": "سنعرف ذلك عزيزي القارئ عندما نتابع القراءة لننتقل إلى مدينة أنقرة؛ لذا فلتحضر فنجان قهوتك ولتكمل الرحلة."}, {"type": "divider"}], "section": "story"}, {"id": 14, "title": "تركيا- انقرة", "paras": [{"type": "p", "text": "بلباس من الحزن، وأسى القلب، تلك الملامح المجهدة، من واقع الحياة، وشدة العيش، ووفاة الأقارب، وتذكر الماضي، وتفكر المستقبل؛ كل ذلك الألم جعل منصور يتوقف عن أشياء كثيرة حتى العمل."}, {"type": "p", "text": "لقد كلمه أباه في امر الخروج للعمل؛ لما رأى في خروجه للعمل ما سوف يجعله يخرج من الحالة التي هو فيها، فقد طال الوقت وهو كذلك."}, {"type": "p", "text": "\" احيانا لابد ان نجد شيئا يخرجنا من حزننا، ربما يحتاج الانسان إلى ما يشغل تفكيره كما يحتاج إلى العزلة في بعض الاوقات.\\\""}, {"type": "p", "text": "من يكون أبو منصور « الحلاج»؟!!"}, {"type": "divider"}, {"type": "p", "text": "الحلاج:"}, {"type": "p", "text": "رجل عجوز تجاوز السبعين من عمره، يبلغ طوله حوالي 170 سم، ذو بنية نحيلة وملامح وجه مليئة بالتجاعيد التي تروي حكايات عمر طويل من التجارب. بشرته سمراء تشوبها علامات الزمن، وشعره أبيض كالثلج، ولحيته الطويلة تزيده وقارًا. عيناه رماديتان باهتتان، تحملان نظرة تأمل وحكمة عميقة، وتظهر في بعض الأحيان بريقًا من الشغف القديم. يمشي مستندًا على عصا خشبية منحوتة بعناية، تحمل نقوشًا تذكارية من أيام شبابه."}, {"type": "p", "text": "الحلاج يتمتع بشخصية هادئة ومتزنة، عرف بالحنكة والحكمة التي اكتسبها من سنوات طويلة قضاها في التجارة والتنقل بين البلدان. كان يمتاز بذكاء خارق وفطنة جعلته واحدًا من أنجح التجار في زمانه، لكنه كان أيضًا يتمتع بنزاهة وكرم جعلا الجميع يثقون به ويحترمونه. في شبابه، كان معروفًا بشجاعته وروح المغامرة، لكن مع تقدم العمر، أصبح أكثر ميلًا للتأمل والفلسفة."}, {"type": "p", "text": "نشأ الحلاج في بيئة تجارية بحتة، حيث كانت عائلته تعمل في التجارة لعدة أجيال. تعلم أصول التجارة منذ نعومة أظفاره، وانطلق في رحلات تجارية عبر البحار والصحارى، مما أكسبه خبرة واسعة وثقافة متنوعة."}, {"type": "p", "text": "عندما بلغ الحلاج سن السبعين، قرر التقاعد وترك إدارة الأعمال لولده منصور، الذي كان قد أعده جيدًا لهذا الدور منذ صغره. كان دائمًا ما يقول بنبرة واثقة ومليئة بالحكمة: \\\"التجارة ليست مجرد بيع وشراء، بل هي بناء جسور بين القلوب والثقافات.\\\""}, {"type": "p", "text": "على مر الوقت يظهر الحلاج كمرشد وناصح لابنه منصور، يقدم له النصائح القيمة ويساعده في تجاوز التحديات التي تواجهه في إدارة الأعمال. ورغم تقاعده، يظل الحلاج نشطًا في مجتمعه، يشارك في حل النزاعات ويقدم المساعدة للمحتاجين، مما يجعله شخصية محبوبة ومحترمة من قبل الجميع."}, {"type": "divider"}, {"type": "p", "text": "قد عاد الصديقان كما البارحة؛ وعادة المياه لمجاريها؛ وقلد خرج منصور للعمل وبالتالي قد خرج قليلا من حزنه؛ ولكن تبقى الذاكرة كل فترة تلقي له بالذكريات كالسهام."}, {"type": "p", "text": "كانت صحة والد منصور تزداد سوءا يوما بعد يوم حتى لم يعد يستطيع أن يتحرك كما السابق."}, {"type": "p", "text": "انزعج منصور وحزن لمرض أبيه وهو غير قادر على فعل شيء من أجله."}, {"type": "p", "text": "ففكر في ان يترك العمل ليجلس بجوار ابيه لكي يرعاه ولكن أباه رفض واخبره انه بخير ولا يحتاج لاحد في جواره، وطلب منه ان يستمر في عمله ولا يتركه ولا يقلق، فكل شيء بقدر."}, {"type": "p", "text": "استمع منصور لكلام ابيه واستمر في عمله، وكان يرجع في وقت متأخر من الليل فيدخل الى غرفته لكي يطمئن عليه، مرت على ذلك الاسابيع؛ حتى جاء اليوم الذي كانت فيه الصدمة لمنصور."}, {"type": "p", "text": "خرج من منزله كعادته وبعد أن أعطى الدواء لأبيه، واطمئن عليه، و لما كاد ان ينقضي النهار، جاءه الخبر المفزع بشان أبيه، لقد علم أن اباه يلفظ انفاسه الاخيرة، وقد طلب ان يراه قبل ان يرحل الى غير رجوع."}, {"type": "p", "text": "\\\"حقا انه لأمر محزن وكئيب؛ ان تظل وحيدا في هذه الحياة؛ يتيما لا أب ولا أم ولا حبيب، ولكن يتبقى شيء واحد هو أنك لا تستطيع إلا أن تحب ولكنك قادر على ألا تتعلق .\\\""}, {"type": "divider"}, {"type": "p", "text": "وبينما كانت مواضيع الشيخ علاء الدين تزداد قوة، بدأت القصة تظهر شيئا فشيئا، لذا دعنا عزيزي القارئ ننتقل لمكان وزمان أخر حتى نصل للنهاية، ولا تنسى مشروبك المفضل واستأنف ما بدأناه لتعرف الوجه الاخر للحقيقة:"}], "section": "story"}, {"id": 15, "title": "المدينة النبوية.9 هـ", "paras": [{"type": "p", "text": "أقبلت على قومي وحدثتهم عن ما وقع من حديثنا فكان منهم من قبل مني ومن ترك، فمن قبل أعد العدة وذهب وافدا اتجاه طيبة، قررنا أن تلك البلد هي الموطن الاخر لنا، لا نعيش إلا في تلك الديار ولا نجاور إلا نبي الله."}, {"type": "p", "text": "وفي يوم شديد البرد، هادئ، ليل ذا سماء غائمة، طريقات لا يرى إلا ضياء القمر الذي تطوع لينير عتمة الطريق، همتنا الوصول في أسرع وقت فما أشد شعورنا من الشوق في تلك اللحظات، من بعيد يرى بعض ضوء النيران أمام البيوت، الطرقات خالية من الخطوات إلا من قليل، وأنت تسري ليلا تسمع من حيث لا ترى أصوت بعض الناس القوية وبعضها الصارخ في الهواء، وأخر خافت، في مغيب شعاع الشمس وسط ضياء القمر الخافت، تقترب قليلا لتشم رائحة احتراق يتبعها صوت حطب يتكسر لسامرة عشاءٍ لنفر من القوم، وكأنك لتتذوق طعم عشاءهم من رائحته، تتمشي متجاوزا إياهم لترى المسجد النبوي؛ ما أجمله، وما جماله إلا مباركة الله لنبيه -صلى الله عليه وسلم- وبركته لهذه المدينة، وإني لأشعر بروحانية المكان؛ ولا أدري أقوم يشعرون بذا؟!."}, {"type": "p", "text": "وصلنا مدينة رسول الله «صلى الله عليه وسلم» ثم ما لبثت أن وضعت متاعي وذهبت أطلبه، دلني بعضهم على أنه ببيته وسوف يخرج لصلاة العشاء."}, {"type": "p", "text": "هممت أن ألحقه لأقص عليه ما كان من أمري، حتى لقيته؛"}, {"type": "p", "text": "وما رأيت جمال قط كجمال ذلك النبي، لكأن القمر خالطني فيه بل استقر القمر عندي ولم يستقر هو أي جمال النجوم ذات الأنوار العلية يعدل."}, {"type": "p", "text": "حتى إذا قبلته سلمت عليه « صلى الله عليه وسلم» وقصصت له ما كان من قصص، ودار بيننا حديث طويل تأخر بسببه عن الصلاة."}, {"type": "divider"}, {"type": "p", "text": "على الجانب الأخر كانت السيدة فاطمة بنت قيس الفهرية، إحدى المهاجرات، كانت في بعض شأنها حين"}, {"type": "p", "text": "سمعت نداء المنادي، مُنَادِى رَسُولِ اللَّهِ صلى الله عليه وسلم ، يُنَادِي؛:"}, {"type": "p", "text": "( الصَّلاَةَ جَامِعَةً )."}, {"type": "p", "text": "فَخَرَجَتْ إِلَى الْمَسْجِدِ فَصَلَّت مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم ، فَكانت فِى صَفِّ النِّسَاءِ الَّتِى تَلِى ظُهُورَ الْقَوْمِ ، فَلَمَّا قَضَى رَسُولُ اللَّهِ صلى الله عليه وسلم صَلاَتَهُ جَلَسَ عَلَى الْمِنْبَرِ وَهُوَ يَضْحَكُ ،"}, {"type": "p", "text": "فَقَالَ: لِيَلْزَمْ كُلُّ إِنْسَانٍ مُصَلاَّهُ."}, {"type": "p", "text": "ثُمَّ قَالَ: أَتَدْرُونَ لِمَ جَمَعْتُكُمْ ؟"}, {"type": "p", "text": "قَالُوا : اللَّهُ وَرَسُولُهُ أَعْلَمُ ."}, {"type": "p", "text": "قَالَ :"}, {"type": "p", "text": "« إِنِّى وَاللَّهِ مَا جَمَعْتُكُمْ لِرَغْبَةٍ وَلاَ لِرَهْبَةٍ ، وَلَكِنْ جَمَعْتُكُمْ لأَنَّ تَمِيماً الدَّارِىَّ كَانَ رَجُلاً نَصْرَانِيًّا فَجَاءَ فَبَايَعَ وَأَسْلَمَ ، وَحَدَّثَنِى حَدِيثاً وَافَقَ الَّذِى كُنْتُ أُحَدِّثُكُمْ عَنْ مَسِيحِ الدَّجَّالِ» ....."}, {"type": "divider"}, {"type": "p", "text": "تسمع السيدة فاطمة مع النساء خطبة النبي وهو يسرد تلك التفاصيل،"}, {"type": "p", "text": "وترى تفاعل النبي مع ما يقول، حتى أنها تصف ذلك مما ترى فتقول:"}, {"type": "p", "text": ": قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم - وَطَعَنَ بِمِخْصَرَتِهِ فِى الْمِنْبَرِ --"}, {"type": "p", "text": ": هَذِهِ طَيْبَةُ هَذِهِ طَيْبَةُ هَذِهِ طَيْبَةُ^26."}, {"type": "divider"}, {"type": "p", "text": "وأخذ رسول الله «صلى الله عليه وسلم» يحدث القوم عن ما حدث بتفصيل ما حدثته، ثم قال في أخر كلامه:"}, {"type": "p", "text": ": أَلاَ هَلْ كُنْتُ حَدَّثْتُكُمْ ذَلِكَ ؟."}, {"type": "p", "text": "فَقَالَ النَّاسُ :نَعَمْ ."}, {"type": "p", "text": "فَإِنَّهُ أَعْجَبنِى حَدِيثُ تَمِيمٍ أَنَّهُ وَافَقَ الَّذِى كُنْتُ أُحَدِّثُكُمْ عَنْهُ وَعَنِ الْمَدِينَةِ"}, {"type": "p", "text": "وَمَكَّةَ ، أَلاَ إِنَّهُ فِى بَحْرِ الشَّامِ أَوْ بَحْرِ الْيَمَنِ ، لاَ بَلْ مِنْ قِبَلِ الْمَشْرِقِ ما^27"}, {"type": "p", "text": "هُوَ ، مِنْ قِبَلِ الْمَشْرِقِ مَا هُوَ ، مِنْ قِبَلِ الْمَشْرِقِ مَا هُوَ. ..."}, {"type": "divider"}, {"type": "p", "text": "\\\"\\\" \\\"\"\\\" \\\"\\\" \\\"\\\""}, {"type": "divider"}, {"type": "p", "text": "الحنين"}, {"type": "p", "text": "في البدء كان الغمام يتراكم جزءا فجزء إلى أن تجمع ليغطي سائر الشوارع والاماكن حتى لكأن الليل عما المكان."}, {"type": "p", "text": "كان ذلك قبيل المغرب بساعة، كنت انا حينها اتمشى في الطرقة عائدا إلى المنزل وذلك بعد ان خرجت من المسجد كعادتي."}, {"type": "p", "text": "وانا عائد اذ بي أرى شخصا يبدو أنه متسول، مددت يدي في جيبي لأخرج له بعضا من المال؛ ولكنه ردها ثم نظر الي وقال:"}, {"type": "p", "text": "وفر نقودك لنفسك فأنا لست بمتسول، وانما تلك طينتي منها خلقت وها هنا ولدت وهنا سأموت."}, {"type": "p", "text": "ثم نظر الي باقتضاب وجهه ثم قال في ابتسام جعلني اظنه مجنونا ليس متسولا: أذهب وابحث عن طينتك التي خلقت منها، عندها سترتاح."}, {"type": "p", "text": "ثم ذهب في حال سبيله وهو يردد:"}, {"type": "p", "text": "خلقت من طين الهوى"}, {"type": "p", "text": "والحب معجون بماء الجرح"}, {"type": "p", "text": "فما للقلب من مثوى"}, {"type": "p", "text": "سوى أرض روائحها الفرح"}, {"type": "p", "text": "فما اختفى بين الزحام ولم اره بعد ذلك، ظننت بأن هذا الرجل كان مجنونا ولكن قلبي لم يخلو من شعور إنما كلماته لا تخلُ من حكمة؛ ولكني لم استقي منها إلا ما هو سطحي، لم اغص في أعماق الكلام، ثم ذهبت مستكملا طريقي إلى المنزل."}, {"type": "p", "text": "\\"}, {"type": "p", "text": "Top of Form"}, {"type": "p", "text": "Bottom of Form"}, {"type": "p", "text": "كان الشيخ علاء الدين يسترسل في الحديث عن الصحابي تميم الداري الذي ذهب للنبي وأخبره بكل شيء حدث، ومع هذا العلامة والفتنة الكبرى التي رآها لم يكن ذلك سوى بداية لما سيحدث لاحقا."}, {"type": "p", "text": "وأول عواصف علامات نبوءة دابق^28 - الملحمة الكبرى- واقتراب الساعة؛ هي وفاة النبي صلى الله عليه وسلم."}, {"type": "p", "text": "فهل ستتغير الأمور بعد هذه اللحظة ولا شك أنها ستتبدل فوفاة النبي أمر عظيم كانت وطأته أشد على أفئدة الصحابة فدعنا نكتشف الأمر:"}], "section": "story"}, {"id": 16, "title": "وفاة نبي الله ١١هـ", "paras": [{"type": "p", "text": "قال تعالى في سورة النازعات -- آية٤٢"}, {"type": "p", "text": "(يَسۡـَٔلُونَكَ عَنِ ٱلسَّاعَةِ أَيَّانَ مُرۡسَىٰهَا)"}, {"type": "p", "text": "ثم قال تعالى : ( يسألونك عن الساعة أيان مرساها فيم أنت من ذكراها إلى ربك منتهاها ) أي : ليس علمها إليك ولا إلى أحد من الخلق ، بل مردها ومرجعها إلى الله - عز وجل - فهو الذي يعلم وقتها على التعيين."}, {"type": "divider"}, {"type": "p", "text": "فعلم الساعة غيب اختص الله به، لا يطلعه أحد من خلقه إلا من أرتضى من رسول."}, {"type": "p", "text": "فإن الله عز وجل قد أطلع النبي على بعض أنباء الغيب ولكن تبقى الساعة موعدها عند ربي لا يجليها لوقتها إلا هو، فلا يعلمها أحد إلا الله سبحانه وتعالى."}, {"type": "p", "text": "ولقد كان النبي صلى الله عليه وسلّم في غزوة تبوك فأتاه أحد من أصحابه فأخبره النبي ببعض ما سوف يحدث في المستقبل إلى قيام الساعة، ومع علمه بتفاصيل تلك الأنباء الواردة في الأحاديث لكنه لا يعلم متى تقوم الساعة فهو سؤال لا يعلم أجابته إلا الله تعالى."}, {"type": "divider"}, {"type": "p", "text": "غزوة تبوك"}, {"type": "p", "text": "السنة التاسعة من الهجرة."}, {"type": "p", "text": "كانت تبوك أخر غزوة خرج فيها النبي صلى الله عليه وسلم بنفسه، وكانت في رجب في سَنةِ تسعة من الهِجرةِ، وكانت مع الرُّومِ، وتبوكُ في أقصى شَمالِ الجزيرةِ العربيَّةِ في مُنتصَفِ الطَّريقِ إلى دِمشقَ، وتبعد عن المدينة 778 ميلا، وكانت من ديار قضاعة الخاضعة لسلطان الروم."}, {"type": "divider"}, {"type": "p", "text": "لقد اخبر رسول الله صلى الله عليه وسلم عن وفاته ولقد اخبر بأن ذلك سيكون من ضمن علامات قرب الملاحم وعلامات الساعة الكبرى."}, {"type": "p", "text": "حيث كان صلى الله عليه وسلم في غزوة تبوك يتدبر في شئون محاربة الروم، وقد كان في خيمته إذ أتاه سيدنا عوف بن مالك رضي الله عنه؛:"}, {"type": "p", "text": ": أتيتُ رسولَ اللَّهِ صلَّى اللَّهُ علَيهِ وسلَّمَ، وَهوَ في غزوةِ تبوكَ، وَهوَ في خباءٍ من أدَمٍ^29"}, {"type": "p", "text": "فجلستُ بفناءِ الخباءِ^30، اي امام مدخل الخيمة التي فيها رسول الله صلى الله عليه وسلم، ثم سلمت عليه"}, {"type": "p", "text": "فقالَ رسولُ اللَّهِ صلَّى اللَّهُ علَيهِ وسلَّمَ: ادخُل يا عَوفُ."}, {"type": "p", "text": "فقلتُ: بِكُلِّي يا رسولَ اللَّهِ؟"}, {"type": "p", "text": "فلقد كان الخباء صغيرا لذا طرحت عليه ذلك لكي لا أزعج رسول الله في خيمته."}, {"type": "p", "text": "قالَ: بكُلِّكَ،"}, {"type": "p", "text": "ثمَّ قالَ: يا عَوفُ احفَظ خلالًا ستًّا، بينَ يديِ السَّاعةِ:"}, {"type": "p", "text": "وتلك ست علامات لابد كائنة قبل قيام الساعة"}, {"type": "p", "text": "إحداهُنَّ مَوتي،"}, {"type": "p", "text": "قال عوف: فوجمتُ^31 عندَها وجمةً شَديدةً، دخل علي من الهم والحزن حتى استبكيت لقول النبي صلى الله عليه وسلم بموته، حتى جعل يسكتني، وإذا إنا في جمرة حزني لسماع خبر وفاته إذ قال لي اعدُد العلامات، وقل هذه الأولى."}, {"type": "p", "text": "فقالَ: قُل: إحدى."}, {"type": "p", "text": "ثمَّ فَتحُ بيتِ المقدسِ،"}, {"type": "p", "text": "ثمَّ داءٌ يظهرُ فيكُم يستشهدُ اللَّهُ بِهِ ذراريَّكم، وأنفسَكُم، ويزَكِّي بِهِ أعمالَكم،"}, {"type": "p", "text": "ثمَّ تَكونُ الأموالُ فيكم، حتَّى يُعطى الرَّجلُ مائةَ دينارٍ، فيظلَّ ساخطًا."}, {"type": "p", "text": "وفتنةٌ تَكونُ بينَكُم لا يَبقى بيتُ مسلِمٍ إلَّا دخلتهُ."}, {"type": "p", "text": "وهذه الفتن اختبارٌ وابتلاءٌ لا يَبْقى بَيتٌ من العربِ إلَّا دخَلَتْه، وانتشَرَتْ"}, {"type": "p", "text": "فيه؛ قيل: وهذه الفِتْنةُ هي فِتنةُ قَتْلِ عُثْمَانَ رضي الله عنه، وقيلَ: هي الفِتنةُ الَّتي وقعَتْ بين عليٍّ ومُعاوِيَةَ رضي الله عنهُما؛ فقد عمَّ شرُّها ودخَلَ بُيوتَ العَربِ والمسلِمينَ، وافتَرَق فيها المُسلِمونَ فِرْقَتينِ."}, {"type": "p", "text": "والسَّادسةُ: \\\" ثمَّ تَكونُ بينَكُم وبينَ بَني الأصفرِ^32 هُدنةٌ^33، فيغدِرونَ بِكُم^34، فيَسيرونَ إليكم في ثمانينَ غايةٍ، تَحتَ كلِّ غايةٍ اثنا عشرَ ألفًا^35."}, {"type": "p", "text": "قلت: وما الغاية؟"}, {"type": "p", "text": "قال: الراية."}, {"type": "divider"}, {"type": "p", "text": "وفسطاط المسلمين يومئذ في أرض يقال لها الغوطة، في مدينة يقال لها دمشق."}, {"type": "p", "text": "من خير مدائن الشام."}, {"type": "p", "text": "> > > نعود الان بالزمن إلى المستقبل؛ وبالتحديد مدينة أنقرة لنعرف ما حدث > هناك؛ فهل ستغير الأحدث من مصير منصور ومن معه أم أن النهاية غير > متوقعة؟ > > هذا ما سنكتشفه سوياً عزيزي القارئ فتتابع القراءة:"}, {"type": "p", "text": "مدينة أنقرة"}, {"type": "p", "text": "لقد اختليت بنفسي كثير واعتزلت الناس، حتى تركت عملي وما يمت له بصلة رغم بقاء امير يمتهن بتلك المهنة إلى الان، ولكني أردت أن اغير حياتي، أن أصل إلى شيء ما بداخلي يخبرني أن هناك طريق اخر."}, {"type": "p", "text": "والان فكل شيء بالنسبة لي بمثابة عدم، اصبحت لا ارغب بشيء سوى مرور الأيام."}, {"type": "p", "text": "وبعد أن مللت كل شيء ولم أعد أتحمل؛ قررت أن ألتحق بدروس العلم لأنهل منها وأتعلم عن عقيدتي، ربما اصلا كل تلك الابتلاءات التي حدثت معي لأنني كنت أفكر فقط في الدنيا."}, {"type": "p", "text": "لقد حملني على هذا التغير هو التشتت الذي أنا فيه وتلك الاشارات التي ما كنت ألقي لها بالا ولكنها بمجموعها تقول أنك تمشي عكس الريح."}, {"type": "p", "text": "ومن الاشارات التي مرت بي منها قول أبي قبيل موته عندما قال لي إحذر فتن الساعة، تجهز بسلاح العقيدة، لا تدري لعل الملاحم على الأبواب، اتخذ صديقا يعينك الطريق."}, {"type": "p", "text": "وما سمعته إيضا من قول ذلك الرجل المتشرد الذي قال لي اترك أرض عشت فيها وارحل لأرض تنتمي إليها، كانت أشارته واضحة في أهمية البيئة وتأثيرها."}, {"type": "p", "text": "إنني لأقول في نفسي الان من اين جاء هذا الرجل المتشرد بكل تلك الحكمة هل حالته تلك هي ما جعلت منه حكيما لكل هذا القدر ام ان في الأمر امرا اكبر من ذلك قد قصرت عقولنا عن ادراكه، فالنهاية لابد ان نترك المجال لعقولنا لكي يفكر خارج الصندوق."}, {"type": "p", "text": "قد ذكرني قول ذلك الحكيم المتشرد بأمر ما حدث معي في الماضي فقد حيث كان ابي يأخذني معه الى ريف المدينة حيفا هناك حيث اخبرني انه يشعر بالانتماء الى ذلك المكان يشعر فيه بالراحة والسكينة ثم تبين لي بعد مضي أعوام النبي قد ولد هناك."}, {"type": "p", "text": "فهل ثمة علاقه بين تلك وذاك وهل يشعر الانسان بالحنين والفقر والاحتياج للمكان الذي ولد به حتى لو كان لا يعلم فان كان هناك علاقه بين الامران كانت العلاقة وثيقه بين تربته التي اخذ منها أو خلق منها ."}, {"type": "divider"}, {"type": "p", "text": "قونيا"}, {"type": "p", "text": "وفي مدينة قونيا وفي مسجدها حيث زحام من الناس قد جلسوا يستمعون وقد أخذهم العجب فجأة لمّ وقف الشيخ علاء الدين من مجلسه ويكأنه تذكر شيء ثم قال ذلك الخبر العظيم، الذي يعد من ضمن دلائل النبوة :"}], "section": "story"}, {"id": 17, "title": "بركان المدينة المنورة — سنة 654.", "paras": [{"type": "p", "text": "قبل 800 عام من الان ظهرت النار التي أخبر عنها رسول الله - صلى الله عليه وسلم- والتي كانت بأرض الحجاز حتى أضاءت لها أعناق الإبل ببصرى."}, {"type": "p", "text": "روى البخاري في صحيحه : عن أبي هريرة أن رسول الله صلى الله عليه وسلم قال : (لا تقوم الساعة حتى تخرج نار من أرض الحجاز تضئ لها أعناق الإبل ببصرى)."}, {"type": "p", "text": "فقد أخبر النبي في هذا الحديث عن ذلك النبأ العظيم الذي كان له من التأثير على أهل المدينة آن ذاك الكثير؛ حتى ظن الجميع أن القيامة قد قامت لشدة وهول ما رأوا من البراكين والنار العظيمة."}, {"type": "p", "text": "فقبل 800 عام من الان وفي المدينة النبوية، في يوم الجمعة في خامس جمادي الآخرة وبالتحديد شرق المدينة من ناحية وادي شظا^36، تلقاء جبل أحد، حدث ما لم يتوقعه ولم يخطر على بال أحد."}, {"type": "p", "text": "كانت طبيعة المدينة قبل حدوث ذلك أرض هادئة، والأماكن ساكنة والناس في مأمن، لا مقدمات لحدوث شيء حتى جاء يوم الاثنين من شهر جمادى؛ بدأ أهل المدينة في سماع أصوات صاخبة استمرت لثلاث أيام، كأصوات الرعد والزلازل، فزع الناس وخافوا ونفروا إلى المسجد النبوي وظنوا أن القيامة قد قامت فتابوا إلى الله واستغفروا وأعتقوا الغلمان وتصدقوا على فقراءهم ."}, {"type": "p", "text": "حتى كان اليوم الثالث حدث شيء عظيم؛ انفجار بركاني هائل بل عدة براكين قد ملات تلك الأودية، وأنه يخرج منها شرر يأكل الحجارة، بل أن المدينة زلزلت بسببها، وأنهم سمعوا أصوات مزعجة قبل ظهورها بخمسة أيام."}, {"type": "p", "text": "نار هائلة صارت كطول أربعة فراسخ في عرض أربعة أميال وعمقها كبير، يسيل الصخر حتى يبقى مثل الآنك^37، ثم يصير كالفحم الأسود، وذكر أن ضوؤها يمتد إلى تيماء^38 بحيث كتب الناس على ضوئها في الليل، وكأن في بيت كل واحد منهم مصباحا، ورأى الناس ضوؤها من مكة شرفها الله."}, {"type": "divider"}, {"type": "p", "text": "عند ذلك الحد من الوقت والكلام توقف الشيخ علاء الدين بعدما أحس الناس بهول وعظم ما سمعوا وتوتروا وحسبوه غضب من الله وربما كان والله أعلم بذلك، بل وخاف الناس أن يحدث لهم كمثل ما حدث في المدينة؛ وفي أثناء ذلك التوتر والقلق قد أخذ يطمئنهم."}, {"type": "p", "text": "ثم اكتفى بهذا القدر بعد أن بين أن تلك كانت علامة على نبوة سيد الخلق صلى الله عليه وسلم، وهي من علامات الساعة، وقد حدثت كما أخبر."}, {"type": "p", "text": "ثم بعد ذلك قرر الذهاب باتجاه منزله."}, {"type": "p", "text": "لنتجه نحن إلى أنقرة مرة أخرى لنرى ما صنع منصور حتى الآن:"}], "section": "story"}, {"id": 18, "title": "مدينة أنقرة", "paras": [{"type": "p", "text": "اصبح امير اكثر اهتماما بعمله وشؤونه فلم يعد على صله قريبه بمنصور"}, {"type": "p", "text": "كما السابق وسبب ذلك أن تجارته قد ازدهرت وتطورت، وأصبح العمل أكبر من ذي قبل، فقد بدل فرشته التي يعرض عليها بضاعته بمحل جديد وفي مكان جيد، فكثرة المشاغل وأعباء الحياة كل ذلك ما لم يجعلهما، يتواصلان."}, {"type": "p", "text": "استمرت الأيام على ذلك ما بين اهتمام أمير بعمله، وانهماك منصور في خلوته، وطلبه العلم إلى أن جاء يوم وقرر أمير أن يذهب فيه لكي يزور منصور."}, {"type": "p", "text": "ذهب إمير متجها لمنزل منصور وأخذ في البحث عنه ما بين البيت والمسجد وأماكن تواجده ولكنه ما وجده."}, {"type": "p", "text": "قرر أن يسأل عنه شيخ المسجد؛ فلما دخل ألقى السلام:"}, {"type": "p", "text": "السلام عليكم ورحمة الله وبركاته."}, {"type": "p", "text": "فرد الرجل عليه بمثلها، ثم رحب به، وقال:"}, {"type": "p", "text": "كيف لي أن أساعدك؟"}, {"type": "p", "text": "رد عليه أمير قائلا:"}, {"type": "p", "text": "لو سمحت يا مولانا كنت أريد أن أسأل عن منصور، فكيف لي الاهتداء إليه."}, {"type": "p", "text": "فقال له:"}, {"type": "p", "text": "نعم، أعرفه، لقد كان من رواد المسجد ومن مريدي الشيخ أحمد النارودي، ولكنه قد ذهب مع الشيخ في خلوة إلى غابة بلغارد..."}, {"type": "p", "text": "شكر أمير لذلك الرجل، ثم هم بالنهوض ليرحل فاستوقفه الشيخ وقال:"}, {"type": "p", "text": "ربما لا تعرف طريق الذهاب، ومكانهم في الغابة، فإن أردت أن تنتظره لحين العودة فذلك أفضل؛ إلا لو كنت تريده في أمر ضروري؟."}, {"type": "p", "text": "وكم سيظل هناك: قالها أمير بقلق وهو يفكر في لقاء منصور وفي نفسه توجس من لقاءه، فقال له الشيخ:"}, {"type": "p", "text": "قد بقي لهم ثلاث أسابيع في خلوتهم؛ فإن كان الأمر مهم فارحل إليهم."}, {"type": "p", "text": "فشكره أمير، ثم قام وانصرف."}, {"type": "divider"}, {"type": "p", "text": "نحن الان في العاصمة قونيا باتجاه المسجد الكبير بعدما أذن لصلاة العشاء،"}, {"type": "p", "text": "وإذ بنا كذلك يأتي الشيخ علاء الدين ليسرد على مسامعنا قصة من أروع وأحزن القصص التي سمعناها، قصة جعلت جميع من بالمسجد ينفجر بكاءا وكأنهم يشاهدون ما يحدث؛ كان يوما عصيبا علينا فذلك يوم وفاة النبي صلى الله عليه وسلم، فهو من علامات الساعة وقرب النهاية وذلك كما بين هو في حديثه عليه الصلاة والسلام......."}, {"type": "p", "text": "يوم الوفاة ١١هـ"}, {"type": "p", "text": "في صباح يوم الاثنين الثاني عشر من ربيع الاول، ١١ من الهجرة، خرج الخبر من بيت أم المؤمنين عائشة رضي الله عنها، ما أشده من خبر على قلوب الصحابة، خبر وفاة النبي؛ ما أقساه وما أوجعه ويكأن الأرض لا تسع القلوب فضلا عن الجوارح، نزل البيان كالصاعقة على القلوب فانفجر المسجد بالبكاء."}, {"type": "p", "text": "نسمع أصوات الجلبة في كل مكان باتجاه مسجد رسول الله، ومناد يناد؛ أن خُيِّر رسول الله فاختار الرفيق الأعلى من الجنة."}, {"type": "p", "text": "ويح هذا الموقف الجلل؛ أنت تغدو وتروح وتسعى في كنف النبي وصحبته، تسمع ما يقول وتطيع ما أمر الله على لسانه، يبلغ عن الله مراده من الناس بالحق، يدلهم على الخير والرشاد، جاهد في الله حق جهادة حتى أوصل لنا الدين كاملا، دلنا على الله وعلى ما يحب وأبعدنا عن ما يغضبه، اوذي في الله أشد الأذى وعذب أقوى العذاب؛ فصبر في سبيل توصيل هذا الدين لي ولك، ولم يتقاضى لذا درهم ولا دينار."}, {"type": "p", "text": "ثم إذا ما اختار الرفيق الأعلى ذهب ولم تجده، فأنى لمن عاش أن يتحمل فراقه صلى الله عليه وسلم."}, {"type": "p", "text": "هذا الفاروق عمر يجري بعد سماع الخبر، يسعى على قدميه ويقبل بقلبه ويكذب بلسانه، فوقف في الناس غير مصدق، غاضبا منكرا ولسان حاله يقول في صدمة الخبر ووطأته على القلب:"}, {"type": "p", "text": "لا....، من ذا يقول عن نبي الله قد مات؛ لا لا !!!."}, {"type": "p", "text": "حتى قال للناس قطع الله ألسنت من يزعم أن رسول الله «صلى الله عليه وسلم قد توفي."}, {"type": "p", "text": "ولكنه ذهب إلى ربه. ...."}, {"type": "p", "text": "على رسلك يا عمر، فانصت."}, {"type": "p", "text": "قالها صاحب رسول الله أبا بكر الصديق وقد خرج بقلب ثابت عرف الحق ورضي وثبت عليه."}, {"type": "p", "text": "فقال له عمر : الا تسمع ما يقوله هؤلاء، قد نافقوا يا أبا بكر."}, {"type": "p", "text": "نظر ابا بكر للجميع فخطب فيهم فقال:"}, {"type": "p", "text": "انصتوا لي أيها الناس:"}, {"type": "p", "text": "الحمد لله القاهر فوق عباده أما بعد:؛"}, {"type": "p", "text": "فإنه من كان يعبد محمد فإن محمد قد مات؛ ومن كان يعبد الله فإن الله حي لا يموت،"}, {"type": "p", "text": "ثم تلى وعمر يستمع قول الله تعالى:"}, {"type": "p", "text": "(وَمَا مُحَمَّدٌ إِلَّا رَسُولࣱ قَدۡ خَلَتۡ مِن قَبۡلِهِ ٱلرُّسُلُۚ أَفَإِی۟ن مَّاتَ أَوۡ قُتِلَ ٱنقَلَبۡتُمۡ عَلَىٰۤ أَعۡقَـٰبِكُمۡۚ وَمَن یَنقَلِبۡ عَلَىٰ عَقِبَیۡهِ فَلَن یَضُرَّ ٱللَّهَ شَیۡـࣰٔاۗ وَسَیَجۡزِی ٱللَّهُ ٱلشَّـٰكِرِینَ)^39"}, {"type": "p", "text": "فأيقن سيدنا عمر أنه الحق."}, {"type": "divider"}, {"type": "p", "text": "لقد كان حال كل فرد من الصحابة ويكأن نفسه قد ماتت،"}, {"type": "p", "text": "وذلكم الصحابي الجليل عوف بن مالك يقف إمام المشهد غير مصدق، ويتفكر في ذكريات كانت مع النبي صلى الله عليه وسلم،"}, {"type": "p", "text": "ولسان حاله يقول:"}, {"type": "p", "text": "لقد تذكرت ذلك اليوم الذي ذكر فيه نبي الله نبأ وفاته لما كنت معه عند الخيمة وذلك عندما توفي فقد كان يوما عصيبا."}, {"type": "p", "text": "وتذكرت كل شيء وانا ببلادي هذه، تذكرت يوم أن جئت الى النبي"}, {"type": "p", "text": "أذكر له تغيب ولدي وقد خرج في الحرب فتم أثره، فقال لي أكثر أنت وزوجك من قول لا حول ولا قوة إلا بالله"}, {"type": "p", "text": "فما فعلت حتى سمعت ونظرت ولدي بالباب وقد أتى بغنائم الأعداء،"}, {"type": "p", "text": "كنت غير مصدق لعيني فأبني مالك كان محبوسا مقيدا بالحديد تبعده عنا أميال ولكن بفضل الله وبـ لا حول ولا قوة إلا بالله نراه ما أصبح الصباح حتى عاد؛ ولقد عاد غانما."}, {"type": "divider"}, {"type": "p", "text": "نعم فذلك اليقين في الله متى دخل القلب أصبح يرى الجنة على الارض.."}, {"type": "p", "text": "فلنكثر عزيزي القارئ من قول «لا حول ولا قوة إلا بالله."}, {"type": "divider"}, {"type": "p", "text": "هكذا كانت أول علامة على قرب الملاحم ونهاية الدنيا؛ موته صلى الله عليه وسلم وإنه ليوم فاجعة."}, {"type": "divider"}, {"type": "p", "text": "نحمل تلك المشاعر الجميلة بالحب لنبينا الكريم صلى الله عليه وسلّم ونسافر في رحلة إلى أنقرة لكي نطمئن على منصور وأمير، ونعرف أخبارهما:"}], "section": "story"}, {"id": 19, "title": "مدينة أنقرة التركية — صباحا. ..", "paras": [{"type": "p", "text": "اشجار كثيفة ومساحات كبيره اذا نظرت الى لن تدرك عيناك نهايتها ارض خضارتها جميله وجداول المياه في كل مكان وفي كل ذلك الجمال كنت انا وشيخي نتمشى ذاهبين الى الضفه الاخرى من النهر انه نهر الوادي لكي نتامل قليلا فيما ابدع الخالق سبحانه وتعالى يا شيخي كيف يصل الانسان الى النمو الى السمو قد سالت انا ذلك السؤال للشيخ النرودي فاجاب الشيخ بترك ما لدينا وما بترك مال الدنيا وما لها وما عليه وما على وجهها والتدبر فيما اودعه الله فيها ثم اردفت قائلا وهل يحتاج الى شيء نستند عليه في ذلك فقال نعم ثم قلت انا وما هو صمت قليلا ثم قال تحتاج الى من يعينك على مصاعب الطريق فاتخذ صديقا وليكن كتاب الله صديقك اولا تدبر فيه واعمل بما فيه."}, {"type": "p", "text": "بعد ان وصلنا الى الضفه الاخرى من النهر نصبنا الخيام للبقاء لا اعرف ربما سيطول الوقت بنا في ذلك المكان مرت الليله الاولى علي وكانها شهر ولا اعلم ما السبب وقد لقد تذكرت الماضي عندما كنا يخرج للنهر الجنوبي من المدينه وبالتحديد عند عند غاده تسمى از ازاريج قد خرجنا واخي الصغير الذي يدعى لؤي نعم عزيزي القارئ كان كان لي اخ صغير وذلك عندما كنا صغار ومن حينها لم يرجع اخي الى الان."}, {"type": "p", "text": "في ذات نهار سمائه تغطيها الغيوم والجو شتاء، ممطر قد خرجنا، لم نكن نعلم ان الجو سينقلب رعودا واعاصير وتتبدل حاله أكثر مما هو فيه إلى ذلك الحد المروع، وفي بداية ان خرجنا كان الجو هادئ قليلا والسحب تغطى السماء ولكنها لم تكن كمثل ما صارت إليه."}, {"type": "p", "text": "كان السبب في خروجنا مفهوم لي ولأخي، فأبي كان يأخذنا دائما إلى تلك الغابة بعد كل فترة، لنتعلم عن الطبيعة وفنون الرحلة وصفات الرحالة"}, {"type": "p", "text": "كان أبي أيضا يحدثنا عن اليوم الاخر والجنة والنار، ويحدثنا عن أحداث يسميها النهاية، كنت صغير لأفهم بالقدر الذي كنت أحتاج أن أفهمه اليوم، وذات يوم في أثناء جلوسنا عند النهر نظر إلينا أبي وقال:"}, {"type": "p", "text": "يا أبنائي ترون تلك الغابة البدائية!"}, {"type": "p", "text": "قلنا: نعم نرى الطبيعة"}, {"type": "p", "text": "تنهد قليلا واخذ نفسا وقال اه ما أجمل الطبيعة؛ وتذكر مخيلتكم تلك الحضارة التي وصلنا لها في موطننا والتي سوف تحدث مستقبلا؛ كل تلك الحضارة في بلدنا وفي العالم كله سوف تفنى وتحال إلى مثل هذه الغابة، لذا كانت كذلك ولسوف تصبح كذلك قبل النهاية بقليل وإنه لقريب."}, {"type": "divider"}, {"type": "p", "text": "مسجد قونية:"}, {"type": "p", "text": "على الجانب الاخر نجد ذلك الشيخ الذي قد جلس بعد صلاة العصر والتف الناس حوله يحدثهم عن علامات الساعة وأخذ يسرد لهم التفاصيل، مستأنفا لحديثه؛ ومن ضمن علامات نبوءة دابق وقرب الملحمة؛ فتح بيت المقدس:"}], "section": "story"}, {"id": 20, "title": "فتح بيت المقدس — 636م - 1187م", "paras": [{"type": "p", "text": "العلامة الثانية من علامات قرب الملاحم والساعة؛"}, {"type": "p", "text": "هي فتح بيت المقدس والذي كان علامة من علامات الساعة كما ذكر رسول الله صلى الله عليه وسلم؛ وذلك عندنا أخبر عوف بن مالك الأشجعي لما أتاه، وكان ذلك الفتح كما قال رسول الله الذي لا ينطق عن الهوى فإن هو إلا وحي يوحى، أطلعه ربه سبحانه وتعالى على بعض أنباء الغيب واصطفاه لذلك الأمر العظيم، فكان كما أوحى ربنا جل وعلى على لسان نبيه."}, {"type": "divider"}, {"type": "p", "text": "وقد وقع ذلك الفتح أكثر من مرة خلال التاريخ؛ مرة في عهد الخليفة الثاني عمر الفاروق رضي الله عنه، ومرة في عهد القائد العظيم صلاح الدين الايوبي."}, {"type": "divider"}, {"type": "p", "text": "عزيزي القارئ لقد أخبرتك منذ البداية؛ لن تستطيع معي صبرا على كثرة التنقلات عبر الزمن؛ فلن تنعم بالسكون والمكوث في مكان واحد وستظل تسافر معي عبر الزمن ذهابًا وإيابا ."}, {"type": "p", "text": "ولكن أبشر فعندما يلتقي الأصحاب؛ وتتجمع الأجساد في مكان واحد كما تجمعت القلوب عندها ستتحطم الة الزمن وتعلق في ذلك المكان الموعود؛ وعندها ستدرك ان النهاية باتت قريبة."}, {"type": "p", "text": "لذا دعنا نعود أولا لمنصور في مدينة أنقرة لنعرف ما حدث معه:"}], "section": "story"}, {"id": 21, "title": "منطقة «البلغراد» إحدى غابات أنقرة", "paras": [{"type": "p", "text": "وتمسك أخي بي وسقطنا عبر الشلال."}, {"type": "p", "text": "اخذت أبحر بعد الهبوط ناحية الشط ونظرت فلم أجد أخي، ناديت بعلو صوتي ولكن دون جدوى، رجعت مرة اخرى إلى المياه، غصت للعمق ولكني لم أجده."}, {"type": "p", "text": "تعبت ولم أستطع أن أكمل البحث حتى جرفتني المياه إلى الشط مرة أخرى."}, {"type": "divider"}, {"type": "p", "text": "أخذت أبكي بحرقة عندها وكنت أمشي بعرض الشط؛ وفجأة وجدت جثة ملقاة على الشط من بعيد، جريت بكل قوتي وكانت الصدمة إنه أخي، وقد سالت الدماء من مقدمة رأسه في منظر محزن، مخيف فأخذت أصرخ جزعا فاستيقظت من النوم مفزوعا."}, {"type": "p", "text": "الحمد لله بل كان حلما لا اكثر."}, {"type": "p", "text": "ذهبت لأتحسس أخي خوفا عليه، فلم أجده نائما في مكانه بل وجدته متدثرا بلحاف وكان منكمشا مرتعش، ونظرات الخوف في عينيه."}, {"type": "p", "text": "سألته: ماذا بك؟!"}, {"type": "p", "text": "فأجابني بلسان متذبذب وجسد مرتجف:"}, {"type": "p", "text": "خائف يا منصور، سوف يأكلنا.!!!"}, {"type": "p", "text": "استغربت من قوله فقلت له بعد أن احتضنته وربت على رأسه:"}, {"type": "p", "text": "ومن ذاك الذي سيأكلنا؟!"}, {"type": "p", "text": "أجاب في براءة وهو يرتجف لا أدري أمن برد أم خوفا:"}, {"type": "p", "text": "إنه وحش الغابة، قد رأيته يحوم وراء الخيمة."}, {"type": "p", "text": "هدأت من روعه وقلت له:"}, {"type": "p", "text": "لا عليك لا تقلق لا يوجد شيء يا عزيزي وان كان هناك وحش لا تخف سوف نبعده أنا وإياك، فأنت أقوى من ذلك."}, {"type": "divider"}, {"type": "p", "text": "قد نمت بجواره الليلة وهو يحتضني من شدة الخوف حتى إذا نتم تركته وذهبت لفراشي وأكملت نومي، وعندما أخذني النوم رأيت نفس الحلم قد تكرر؛ ففطنت أن هناك أمر جلل."}, {"type": "p", "text": "دعنا نعود إلى مدينة قونية مرة اخرى لنسمع من الشيخ علاء الدين باقي القصة:"}, {"type": "p", "text": "مسجد قونية"}], "section": "story"}, {"id": 22, "title": "بعد صلاة العشاء.", "paras": [{"type": "p", "text": "في قلب مدينة قونية، حيث تلتقي الأزقة الضيقة بالشوارع العريضة، وحيث تختلط أصوات الحياة اليومية بدقات الساعة المقتربة من العصر، كان مسجد قونية الكبير يبرز بجلاله وهيبته، كان الوقت يقترب من الثالثة عصراً، والشمس تلقي بأشعتها الذهبية على الساحة الواسعة أمام المسجد، مما جعلها تتوهج بنور دافئ ومهيب."}, {"type": "p", "text": "تدفق الناس من كل حدب وصوب، تجمعهم رغبة في أداء الصلاة، وشوق للاستماع إلى الشيخ علاء الدين وهو يسرد قصة عمر بن الخطاب وفتح بيت المقدس. كان الزحام كبيراً، والوجوه متلهفة، والعيون تتطلع بشغف نحو المنبر الذي سيقف عليه الشيخ بعد قليل."}, {"type": "p", "text": "أمام المسجد، كانت الحياة تدور في حلقة لا تنتهي. الباعة الجائلون يعرضون سلعهم بحيوية وابتسامات واثقة. بائع السبحات يجلس على كرسيه الخشبي العتيق، يراقب المارة بعينين حادتين، ينادي بعروضه الجذابة، بائع التمور، ذو الوجه الأسمر الودود، يقلب بضاعته بمهارة، ينادي بأصوات رخيمة تعلن عن أجود أنواع التمر."}, {"type": "p", "text": "رائحة البخور تتصاعد من المحلات الصغيرة المحيطة بالمسجد، تعانق الأنوف برائحة خشب الصندل والعود. الألوان الزاهية للأقمشة المعروضة تلمع تحت أشعة الشمس، تضفي على المكان حيوية وبهجة. الأصوات تتداخل، تنسج نسيجاً من الحياة التي تفيض بالحركة والنشاط."}, {"type": "p", "text": "في وسط هذا الزحام، كان شاب يسعى بخطوات متسارعة، يحمل بيده سجادة صلاة صغيرة. كانت عيناه تبحثان عن مكان مناسب ليفرشها فيه. إلى جانبه، كانت سيدة مسنة، تتكئ على عصا خشبية، تمشي بخطى بطيئة لكنها ثابتة. توقفت للحظة، استجمعت أنفاسها، ثم واصلت السير بعزم وإصرار."}, {"type": "p", "text": "الأطفال كانوا يركضون هنا وهناك، يملأون الساحة بضحكاتهم وصيحاتهم البريئة. امرأة شابة، تمسك بيد طفلها الصغير، تحاول جاهدة ألا تفقده في خضم هذا الزحام. نادت عليه برفق، ابتسمت له عندما التفت إليها بوجهه المشرق."}, {"type": "p", "text": "وفوق كل هذا الزحام، كانت ترتفع مآذن المسجد شامخة، تراقب المشهد بعظمة وصمت. وفجأة، اخترق الهواء صوت الأذان، شق الصمت النسبي وأضفى على المكان جواً من السكينة والوقار. توقف الجميع لحظة، وكأنما يعيدون ترتيب أنفاسهم، ثم واصلوا التقدم نحو المسجد بخطى أكثر هدوءاً."}, {"type": "p", "text": "داخل المسجد، كان الحشد ينتظر بفارغ الصبر. الشيخ علاء الدين، بشعره الأبيض الكثيف ولحيته الطويلة، صعد إلى المنبر. بصوت رخيم مليء بالوقار، بدأ يسرد قصة عمر بن الخطاب وفتح بيت المقدس. صمتت الجموع، وأصغت بكل حواسها إلى كلماته التي حملت عبق التاريخ وروح البطولة."}, {"type": "p", "text": "كل كلمة نطق بها الشيخ كانت تحملهم إلى تلك الأيام الخوالي، أيام العزة والقوة والإيمان. كانوا يشعرون بأنهم جزء من تلك القصة، يستلهمون منها القوة لمواجهة تحديات حياتهم اليومية. المسجد الكبير، بجلاله وأصالته، كان شاهداً على هذا اللقاء الروحي العميق بين الماضي والحاضر."}, {"type": "p", "text": "كانت أنقرة في ذلك الوقت تعيش لحظاتها الخاصة، ولكن قونية، بروحها التاريخية، كانت تفتح صفحات من المجد، ترويها كلمات الشيخ، وتعيشها قلوب الناس الحاضرين، حيث استأنف ما كان قد بدأه:"}], "section": "story"}, {"id": 23, "title": "عمر بن الخطاب (1/4)", "paras": [{"type": "p", "text": "كان فتح بيت المقدس في عهد الفاروق، جزء من الصراع العسكري بين"}, {"type": "p", "text": "الامبراطورية البيزنطية والخلافة الراشدة؛ الذي وقع في 637 الموافق 16 للهجرة."}, {"type": "p", "text": "وقد بدأت عندما قام جيش المسلمين، تحت قيادة أبو عبيدة، بمحاصرة القدس في شوال الموافق نوفمبر تشرين الثاني 636."}, {"type": "p", "text": "وبعد ستة أشهر، وافق البطريرك صفرونيوس للاستسلام، بشرط إذا قدم"}, {"type": "p", "text": "فقط الخليفة الراشدي."}, {"type": "p", "text": "وفي عام 16 هـ، سافر الخليفة عمر بن الخطاب إلى القدس لتسلم مفاتيح المدينة."}, {"type": "divider"}, {"type": "p", "text": "ها قد استتب الأمر عزيزي القارئ في سوريا بفتح دمشق عام15هـ / 636مـ."}, {"type": "p", "text": "بعد ذلك قد كتب أبو عبيدة إلى أمير المؤمنين عمر بن الخطاب يستشيره في التوجه إلى قيسارية أو إلى بيت المقدس."}, {"type": "p", "text": "فجمع الفاروق عمر المسلمين واستشارهم في ذلك."}, {"type": "p", "text": "فقال علي بن أبي طالب:"}, {"type": "p", "text": "يا أمير المؤمنين مر صاحبك ينزل بجيوش المسلمين إلى بيت المقدس فإذا فتح الله بيت المقدس، صرف وجهه إلى قيسارية، فإنها تفتح بعد إن شاء الله تعالى."}, {"type": "p", "text": "رضي الفاروق بما اقترح على كرم الله وجهه، فكتب كتابا لأبو عبيدة،"}, {"type": "p", "text": "وهذا نص جواب كتاب عمر إلى أبي عبيدة:"}, {"type": "p", "text": "بسم الله الرحمن الرحيم"}, {"type": "p", "text": "من عبد الله عمر بن الخطاب إلى عامله بالشام أبي عبيدة،"}, {"type": "p", "text": "أما بعد:"}, {"type": "p", "text": "فإني أحمد الله الذي لا إله إلا هو وأصلي على نبيه، قد ورد عليَّ كتابك وفيه تستشيرني إلى أي ناحية تتوجه، وقد أشار ابن عم رسول الله بالمسير إلى بيت المقدس، فإن الله يفتحها على يديك، والسلام."}, {"type": "p", "text": "ما أن وصل الكتاب إلى أبي عبيدة، قرأه على المسلمين ففرحو بالمضي"}, {"type": "p", "text": "إلى بيت المقدس، ولا شك في ذلك الفرح فأن النفوس تهفو لذلك المكان"}, {"type": "p", "text": "المقدس الذي أخبر رسول الله أن الصلاة في بأضعاف فيما سواه إلا"}, {"type": "p", "text": "المسجد الحرام؛ مسرى رسول الله صلى الله عليه وسلم."}, {"type": "divider"}, {"type": "p", "text": "ولقد ضرب المسلمون حصارا على المدينة متحملين الشدائد من قسوة"}, {"type": "p", "text": "البرد والشتاء وما استسلموا، حتى ضاق حال أهلها فطلبوا الصلح والأمان."}, {"type": "p", "text": "لقد رأى اهل إيليا أن المسلمين مصممون على فتح المدينة، حتى لو قاوموا ذلك؛ فرأوا أن يتم الصلح حفظا لدمائهم وأموالهم وكنيستهم."}, {"type": "p", "text": "واشترطوا أن يكون الفاروق عمر الذي سيتم ذلك الأجراء معهم ليتسلم مفاتيح بيت المقدس."}, {"type": "p", "text": "فكتب أبو عبيدة إلى عمر بذلك، فقدم عمر بيت المقدس."}, {"type": "p", "text": "لما قدم الفاروق إلى القدس مباشرة بل ذهب إلى منطقة تسمى الجابية، وكان المسلمون مستعدون لاستقباله هناك مع قائد الجيش أبي عبيدة بن الجراح فرحبوا به ترحيبًا عظيمًا."}, {"type": "p", "text": "وهمَّ أبو عبيدة أن يقبل يدَ عمر بن الخطاب، فهَمَّ عمر أن يقبل قدم أبي عبيدة، فكفَّ أبو عبيدة، فكفَّ عمر."}, {"type": "p", "text": "كان ذلك موقفا يمثل التواضع في أبهى صوره، فلابد لكل قائد أن يكون متواضعا لكي يحبه من يأتمر بأمره؛ أنه لأدب جم هؤلاء هم النبلاء الشرفاء."}, {"type": "p", "text": "وقام في الجابية^40 يخطب خطبة طويلة عصماء^41، جاء فيها:"}, {"type": "p", "text": "أيها الناسُ أصلحوا سرائركم تَصلُحْ علانيتكم، واعملوا لآخرتكم تُكْفَوْا أَمْرَ دنياكم\\\"، وقال فيها أيضا: \\\"فمن أراد بحبوحة^42 الجنة فليلزم الجماعة فإن الشيطان مع الواحد، وهو من الاثنين أبعد\\\"، وقال أيضا: \\\"ولا يخلون أحدكم بامرأة فإن الشيطان ثالثهما."}, {"type": "divider"}, {"type": "p", "text": "في صباح يوم جديد بتاريخ 13 رمضان 15 هـ الموافق 18 اكتوبر/تشرين الأول عام 636 للميلاد."}, {"type": "p", "text": "وفي يوم هادئ، ومن بعيد نرى تلك المدينة التي أعدت للدفاع عن حصونها."}, {"type": "p", "text": "وفي صرح عال، في الطابق الأعلى نجد بعض من البطارقة، جالسين متأهبين ومستعدون لرؤية ذلك الرجل الذي تفتح على يديه الأرض المقدسة، ويستلم مفاتح الملك."}, {"type": "p", "text": "ذلك كما جاء في الكتب أن الذي سيفتح بلادهم رجل بأوصاف دقيقة معدودة، يعلمونها هم أشد العلم، لأجل ذلك عندما وقع الحق وظهر سلموا أمرهم ورضوا بدون قتال أو مقاومة."}, {"type": "p", "text": "وقف بطريرك ابيت المقدس «صفرونيوس» على استعداد ينظر من بعيد على القادم في ذلك الوفد ويقول:"}, {"type": "p", "text": "هذا هو الذي وصف لنا؛ تفتح مدينة الرب على يديه."}, {"type": "p", "text": "فنظر ثانيا ثم أردف قائلا:"}, {"type": "p", "text": "على جمل أحمر، وعلى رأسه عباءة قطوانية^43، ويرتدي ثوبا مرقعا."}, {"type": "p", "text": "وأخذ يصف مجيء سيدنا عمر بن الخطاب ثم قال اخر ما قال:"}, {"type": "p", "text": "سنعقد معه الأمان؛ هذا والرب صاحب محمد بن عبد الله."}, {"type": "divider"}, {"type": "p", "text": "قدم عمر رضي الله عنه حتى وقف أمام الصرح بالقرب منهم فلم استقر نظر إليها البطريرك فقال:"}, {"type": "p", "text": "نسألك العهد والأمان إيها الفاروق عمر"}, {"type": "p", "text": "فحمد الله وأثنى عليه ثم رد قائلا:"}, {"type": "p", "text": "الله أكبر."}, {"type": "p", "text": "ثم خر لله ساجدا أمام أنظار أولئك ومراقبتهم وهم يصفون ما يرون ويتمتمون بالكلام عجبا يقولون:"}, {"type": "p", "text": "انها الصفة الكبرى والرب"}, {"type": "p", "text": "يرفع عمر ومن معه مكبرون ثم قال عمر:"}, {"type": "p", "text": "لكم الذمة والعهد إذا سالمتمونا، وأقررتم بالجزية لأنفسكم."}, {"type": "p", "text": "فرد عليه البطريرك قائلا:"}, {"type": "p", "text": "سنفعل إيها الأمير، هذه إيليا^44 ونرجو أن تتجنب الخراب على يديك."}, {"type": "p", "text": "قال عمر: كل المدن وما عليها لله، فقد أعطيتكم عهدا لن يخرقه مسلم، فمن خرقه فقد خرق ذمة رسول الله صلى الله عليه وسلم"}, {"type": "p", "text": "قال البطريرك: سنترك أبوابها مفتوحة ثقة بكم"}, {"type": "p", "text": "قالوا: لن ندخلها إلا بإذنكم، ويتقدمنا الفروق بإذن الله."}, {"type": "p", "text": "وقام «صفرونيوس» بتسليم المدينة له."}, {"type": "p", "text": "وأعطى عمر أهلها عهد الأمان المشهور، وفيه طمأنهم على الحرية"}, {"type": "p", "text": "التامة في ممارسة شعائرهم وحفظ كنائسهم وأموالهم وأعراضهم."}, {"type": "p", "text": "وكتب أمير المؤمنين عمر بن الخطاب وثيقة الأمان لأهل المدينة وهي التي عرفت فيما بعد بالعهدة العمرية."}, {"type": "p", "text": "نص العهد الذي أعطاه الإسلام للقدس:"}, {"type": "divider"}, {"type": "p", "text": "بسم الله الرحمن الرحيم"}, {"type": "p", "text": "هذا ما أعطى عبد الله عمر أمير المؤمنين أهل ايلياء من الأمان، أعطاهم أمانا لأنفسهم وأموالهم ولكنائسهم وصلبانهم سقيمها وبريئها وسائر ملتها، أنه لا تسكن كنائسهم ولا تهدم ولا ينتقص منها ولا من حيزها، ولا من صلبهم، ولا من شئ من أموالهم ولا يكرهون على دينهم، ولا يضار أحد منهم، ولا يسكن بايلياء معهم أحد من اليهود وعلى أهل ايلياء أن يعطوا الجزية كما يعطى أهل المدائن، وعليهم أن يخرجوا منها الروم واللصوص ."}, {"type": "p", "text": "فمن خرج منهم فإنه آمن على نفسه وماله حتى يبلغوا مأمنهم."}, {"type": "p", "text": "ومن أقام منهم فهو آمن وعليه مثل ما على أهل إيلياء من الجزية ، ومن احب من أهل ايلياء أن يسير بنفسه وماله مع الروم ويخلى بيعهم وصلبهم، فانهم آمنون على أنفسهم حتى يبلغوا مأمنهم، ومن كان بها من أهل الأرض فمن منهم قعد وعليه مثل ما على أهل ايلياء من الجزية ومن شاء سار مع الروم ومن شاء رجع إلى أهله، لا يؤخذ منهم شيء حتى يحصد حصادهم، وعلى ما في هذا الكتاب عهد الله وذمة رسوله وذمة الخلفاء وذمة المؤمنين إذا أعطوا الذي عليهم من الجزية شهد على ذلك، كتب وحضر سنة 15 هـ، عمر بن الخطاب خالد بن الوليد - عبد الرحمن بن عوف - معاوية بن أبي سفيان."}, {"type": "divider"}, {"type": "p", "text": "ها قد انتهينا من قصة عمر بن الخطاب وفتحه لمدينة فلسطين الحبيبه، ذلك المجد العظيم، ولننتقل الان إلى غابة بلغراد لنكشف عن تفاصيل منصور وشيخه:"}, {"type": "p", "text": "غابة بلغراد^45- قونية"}, {"type": "p", "text": "تركيا"}, {"type": "p", "text": "في صباح جديد هادئ، ترنمت العصافير بأنغام السلام على أغصان الأشجار، وتلامست أوراقها الأرض بلطف، وساد هدوء عميق في أنحاء الغابة. مناظر الشجيرات الكثيفة خلقت عالمًا مليئًا بالجمال، حيث يعبق كل زاوية بتناغم مذهل يفتح نوافذ الروح على إبداع الخالق العظيم. وكل ذلك يدعو للتأمل في عجائب الطبيعة وإبداعها، فهي تذكرنا بعظمة الله وحكمته التي تتجلى في كل نقطة من تكويناته."}, {"type": "p", "text": "تفتح هذه الجماليات أبوابًا للتأمل العميق في علاقة الإنسان بالكون والخالق، كما يقول الإمام علي:"}, {"type": "p", "text": "\\\"تحسب أنك جرم صغير، وفيك انطوى العالم الأكبر\\\"."}, {"type": "p", "text": "فالإنسان جزء من هذا الكون العظيم، حيث تتجلى فيه عجائب الخلق والإبداع بكل تفاصيله الدقيقة والجميلة."}, {"type": "divider"}, {"type": "p", "text": "وعندما توجهنا للصيد في تلك الأجواء الساحرة، قال أبي: \\\"سأذهب لأحضر أدوات الصيد\\\". بقيت أنا وأخي، فأخذتُ لحظةً للتأمل في جمال الطبيعة المحيطة بي، إلا أنني سُرِقت من هدوئي بصوت صرخة أخي، حيث جرفته مياه النهر إلى لقاءٍ محتوم بالموت."}, {"type": "p", "text": "\\\" فقدان الأحبة يخلف جرحًا عميقًا في القلب، لا يندمل سريعًا، بل ينمو ويشتعل مع كل ذكرى جديدة.\\\""}, {"type": "p", "text": "هكذا كنتُ دائمًا أشعر، وبينما كنت أفكر، لاحظتُ صوت الشيخ ينادي بالعودة للنوم للاستيقاظ باكرًا..."}, {"type": "p", "text": "نترك منصور ومشاهدته في الغابة، لننتقل إلى قصة فتح بيت المقدس، حيث جمعت الناس في قونية، وبينهم النساء المنقبات، للاستماع إلى حكاية مثيرة عن الحقب السابقة."}, {"type": "p", "text": "سئل أحد الحضور: \\\"هل ستفتح القدس مرة أخرى؟."}, {"type": "p", "text": "، فأجاب الشيخ بعذوبة: نعم، ودعني أخبركم قصة فتحها في زمن النهاية\\\"."}, {"type": "divider"}, {"type": "p", "text": "وفي عهد صلاح الدين الأيوبي، في 27 من رجب عام 583 هـ، الموافق لـ 2 أكتوبر 1187م، فتح بيت المقدس من جديد."}, {"type": "p", "text": "سيذكر التاريخ بكل عز وافتخار وتقدير نجاح صلاح الدين الايوبي في استرداد بيت المقدس اولى القبلتين مسرى رسول الله صلى الله عليه وسلم، في يوم مبارك وافق ذكرى الاسراء والمعراج."}, {"type": "p", "text": "وزاد من عظمة ذلك الفتح روح السماحة والكرم وحسن اخلاق القائد صلاح الدين والنيل الرفيع الذي أرسى قواعدها بفتحه وانتصاره."}, {"type": "p", "text": "فما غلبت عليه شهوة الثأر والانتقام من الصليبيين لما فعلوا ومارسوا من وحشية حين استولوا على القدس في 22 من شعبان 492 هـ الموافق 15 يوليو 1099م."}, {"type": "p", "text": "فقد أقاموا المذابح للمسلمين العزل وأبيحت المدينة للسلب والنهب والقتل وسفك الدماء عدة أيام؛ حتى أن جثث المسلمين كانت تملأ الشوارع."}, {"type": "p", "text": "ورضي ببدل الأمن وهي النقود، ليعطيهم الأمان، وذلك جراء ما فعلوه."}, {"type": "p", "text": "ثم يأتي أحدهم ويصف الاسلام والمسلمين بالإرهاب، وإن القارئ المنصف للتاريخ ليعلم تمام العلم من السافك للدماء والمستبيح لأعراض الخلق، إن كان قد نسي هؤلاء تاريخهم الأسود فان التاريخ لا ينسى."}, {"type": "p", "text": "ولا يزال التاريخ يعيد نفسه ....."}, {"type": "p", "text": "لما فرغ صلاح الدين الايوبي من أمر عسقلان وما يجاورها من البلاد، وكان قد أرسل إلى مصر أن يخرجوا الأسطول الذي بها مع جيش من المقالتين."}, {"type": "p", "text": "وقائدهم حسام الدين لؤلؤ الحاجب، وكان معروفا بالشجاعة والشهامة."}, {"type": "p", "text": "وأقاموا على البحر يقطعون الطريق على الفرنج كلما رأوا لهم موكبا غنموه."}, {"type": "p", "text": "ثم سار الاسطول من عسقلان إلى بيت المقدس، وكان به ان ذاك البطرك المعظم عندهم."}, {"type": "p", "text": "وقد جمعوا وحشدوا الخلق الكثير، يرون الموت اهون عندهم من ترك القدس للمسلمين."}, {"type": "p", "text": "فاجتمعوا على حفظه والدفاع عنه مظهرين العزم والمناضلة."}], "section": "story"}, {"id": 24, "title": "عمر بن الخطاب (2/4)", "paras": [{"type": "divider"}, {"type": "p", "text": "حتى قدم صلاح الدين بجيشة، فنشب قتال بين فرقة من الجيش وبينهم، وقتل عدد من الجهتين."}, {"type": "p", "text": "رأى المسلمون قوة تحصين المدينة، فحاصروها ونصبوا المجانيق، كما نصب الفرنج ايضا على سور البلد."}, {"type": "p", "text": "ولكن مع صمود جيش المسلمين بتوفيق من الله، رأى الفرنج أنهم مشرفون على الهلاك فاجتمعوا يتشاورون؛ فاتفقوا على طلب الأمان وتسليم بيت المقدس."}, {"type": "p", "text": "ولقد أرسلوا جماعة من كبرائهم وأعيانهم في طلب الأمان من صلاح الدين."}, {"type": "p", "text": "فلما ذكروا ذلك امتنع من أجابتهم وقال:"}, {"type": "p", "text": "لا أفعل بكم إلا كما فعلتم بأهله حين ملكتموه سنة إحدى وتسعين"}, {"type": "p", "text": "وأربعمائة:"}, {"type": "p", "text": "من القتل والسبي وجزاء السيئة بمثلها."}, {"type": "p", "text": "لقد رجع الرسل خائبين غير مجابون فيما طمعوا، يحسبون أن دماء المسلمين رخيصة ودمائهم نفيسة؛ كلا والله فنفس عبد مؤمن عند الله خير منهم جميعا، مما هم فيه من الكفر والعدوان والظلم."}, {"type": "p", "text": "عندها أرسل «باليان بن بيرزان» يطلب الأمان لنفسه ليحضر عند صلاح الدين في هذا الأمر فأجيب إلى ذلك."}, {"type": "p", "text": "ثم رغب في الأمان، وسأل فيه فلم يجبه إلى ذلك، ولقد استعطفه فلم يعطف عليه، واسترحمه فلم يرحمه."}, {"type": "p", "text": "ولما أيس من ذلك قال له:"}, {"type": "p", "text": "أيها السلطان اعلم أننا في هذه المدينة في خلق كثير لا يعلمهم الا الله تعالى وانما يفترون عن القتال رجاء الامان ظنا منهم انك تجيبهم اليه كما اجبت غيرها هم يكرهون الموت ويرغبون في الحياه فاذا راينا ان الموت لابد منه فوالله لنقتلن ابنائنا ونساءنا ونحرق اموالنا وامتعتنا ولا نترككم تغنمون من هذه نار واحدا ولا درهما ولا تسبون وتأثرون رجلا ولا امراه واذا فرغنا من ذلك اخرجنا الصخرة والمسجد الاقصى وغيرهم من المواضع ثم نقتل من عندنا من الاسرى المسلمين وهم 5000 اسير ولا نترك لنا دابة ولا حيوانا الا قتلناه ثم خرجنا اليكم كلنا نقاتلكم قتال من يريد أن يحمي دمه ونفسه وحينئذ لا يقتل الرجل حتى يقتل أمثاله ونموت اعزاء ونظفر كرماء."}, {"type": "p", "text": "بعد ما سمع ذلك منه شاور صلاح الدين أصحابه فأجمعوا عليه بإعطائهم الأمان."}, {"type": "p", "text": "وأجاب صلاح الدين إلى بدل الأمان للفرنج؛ فاستقر ان يزن الرجل عشرة دنانير والمرأة خمسة والطفل دينارين، فمن أدى ذلك إلى اربعين يوما فقد نجا ومن لم يؤده صار مملوكا، فبذل «باليان» عن الفقراء ثلاثين ألف دينار فأجيب إلى ذلك."}, {"type": "p", "text": "وسلمت المدينة يوم الجمعة السابع والعشرين من رجب وكان يوما مشهودا."}, {"type": "p", "text": "كان على راس قبه الصخرة صليب كبير مذهب فلما دخل المسلمون البلد يوم الجمعة تسلق جماعه منهم الى اعلى القبه ليقلعوا الصليب فلما فعلوا وسقطا صاح الناس كلهم صوتا واحدا من البلد ومن ظاهره المسلمون والفرنج اما المسلمون فكبروا فرحا واما الفرنج فصاحوا تفجعا وتوجعا فسمع الناس ضجا كانت الارض ان تميد بهم لعظمها وشدتها."}, {"type": "p", "text": "الكامل وبيت المقدس"}, {"type": "p", "text": "لم تكد تمضي خمسة وثلاثون عامًا على عودة القدس إلى أحضان المسلمين، حتى وجدناها مرة أخرى عرضة للمساومة والتفريط. السلطان الكامل بن العادل الأيوبي، حاكم مصر، اتخذ قرارًا من أكثر القرارات غرابةً التي يمكن أن تصدر عن حاكم مسلم، حين اشتدت به الأزمات وأحاطت به الملمات من كل جانب. في لحظة ضعف، بعيدًا عن الحكمة والسداد، أقدم على التنازل عن مقدسات لا يملك حق التصرف فيها."}, {"type": "p", "text": "كان لتضامن أبناء السلطان العادل الثلاثة: الكامل محمد، والمعظم عيسى، والأشرف موسى، أثرٌ واضح في تحقيق النصر في دمياط وإفشال الحملة الصليبية الخامسة بقيادة \\\"هنري دا برين\\\". لكن المأمول أن يظل هذا التحالف قويًّا، لم يتحقق، فانفرط العقد، وانكفأ كلٌّ منهم حول ذاته، يعظم من شأن مصالحه ومكاسبه، دون النظر إلى مصلحة الأمة. واندلع صراع بين الكامل وأخيه السلطان المعظم عيسى، صاحب دمشق."}, {"type": "p", "text": "استعان كل منهما بقوى خارجية لمؤازرته في مواجهة الآخر؛ فاستنجد الملك المعظم بالسلطان جلال الدين بن خوارزم شاه، سلطان الدولة الخوارزمية، بينما استعان السلطان الكامل بالإمبراطور فريدريك الثاني، صاحب صقلية وإمبراطور الدولة الرومانية في غرب أوروبا."}, {"type": "p", "text": "الثمن الذي أعلنه السلطان الكامل للإمبراطور فريدريك كان تسليم بيت المقدس وجميع فتوح صلاح الدين بالساحل الشامي، مقابل مساعدته في حربه ضد أخيه المعظم. يا له من ثمنٍ غالٍ مقابل هدفٍ غير نبيل!"}, {"type": "p", "text": "وإذا كان السلطان الكامل قد عرض تسليم القدس للصليبيين مقابل الجلاء عن دمياط، فإنَّ هول المصيبة قد أطاش بلبه وأعجزه عن التفكير السليم. ولكن لا عذر له في عرضه الثاني، فضلًا عن كونه لا يملك الحق في هذا التنازل أصلًا. وهذا من أعجب ما يُقابله الإنسان في تصفُّحه للتاريخ الإسلامي: تفريط دون حاجة، وتنازل مقابل أهداف غير نبيلة."}, {"type": "divider"}, {"type": "p", "text": "سلاح التفاوض"}, {"type": "p", "text": "ساء موقف الإمبراطور فريدريك الثاني من تغيُّر الأوضاع، ولم يبقَ له سوى سلاح المفاوضة والاستعطاف، لتحقيق الهدف الغالي والأمل المنشود؛ فأرسل سفارةً إلى السلطان الكامل تحمل له هدايا نفيسة، وتطلب منه الوفاء بما تعهَّد به للإمبراطور، وتسليم بيت المقدس له، وكان طبيعيًّا أن يرفض السلطان الكامل هذا الطلب بعدما تبدَّلت الأحوال التي ألجأته إلى القيام بهذا العرض، غير أنَّ رفض السلطان زاد من إصرار الإمبراطور على تكرار الطلب، والمبالغة في استمالة السلطان واستعطافه إلى حدِّ التذلُّل والبكاء."}, {"type": "p", "text": "وبلغ به الأمر إلى أنَّه كتب إلى السلطان الكامل في أثناء المفاوضات:"}, {"type": "p", "text": "\\\"أنا مملوكك وعتيقك وليس لي عمَّا تراه خروج، وأنت تعلم أنِّي أكبر ملوك البحر، وقد علم البابا والملوك باهتمامي وطلوعي، فإن رجعت خائبًا انكسرت حرمتي بينهم! .. فإن رأى السلطان أن يُنعم عليَّ بقبضة البلد والزيارة، فيكون صدقةً منه، ويرتفع رأسي بين ملوك البحر\\\"."}, {"type": "p", "text": "تسليم بيت المقدس"}, {"type": "p", "text": "أفلحت هذه السياسة وأثمرت استعطافات فريدريك في استمالة قلب السلطان الكامل، وكان رجلًا متسامحًا، ففرَّط فيما لا يملكه، وتسامح فيما لا يجوز التسامح فيه، ووافق على تسليم بيت المقدس دون أن يبذل الإمبراطور في الاستيلاء عليه قطرة دم، أو ضربة سيف، أو طعنة رمح؛ وإنَّما فاز ببيت المقدس بدمعة عين، وخداع نفس، وحقَّق ما عجز عن تحقيقه ريتشارد قلب الأسد بجيوشه الضخمة وإمكانيَّاته الكبيرة."}, {"type": "p", "text": "لقد تعودنا الحزن!!"}, {"type": "p", "text": "ها قد استقبل المسلمون نبأ تسليم بيت المقدس بالأسى والحزن والجزع، فما بين عشية وضحاها حتى أصبحت المقدسات لعبة في أيدي عداء، وعمَّ السخط أرجاء العالم الإسلامي، وأُقيمت المآتم في المدن الكبرى، ولقد صور المقريزي ما حل بالمسلمين من ألم وحزن بقوله:"}, {"type": "p", "text": "لقد تلق المسلمون ذلك النبأ بالبكاء والصراخ والعويل، وحضر الأئمَّة والمؤذِّنون من القدس إلى مخيَّم الكامل، وأذَّنوا على بابه في غير وقت الأذان... واشتدَّ الإنكار على الملك الكامل، وكثرت الشفاعات عليه في سائر الأقطار."}, {"type": "p", "text": "وعندما أحس السلطان بعاقبة أمره، وما صنع مع الفرنج من جريمة عظمى وخيانة لله ولرسوله ولعامة الناس؛ فعمل على تهوين الأمر في عيونهم وبأنهم لم يعطي الفرنج إلا زيارة الكنائس والبيوت الخربة، وأن يبقى المسجد الأقصى على حاله، غير ان هذه التبريرات لم تلقى استجابة من الشعب ولم تنطل عليهم تلك الخدع."}, {"type": "p", "text": "ولقد ظل بيت المقدس نحو خمسة وعشرين عامل أسيرا في يد الصليبيين، شاهدنا على خزلان الحكام وسوء صنيعهم ، حتى نجح الخوارزميُّون في تحريره (عهد السلطان المجاهد الملك الصالح نجم الدين أيوب) في (3 من صفر 642هـ=11 من يوليو 1244م)."}, {"type": "divider"}, {"type": "p", "text": "نعود بالزمن للمستقبل تاركين ورائنا ذلك الخزي العظيم؛ يوما أن ضاعت القدس لأتفه الأسباب؛ ثم ننتقل لتركيا وبالتحديد في أنقرة لنستأنف ما قد حدث هناك:"}, {"type": "p", "text": "مدينة أنقرة التركية"}, {"type": "p", "text": "بعد غروب الشمس."}, {"type": "p", "text": "تكاد الموجة تلمح لنا صورة فتاة تجلس على صخرة كبيرة أمام البحر، وتتناغم مع تجرعها الألم والحزن."}, {"type": "p", "text": "لِمَ يُحاصِر الحُزن قلبك، يا أختاه؟ فلتعلني عن ما في دَاخِلكِ، أَرى مَعكِ تقلّبات شؤونِك، أراكِ تَصمُتين وتُعَانين من آلامكِ، وأشعُر بحُزنكِ الدائِم، لكنني لا أَفهم سببَ حُزنكِ هذا المُتأصّل."}, {"type": "p", "text": "هكذا قالت شقيقة سلمى الكبرى، بعدما لاحظت حزنها وتأمّلها، وذلك منذ فترة، فقرّرت أن تصارحها بهذا، فأجابتها قائلة:"}, {"type": "p", "text": "\\\"آهٍ يا أختاه، فماذا أقولُ وأنا قد تَعَبْتُ، وأصبحَ قلبي يُؤلِمني؟\\\" ثُم تنهّدتْ قليلاً وقالت: \\\"لقد غابت شمسي بعد أن كانت مشرقةً، يا أختاه.\\\""}, {"type": "p", "text": "مريم، اختها الكبرى، تلك الفتاة العاطفية التي امتلأ قلبها عطفًا وحنانًا، والتي تكبر أختها بثلاث سنوات، كانت قد تزوّجت وأصبحت الآن أرملة. فتاةٌ جميلة الملامح، هادئة، عيناها البنيتان وبشرتها البيضاء ذات الحمرة المختلطة، يبدو عليها أسى الزمن، بعد أن فارق زوجها الحياة في عمل له بالخارج. إنها تدرك بشكلٍ خاص تأثير كلام سلمى، ولكنها تحاول بكل جهد التخفيف عنها، بينما هي في أمسّ الحاجة إلى مساعدة."}, {"type": "p", "text": "\\\"النسيان هو الدواء، يا أخيتي، فإن لم تستطيعين النسيان، فعليكِ بالتخلّي، ولا تتعلقي، فنحن جميعًا في مسيرة الرحيل.\\\""}, {"type": "divider"}, {"type": "p", "text": "ـــــــــــــــــــــــــ"}, {"type": "p", "text": "عندما تمتلئ سماء قرية عمواس بسحب الوباء في عهد عمر بن الخطاب، تحولت الأزقة الضيقة والساحات الهادئة إلى ساحة معركة مع الوجع والموت. الأرض التي كانت يومًا مزدهرة بأشجار الزيتون وأصوات الأطفال، أصبحت الآن مكانًا يُعتبر مهددًا بالتدمير."}, {"type": "p", "text": "الموت كان يجول في كل مكان كالظل الذي لا يفارق، يتسلل إلى كل بيت ويفتك بكل من يعبر طريقه. الأرواح الحزينة تعبث بالقرية، حيث يعلو صوت البكاء والنحيب ويُغلق الأهالي أبواب منازلهم بثقة وكأنهم يحاولون حماية أنفسهم من شيء لا يُرى ولا يُحس."}, {"type": "p", "text": "المظاهر السلبية للوباء تتجلى في كل زاوية، حيث يُرى الناس يتجنبون بعضهم بعضًا كما لو أن كل شخص هو عدو بالنسبة للآخر. الأمراض الوبائية تحول القرية إلى مكان مهجور، حيث تخرج الأرواح الميتة من بيوتها لتكون جزءًا من المنظر المحزن والمأساوي."}, {"type": "p", "text": "الأجواء الخانقة تملأ الهواء، حيث يشعر الناس بالضيق والخوف الشديد من المستقبل المجهول. الأمل الذي كان يسكن قلوبهم يبدأ بالتلاشي تحت وطأة الوباء الذي لا يمتثل لقوانين الزمن والمكان."}, {"type": "p", "text": "وفي يوم مشمس حار درجة حرارته مرتفعة، وفي هدوء يملأ الطرقات يخرج أمير من بيته قاصدا ذلك المسجد مرة أخرى ليقابل صديقه منصور كما يتمنى أن يجده هناك او أن يعرف أخباره منذ أن ذهب وافترقا واصبح ملازما لذلك المسجد، مسجد انطاليا، عندما وصل المسجد لم يجده فسأل عنه بعض رواد المنزل ولكن أحدا لا يعرفه."}, {"type": "p", "text": "حزن أمير على صديق عمره ويقول بلسان حاله"}, {"type": "p", "text": "كيف ادعه يفارقني بعد كل تلك السنين التي عشناها سويا، ولأجل ماذا، بضعة دنانير، لا تسمن ولا تغني من جوع قبح الله صنيعي وصنيع من يصنع كما فعلت، فلا الاصدقاء ينبغي ان تفترق؛ فالصديق قبل الطريق، الصديق قبل الطريق، وأخذ يرددها في باله."}, {"type": "p", "text": "\" بما عليك ان تدرك ان ما تبحث عنه يبحث عنك، سواء بجسده أو بقلبه والقلب أشد وأقوى وطأة، علينا ان نوسع مدارك عقولنا لتشمل ما يدور حولنا؛ وإن كنا لا نعلم حقيقته، فقط علينا ان نبني هيكلا لتصوراتنا.\\\""}, {"type": "p", "text": "ننتقل من تركيا حتى نصل إلى قرية عمواس؛ ولكن كيف ستتغير الأمور بعد هذا الناقوس الخطير، وكيف ستصبح الأحداث بعد ذلك وكيف عاش الصحابة ذلك الأمر:"}, {"type": "p", "text": "طاعون عمواس^46"}, {"type": "p", "text": "ارض فلسطين- السنة الثامنة عشر من الهجرة"}], "section": "story"}, {"id": 25, "title": "عمر بن الخطاب (3/4)", "paras": [{"type": "divider"}, {"type": "p", "text": "ذلك يوم مشهود له الناس؛ يوم تقشعر له الأبدان، يوم أن بدأ الطوفان؛ وإنك لما تسير في الأرض فتنظر كيف كانت أثار القوم:"}, {"type": "p", "text": "ففي تلك المدينة الصغيرة في فلسطين والتي تسمى «عمواس» تمشي فترى القوم صرعى، شهداء المسلمين تترا، يتساقطون جماعات في كل مكان، لقد أودى الطاعون بحياة الكثير، ولا شك فهذ المعهود على ذك الوباء، فقد سُمي بالداء الأسود، لشدة انتشاره بين الخلق."}, {"type": "p", "text": "فما ذكر ذلك المرض إلا ومعه الأذهان تتفكر في سرعة تفشيه وشدة فتكه."}, {"type": "p", "text": "الطاعون ذلك المرض الفتاك، والداء الأخاذ، إذا حل بأرض فقد أصبحت في عداد الموتى، داء يأخذ في الخلق كما يأخذ عقاص الغنم؛ كما أخبر رسول الله صلى الله عليه وسلم في حديثه عن علامات الساعة، وعقاص الغنم مرض يأتي للدواب فيفنيها عن بكرة أبيها."}, {"type": "p", "text": "يقول صلى الله عليه وسلم وقد عدد خصالا من علامات الساعة فذكر منها:"}, {"type": "p", "text": "\\\"وموتان يأخذ فيكم كقعاص^47 الغنم\\\"."}, {"type": "p", "text": "وقد والله وقع ما أخبر به نبي الحق، الذي لا ينطق عن الهوى، ففي خلافة عمر الفاروق وقع ذلك المرض الفتاك طاعون عمواس في السنة الثامنة عشر من الهجرة."}, {"type": "p", "text": "الذي قضى على كثير من المسلمين؛ فقد مات فيه ما يقرب من 25 ألف نفس من المسلمين."}, {"type": "p", "text": "منهم أكابر الصحابة كأبي عبيدة ابن الجراح أحد العشرة المبشرين بالجنة."}, {"type": "p", "text": "ويذكر التاريخ كيف تعامل الصحابة مع ذلك المرض الفتاك فها هو سيدنا عمر الفاروق نراه قادما نحو فلسطين، وقد علم بذلك الطاعون، وكان يريد أن يكمل طريقه حتى ذكره سيدنا عبد الرحمن بن عوف بحديث رسول الله صلى الله عليه وسلم الذي ذكر فيه الطاعون فقال له:"}, {"type": "p", "text": "«إِذا سمعتم به بأرضٍ؛ فلا تقدموا عليه، وإِذا وقع بأرضٍ، وأنتم بها؛ فلا تخرجوا فراراً منه»."}, {"type": "p", "text": "وكان الفاروق ناويا على الدخول ولكنه كان حذر وكان وقافا عند كتاب الله وسنة نبيه فلما سمع ذلك استقر في قلبه وقرر العودة."}, {"type": "p", "text": "ولما علم ابو عبيدة بمجيئ الفاروق خرج لاستقباله، وقد علم بعزمه على العودة،"}, {"type": "p", "text": "فقال له : أفرارا من قدر الله يا عمر."}, {"type": "p", "text": "فرد عليه قائلا: لو كان غيرك قالها يا ابا عبيدة."}, {"type": "p", "text": "ثم أردف قائلا: نعم نفر من قدر الله إلى قدر الله."}, {"type": "p", "text": "ثم ضرب له مثلا على ذلك فقال:"}, {"type": "p", "text": "لو كان لديك أبل وترعى في مكان غير نابت واخر نابت ألست تسوسوها لذاك المكان الأصلح لها وترعاها بقدر الله، وان رعيتها في ذاك رعيتها بقدر الله."}, {"type": "p", "text": "هكذا وقع كما أخبر محمد بن عبد الله رسول الله الذي لا ينطق عن الهوى."}, {"type": "p", "text": "فصلوا عليه وسلموا تسليما."}, {"type": "p", "text": "ثم هيا بنا لنعود للحاضر لنرى كيف ستسير الأحداث مع منصور"}, {"type": "divider"}, {"type": "p", "text": "غابات أنقرة- تركيا"}, {"type": "p", "text": "في جو ينعم بالهدوء، سمائه صافية، ضوء القمر الخافت قد ألقى بالضياء على فروع الاشجار ، قد جُبت أنا طرقات الغابة النائية ليلا إلى أن وصلت عند نهر بعيد في مقربة من الشط جلست أتأمل، زرفت العبرات وكأن جمرا ما يسكن فؤادي، وشعرت بحزن غريب مفاجئ، ثم أفردت ظهري وتأملت النجوم فأخذتني سنة من النوم."}, {"type": "p", "text": "ذلك الكون مع ما فيها من جمال حتما لابد وينتهي، كل شيء لا محالة زائل، لا ندري بعد كم تتغير تلك المنطقة ربما حديثا تعمر أو في أخر الزمان تزلزل أو تدمر."}, {"type": "divider"}, {"type": "p", "text": "كان منصور طوال فترة مكوثه في الغابة يتحدث إلى نفسه بهذه الطريقة التدبرية في الكون والحياة وأحداث النهاية، وفي تلك المرة نام ورأى وكأنه في نفس المكان وأن السماء تلمع بالنجوم كطبق أزرق مرصع بالياقوت، والقمر منير وان صوتا يأتيه من بعيد ينادي عليه:"}, {"type": "p", "text": "ان يا منصور اقبل تعال، فإني في انتظارك بالأشواق."}, {"type": "p", "text": "أخذ يتلفت، ثم نظر إلى تلك الشجيرات الكثيفة التي أمامه بعد ان اهتزت أوراقها لتخرج من بينها فتاة كأنها ملاك لا يشبه البشر إلا في الصورة البدنية ولكن الشكل شكل ملاك والحالة الحضورية حالة جوهرة ثمينة تشع ضوء على عكس الضوء، مريح للعين مبهج للأبصار."}, {"type": "p", "text": "وجه دائريه كأنها قمر وعينان واسعان حوراء، رداء حريري ناعم."}, {"type": "p", "text": "نظرت إليه وقالت:"}, {"type": "p", "text": "قد انتظرت كثيرا وسأنتظرك إلى الأبد، ولكن لا تطل الغيبة علينا، فعد ولا تنساني."}, {"type": "p", "text": "وفجأة اخفت بين الأشجار فاستيقظ منصور على صوت الشيخ يقول هيا لنصلي الفجر."}, {"type": "p", "text": "ـــــــــــــــــ"}, {"type": "p", "text": "بعد الفجر جلسنا سويا نذكر الله نذكر الله ونتدبر في صفحات الكون وما أبدع الخالب العظيم جل وعلى."}, {"type": "p", "text": "أخذ الشيخ «النرودي» يحدثني حديثا عن رسول الله قد تواتر عن يوم الملاحم، وقد أفاض."}, {"type": "p", "text": "حدثني عن اجتماع الروم للملحمة الكبرى وكيف يكون الصراع."}, {"type": "p", "text": "فتساءلت؛ وكيف يصبح الناس آن ذاك؟!"}, {"type": "p", "text": "فقال: الناس يومئذ في فتن وبلاء شديد يوم ترجف المدينة فتخرج كل منافق وكافر وينقسم الناس لفسطاطين اي لفريقين، فسطاط الحق وفسطاط الباطل."}, {"type": "p", "text": "ثم نظر إلى وقال: والحال ان مجابهة تلك الفتن بتقوية الإيمان والتدبر في كتاب الله والكون ، وفي الخلوة حياة لأولى الألباب."}, {"type": "p", "text": "لذا نحن كل عام نأتي لنختلي هنا ونبتعد عن العمران والناس لنعود بأرواحنا لتلامس أطراف الماضي."}, {"type": "divider"}, {"type": "p", "text": "وقبيل الظهر وفي جو مشمس هادئ جاء من أقصى الغابة رجل يسعى."}, {"type": "p", "text": "عندما نظر إليه منصور وقف من مقامه وشبه عليه وأطلق بصره يريد تحديد هويته ولكن نفسه تخبره أنه صديقه ورفيق دربه القديم، ولكن عقله يقول كيف وقد فارق بإرادته، ولكن القلب يرده قائلا ربما أرداها الحنين قتيلا على طريقنا فأتبعه سببا."}, {"type": "p", "text": "احتضن صديقه بحرارة وقال له منصور:"}, {"type": "p", "text": "لما كل ذلك الأفول يا صديقي كأنما قمر وأنا دونك كليل بدون ضياء."}, {"type": "p", "text": "فرد عليه إمير قائلا:"}, {"type": "p", "text": "وكيف أنت يا منصور، فقد أشتقت إليك."}, {"type": "p", "text": "- الحمد لله في أتم نعمة"}, {"type": "p", "text": "> : أتمنى ان تكون على ما يرام، أما آن لك أن تعود لحياتك الطبيعية. >"}, {"type": "p", "text": "- وهل حياتي الان لا تعدُ كونها طبيعية؟!"}, {"type": "p", "text": ": ما قصدت ذلك، ولكن حياتك التي كنت عليه."}, {"type": "p", "text": "- لا عليك صديقي؛ فحياتي تلك هي التي ستحيي روحي، وقد كنت منصرفا لأمور الدنيا، أما الان فطريق العلم والتدبر والقرب من الله هي الحيوان لو كل الناس تدري."}, {"type": "p", "text": "> ----"}, {"type": "p", "text": "كانت من ضمن علامات الساعة التي أخبر عنها نبي الملحمة صلى الله عليه وسلم هي استفاضة المال؛ وكثرته حتى أن الناس أصبحوا لا يحتاجونه، وقد حدث شيء يشبه ذلك على عهد عمر بن عبد العزيز:"}, {"type": "p", "text": "ــــــــــــــــــ"}, {"type": "p", "text": "استفاضة المال"}, {"type": "p", "text": "عمر بن عبد العزيز."}, {"type": "p", "text": "لقد كان من علامات قرب الساعة والملاحم أخر الزمان أن أخبر الصادق المصدوق الذي لا ينطق عن الهوى محمد بن عبد الله صلى الله عليه وسلم؛ فما من شيء قاله إلا كان كفلق الصبح، وإنه لا ينطق عن الهوى إن هو إلا وحي يوحى كما وصفه ربه جل وعلى."}, {"type": "p", "text": "فكان مما أخبر به من الغيب وأطلعه الله على شيء منه هو استفاضة المال وكثرته ، حتى لكأن الناس تزهد في المال، فقد ذكر ذلك في حديثه حيث عدد علامات الساعة ثم قال:"}, {"type": "p", "text": "«استفاضة المال حتى يعطى الرجل مائة دينار فيظل ساخطا»"}, {"type": "p", "text": "فلقد صدق رسول الله صلى الله عليه وسلم فلقد وقع ما أخبر به فيما وقع وما لم يقع بعد فإذا ثبت بالبراهين أن جزءا مما أخبرنا به وقع فالمنطق يقول أن كال ما قاله صدق ومبلغ عن الله عز وجل وأن كل ما أخبر به سيقع حتما؛ فهذه عقيدة."}, {"type": "p", "text": "وقد وقع على عهد الخليفة عمر بن عبد العزيز شبيها بتلك الوفرة في المال ولكن حتما أخر الزمان سيفيض المال بكثير من ذلك."}, {"type": "divider"}, {"type": "p", "text": "فقد كان على عهد الخليفة عمر بن عبد العزيز عندما تولى الخلافة قد ازدهرت البلاد في عهده حتى أمر بنثر الحب على رؤوس الجبال، فكان يقول:"}, {"type": "p", "text": "لكي لا يقال جاع طائر في بلاد المسلمين."}, {"type": "divider"}, {"type": "p", "text": "لقد استخلف عمر بن عبد العزيز في هذه السنه بعد سليمان بن عبد الملك فلما كان «بدابق» مَرِض فلمَّ ثقل عليه المرض عهد في كتاب كتبه لبعض بنيه."}, {"type": "p", "text": "وهو غلام لم يبلغ فقال له «رجاء ابن حيوة»:"}, {"type": "p", "text": "ما تصنع يا أمير المؤمنين إنه مما يحفظ الخليفة في قبره أن يستخلف على الناس الرجل الصالح."}, {"type": "p", "text": "فقال سليمان: أنا استخير الله وانظر فيه ولم أعزم عليه."}, {"type": "p", "text": "فمكث السليمان يوما أو يومين ثم دعا رجاء فقال:"}, {"type": "p", "text": "ما ترى في ولدي داوود؟"}, {"type": "p", "text": "فقال رجاء: هو غائب عنك بالقسطنطينية ولا تدري حي هو أم لا؟!"}, {"type": "p", "text": "قال: فمن ترى؟"}, {"type": "p", "text": "قال رجاء: رايك."}, {"type": "p", "text": "قال: فكيف ترى في عمر بن عبد العزيز."}, {"type": "p", "text": "قال رجاء: فقلت أعلمه والله خيراً فاضلا سليما"}, {"type": "p", "text": "قال سليمان: هو على ذلك ولئن وليته ولم أولي أحدا سواه لتكونن فتنه ولا يتركونه أبداً يلي عليهم إلا أن يجعل أحدهم."}, {"type": "p", "text": "وكان عبد الملك قد عهد إلى الوليد وسليمان أن يجعلا اخاهما «يزيد» ولي عهد فأمر سليمان أن يجعل يزيد ابن عبد الملك بعد عمر وكان يزيد غائبا في الموسم قال:"}, {"type": "p", "text": "رجاء قلت رايك."}, {"type": "p", "text": "فكتب:"}, {"type": "p", "text": "بسم الله الرحمن الرحيم"}, {"type": "p", "text": "هذا كتاب من عبد الله سليمان أمير المؤمنين لعمر بن عبد العزيز إني قد وليتك الخلافة بعدي ومن بعدك يزيد بن عبد الملك فاسمعوا له وأطيعوا واتقوا الله ولا تختلفوا فيُطمع فيكم."}, {"type": "divider"}, {"type": "p", "text": "وختم الكتاب فأرسل إلى كعب بن جابر العبسي صاحب شرطته فقال:"}, {"type": "p", "text": "أدعوا أهل البيت."}, {"type": "p", "text": "فجمعهم كعب ثم قال سليمان لرجاء بعد اجتماعهم:"}, {"type": "p", "text": "اذهب بكتابي اليهم واخبرهم بكتابي وامرهم فبايعوا من وليت منه من وليت فيه تفاعل رجاء"}, {"type": "p", "text": "فقالوا: ندخل ونسلم على أمير المؤمنين؟."}, {"type": "p", "text": "قال: نعم."}, {"type": "p", "text": "فدخلوا، فقال لهم سليمان: في هذا الكتاب."}, {"type": "p", "text": "هو يشير إلى الكتاب الذي في يد رجاء ابن حيوة، ثم قال:"}, {"type": "p", "text": "عهدي فاسمعوا وأطيعوا لم
