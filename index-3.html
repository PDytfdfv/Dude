 هو علم شرعي ولكني أحاول أسقاطه على الواقع لكي يفهم الناس وما أظن أنه يؤذي سياسة الدولة."}, {"type": "divider"}, {"type": "p", "text": "وانتهى التحقيق على ذلك وتم تركي أذهب عندما لم يجدوا دليلا واضحا يديننا إلا كلاما لا يسمن من جوع."}, {"type": "divider"}, {"type": "p", "text": "المسجد الكبير"}, {"type": "p", "text": "لقد عاد الشيخ علاء للمسجد في صلاة العشاء ثم جلس بعد أن صلى وأفتتح بالحمد والثناء على الله ثم شرع في إكمال دروسه غير عابئ بأحد."}, {"type": "p", "text": "ثم لما أنهى مقدمات الملحمة شرع في أحداثها:"}, {"type": "p", "text": "أحداث دابق"}, {"type": "p", "text": "نزول الروم بالاعماق^56"}, {"type": "p", "text": "فقد أخرج مسلم في صحيحه عن أبي هريرة، أن رسول الله صلى الله عليه وسلم، قال: لا تقوم الساعة حتى ينزل الروم بالأعماق أو بدابق، فيخرج إليهم جيش من المدينة، من خيار أهل الأرض يومئذ، فإذا تصافوا، قالت الروم: خلوا بيننا وبين الذين سبوا منا نقاتلهم، فيقول المسلمون: لا، والله لا نخلي بينكم وبين إخواننا، فيقاتلونهم، فينهزم ثلث لا يتوب الله عليهم أبدا، ويقتل ثلثهم، أفضل الشهداء عند الله، ويفتتح الثلث، لا يفتنون أبدا فيفتتحون قسطنطينية، فبينما هم يقتسمون الغنائم، قد علقوا سيوفهم بالزيتون، إذ صاح فيهم الشيطان: إن المسيح قد خلفكم في أهليكم، فيخرجون، وذلك باطل، فإذا جاءوا الشأم خرج، فبينما هم يعدون للقتال، يسوون الصفوف، إذ أقيمت الصلاة، فينزل عيسى ابن مريم صلى الله عليه وسلم، فأمهم، فإذا رآه عدو الله، ذاب كما يذوب الملح في الماء، فلو تركه لانذاب حتى يهلك، ولكن يقتله الله بيده، فيريهم دمه في حربته."}, {"type": "divider"}, {"type": "p", "text": "> يتحدث الحديث ها هنا عن الملحمة الكبرى والصدام القادم لا محالة بين > قوتين، بين الحق والباطل، بين الخير والشر، بين المسلمين والروم في اخر > الزمان. > > اذ يأتي جيش الروم فينزل في مكان يسمى بالأعماق، والعمق ما يبعد من > أطراف المفاوز؛ فليس الأعماق أسم جمع وهنا ولكنه اسم موضع معين في أطراف > المدينة، فينزل فيه الروم استعدادا للحرب. > > وهناك موضع أخر مذكور في الحديث وهو « دابق» وهو موضع معروف بحلب، > فربما ذكر الموضعين هنا شك من الراوي في أي موضع نزل الروم ولكنهما > موضعان. > > ها قد وصل جيش الروم إلى دابق، وأن المسلمون ليسمعنَّ أصوات حوافر > الخيول تضرب في الأرض، وكان المسلمون بالمدينة ببيت المقدس، ولكنهم خرجوا > حتى وصلوا حلب. > > فيخرج إليهم جيش المسلمين من المدينة، وقيل أن المكان الذ وصل > المسلمون إلي دمشق ، وذلك كما جاء في الحديث، والمدينة النبوية يومئذ > خراب ولكنها أمنة. > > فيخرج جيش المسلمين وهم يومئذ من خيار أهل الأرض، فإذا تواجه الفريقان > ووصل كل فرق إمام الأخر وذلك بعد الاشتباكات بين بضع الفرق في الصفين > فقتل من قتل، فاجتمعوا بأكثرهم وكان كل فرق كالطود العظيم. > > فلما اصطفوا وسكن الجيشان قال قائل من الروم: > > خلوا بننا وبين الذين سبوا منا.: > > ويدل ذلك على القتال الذي كان قبل، فلقد اثر المسلمون في بعض المعارك > من جنود جيش الروم عددا من الجيش، وهذا العدد قد أسلم واتبع جيش > المسلمين. > > فلما كان كذلك رأي الروم انهم لا يريدون قتال المسلمين، إنهم أرادوا > هؤلاء الذين فارقوهم، يريدون قتالهم فقالوا اتركوهم لنا وما لنا بكم > شأن. > > وهذا دأبهم فهم يحاولون تفريق وتقطيع أوصال جيش المسلمين ليسهل عليهم > بعدها قتالهم؛ فالعود الواحد هين والجمع بالجمع ثقال ومجهدة، وهم دائما > دأبهم التفريق بين المؤمنين. > > أو هم يريدون أولئك الذين غزوا بلادهم، فسبوا ذريتهم، فيقول > المسلمون: > > لا والله لا نخلي بينكم وبين إخواننا."}, {"type": "p", "text": "فيقاتلونهم؛ وتشتد وطأة الحرب في البداية على المسلمين حتى انهزم ثلث وفروا من المعركة، وهذا لضعف الايمان؛ فهذا الثلث لا يتوب الله عليهم أبدا، كناية على موتهم على الكفر."}, {"type": "p", "text": "فلما اشتبك الجهتان في أول يوم كانت الغلبة للروم، فيفر ثلث جيش المسلمين وهؤلاء لن يتوب الله عليهم أبدا كما ذكر في الأحاديث؛ فذلك موقف عظيم، لابد للثبات فيه وعدم التولي يوم الزحف؛ فهو معدود من الموبقات السبع التي ذكرت في الأحاديث."}, {"type": "p", "text": "ثم يبقى ثلثي الجيش فيحاربون الروم محاربة عادلة، لا ينهزم أي الجيشين، ويستمر على نفس الحال لمدة ثلاثة أيام، وهناك بعض من فرق جيش المسلمين تشترط شرطة للموت في كل يوم اي تشترط على نفسها ألا ترجع حتى تنتصر أو تموت."}, {"type": "p", "text": "فكانوا كلما جن الليل والعتمة اجتمعوا فقالوا:"}, {"type": "p", "text": "- سنقاتلهم ولا نرجع، وما هي إلا الحسنيين؛ النصر أو الشهادة."}, {"type": "p", "text": "فرد رجل من الجند فقال:"}, {"type": "p", "text": "- نعم والله إما أن نموت في سبيل الله فننال الشهادة والدرجة العليا..."}, {"type": "p", "text": "فتلقف بقيتها منه رجل ثانٍ قائلا:"}, {"type": "p", "text": "- وإمّ نصر من الله يبلغنا إياه، فتكون لنا الغلبة."}, {"type": "p", "text": "وأردف أخر:"}, {"type": "p", "text": "- وعندها يفتح الله علينا الأرض والخير وننعم أبداً ان شاءلله."}, {"type": "divider"}, {"type": "p", "text": "وفي كل يوم كانت تفنى تلك الفرقة التي اشترطت على نفسها ذلك الشرط ولكن الجيشان لم ينهزم أي منهما بعد باستثناء تلك الأعداد التي تتناقص من جيش المسلمين. ......"}, {"type": "p", "text": "ها قد أطل الصباح بنوره والسماء بزرقتها والسحاب الغائم في الأرجاء الذي يحمل معه بشارات النصر والعز، فذلك يوم مشهود وذلك يوم الملحمة التي قدرها الله على أولئك الجمع من المسلمين، ذلك الجند المتبقي من جنود الحق في وجه الباطل."}, {"type": "p", "text": "قد صلى المسلمون الفجر وعزموا على الذهاب وكلهم استبشار ويقين في الله بأن النصر قادم لا محالة وإن طال وطال معه الضعف والوهن، ولكن الله كرم هؤلاء بأن جعلهم خير الفوارس على ظهر الإرض يومئذ."}, {"type": "p", "text": "وفي اليوم الرابع انطلق المسلمون متوكلين على الله، ولا يرجون إلا إحدى الهدفين إما النصر أو الشهادة."}, {"type": "p", "text": "حتى أتوا أرض القتال ولقيهم أعداء الله اشتد القتال، ثم يفتح الله على ذلك الجزء المتبقي من جيش المسلمين ويحدث النصر الكبير؛ نصر كاسح، وفيه يستشهد ثلث اخر من جيش المسلمين، فلا يبقى إلا ثلث واحد، وهذا الثلث يفتح الله عليه، ويذهب للقسطنطينية ."}, {"type": "p", "text": "فلا يبتلون ببلية أو لا يمتحنون بمقاتلة أو لا يعذبون أبدا؛ وذلك فيه إشارة لحسن خاتمتهم."}, {"type": "divider"}, {"type": "p", "text": "فماذا سيحدث؟ وماذا سيفعل المسلمون عندما يتوجهوا إليها، هل تنتظرهم ملحمة أخرى، أم ستكون النتائج كما المتوقع؟!"}, {"type": "p", "text": "كل ذلك سنعرفه في ما هو قادم عزيزي القارئ فخذ قسط من الراحة ثم استأنف الملحمة، وكما العادة لا تنسى مشروبك المفضل، وأعرف أنك ربما في ذهنك تتساءل: ما عساه في كل مرة يذكرني بما أشرب؟!!"}, {"type": "p", "text": "سأقول لك عزيزي القارئ بالطبع لا أبغي ان تفيد صاحب البقالة، وتشتري ما لديه من مساحيق الشراب؛ ولكن لتعلم أمر فكما كنت أنا أشرب القهوة وأنا أكتب لك كلماتي تلك، حتى أكون في ذهن صافٍ؛ أردت لك ما أردته لنفسي."}, {"type": "p", "text": "المهم تناول ما تشاء فالوقت الذي تشاء فأنت سيد الموقف ها هنا على أرض تلك الرواية والمتحكم في الأحداث؛ فإذا كنت تفضل القراءة وبجانبك مشروبك المفضل أثناء القراءة فافعل."}, {"type": "p", "text": "وتناول ما تشاء ولكن حسبك والمقاطعة؛ فإن لك إخوة ما زالوا يعانون، فلتدع الله لهم، أو ما زالوا يقتلون."}], "section": "story"}, {"id": 39, "title": "ما قبل الملحمة: (3/5)", "paras": [{"type": "divider"}, {"type": "p", "text": "وذات صباح في يوم هادئ لقد انقشع الغمام وأخذا معه بعض من الشر والفتن ليأتي شيء من السلام ، فيمضي هؤلاء الثلث الباقي من الجيش بعد قتال مع الروم لمدة اربعة أيام؛ ثم يمضون بهذا النصر إلى مدينة القسطنطينية؛ وهي الان تركيا."}, {"type": "p", "text": "نعم تركيا الان هي في ايدي المسلمين ولكن تضارب الأحداث وسرعتها تجعل الأمور تتقلب فهي الان في أيدي المسلمين ولكن بعد نشوب الاشتباكات وربما المعارك الكثيرة بين المسلمون والروم تسقط في أيديهم مرة ثانية."}, {"type": "p", "text": "لقد انتصر المسلمون في هذه الملحمة الكبرى أعظم حرب في التاريخ ينتصر المسلمون على قلة عددهم ثم يتوجهون إلى القسطنطينية لفتحها، ولكنه بفضل الله كان فتحا ميسرا بعون الله وذلك كما ورد في الحديث الذي رواه أبو هريرة في صحيح مسلم:"}, {"type": "p", "text": "عن أبي هريرة، أن النبي صلى الله عليه وسلم، قال: «سمعتم بمدينة جانب منها في البر وجانب منها في البحر؟» قالوا: نعم، يا رسول الله. قال: \\\" لا تقوم الساعة حتى يغزوها سبعون ألفا من بني إسحاق، فإذا جاءوها نزلوا، فلم يقاتلوا بسلاح ولم يرموا بسهم، قالوا: لا إله إلا الله والله أكبر، فيسقط أحد جانبيها - قال ثور: لا أعلمه إلا قال - الذي في البحر، ثم يقولوا الثانية: لا إله إلا الله والله أكبر، فيسقط جانبها الآخر، ثم يقولوا الثالثة: لا إله إلا الله والله أكبر، فيفرج لهم، فيدخلوها فيغنموا، فبينما هم يقتسمون المغانم، إذ جاءهم الصريخ، فقال: إن الدجال قد خرج، فيتركون كل شيء ويرجعون \\\"،"}, {"type": "p", "text": "فكما في الحديث الشريف يذكر النبي أنهم سوف يفتحون القسطنطينية بغير سلاح؛ بذكر الله عز وجل وهذا فضل عظيم من الله، وذكر أيضا ان الذين سيفتحونها ليسوا من العرب بل هم ممن أسلم من بني أسحاق، ولعل المراد بهم أكراد الشام، وقيل يحتمل أن يكون معهم غيرهم من بني اسماعيل من العرب أو غيرهم من المسلمين، ولكن في الحديث أقتصر على ذكر بني أسحاق لأنهم الاغلب يومئذ في هذه الفئة التي ستذهب لفتح القسطنطينية."}, {"type": "divider"}, {"type": "p", "text": "الارض مليئة بالقتلى، جثث في كل مكان، حرب قاسية أودت بالكثير، ملحمة كبرى؛ موات يأخذ في الناس كداء الغنم، لقد غرقت السيوف في سيول من الدماء، هيئة المكان توحي بالرعب، لقد فني عداد من البشر ولشدة المقتلة إذا مرة الطائر فوق المعركة لا يخرج من سماءها حتى يخر ساقطا لشدة القتل والجثث والرائحة."}, {"type": "p", "text": "ها قد انتهى المسلمون من الانتصار على الروم وقد استعدوا للذهاب لفتح القسطنطينية؛ فيخرج سبعون ألف بني اسحاق."}, {"type": "p", "text": "فإذا جاءوا المدينة نزلوا حولها، وقد حاصروا أهلها ممن بقي من الروم، فلم يقاتلوا بسلاح، ولم يرموا بسهم."}, {"type": "p", "text": "ولكنهم يقولون: لا إله إلا الله والله أكبر."}, {"type": "p", "text": "فيسقط أحد طرفي سور المدينة، والسور الذي سقط كما جاء في الحديث هو الذي في البحر، فالسور الذي سيسقط أولا هو من جانب البحر."}, {"type": "p", "text": "ثُمَّ يقولُ المُسلِمونَ في المرَّةِ الثَّانيةِ: «لا إلَهَ إلَّا اللهُ، واللهُ أكبرُ»،"}, {"type": "p", "text": "فيَسَقَطُ جانِبُها الآخرُ الَّذي في البَرِّ."}, {"type": "p", "text": "ويَقولونَ الثَّالثةَ: «لا إِلَهَ إلَّا اللهُ، واللهُ أَكبرُ»."}, {"type": "p", "text": "فيُفتحُ لَهم فيَدخلونَها فيَغنَمون مِن أموال تلكَ البلدةِ."}, {"type": "p", "text": "> فبيْنَما هُم على حالٍ يَقتَسِمونَ فيها المَغانِمَ، وقد علقوا سيوفهم > بالزيتون > > ثم فجأة وهم على حالهم تلك جاءَهمُ الصَّريخُ، وهو المُنادي المسْتغيثُ > والمحذِّرُ لهم: > > فَيقولُ وهو الشيطان بصوت صائح رفيع: > > : «إنَّ الدَّجَّالَ قدْ خَرجَ». > > أي أنه قد خرج في أهلِيهم وذَرارِيِّهم، وقام مقامهم ، فيَتركونَ كلَّ شيءٍ منَ > المَغانِم وغَيرِها ويَرجِعونَ سريعًا لمُقابلةِ الدَّجَّالِ، ومُساعدةِ الأَهلِ > والعِيالِ. > > فيكون الدجال قد خرج وفك قيده كما علمنا من قبل لو تتذكر عزيزي القارئ > عندما سمعنا حديث الصحابي الجليل تميم الداري الذي قابل الدجال في تلكم > الجزيرة. > > فها هو الان قد خرج؛ والدجال هو مِن الدَّجلِ وهو الغطاء اي أنه يُغطِّي الحَقَّ > بباطِلِه، وهو شَخصٌ مِن بني آدَمَ، يَدَّعي الأُلوهيَّةَ، وظُهورُه مِن العلاماتِ الكُبرى > ليَومِ القِيامةِ، يَبتَلي اللهُ به عِبادَه. > > وأَقْدَره على أشياءَ مِن مَقدوراتِ اللهِ تعالى: مِن إحياءِ الميِّتِ الَّذي يَقتُلُه، > ومِن ظُهورِ زَهرةِ الدُّنيا والخِصْبِ معه، وجَنَّتِه ونارِه، ونَهْرَيْهِ، واتِّباعِ كُنوزِ > الأرضِ له، وأمْرِه السَّماءَ أنْ تُمطِرَ فتُمطِرَ، والأرضَ أنْ تُنبِتَ فتُنبِتَ؛ فيَقَعُ كلُّ > ذلك بقُدرةِ الله تعالَى ومَشيئتِه. > > ...... > > فلما جاءهم هذا الأمر الهائل وهذا النبأ العظيم الذي هو أكبر من حربهم > التي فرغوا منها، فلما جاءهم الخبر يتوجهون إلى الدجال. > > فيخرج طليعة من المدينة من قسطنطينية، عشر فوارس، ليطلعوا على نبأ > الدجال قبل خروج الجيش ورائهم لكي يخبرونهم بحقيقة النبأ. > > وقد جاء في الحديث الشريف عن هؤلاء الفوارس العشرة: > > فقال رسولُ اللهِ صَلَّى اللهُ عليه وسلَّمَ: إنِّي لَأعرِفُ أسماءَهم، وأسماءَ > آبائِهم، وألْوانَ خُيولِهم، هم خَيرُ فوارسَ على الأرضِ يومئذٍ، أو قال: هم مِن خَيرِ > فوارسَ على ظَهْرِ الأرضِ يومئذٍ. > > فالرسول صلى الله عليه وسلم يعلم أسماء العشرة وابائهم، وألوان الخيول > التي يركبونها خروجا لمعرفة نبأه. > > ......."}, {"type": "p", "text": "لما فرغ الشيخ علاء الدين من درس اليوم أعتذر عن الأطالة عليهم اليوم عن العادة؛ والأمر أنه يريد أن ينتهي من دروس الملاحم مسرعا ليعلم الناس حقيقة هذه الملاحم لكي يتقى الانسان ويعتصم من تللك الفتن، قبل أن يحدث مكروه له فلا يستطيع معه سبيل لأن يبلغ رسالته."}, {"type": "divider"}, {"type": "p", "text": "كان أرسلان ومنصور بالمسجد ولكنهما أتيا متأخران فلم يسمعا كل ما قال الشيخ غير أخر جزء من الدرس، ولما انتهوا خرجوا من المسجد فقال منصور لأرسلان هل تعرف منزل الشيخ علاء الدين."}, {"type": "p", "text": "فقال: للد أخبرت بن قبل ذلك ولكني لا أعرف الطريق بالضبط."}, {"type": "p", "text": "فقال منصور: دعنا نذهب كما تعرف ولأن أخطأنا الطريق لنسأل وإن شاء الله ندرك الشيخ."}, {"type": "divider"}, {"type": "p", "text": "ذهبا من الطريق التي يعرفها أرسلان ولكنه تحير قليلا لما راى طريقين متفرعان عندها قال له منصور دعنا نسأل عن بيته."}, {"type": "p", "text": "ظلا واقفين حتى نظرا رجلا من بعيد فأقبلا وراءه، لحقا به ثم سأل منصور أين يسكن الشيخ علاء الدين؟"}, {"type": "p", "text": "فقال الرجل: ممن القوم"}, {"type": "p", "text": "رد عليه أرسلان: نحن شمال تركيا من أنقرة"}, {"type": "p", "text": "رحب بهم الرجل بترحيب كبير ثم أخبرهما أن بيته في هذا الطريق على ناحية اليمين بعد الصخرة الكبيرة ."}, {"type": "divider"}, {"type": "p", "text": "كان علاء الدين جالسا يتناول طعام العشاء وبينما هو كذلك إذ طُرق الباب فقام وفتح وإذ به يرى منصور، هذا اللقاء الذي بات منتظرا لوقت طويل لما رحب بهما ثم قال:"}, {"type": "p", "text": "- تفضلا بالدخول."}, {"type": "p", "text": "> : اعزك الله مولانا، بارك الله فيكم. > > لما دخلا البيت طلب منهما الجلوس ثم استأذن لدقائق ثم عاد وفي يده > مشروب الضيافة وبعض من حلوى «السوتلاش» حلوى معروفة في تركيا بطعمها > الجميل وتعد من الحليب والقرفة والأرز والمكسرات. > > ولم جلس بين يديهما عرفهما بنفسه بعد أن عرف من هما ومن أي البلاد > أتوا. > > قال منصور: لا أدرى يا شيخ ويكأني أعرفك من فترة كبيرة، وقد كنت عازما > على تغيير حياتي للأفضل بعدما كنت في اهتمام بالدنيا وبالتجارة، فقررت > ترك تلك البيئة لكي أتوجه إلى هنا وقد حثني على ذلك شيخي النرودي، وكنت > أشعر بانجزاب كبير لتلك البلد وقد تذكرت قول شيخي عندما أخبرني بأن في > قونيا شيوخ كثيرة أجلاء سول يمهدون لك الطريق > > من بعدي. > > فقال: الشيخ علاء الدين: كيف حال الشيخ النرودي؟! > > رد عليه منصور في بهجة تخالطها الاستفهامات: > > وهل تعرف الشيخ؟ > > نعم فقد تتلمذنا نحن الاثنين على يد بعضا من شيوخ مدينة اسطنبول ، > وكانت تجمعنا سنوات وذكريات جميلة؛ فكيف هو الان. > > رد منصور في نبرة حزينة: > > لقد توفى منذ مدة قبيل مجيئي إلى هنا. > > قال الشيخ في حزن: لا حول ولا قوة إلا بالله، إنا لله؛ وإنا إليه > راجعون. > > ثم بعد أن انتهوا من التعارف سأل منصور وقال للشيخ: > > قد سمعناك تحدث الناس عن أحداث الساعة وتحدثت عن كلام ما سمعته أذني > قبل ذلك عن الملحمة الكبرى فما قصتها؟! > > فرد الشيخ قائلا: إن للحديث إطالة، فلتنزلا ضيوف عندي اليوم وأخبركما > بكل ما ورد عن الملحمة الكبرى ان شاءلله."}, {"type": "divider"}, {"type": "p", "text": "أخذ الشيخ يخبرهما بما جاء عن أحداث الملاحم ونهاية العالم وقد قص عليهما ما كان يذكره في المسجد ثم أكمل من حيث توقف:"}, {"type": "p", "text": "> خروج الدجال > > \\\" بدء ظهوره من أصبهان ، من حارة منها يقال لها اليهودية ، وينصره من > أهلها سبعون ألف يهودي ، عليهم الأسلحة والتيجان ، وهي الطيالسة الخضراء > ، وكذلك ينصره سبعون ألفاً من التتار ، وخلق من أهل خراسان > . > > فيظهر أولاً في صورة ملك من الملوك الجبابرة ، ثم يدعي النبوة ، ثم > يدعي الربوبية . > > فيتبعه على ذلك الجهلة من بني آدم ، والطغاة من الرعاعٍ والعوام ، > ويخالفه ويَرُدُّ عليه مَن هَدَى الله مِن عباده الصالحين وحزب الله المتقين > . > > يأخذ البلاد بلداً بلداً ، وحصناً حصناً ، وإقليماً إقليماً ، ولا يبقى بلد > من البلاد إلا وطئه بخيله ورجله غير مكة والمدينة ، ومدة مقامه في الأرض > أربعون يوماً يوم كسنة ، ويوم كشهر ، ويوم كجمعة ، وسائر أيامه كأيام > الناس هذه ، ومعدل ذلك سنة وشهران ونصف شهر . > > وقد خلق الله تعالى على يديه خوارق كثيرة يضل بها من يشاء من خلقه ، > ويثبت معها المؤمنون فيزدادون بها إيماناً مع إيمانهم ، وهدى إلى هداهم > . > > ويكون نزول عيسى بن مريم مسيح الهدى في أيام المسيح الدجال مسيح > الضلالة ، على المنارة الشرقية بدمشق ، فيجتمع عليه المؤمنون ويلتف به > عباد الله المتقون ، فيسير بهم المسيح عيسى بن مريم قاصداً نحو الدجال ، > وقد توجه نحو بيت المقدس ، فيدركهم عند عقبة أفيق ، فينهزم منه الدجال ، > فيلحقه عند مدينة باب لد ، فيقتله بحربته وهو داخل إليها ، ويقول إن لي > فيك ضربة لن تفوتني ، وإذا واجهه الدجال ينماع كما يذوب الملح في الماء ، > فيتداركه فيقتله بالحربة بباب لدّ ، فتكون وفاته هناك لعنه الله ، كما دلت > على ذلك الأحاديث الصحاح من غير وجه \\\" انتهى. > > ......... > > فالدجال سوف يظهر أول ظهوره في أصبهان من حارة يقال لها اليهودية ، > وينصره من أهلها سبعون ألف يهودي ، وهؤلاء اليهود هم المذكورون في حديث > النبي صلى الله عليه وسلم. > > يروي الحديث عن رسول الله صلى الله عليه وسلم انس بن > مالك: > > يَتْبَعُ الدَّجَّالَ مِن يَهُودِ أصْبَهانَ، سَبْعُونَ ألْفًا عليهمُ > الطَّيالِسَةُ. > > فاليهود أكثر ما يتبعه فهم أخبث الناس، حيث كانوا ينتظرون > خروجه > > وسوف يتبعه كثير من الناس غير اليهود من أمثال التتار ومن أهل خراسان > . > > ويتبعه من العجم والترك كذلك وأخلاط من الأعراب > والنساء. > > وكما جاء وصفهم في حديث أبي هريرة رضي الله عنه: ( لا تقوم الساعة حتى > تقاتلوا خوزا وكرمان من الأعاجم ، حمر الوجوه ، فطس الأنوف ، صغار الأعين > ، كأن وجوههم المجان المطرقة ، نعالهم الشعر ). > > وأما كون أكثر أتباعه من الأعراب ، فلأن الجهل غالب عليهم ، ولما جاء > في حديث أبي أمامة الطويل: > > قوله صلى الله عليه وسلم : ( وإن من فتنته -- أي الدجال -- أن يقول > للأعرابي : أرأيت إن بعثت لك أباك وأمك أتشهد أني ربك ؟ فيقول : نعم . > فيتمثل له شيطانان في صورة أبيه وأمه فيقولان : يا بني ! اتبعه فإنه ربك > ) > > وأما النساء فحالهن أشد من حال الأعراب ، لسرعة تأثرهن ، وغلبة الجهل > عليهن ، ففي الحديث عن ابن عمر رضي الله عنهما قال : > > قال النبي صلى الله عليه وسلم : ينزل الدجال في هذه السبخة بمرِّ قناة > -- واد في المدينة - ، فيكون أكثر من يخرج إليه النساء ، حتى إن الرجل > يرجع إلى حميمه وإلى أمه وابنته وأخته وعمته فيوثقها رباطا مخافة أن تخرج > إليه ) > > فتساءل أرسلان قائلا: يعني قليلا من الناس من سوف يعصمه الله ويكون > إيمانه قوي ولا يخرج إليه وأن أكثر ذلك النساء؟! > > قال الشيخ: نعم وذلك أنهم أكثر عاطفة وخوفا على أبنائهن فيخدعن عندما > يأتي الدجال ويحسبون أن معه من الخير ما يسد الجوع ويبدل حالهم يسرا > فيخرجون إليه عطفا على الأبناء. > > والذي يتبين من الأحاديث أن قلة من الخلق من يعصمهم الله من فتنته فلا > يتبعونه. > > ..... > > وكما ذكر الحافظ بن كثير فهو لا يدعي الالوهية في بادئ الأمر، فيظهر > في صورة ملك من الملوك فيتدرج في ذلك لتصديق الناس إياه ثم يدعي أنه نبي > فيصدقه الناس على ذلك حتى يدعي الربوبية > > ولا يترك الدجال مكان الا وطئه فيأخذ البلاد بلدا بلدًا الا مكة > والمدينة، فهو سيمسح الأرض كلها أي يذهب لكل مكان وذلك من ضمن الأسباب > التي سمي بها المسيح ويكون ذلك في مدة 40 يوما بمقدار سنة وشهران ونصف > الشهر؛ يوم كسنة ويوم كشهر ويوم كجمعة وسائر أيامه كأيام > الناس. > > -« يَأْتي المَسِيحُ مِن قِبَلِ المَشْرِقِ، هِمَّتُهُ المَدِينَةُ، حتَّى يَنْزِلَ دُبُرَ أُحُدٍ، ثُمَّ > تَصْرِفُ المَلَائِكَةُ وَجْهَهُ قِبَلَ الشَّامِ، وَهُنَالِكَ يَهْلِكُ.» > > ......... > > يوشك المسلمون أن يحاصروا بالمدينة عندما يأتي الدجال فينزل ببعض > السباخ التي تلي المدينة عند جبل أحد بأرض سبخة لا تنبت > > ويجعل معسكره هناك ثم يحاصر المدينة. > > فالمسلمون يأتون من كل مكان حتى يتحصنوا بالمدينة عندما يسمعون ان > الدجال قد ظهر، ثم يبتدوا في وضع المتاريس والأسلحة بمنطقة تسمى «سلاح» > وهي قريبة من المدينة وذلك لكي يدافعوا عن المدينة > > لكي يقاوموا الدجال ولكنهم لن يستطيعوا فيرجعوا مرة اخرى > للمدينة > > ولكن الحراسة الحقيقية للمدينة المنورة هم الملائكة وذلك كما جاء في > الحديث عن انس بن مالك في البخاري: > > عن أنس بن مالك رضي الله عنه عن النبي صلى الله عليه وسلم قال: «ليس > من بلدٍ إلا ‌سَيَطَؤُه الدجال إلا مكة والمدينة، ليس له من نقابها > نَقْبٌ^57 إلا عليه الملائكة صافين يحرسونها، ثم ترجف > المدينة بأهلها ثلاث رجفات، فيخرج الله كل كافر ومنافق». > > . > > فكما ذكر الحديث أن الدجال سيطأ كل مكان ولكنه غير قادر على دخول > المدينة وذلك لوجود الحراسة الملائكية التي جعلها الله لهذا المكان > تشريفا له وكرامة. > > وقد يكون لأن المدينة هي المكان الوحيد الذي سيكون الحصن الوحيد > للمسلمين أن ذاك إذ أنهم يعلمون ذلك فيذهبون للتحصن بها، فهو يريد > المدينة ربما لذلك العدد الكبير من المسلمين. > > فالحراسة تكون من الملائكة حين ذاك، فليس له من أبوابها باب إلا عليه > الملائكة صافين يحرسونها، فأما المسلمون عندما نصبوا معسكرهم الدفاعي عن > المدينة أمام الدجال ولكنهم لم يستطيعوا الوقوف أمامه حتى رجعوا القهقري > إلى المدينة. > > ثم بعدها ترجف المدينة بأهلها ثلاث رجفات، فيخرج الله كل كافر ومنافق > حتى يكون فريق المسلمين أيمان خالص لا نفاق فيه أبدا، وكفر لا إيمان فيه، > فالمدينة كالكير^58 اي كالنار تنفي خبثها وينصع > طيبها. > > وأكثر ما يخرج إليه غير الكفار والمنافقين النساء، حتى أن الرجال يرون > الناس أسهل ما يخرجون برجافات المدينة ، وإن الدجال يدعوهم من خارجها > ويطمعهم في الخير المكذوب الذي قد أتى به، فأكثر من يصدقه النساء > فيخرجون؛ حتى أن الرجل ليرجع إلى زوجته وأمه وابنته فيوسقها رباطا مخافة > أن تخرج إليه من شدة فتنته. > > ثم أردف الشيخ قائلا: فالحذر الحذر من فتنة هذا الكذاب إنها الفتنة > الكبرى؛ أكبر فتنة على وجه الأرض منذ أن خلقها الله، فالعقيدة هي زاد > المؤمن وحصنه الحصين. > > رد منصور وقال: نسأل أن يعصمنا من شر فتنته. > > فرد أرسلان ومعه الشيخ: اللهم أمين نسأل الله السلامة. > > ثم سأل أرسلان: وهل نحن على مشارف الساعة. > > رد الشيخ مؤكدا: نعم نحن قريبون جدا من الساعة فنحن الان > في > > وقت ازدادت فيه الفتن والقتل وأكثر العلامات الصغرى قد > ظهرت. > > وقد مضى أكثر من 1400 عام والله يقول « اقتربت الساعة» > > ولا شك في هذه الآونة الاخير قد كثرة الفان والزلازل والهرج والمعارك؛ > فلا سك فهي أقرب. > > ....... > > بعد أن كان متكئ فجلس ثم استئنف الحديث: > > .. > > ها قد عسكر جند الشر بجحافله العظام، يوشك أن يقتلع رؤوس كل من مر من > جنباتهم حتى الطيور في الهواء، يومٌ يدق فيه ناقوس الخطر، وأيما خطر أشد > من ذلك على المسلمين؛ فتنة عظيمة أبتلى الله عز وجل عبادة للتمحيص، > وليكون جيش الايمان لا نفاق فيه صف واحد. > > قد عسكر هؤلاء امام المدينة يقودهم عدو الله الدجال، فإذا > عسكروا > > واستعدوا ولا قدرة لهم على الدخول وإذ بهم كذلك إذ خرج إليهم رجل من > المؤمنين ممتلأ شباباً ، فيتوجه باتجاه الدجال يريد لقائه فيتلقاه بعض > جنود الدجال فيقولون له: > > إلى أين تَعمِدُ؟ > > فيقول: أعمد إلى هذا الذي خرج. > > فيقولون: أو ما تؤمن بربنا؟ > > فيقول: ما بربنا خفاء، فالله ليس بهذا الذي هو أعور ولا يستطيع اصلاح > عوره فكيف يكون إله يصلح أمور الناس، فالله ليس كمثله شيء. > > فيقولون: اقتلوه. > > فيقول بعضهم لبعض: أليس قد نهاكم ربكم أن تقتلوا أحدا > دونه. > > فيمسكونه ثم ينطلقون به إلى الدجال، فإذا رآه المؤمن > قال: > > يَا أيُّهَا النَّاسُ إنَّ هذَا الدَّجَّالُ الَّذي ذَكَر رَسُولُ اللَّه صَلّى اللهُ عَلَيْهِ > وسَلَّم. > > لقد خدعكم هذا الكذاب، ارجعوا للإيمان بالله واتركوا هذه > الدجال. > > عندها يأمر الدجال به فيشبح^59 فيقول: > > > خُذُوهُ وَشُجُّوهُ. > > فَيُوسَعُ ظَهْرُهُ وبَطْنُهُ ضَرْباً."}, {"type": "p", "text": "فيقولُ: أَوَمَا تُؤمِنُ بِي؟"}, {"type": "p", "text": "فَيَقُولُ: أنْتَ المَسِيحُ الْكَذَّابُ."}, {"type": "p", "text": "فَيُؤمرُ بهِ، فَيؤْشَر^60ُ بالمِنْشَارِ مِنْ مَفْرقِهِ حتَّى يُفْرقَ بَيْنَ رِجْلَيْهِ، ثُمَّ يَمْشِي الدَّجَّالُ بَيْنَ الْقِطْعتَيْنِ، ثُمَّ يقولُ لَهُ:"}, {"type": "p", "text": "قُمْ، فَيَسْتَوي قَائماً، يتهلل ووجهه ضَحِك."}, {"type": "p", "text": "ثُمَّ يقولُ لَهُ: أتُؤمِنُ بِي؟"}, {"type": "p", "text": "فيقولُ: مَا ازْددتُ فِيكَ إلاَّ بصِيرةً."}, {"type": "p", "text": "ثُمًَّ ينظر الرجل المؤمن للناس فيناديهم"}, {"type": "p", "text": "ويَقُولُ: يَا أَيُّهَا النَّاسُ إِنَّهُ لاَ يفْعَلُ بعْدِي بأَحَدٍ مِنَ النَّاسِ."}, {"type": "p", "text": "فَيأخُذُهُ الدَّجَّالُ لِيَذْبَحَهُ، فَيَجْعَلُ اللَّه مَا بيْنَ رقَبَتِهِ إلَى تَرْقُوَتِهِ^61 نُحَاساً، فَلا يَسْتَطِيعُ إلَيْهِ سَبيلاً، فَيَأْخُذُ بيَدَيْهِ ورجْلَيْهِ فَيَقْذِفُ بِهِ، فَيحْسَبُ الناسُ أنَّما قَذَفَهُ إلَى النَّار، وإنَّما ألْقِيَ فِي الجنَّةِ."}, {"type": "p", "text": "يقول النبي صلى عليه وسلم عن ذلك الرجل الذي استشهد:"}, {"type": "p", "text": "\"هذا أعْظَمُ النَّاسِ شَهَادَةً عِنْد رَبِّ الْعالَمِينَ\\\"."}], "section": "story"}, {"id": 40, "title": "ما قبل الملحمة: (4/5)", "paras": [{"type": "divider"}, {"type": "p", "text": "> ........ > > لم يستطع الدجال الدخول للمدينة بعد ذلك الحصار، وما حدث خارجها وما > فعله بذلك الرجل المؤمن ثم بعدها تصرفه الملائكة نحو الشام فيتوجه إلى > بيت المقدس ليحاصرها كذلك ولكن عزيزي القارئ ستكون نهايته هناك فأحضر لك > فنجانا من القهوة ثم تابع القراءة . > > بيت المقدس -اخر الزمان. > > على الجانب الأخر إذا نظرنا من بعيد نرى على مد البصر تلك الأشجار، > والسحاب الكثيف قد أظل أطهر البقاع على تلك الأرض، حتى إذا ما اقتربنا من > تلك الارض الجليلة، وهبطنا بالقدس ثم نزلنا بالمسجد الاقصى رأينا مجموعة > من المؤمنين وإذا نظرنا حولهم وجدنا قائدهم، الذي أخبرنا رسولنا الكريم > من ظهوره اخر الزمان ليملأ الأرض عدلا وقسطا بعد ما ملئت > جورا. > > تلك الفئة وقائدهم سيكونون محصورين ببيت المقدس ينتظرون مجيئ الدجال > ومعه سبعون ألف من يهود أصبهان، قادمين لمحاصرة المسجد الأقصى وبه > المسلمون والمهدي. > > .. > > حتى إذا جن الليل أجتمع عصابة من المسلمين فيقول الذي عليهم: ماذا > تنتظرون بهاذ الطاغية، ان تقاتلوه حتى تلحقوا بالله أو يفتح > لكم. > > فإذا أصبح الصبح انطلقنا إليه ان شاءلله. > > ..... > > على الجانب الأخر، وفي ذلك التوقيت الذي قد اتفقت فيه تلك العصابة على > الخروج لمقاتلة الدجال، وقريبا من القدس في دمشق بالتحديد ينزل سيدنا > عيسى ابن مريم عليه السلام من السماء كما أخبر النبي صلى الله عليه > وسلّم: > > فبينما هو كذلك اذ بعث الله المسيح بن مريم، فينزل عند المنارة > البيضاء شرقي دمشق، ينزل بين مهرودتين^62 واضعا كفيه > على أجنحة ملكين، إذا طأطأ رأسه قطر^63 > > وإذا رفعه تحدر منه جمان^64 > كاللؤلؤ. > > فيقول: فلا يحل لكافر يجد ريح نفسه إلا مات، ونفسه ينتهي حيث ينتهي > طرفه. > > فسيدنا عيسى نزل في دمشق، المسلمين محصورين في بيت المقدس، فيجعل > سيدنا عيسى همته الوصول إلى القدس لمواجهة الدجال، لكي > يقتله. > > لقد قرب الفجر فها نحن ذا ببيت المقدس، ننظر فنرى جل المسلمين هناك > وأمامهم المهدي ذلك الرجل الصالح الذي قد تقدم ليصلي بهم الصبح وإذ هم > كذلك إذ نزل عليهم عيسى ابن مريم عليه السلام. > > ثم لما رأي المهدي عيسى عليه السلام رجع إلى الخلف وقدمه لكي يصلي > بالمسلمين، > > ويقول: تعالى صلي لنا. > > ولكن عيسى عليه السلام يضع يده بين كتفيه فيقول: > > تقدم فصلي فإنها لك أقيمت، ثم يقول إن بعضكم لبعض امراء تكرمة الله > هذه الأمة. > > فيصلي بهم امامهم وعيسى عليه السلام خلفه صلاة الصبح وبعد الانتهاء من > الصلاة يقرر سيدنا عيسى عليه السلام فتح الباب ومقاتلة > الدجال. > > فيقول سيدنا عيسى: افتحوا الباب. > > ولما فتح الباب كان من وراءه الدجال ومعه يهود > اصبهان^65، وكلهم ذو سيف محلى وشال لونه أخضر فوق > أكتافهم. > > فإذا نظر الدجال عيسى عليه السلام علم أنها نهايته فيتملكه الخوف ثم > يبدأ في الذوابان كما يذوب الملح في الماء وينطلق هاربا."}, {"type": "p", "text": "وعندما رآه عيسى عليه السلام فارا من أمامه قال:"}, {"type": "p", "text": "إن لي فيك ضربة لن تسبقني بها،"}, {"type": "p", "text": "وكان معه حربة ثم انطلق ورآه حتى أدركه عند باب اللد الشرقي فيقتله بحربته"}, {"type": "p", "text": "وباب اللد هي بلد تقريبا 35 كيلوا غرب القدس ناحية يافا، فيلقاه هناك، ويقتله الله بيد عيسى عليه السلام، ويريهم دمه في حربته."}, {"type": "p", "text": "وإنما قتله بالحربة ولم يتركه يذوب لكي يقطع الشائعات وإظهارا لقتله وأعلانا لانتهاء الفتنة ولكي يطمئن المسلمون."}, {"type": "divider"}, {"type": "p", "text": "وبينما يطارد عيسى عليه السلام الدجال يقوم المسلمون بقتال اليهود؛ فيهزم الله اليهود ثم يهربون بعد هزيمتهم ويختبئون من المسلمين وراء الحجر والشجر."}, {"type": "p", "text": "لكن الله سبحانه وتعالى قد أنطق الحجر والشجر وكل ما يختبئون ورائه فيقول الحجر والشجر والدواب:"}, {"type": "p", "text": "يا مسلم يا عبد الله هذا يهودي ورائي تعال فاقتله."}, {"type": "p", "text": "> إلا شجر الغرقد فهو الشيء الوحيد الذي لا ينطق فهو من شجرهم، لذلك > يزرعونه؛ ثم تنتهي الفتنة بقتل اليهود والدجال ويطمئن الناس، ويعود من > اختبأ في الجبال خوفا من فتنة الدجال، ويعود الناس من كل فج ليروا عيسى > عليه السلام بعدما علموا انه قد قتل الدجال بفضل الله > وقوته. > > فيقابلهم عيسى عليه السلام ويمسح عن وجوههم؛ وذلك أما حقيقة لأنه من > معاني اسم المسيح أنه يمسح على وجوههم. > > وأما المقصود هو المعنى المجازي وهو كشف الكرب الذي كانوا > فيه. > > ثم يحدثهم عن درجاتهم في الجنة وبينما هو كذلك اذ أوحى الله إليه قال: > إني قد أخرجت عباد لي لا يدان لأحد بقتالهم اي لا أحد له طاقة > بقتالهم. > > نعم لقد انتهى شر الدجال ولكن هناك شر اخر في الطريق لا يقل خطورة عن > المسيح الدجال وهم يأجوج ومأجوج. > > فيقول الله عز وجل لعيسى عليه السلام: فحرز عبادي إلى > الطور. > > أخبر الله جل وعلى عيسى عليه السلام أن يذهب ويختبأ في الطور مع > المسلمون وأمره بعدم قتالهم لأن الله عز وجل يعلم مدى خطورة هؤلاء القوم؛ > فعدم المواجهة هو الحل الأمثل. > > فانطلق سؤال من فم منصور فقال: لماذا حارب سيدنا عيسى الدجال ولكنه لم > يواجه يأجوج ومأجوج؟! > > فقال الشيخ علاء الدين: لأن فتنة المسيح الدجال كانت فتنة على الدين > ولم تكن خطرا كبيرا يستطيع أحد أن يقف أمامه كمثل يأجوج ومأجوج؛ فهم > كانوا خطرا على الانفس وما كان لأحد ولا لأي جيش ان يقف أمامهم حتى سيدنا > عيسى لم يكن ليستطيع أن يواجههم بجيش المسلمين، لكن المسيح الدجال كان > أكثر فتنة على الدين. > > ثم استكمل القصة فتحدث عن خروج يأجوج ومأجوج: > > خروج يأجوج ومأجوج > > قال تعالى في سورة الأنبياء - آية ٩٦: > > (حَتَّىٰٓ إِذَا فُتِحَتۡ يَأۡجُوجُ وَمَأۡجُوجُ وَهُم مِّن كُلِّ حَدَبٖ يَنسِلُونَ) > > يأجوج ومأجوج هم من سلالة آدم ، عليه السلام ، بل هم من نسل نوح أيضا > من أولاد يافث أبي الترك ، والترك شرذمة منهم ، تركوا من وراء السد الذي > بناه ذو القرنين . > > فإذا ما فتح الردم خرج هؤلاء القوم يسرعون في المشي إلى الفساد، من كل > مرتفع من الأرض . > > وهذا مشهدهم يوم خروجهم، وقد قال ابن عباس واصفا خروجهم ما قاله بن > جرير : عن عبيد الله بن أبي يزيد قال : رأى ابن عباس صبيانا ينزو بعضهم > على بعض ، يلعبون ، فقال ابن عباس : هكذا يخرج يأجوج ومأجوج > ."}, {"type": "p", "text": "فعندما يخرج هؤلاء القوم فيغشون الناس ويباغتونهم، فيفزع المسلمون ويفروا إلى المدائن والحصون أتقاء شرهم ويأخذون معهم مواشيهم."}, {"type": "p", "text": "ثم يمرون ببحيرة طبرية فيشربون مياه الأرض ، حتى أن بعضهم ليمر بالنهر ، فيشربون ما فيه حتى يتركوه يبسا ، حتى أن من بعدهم ليمر بذلك النهر فيقول :"}, {"type": "p", "text": "قد كان هاهنا ماء مرة."}, {"type": "p", "text": "حتى إذا لم يبقى من الناس أحد إلا أحد في حصن أو مدينة وقد وصلوا إلى جبل الخمر في بيت المقدس"}, {"type": "p", "text": "قال قائلهم :"}, {"type": "p", "text": "هؤلاء أهل الأرض ، قد فرغنا منهم ، بقي أهل السماء ."}, {"type": "p", "text": "ثم يهز أحدهم حربته ، ثم يرمي بها إلى السماء ، فترجع إليه مختضبة دما; للبلاء والفتنة ."}, {"type": "divider"}, {"type": "p", "text": "وينحصر نبي الله عيسى عليه السلام وأصحابه في الطور ويطول بهم المكث حتى يكون رأس الثور لأحدهم خيرا من مئة دينار من شدة الجوع."}, {"type": "p", "text": "فيرغب نبي الله عيسى عليه السلام وأصحابه إلى الله، يدعون"}, {"type": "p", "text": "فبينما هم على ذلك إذ بعث الله عز وجل دودا في أعناقهم كنغف الجراد الذي يخرج في أعناقه ، فيصبحون موتى لا يسمع لهم حس،."}, {"type": "p", "text": "فيقول المسلمون : ألا رجل يشري لنا نفسه ، فينظر ما فعل هذا العدو؟"}, {"type": "p", "text": "فيتجرد رجل منهم محتسبا نفسه ، قد أوطنها على أنه مقتول ، فينزل فيجدهم موتى ، بعضهم على بعض ،"}, {"type": "p", "text": "فينادي : يا معشر المسلمين ، ألا أبشروا ، إن الله عز وجل قد كفاكم عدوكم."}, {"type": "p", "text": "ثم يهبط عيسى عليه السلام وأصحابه من الطور إلى الأرض فيجدون مشكلة أخرى وهي عفن الأرض من تلك الأجساد التي فوق بعضها البعض، فلا يجدون موضع شبر إلا ملئه زهمهم وننتنهم."}, {"type": "p", "text": "فيرغب نبي الله عيسى عليه السلام إلى الله فيدعون، فيرسل الله طيرا كأعناق البخت وهي طيور ضخمة أعناقها كأعناق الإبل تسمى البخت وهي نوع من أنواع الإبل."}, {"type": "p", "text": "ثم تأتي فتحملهم فتطرحهم بمكان يسمى المهبل وهي هوة سحيقة الله أعلم بمكان وجودها."}, {"type": "p", "text": "وقد ترك يأجوج ومأجوج قسيهم وأسلحتهم الكثيرة فيوقدون منها المسلمون مدة سبع سنين بعد انتهاء تلك الفتنة سبع سنين يوقدون منها من كثرتها ."}, {"type": "p", "text": "ولكن الان لا تزال الارض منتنة بعد جلاء أجسادهم فيرسل الله مطرا لا تترك مكان إلا دخلته، فيغسل الأرض حتى يتركها المطر كالمرآة لكثرة نظافتها."}, {"type": "p", "text": "وهكذا تنتهي فتنة يأجوج ومأجوج ثم يعيش الناس في مرحلة بعد ذلك هي من أجمل مراحل الدنيا"}, {"type": "p", "text": "قال أرسلان مبتهجا:"}, {"type": "p", "text": "قلت مرحلة من أجمل مراحل الدنيا؟!"}, {"type": "p", "text": "قال الشيخ: نعم"}, {"type": "p", "text": "فقال منصور: وهذا يعني أن الشر سينتهي من الدنيا ويعود الخير والبركة.؟!"}, {"type": "p", "text": "قال الشيخ: بالضبط هذا ما سوف يحدث وما جاء في حديث النبي صلى الله عليه وسلم حيث قال: \\\"طوبى لعيش بعد المسيح\\\"."}, {"type": "p", "text": "ثم استئنف لهم الشيخ سرد باقي الأحداث:"}, {"type": "p", "text": "> حياة جديدة > > ها قد انتهت الفتن وانتهى وجود الشهر من الدنيا، فلا حروب ولا صراعات > ولا خوف ولا فساد، قد انتهى وجود الشر بعد انتهاء تلك الفتن لتبدأ الأرض > وتتهيأ لحياة جديدة غير الذي عهدها البشر منذ خلق الأرض، سيعود الخير > يملأ أركان الدنيا ليعيش الناس في سلام وأمان وحب ليس فقط مع الانسان بل > ومع كل شيء، حتى تلعب الأطفال مع الحياة ولا تؤذيها، ويرعى الذئب مع > الشاة فيحرسوها ولا يقربها. > > حياة لا يوجد بها لا هموم ولا أحزان ويكأنها برزخ بين جمال اخر الدنيا > وجمال الجنة حتى أن الرسول صلى الله عليه وسلّم قد وصف هذه الفترة في جملة > قصيرة في حديثه حيث قال: > > » طوبى لعيش بعد المسيح؛ طوبى لعيش بعد المسيح». > > كررها مرتين. > > فبعد تلك الفتن يحكم عيسى عليه السلام بدين الاسلام وشريعته، حكما > عدلا وأماما مقسطا، فيكسر الصليب، ويذبح الخنزير، ويضع الجزية ويترك > الصدقة. > > فتعود البركة للأرض مرة أخرى بعد أن كانت في أول أمرها بعد أن أفسد > الخلق في الارض، فكلما زاد الفساد قلت البركة. > > وفي بركة الأرض تكون نظيفة كأنها سطح فضة ثم يقال لها ردي ثمرتك، > فتنبت وتنضج بأحجام وأشكال مختلفة ، حتى لو جئت وبزرت الحب على الصفا > لنبت؛ على الحجر الأملس فسوف ينبت. > > وعند إذ تأكل العصابة، 20 أو 30 رجلا من حبة رمان واحدة فتكفيهم حتى > أنهم يستظلون بقشرتها. > > ويكون الثور سعره مرتفع والخيل ترخص وذلك لأن هذا الوقت ليس بوقت حرب > وإنما وقت زراعة وخير فالثور يحتاج له في حراثة الأرض ولذلك ثمنه غال، > ونتاج البقر والغنم من اللبن غاية في الكثرة حتى أن > الفئام^66 من الناس تكتفي بلبن ناقة > واحدة. > > ويفيض المال في هذه الفترة حتى لا يقبله أحد، وايضا تكون البركة في > العلاقات، فترفع الشحناء والبغضاء من قلوب الناس فليس بين اثنين عداوة، > وتملئ الأرض من السلم كما يملئ الإناء من الماء. > > إذا تضع الحرب أوزارها، ويكثر الأمن حتى ترعى الأسود مع الأبل، وينزع > حمة كل ذات حمة^67؛ حتى يدخل الوليد يده في فمها فما > يؤذى. > > وهذه الفترة تكون مدة 40 عاما من الخير والسعادة؛ فطوبى لعيش بعد > المسيح."}], "section": "story"}, {"id": 41, "title": "ما قبل الملحمة: (5/5)", "paras": [{"type": "divider"}, {"type": "p", "text": "ثم فجأة سكت الشيخ وظهرت علامات الخوف والحزن على وجهه، حتى ظنناه سوف يبكي."}, {"type": "p", "text": "فقلنا ماذا ألم بك مولانا؟!"}, {"type": "p", "text": "فأجاب في نبرة حزينة وبعيون لامعة كادت الدموع أن تسقط منها:"}, {"type": "p", "text": "ثم يأتي زمان على الناس لا يقال فيه الله الله، حتى يأتي اقوام لا يعرفون من ربهم حتى يسال الصغير من الله فيقول اباه لا أدري يا ولدي كلمة كانت ءابآئنا تقولها!!!"}, {"type": "p", "text": "ثم ذكر لهم كيف يكونن حال القوم بعد مدة 40 عام:"}, {"type": "p", "text": "> سُنَّةُ التبديل"}, {"type": "p", "text": "وتستمر الدنيا حتى تنقضي تلك المدة التي كانت من أفضل أيام الدنيا حتى يتوفى عيسى عليه السلام وتبدأ الارض في العودة بالتدريج إلى ما كانت عليه قبل، فتعود فتنزع البركة مرة أخرى ويعود الناس لما كانوا عليه من الفساد والكفر والعصيان."}, {"type": "p", "text": "حتى يقول الولد لوالده: سمعتك تقول الله يا أبتي؛ فما الله؟"}, {"type": "p", "text": "فيقول: لا ادري كلمة كانت تقولها أباءنا فنحن نقولها."}, {"type": "p", "text": "... لتتخيل عزيزي القارئ يأتي زمان لا يعرف الرجل من ربه الذي خلقه وأكرمه ونعمه حتى لا يدري من ربه الذي خلقه فسواه، فلا تقوم الساعة حتى لا يقال الله الله."}, {"type": "p", "text": "ثم تهدم الكعبة"}, {"type": "p", "text": "نظر أرسلان ومنصور إلى الشيخ بنظرة تملئها الصدمة وقالا في نفس واحد:"}, {"type": "p", "text": ": الكعبة؟؟!!"}, {"type": "p", "text": "قال: نعم، هذا البيت المقدس الذي حفظه الله عز وجل مذ خلق الإرض يأذن الله في ان تكون لله سنن في الدنيا قد اقتضت حكمته أن تكون، فالبيت محفوظ من قبل الله إلى قيام الساعة ولكن هدمه في أخر الدنيا حيث يعم الفساد والهرج والمرج والأمور العظام والقتل وارتكاب الفواحش وينسى الناس الدين من نفوسهم بالكلية فلا يوجد على الأرض نفس توحد الله حيث يقبض الله نفوس الصالحين وتبقى الدنيا تقوم على شرارها."}, {"type": "p", "text": "ثم أكمل لهم كيف تهدم الكعبة:"}, {"type": "p", "text": "فلا تقوم القيامة حتى تهدم الكعبة وتنقض حجرا حجرا وذلك كما أخبرنا نبينا محمد صلى الله عليه وسلم:"}, {"type": "p", "text": "عن أبي هريرة رضي الله عنه، عن النبي صلى الله عليه وسلم قال: «يُخرِّب الكعبة ذو ‌السُّوَيقَتَين من الحبشة»."}, {"type": "p", "text": "ستهدم قبلة المسلمين في اخر الزمان بعد ذهاب الدين ورجوع الناس الى الكفر."}, {"type": "p", "text": "لمع سؤال في ذهنيهما فقال الشيخ أرى أنكما تسألان من يكون ذو السويقتين حسنا سأخبركم."}, {"type": "p", "text": "فالذي يهدمها هو ذو السويقتين، وسمي بذو السويقتين لصغر قدميه وهو من الحبشة حتى يهدما ويسلب متاعها."}, {"type": "p", "text": "هو رجل أصيلع^68 أفيدع^69 ، ومفاصله غير منتظمة، ويضرب عليها بمسحاته ومعوله اي يضرب الكعبة ويهدمها بفأسه وأدواته."}, {"type": "p", "text": "فيهدمها أمام الناس وهم يشاهدون غير منكرين لما يفعل، بل أنهم سعداء بذلك."}, {"type": "p", "text": "ثم تأتي ريح طيبة تقبض كل نفس مؤمنة وتقوم القيامة على شرار الخلق."}, {"type": "p", "text": "وتخرج الشمس من مغربها، وتظهر النار التي تسوق الناس إلى محشرهم، ثم تنتهي الدنيا ."}, {"type": "divider"}, {"type": "p", "text": "وانتهت الحياة عزيزي القارئ هذه الدنيا التي يتسارع الناس عليها بل ويختصمون بل ويقتل بعضهم بعضا من أجل دنيا، وما سميت دنيا إلا من دنوها، فخذ لنفسك من اليوم واستعد لمجابهة تلك الفتن، ولا تحسبن الأمر بعيد فلربما ومن الممكن أن يقع في حياتك، فما تفعل إن لم تكن مستعدا."}, {"type": "divider"}, {"type": "p", "text": "سأل منصور: وكيف تكون النجاة يومئذ من كل تلك الفتن يا شيخ.؟!"}, {"type": "p", "text": "فقال الشيخ: تكون النجاة باتباع كتاب الله وسنة نبيه كما أخبرنا نبي الله صلى الله عليه وسلم."}, {"type": "p", "text": "ثم تابع قوله بتفصيل ذلك:"}], "section": "story"}, {"id": 42, "title": "كيف النجاة", "paras": [{"type": "p", "text": "ربما تسأل نفسك عزيزي القارئ كيف تكون النجاة من كل تلك الفتن والمحن الجواب في حديث النبي صلى الله عليه وسلم عندما قال لحذيفة بعد ان اخبره بهذه الفتن، قال له:"}, {"type": "p", "text": "يا حذيفة تعلم كتاب الله واتبع ما فيه. ثلاث مرات يقولها."}, {"type": "p", "text": "فالحل في كتاب الله هو المفتاح الذي سيفتح لنا باب الاعتصام من الفتن ما ظهر منها وما بطن"}, {"type": "p", "text": "كيف لا والنبي قال في حديث اخر عليكم بكتاب الله وسنتي."}, {"type": "p", "text": "تركت فيكم ما أن تمسكتم به فلن تضلوا، كتاب الله وسنتي."}, {"type": "divider"}, {"type": "p", "text": "فينبغي لكل مسلم ومسلمة من التمسك بكتاب الله والمداومة على قراءته وتدبره وحفظه، فالقرءان تزكية للنفوس، فالقرءان الماء العزب للجسد العطشان."}, {"type": "p", "text": "فاجعل لك وردا، تقرأه كل يوم، وتدبر، واطلع على تفسير ما تقرأ من الكتب المختصرة."}, {"type": "p", "text": "تعلم وأدرس تلك الفتن واقرأ عنها لكي تكون مستعدا، فوالله انها باتت قريبة فمن ألف وأربعمائة عام قال الله «اقتربت الساعة»."}, {"type": "p", "text": "علم أولادك وربهم على كتاب الله، حفظهم من سورة الكهف لتكن عصمة لهم؛ ربهم على العقيدة السليمة."}, {"type": "p", "text": "ثاني أمر هو قيام الليل ولو ركعتين، فقيام الليل له سره العجيب في رفع الروح الإيمانية، وتعزيز المعتقد، والثبات، وهو سبب في أجابة الدعوات، وحصن حصين، وهو يعرفك على ذاتك ."}], "section": "story"}, {"id": 43, "title": "المصادر والمراجع", "section": "front", "paras": [{"type": "p", "text": "المصادر"}, {"type": "p", "text": "المصادر:"}, {"type": "p", "text": "- صحيح مسلم: الحديث رقم (2942) في كتاب الفتن وأشراط الساعة، باب ذكر الدجال وصفته وما معه."}, {"type": "p", "text": "- سنن أبي داود: الحديث رقم (4325) في كتاب الملاحم، باب خروج الدجال."}, {"type": "p", "text": "- سنن الترمذي: الحديث رقم (2253) في كتاب الفتن، باب ما جاء في شأن الدجال."}, {"type": "p", "text": "- مسند أحمد: عدة روايات في مسند أحمد تتناول نفس القصة."}, {"type": "p", "text": "- مرقاة المفاتيح للقاري"}, {"type": "p", "text": "- صحيح الجامع/ 4205"}, {"type": "p", "text": "- موقع «الدرر السنية»"}, {"type": "p", "text": "- جيل موشيه (1997)، ص.70-71."}, {"type": "p", "text": "- أكرم إبراهيم آغا (2004). سيف الله خالد بن الوليد - حياته وحملاته. طبعة جامعة أكسفورد : باكستان. ISBN 0-19-597714-9"}, {"type": "p", "text": "- محمد بن عمر الواقدي : فتح الشام."}, {"type": "p", "text": "- بنفنستي، ميرون (1998). مدينة الحجر : التاريخ الخفي للقدس، طبعة جامعة كاليفورنيا. ISBN 0-520-20768-8"}, {"type": "p", "text": "- إدوارد جيبون (1862). تاريخ انحدار وسقوط الإمبراطورية الرومانية، المجلد 6، طبعة جيه دي موريس."}, {"type": "p", "text": "- جيل، موشيه (فبراير 1997) التاريخ الفلسطيني من 634-1099، طبعة جامعة كامبريدج. ISBN 0-521-59984-9"}, {"type": "p", "text": "- ليو جريتس، صموئيل جيم نون (2002). الحدود الرومانية الشرقية والحروب الفارسية (الجزء الثاني). طبعة روتليدج. ISBN 0-415-00342-3"}, {"type": "p", "text": "- هالدون، جون (1990). بيزنطة في القرن السابع : التحول في الثقافة. طبعة جامعة كامبريدج. ISBN 0-521-31917-X"}, {"type": "p", "text": "- هوبي، ليزلي ج (2000). المدينة المقدسة : القدس في لاهوت العهد القديم، كتب مايكل جليزر. ISBN 0-8146-5081-3"}, {"type": "p", "text": "- عماد الدين الأصفهاني. الفتح القسي في الفتح القدسي."}, {"type": "p", "text": "- لويس، برنارد (2002، الطبعة السادسة) العرب في التاريخ جامعة أكسفورد للصحافة. ISBN 0-19-280310-7"}, {"type": "p", "text": "- نيكول، ديفيد (1994)، اليرموك 636 م : الفتح الإسلامي لسوريا، طبعة اسبري. ISBN 1-85532-414-8"}, {"type": "p", "text": "- رنسبرن، ستيفن (1987، الطبعة الثانية)، تاريخ الحروب الصليبية : الحملة الصليبية الأولى. كتب البطريق : لندن. ISBN 978-0-521-34770-9"}, {"type": "p", "text": "http://islamstory.com/ar- - /صلح_القدس_فتح_الشام"}, {"type": "p", "text": "- ابن الأثير: الكامل في التاريخ، دار صادر -- بيروت، 1402هـ=1982م."}, {"type": "p", "text": "- المقريزي: السلوك لمعرفة دول الملوك، تحقيق محمد مصطفى زيادة، لجنة التأليف والترجمة والنشر -- القاهرة، 1934م."}, {"type": "p", "text": "- سعيد عبد الفتاح عاشور: الحركة الصليبية، مكتبة الأنجلو المصرية -- القاهرة، 1971م."}, {"type": "p", "text": "- قاسم عبده قاسم: الحروب الصليبية، سلسلة عالم المعرفة -- الكويت."}, {"type": "p", "text": "- السيد الباز العريني: الأيوبيون، دار النهضة العربية -- بيروت، 1976م."}, {"type": "p", "text": "-صحيح الترغيب."}, {"type": "p", "text": "-صحيح الجامع/ 3612"}, {"type": "p", "text": "صحيح مسلم/ 2899.]"}, {"type": "p", "text": "الطبراني - في \\\"المعجم الكبير\\\" (11138):"}, {"type": "p", "text": "........"}, {"type": "p", "text": "^70"}]}];
const FOOTNOTES = {"1": "هاج واضطربت أمواجه", "2": "قربنا", "3": "بيسان مدينة تاريخية تقع شمال شرق القدس وتعتبر من أقدم المناطق في فلسطين.", "4": "وثب تشير إلى القفز", "5": "طيبة تقع في المدينة المنورة", "6": "هي بحيرة تقع شمال فلسطين التاريخية وغرب هضبة الجولان ويخرج منها نهر الاردن.", "7": "نبع ماء صغير يقع جنوب بحيرة الطبريا قريبا من مدينة أريحا وتعرل إيضا بأسم عين السلطان.", "8": "ذلك المسيخ الدجال الفتنة الكبرى التي ستكون قرب قيام الساعة وهي من علامات الساعة الكبرى وسمي مسيح لأنه يمسح الأرض أي يطئها في 40 يوما", "9": "صلتا تشير إلى ان السيف في حالة مجردا أو معلقا بدون غمد", "10": "قبيلة لخم وجذام هما قبيلتان عربيتان قديمتان لهما تاريخ طويل وعريق في الجزيرة العربية.", "11": "بحر الشام هو اسم يُطلق على الجزء الشمالي الشرقي من البحر الأبيض المتوسط. يمتد بين تركيا وسوريا ولبنان وفلسطين وإسرائيل. يُعتبر بحر الشام منطقة استراتيجية هامة ومصدرًا للثروات البحرية والأسماك، بالإضافة إلى أهميته الجغرافية والاقتصادية والسياسية في المنطقة.", "12": "يقصدون رسول الله صلى الله عليه وسلم؛ محمد بن عبد الله بن عبد المطلب.", "13": "الحجون هي منطقة في شمال موريتانيا وجنوب الصحراء الكبرى. تشتهر بالطقس القاسي والحياة البرية المتنوعة التي تتكيف مع الظروف الصعبة فيها.", "14": "وأنطاليا هي مدينة ساحلية جميلة تقع في جنوب غرب تركيا على ساحل البحر الأبيض المتوسط. تشتهر بشواطئها الرملية الجميلة والمناظر الطبيعية الخلابة، وتعتبر وجهة سياحية رائعة للعائلات والمسافرين من جميع أنحاء العالم.", "15": "هي مدينة تاريخية تقع في شمال افغانستان، يعود تاريخها إلى حوالي 2000عام قبل الميلاد، ودخلها الاسكندر الأكبر من ضمن حملاته في آسيا، وقد خضعت لحكم الأمبراطورية الساسانية، قبل أن يتم فتحها من قبل المسلمين في القرن السابع الميلادي. ولما فتحت في العهد الاسلامي كانت موطنا للعديد من العلماء والمفكرين، تعرضت للدمار عدة مرات على يد المغول لتعود إلى التاريخ مرة أخرى في العصر الحديث حيث أعيد بناء معالمها التاريخية، وتحتوى على العديد من الأماكن الاثارية مثل «مزار شريف\\\" الذي يحتوى على ضريح على بن أبي طالب.", "16": "يقع الجامع في وسط مدينة قونيا ويعود تاريخ بناءه إلى العصور الأولى للإمبراطورية العثمانية، ويتميز بالعمارة التقليدية العثمانية، ويشمل قبة مركزية ومآذن طويلة.", "17": "هي حدائق تقع في مدينة اسطنبول، في منطقة جينتشليك وهي منطقة تجارية وسكنية، وتعتبر ملاذاً هادئا للناس حيث تتميز بالساحة الخضراء الواسعة والأشجار المتنوعة.", "18": "خفنا", "19": "اي جلدة تغطي أجزاء منها", "20": "- كأنها رأس ثعبان", "21": "- كثير الشعر", "22": "اي كثير التجعد", "23": "اي كثير الجعود", "24": "والاقمر شديد البياض خالصه لا ترى فيه لون مختلط، ومشرب بحمرة.", "25": "هجانا والهجين هو نوع من النوق خفيف الجسم سريع السير", "26": "يَعْنِى الْمَدِينَةَ.", "27": "«ما» في لفظة «ما هو» هي زائدة، وهذا في استعمال العرب.", "28": "نبوءة دابق تشير إلى معركة كبرى ستحدث في أخر الزمان في منطقة دابق، وهي بلدة صغيرة تقع شمال مدينة حلب في سوريا، وهذه النبوءة تتعلق بالأحداث الكائنة كما أخبر رسول الله-صلى الله عليه وسلّم- في بعض أحاديثه، حيث قال: \\\"لا تقوم الساعة حتى ينزل الروم بالأعماق أو بدابق\\\"", "29": "« أي في خيمة أو قبة، والأدم هو الجلد المدبوغ»", "30": "أي المكان الذي يختبأ فيه.", "31": "فأُصبت فجأة", "32": "و بني الأصفرِ\\\" وهم الرُّومُ", "33": "\\\"هُدنةٌ\\\"، أي: صُلْحٌ على تَركِ القِتالِ بعد التَّحرُّكِ فيه،", "34": "\\\"فيغْدِرونَ\\\"، أي: يَنقُضُ الرُّومُ الهُدنةَ،", "35": "وتحت كلِّ رايةٍ اثنا عشَرَ ألفًا من الجُنود.", "36": "هو أحد المواقع التاريخية والطبيعية في المملكة العربية السعودية، ويقع في منطقة عسير بجنوب غرب السعودية، وهي منطقة تتميز بمناخها المعتدل وطبيعتها الخضرا.", "37": "\"الآنك\" تعني الأُسْرُبُّ، وهو الرصاص القلعيّ، أو القزدير", "38": "محافظة سعودية تتبع إدارة منطقة تبوك", "39": "[سورة آل عمران 144]", "40": "منطقة الجابية هي منطقة تقع في جنوب العراق، تشتهر بأراضيها الزراعية الواسعة وخصوبة التربة، وتعتبر جزءًا من محافظة البصرة. تشتهر أيضًا بكثرة الأهوار فيها والتي تعتبر موطنًا للعديد من الأنواع النادرة من الحيوانات والنباتات.", "41": "إذا قلنا \\\"خطبة عصماء\\\"، فالمعنى يكون \\\"خطبة نقية\\\" أو \\\"خطبة محمية من العيوب والشوائب\\\"، حيث تعبر عن خطبة تتسم بالطهارة والنقاء في المضمون والأداء.", "42": "كلمة \\\"بحبوحة\\\" في الحديث النبوي تعني بالنعيم والخير، وتستخدم للدلالة على الراحة والسعادة الفائقة، كما يُصوَّر في الوصفات الإسلامية عن الجنة.", "43": "عباءة قطوانية هي نوع من العباءات المصنوعة من قماش القطوان، وهو نوع من الأقمشة التي تتميز بملمسها الناعم والفخم. غالباً ما يُصنع هذا القماش من صوف عالي الجودة، ويُستخدم في صنع ملابس فاخرة ودافئة. يمكن أن يكون القطوان مزيجاً من الصوف والحرير أو الصوف القطني. تعكس العباءة القطوانية أناقة وفخامة، وتُعتبر خياراً شائعاً للملابس الشتوية الرسمية.", "44": "مدينة إيليا هي مدينة أثرية تاريخية تقع في الجنوب الغربي من فلسطين التاريخية، في منطقة ما يعرف اليوم بجنوب لبنان. كانت إيليا في العصور القديمة مركزًا مهمًا للحضارة الفينيقية، وتعتبر اليوم موقعًا أثريًا مهمًا يجتذب السياح والباحثين لدراسة تاريخها وأثارها.", "45": "بلغراد هي عاصمة صربيا وأكبر مدينة فيها", "46": "عمواس قرية فلسطينية", "47": "هو داء قاتل يصيب الجهاز العصبي للأغنام والماعز.", "48": "متحف مولانا ومعروف أيضا بمتحف جلال الدين الرومي، والمتحف يعد مزارا للسياح، وبه معروضات شخصية تعود لجلال الدين.", "49": "هذه المدينة تقع في محافظة قونيا-تركيا، ترتفع عن سطح البحر حوالي 1007 متر.", "50": "نبوءة دابق تشير إلى معركة كبرى ستحدث في أخر الزمان في الشام بحلب شمال سوريا، وتعتبر هذه المنطقة مهمة تاريخيا ومستقبليا بسبب كونها نقطة شاهدة على قيام نبوءة النبي-عليه الصلاة والسلام- عن الملحمة الكبرى اخر الزمان فقد ذكرت في حديث النبي- صلى الله عليه وسلم- حيث قال: \\\"ينزل الروم بالأعماق أو بدابق\\\". حيث سيواجه جيش المسلمين جيش الروم في تلك المنطقة وهي تعد من علامات قيام الساعة. وتسمى أيضا بــ\\'هر مجدون\\' وهي كلمة وردت في العهد الجديد وهي تشير إلى الملحمة الكبرى أو معارك أخر الزمان؛ وهي تنقسم إلى مقطعين: هر: وتعني جبل أو تل. ومجدون: وهي وادي أو منطقة كنعانية تقع شمالي فلسطين، وسميت بذلك بسبب موقعها على تل استراتيجي حيث تعني التسمية: موضع الجيوش ومخيمها.  ويعود تاريخها إلى الألف الثالثة قبل الميلاد، وتميزت في ظل الحضارة الكنعانية بالبناء الحجري والأسوار الكبيرة، والقصور الفخمة، واشتهرت بصناعة النسيج والملابس؛ وتعتبر اليوم من أهم المناطق الأثرية بفلسطين.", "51": "دابق قرية في منطقة إعزاز في محافظة حلب بسوريا.", "52": "الغاية هي الراية", "53": ". أي كسره.", "54": "هجيري تعني شيء يركب عليه كجمل أو نحوه أي جاء منفردا", "55": "الغوطة تحيط بدمشق من الشرق والغرب، وهي سهل ممتد من بساتين،", "56": "وهي منطقة دابق التي سبق الحديث عنها قبل ذلك وهي قرية في محافظة حلب.", "57": "نقبا أي فتحا أو مدخلا يدخل منه إلى المدينة", "58": "والكير جلد غليظ يستخدمه الحداد للنفخ في النار أو الجمر.", "59": "فيشبح أي؛: يمد بأوتاد في كل قدميه ويديه وتد", "60": "أي ينشر بالمنشار", "61": "الترقوة عظم يمتد من أعلى عظم الصدر إلى لوح الكتف. الأوسط، المَسَالح\\\": هُمْ الخُفَرَاءُ", "62": "أي ثوبين مصبوغين بالأصفر قليلا.", "63": "قطر: اي حبات عرق تنزل منه", "64": "> جمان «الجمان يعني حبات وتنزل كأنها حبات لؤلؤ»", "65": "اصفهان هي إحدى مدن إيران", "66": "الفئام اي عدة قبائل وربما شعب كامل", "67": "الحمة وهي كل ذات سم", "68": "أصيلع اي لا شعر في رأسه", "69": "أفيدع اي متباعد ما بين القدمين", "70": ""};

</script>
<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const cover = $('#cover');
  const reader = $('#reader');
  const content = $('#content');
  const drawer = $('#drawer');
  const overlay = $('#overlay');
  const tocList = $('#tocList');
  const topTitle = $('#topTitle');
  const settingsSheet = $('#settingsSheet');
  const bookmarkToast = $('#bookmarkToast');
  const progressLabel = $('#progressLabel');

  let currentChapterIdx = 0; // index into CHAPTERS array
  let fontSize = 19;
  let theme = 'light';

  // ---------- Storage helpers (persistent, personal) ----------
  async function loadState(){
    try{
      const r = await window.storage.get('reading-state', false);
      if(r && r.value) return JSON.parse(r.value);
    }catch(e){ /* no saved state yet */ }
    return null;
  }
  async function saveState(partial){
    try{
      const existing = await loadState() || {};
      const merged = Object.assign(existing, partial);
      await window.storage.set('reading-state', JSON.stringify(merged), false);
    }catch(e){ console.error('storage error', e); }
  }

  // ---------- Build fahras ----------
  function buildToc(){
    tocList.innerHTML = '';
    CHAPTERS.forEach((ch, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'toc-item' + (ch.section === 'front' ? ' section-front' : '');
      btn.dataset.idx = idx;
      if(ch.section === 'story'){
        const num = storyNumber(idx);
        btn.innerHTML = '<span class="n">'+num+'</span>' + ch.title;
      } else {
        btn.textContent = ch.title;
      }
      btn.addEventListener('click', ()=>{
        openChapter(idx);
        closeDrawer();
      });
      tocList.appendChild(btn);
    });
  }

  function storyNumber(idx){
    let n = 0;
    for(let i=0;i<=idx;i++){
      if(CHAPTERS[i].section === 'story') n++;
    }
    return n;
  }

  function markActiveToc(idx){
    document.querySelectorAll('.toc-item').forEach(b=>{
      b.classList.toggle('active', Number(b.dataset.idx) === idx);
    });
  }

  // ---------- Render chapter ----------
  function renderFootnoteText(text){
    return text.replace(/\^(\d+)/g, (m, num)=>{
      if(FOOTNOTES[num]){
        return '<sup class="fn" data-fn="'+num+'">'+num+'</sup>';
      }
      return '';
    });
  }

  function openChapter(idx, scrollToTop=true){
    if(idx < 0 || idx >= CHAPTERS.length) return;
    currentChapterIdx = idx;
    const ch = CHAPTERS[idx];
    content.innerHTML = '';

    const eyebrow = document.createElement('div');
    eyebrow.className = 'chapter-eyebrow';
    eyebrow.textContent = ch.section === 'story' ? ('الفصل ' + storyNumber(idx)) : 'نبوءة دابق';
    content.appendChild(eyebrow);

    const title = document.createElement('h1');
    title.className = 'chapter-title';
    title.textContent = ch.title.replace(/\s*\(\d+\/\d+\)\s*$/, '');
    content.appendChild(title);

    ch.paras.forEach(p=>{
      if(p.type === 'divider'){
        const d = document.createElement('div');
        d.className = 'divider';
        d.textContent = '۞ ۞ ۞';
        content.appendChild(d);
      } else {
        const el = document.createElement('p');
        el.className = 'para';
        el.innerHTML = renderFootnoteText(p.text);
        content.appendChild(el);
      }
    });

    topTitle.textContent = ch.title.replace(/\s*\(\d+\/\d+\)\s*$/, '');
    progressLabel.textContent = (idx+1) + ' / ' + CHAPTERS.length;
    $('#btnPrev').disabled = idx === 0;
    $('#btnNext').disabled = idx === CHAPTERS.length - 1;
    markActiveToc(idx);

    if(scrollToTop) window.scrollTo({top:0, behavior:'instant'});
    saveState({chapterIdx: idx});
    attachFootnoteHandlers();
  }

  function attachFootnoteHandlers(){
    document.querySelectorAll('sup.fn').forEach(sup=>{
      sup.addEventListener('click', ()=>{
        const n = sup.dataset.fn;
        const txt = FOOTNOTES[n];
        showBookmarkToast(txt, 4500);
      });
    });
  }

  // ---------- Drawer ----------
  function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }

  // ---------- Settings sheet ----------
  function openSheet(){ settingsSheet.classList.add('open'); }
  function closeSheet(){ settingsSheet.classList.remove('open'); }

  function applyTheme(t){
    theme = t;
    document.body.setAttribute('data-theme', t);
    document.querySelectorAll('#themeSeg button').forEach(b=>{
      b.classList.toggle('active', b.dataset.v === t);
    });
    saveState({theme: t});
  }

  function applyFont(size){
    fontSize = size;
    document.documentElement.style.setProperty('--fs', size + 'px');
    document.querySelectorAll('#fontSeg button').forEach(b=>{
      b.classList.toggle('active', Number(b.dataset.v) === size);
    });
    saveState({fontSize: size});
  }

  let toastTimer = null;
  function showBookmarkToast(msg, duration=2200){
    bookmarkToast.textContent = msg;
    bookmarkToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ bookmarkToast.classList.remove('show'); }, duration);
  }

  // ---------- Init ----------
  async function init(){
    buildToc();

    document.getElementById('fontSeg').innerHTML = document.getElementById('fontSeg').innerHTML; // no-op safeguard

    $('#btnOpen').addEventListener('click', ()=>{
      cover.style.display = 'none';
      reader.style.display = 'block';
      openChapter(currentChapterIdx);
    });

    $('#btnResume').addEventListener('click', async ()=>{
      const st = await loadState();
      cover.style.display = 'none';
      reader.style.display = 'block';
      openChapter(st && typeof st.chapterIdx === 'number' ? st.chapterIdx : 0);
    });

    $('#btnToc').addEventListener('click', openDrawer);
    overlay.addEventListener('click', closeDrawer);

    $('#btnSettings').addEventListener('click', openSheet);
    $('#btnCloseSheet').addEventListener('click', closeSheet);

    $('#btnPrev').addEventListener('click', ()=> openChapter(currentChapterIdx - 1));
    $('#btnNext').addEventListener('click', ()=> openChapter(currentChapterIdx + 1));

    document.querySelectorAll('#themeSeg button').forEach(b=>{
      b.addEventListener('click', ()=> applyTheme(b.dataset.v));
    });
    document.querySelectorAll('#fontSeg button').forEach(b=>{
      b.addEventListener('click', ()=> applyFont(Number(b.dataset.v)));
    });

    $('#btnBookmark').addEventListener('click', ()=>{
      saveState({bookmarkIdx: currentChapterIdx, bookmarkScroll: window.scrollY});
      showBookmarkToast('تم حفظ العلامة عند: ' + CHAPTERS[currentChapterIdx].title.replace(/\s*\(\d+\/\d+\)\s*$/, ''));
    });

    // load saved state
    try{
      const st = await loadState();
      if(st){
        if(typeof st.chapterIdx === 'number'){
          $('#btnResume').style.display = 'inline-block';
        }
        applyTheme(st.theme || 'light');
        applyFont(st.fontSize || 19);
      } else {
        applyTheme('light');
        applyFont(19);
      }
    }catch(e){
      applyTheme('light');
      applyFont(19);
    }
  }

  init();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
