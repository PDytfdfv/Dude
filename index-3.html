<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نبوءة دابق</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12141f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2E9D3;
    --bg-2: #E9DCB9;
    --ink: #2B2116;
    --ink-soft: #574a37;
    --gold: #9c7a2f;
    --gold-2: #b8903e;
    --maroon: #6b2337;
    --rule: rgba(43,33,22,0.18);
    --card: #FBF6E9;
    --shadow: rgba(43,33,22,0.25);
    --star-op: 0;
  }
  [data-theme="dark"]{
    --bg: #12141f;
    --bg-2: #191c2b;
    --ink: #e8dcc0;
    --ink-soft: #b7ab8d;
    --gold: #cda545;
    --gold-2: #e8c468;
    --maroon: #c9576f;
    --rule: rgba(232,220,192,0.16);
    --card: #191c2b;
    --shadow: rgba(0,0,0,0.5);
    --star-op: 1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    min-height:100vh;
    transition: background .4s ease, color .4s ease;
    position:relative;
    overflow-x:hidden;
  }
  .starfield{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    opacity: var(--star-op);
    transition: opacity .6s ease;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 70% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 60%, #fff, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 55% 45%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 10% 65%, #fff, transparent),
      radial-gradient(1px 1px at 92% 88%, #fff, transparent),
      radial-gradient(1px 1px at 30% 10%, #fff, transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
  }

  /* ---------- Cover screen ---------- */
  #cover{
    position:relative; z-index:1;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    text-align:center; padding: 0 0 50px;
    background: #1f150f;
  }
  .cover-art{
    width:100%; max-width: 520px; display:block; margin: 0 auto;
  }
  .btn-open{
    margin-top: 26px;
    background: linear-gradient(135deg, #e8c468, #9c7a2f);
    color: #1b1409;
    border:none;
    font-family:'Reem Kufi', sans-serif;
    font-size: 17px;
    font-weight:600;
    padding: 14px 42px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.5);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn-open:active{ transform: scale(.96); }
  .cover-resume{
    margin-top: 14px;
    font-size: 14px;
    color: #cbbfa8;
    background:none; border: 1px solid rgba(232,220,192,0.25); border-radius: 999px;
    padding: 8px 20px; cursor:pointer; font-family:'Reem Kufi', sans-serif;
  }

  /* ---------- Top bar ---------- */
  #reader{ display:none; position:relative; z-index:1; min-height:100vh; }
  .topbar{
    position: sticky; top:0; z-index: 20;
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
    backdrop-filter: blur(6px);
  }
  .icon-btn{
    background:none; border:none; color: var(--ink);
    font-size: 22px; cursor:pointer; padding:6px 10px; line-height:1;
    border-radius:10px;
  }
  .icon-btn:active{ background: var(--bg-2); }
  .topbar-title{
    font-family:'Aref Ruqaa', serif; font-size:16px; color:var(--gold-2); flex:1; text-align:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 8px;
  }

  /* ---------- Fahras drawer ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none;
  }
  #drawer{
    position:fixed; top:0; right:0; height:100vh; width: min(86vw, 340px);
    background: var(--card); z-index:31;
    transform: translateX(100%);
    transition: transform .3s ease;
    box-shadow: -8px 0 30px var(--shadow);
    display:flex; flex-direction:column;
  }
  #drawer.open{ transform: translateX(0); }
  #overlay.open{ display:block; }
  .drawer-head{
    padding: 20px 18px 12px; border-bottom:1px solid var(--rule);
  }
  .drawer-head h2{
    font-family:'Aref Ruqaa', serif; margin:0 0 2px; color:var(--gold-2); font-size:22px;
  }
  .drawer-head p{ margin:0; font-size:12px; color:var(--ink-soft); font-family:'Reem Kufi',sans-serif;}
  .toc-list{ overflow-y:auto; flex:1; padding: 6px 0; }
  .toc-item{
    display:block; width:100%; text-align:right; background:none; border:none;
    color: var(--ink); font-family:'Reem Kufi', sans-serif; font-size:14.5px;
    padding: 12px 18px; cursor:pointer; border-bottom:1px solid var(--rule);
  }
  .toc-item .n{ color: var(--gold); font-size:12px; margin-left:8px; }
  .toc-item.active{ background: var(--bg-2); color: var(--gold-2); font-weight:600; }
  .toc-item.section-front{ color: var(--ink-soft); font-size:13.5px; }

  /* ---------- Content ---------- */
  .content-wrap{
    max-width: 640px; margin: 0 auto; padding: 26px 22px 120px;
  }
  .chapter-eyebrow{
    text-align:center; color: var(--gold); font-family:'Reem Kufi',sans-serif;
    font-size:12px; letter-spacing:3px; margin-bottom:6px;
  }
  .chapter-title{
    text-align:center; font-family:'Aref Ruqaa', serif; color: var(--ink);
    font-size: clamp(22px, 6vw, 30px); margin: 0 0 26px; line-height:1.5;
  }
  .divider{
    text-align:center; color: var(--gold); margin: 30px 0; font-size:18px; letter-spacing:10px;
  }
  p.para{
    font-size: var(--fs, 19px); line-height: 2.05; margin: 0 0 20px; text-align: justify;
    color: var(--ink);
  }
  sup.fn{
    color: var(--maroon); cursor:pointer; font-size: 12px; padding: 0 2px;
    border-bottom: 1px dotted var(--maroon);
  }

  /* ---------- Bottom nav ---------- */
  .bottombar{
    position: fixed; bottom:0; left:0; right:0; z-index:15;
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px; background: var(--bg);
    border-top:1px solid var(--rule);
  }
  .nav-btn{
    background: var(--bg-2); border:none; color:var(--ink); font-family:'Reem Kufi',sans-serif;
    font-size:13px; padding:10px 16px; border-radius:999px; cursor:pointer;
  }
  .nav-btn:disabled{ opacity:.35; }
  .progress-label{ font-size:11px; color:var(--ink-soft); font-family:'Reem Kufi',sans-serif; }

  /* ---------- Font/theme sheet ---------- */
  #settingsSheet{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background: var(--card); border-radius: 18px 18px 0 0;
    transform: translateY(100%); transition: transform .3s ease;
    padding: 18px 20px 26px; box-shadow: 0 -10px 30px var(--shadow);
  }
  #settingsSheet.open{ transform: translateY(0); }
  .sheet-row{ display:flex; align-items:center; justify-content:space-between; margin: 14px 0; }
  .sheet-label{ font-family:'Reem Kufi',sans-serif; font-size:14px; color: var(--ink-soft); }
  .seg{ display:flex; gap:6px; }
  .seg button{
    border:1px solid var(--rule); background:none; color:var(--ink);
    border-radius:10px; padding:8px 14px; font-family:'Reem Kufi',sans-serif; cursor:pointer; font-size:13px;
  }
  .seg button.active{ background: var(--gold); color:#1b1409; border-color:var(--gold); }
  .sheet-close{
    display:block; margin:10px auto 0; background:none; border:none; color:var(--ink-soft);
    font-family:'Reem Kufi',sans-serif; font-size:13px; cursor:pointer;
  }
  .bookmark-toast{
    position:fixed; bottom: 78px; right:50%; transform: translateX(50%) translateY(20px);
    background: var(--gold-2); color:#1b1409; padding:10px 20px; border-radius:999px;
    font-family:'Reem Kufi',sans-serif; font-size:13px; opacity:0; pointer-events:none;
    transition: all .3s ease; z-index:50; white-space:nowrap;
  }
  .bookmark-toast.show{ opacity:1; transform: translateX(50%) translateY(0); }

  @media (min-width:700px){
    #drawer{ width: 340px; }
  }
</style>
</head>
<body data-theme="light">
<div class="starfield"></div>

<!-- COVER -->
<div id="cover">
  <img class="cover-art" src="cover-bg.jpg" alt="نبوءة دابق">
  <button class="btn-open" id="btnOpen">افتح الكتاب</button>
  <button class="cover-resume" id="btnResume" style="display:none;">تابع من حيث توقفت</button>
</div>

<!-- READER -->
<div id="reader">
  <div class="topbar">
    <button class="icon-btn" id="btnToc" aria-label="الفهرس">☰</button>
    <div class="topbar-title" id="topTitle">نبوءة دابق</div>
    <button class="icon-btn" id="btnSettings" aria-label="الإعدادات">Aa</button>
  </div>

  <div class="content-wrap" id="content"></div>

  <div class="bottombar">
    <button class="nav-btn" id="btnPrev">الفصل السابق ←</button>
    <span class="progress-label" id="progressLabel"></span>
    <button class="nav-btn" id="btnNext">→ الفصل التالي</button>
  </div>
</div>

<!-- DRAWER / FAHRAS -->
<div id="overlay"></div>
<div id="drawer">
  <div class="drawer-head">
    <h2>الفهرس</h2>
    <p id="drawerSub">تنقّل بين فصول الرواية</p>
  </div>
  <div class="toc-list" id="tocList"></div>
</div>

<!-- SETTINGS SHEET -->
<div id="settingsSheet">
  <div class="sheet-row">
    <span class="sheet-label">المظهر</span>
    <div class="seg" id="themeSeg">
      <button data-v="light">نهاري</button>
      <button data-v="dark">ليلي</button>
    </div>
  </div>
  <div class="sheet-row">
    <span class="sheet-label">حجم الخط</span>
    <div class="seg" id="fontSeg">
      <button data-v="17">صغير</button>
      <button data-v="19">متوسط</button>
      <button data-v="22">كبير</button>
      <button data-v="26">أكبر</button>
    </div>
  </div>
  <div class="sheet-row">
    <span class="sheet-label">علّم هذا الموضع</span>
    <button class="nav-btn" id="btnBookmark">وضع علامة 🔖</button>
  </div>
  <button class="sheet-close" id="btnCloseSheet">إغلاق</button>
</div>

<div class="bookmark-toast" id="bookmarkToast">تم حفظ العلامة المرجعية</div>

<script>
const CHAPTERS = [{"id": 1, "title": "الغلاف والإهداء", "paras": [{"type": "p", "text": "نُبُوءَةُ دَابِق"}, {"type": "p", "text": "تأليف"}, {"type": "p", "text": "محمد سيد الأطرش"}, {"type": "p", "text": "«بسم الله الرحمن الرحيم»"}, {"type": "p", "text": "(فَهَلۡ یَنظُرُونَ إِلَّا ٱلسَّاعَةَ أَن تَأۡتِیَهُم بَغۡتَةࣰۖ فَقَدۡ جَاۤءَ أَشۡرَاطُهَاۚ فَأَنَّىٰ لَهُمۡ إِذَا جَاۤءَتۡهُمۡ ذِكۡرَىٰهُمۡ)"}, {"type": "p", "text": "[سورة محمد 18]"}, {"type": "p", "text": "الإهداء"}, {"type": "p", "text": "إلى من يهمه الأمر؛ من يريد اتقاء الفتن، من يريد النجاة من براثن العاصفة لمَّ تقع، من يريد أن يفهم تفاصيل الحكاية؛ إليك أيها القارئ العزيز أُهديك كتابي هذا عسى أن تنتفع به، فإن لقيت به خيرًا فلتحمد الله على أن أرشدك لبعض الحقيقة، وإن كان غير ذلك فدونك فلتلقه بيم النسيان، وأدعو الله لي بالخير والهداية على أن حاولت."}, {"type": "p", "text": "تنويه هام"}, {"type": "p", "text": "كان لزاما ان ننبه على الآتي:"}, {"type": "p", "text": "ان ما جاء في بعض الأحاديث هو اعادة صياغة لها في"}, {"type": "p", "text": "قالب قصصي ومن أراد الحديث بالنص فليعود للمصادر أدناه."}, {"type": "p", "text": "وليعلم القارئ العزيز أن هناك من الحوارات القليلة في جانب ما وردت به الأحاديث عن نبوءة دابق، والتي جاءت من خلال فهم الأحداث وليس هناك نص يثبتها، ومنها ما لمحت إليه الأحاديث ومنها ما تم استنتاجه ولكن تبقى الأحداث الرئيسية كما جاءت."}, {"type": "p", "text": "وهناك شيء من الأثار التي لم تقم أدلة كافية على صحتها، فأوردناها ولكن على كونها حلم أو هاجس وقع لبطل القصة."}, {"type": "p", "text": "والله من وراء القصد."}, {"type": "p", "text": "تم في"}], "section": "front"}, {"id": 2, "title": "الفتنة الكبرى — قصة الجسّاسة", "paras": [{"type": "p", "text": "الفتنة الكبرى"}, {"type": "p", "text": "جزيرة الدجال - وسط البحر"}, {"type": "p", "text": "فجرا."}, {"type": "p", "text": "تناقلت تلك الخطوات المسرعة طارحة خوفًا من وراء ظهورها وناظرةً لتوجسٍ وخيفةٍ قادمان من فراغات ذلك الكهف المظلم، حيث تعانقت الأنفاس مع روائح الأرض وجران الهف الرطبة، والصخور القديمة قدم الحضارات الغابرة."}, {"type": "p", "text": "أشعة الشمس الخافتة قد انعكست متسللة من فتحة الكهف على جدرانه الصخرية بأناقة فائقة، راحت تمتزج مع الانسجة المتسللة عبر ثنايا الظلام لترسم اشكال فنية تعكس مدى عمق المكان وأسراره وسريته."}, {"type": "p", "text": "وفجأة وفي لحظة واحدة من التأمل الشديد والتفكير وضحت الصورة المرعبة قدام عيونهم، وتداعب كل حواسهم وأفكارهم لتنسج خيوط كاملة"}, {"type": "p", "text": "لنسج أفكار قد ولدت لتوها، سائلة عن كينونة ذلك الشيء الغريب؛ الذي لم نرى مثله في حياتنا أبدا، وما ترك العقول حتى طرأت عليها بنات العقل."}, {"type": "p", "text": "ذهول يبدو على أعين القوم، تساؤلات تسقط على الأفئدة كالسهام، ولحظات من الصمت يقطعها أحدنا بقوله لذلك الكائن العجيب ونحن في إثره:"}, {"type": "p", "text": "قلنا: ويلك ما أنت؟"}, {"type": "p", "text": "لم يجب عن سؤالنا مثلما فعلت الدابة من قبل، ولكنه نظر إلينا ولولا انه مقيد لما استطعنا محاورته من خوفنا على أنفسنا:"}, {"type": "p", "text": "قال: قد قدرتم على خبري، فأخبروني ما أنتم؟"}, {"type": "p", "text": "قلنا: نحن أناس من العرب، ركبنا في سفينة بحرية، فصادفنا البحر حين اغتلم^1"}, {"type": "p", "text": "فلعب بنا الموج شهرًا، ثم أرفأنا^2 إلى جزيرتك هذه،"}, {"type": "p", "text": "فجلسنا في أقربها، ولما دخلنا الجزيرة استقبلتنا دابة كثير الشعر، لا يدري ما قُبله من دبره من كثرة الشعر."}, {"type": "p", "text": "فقلنا: ويلك ما أنت؟"}, {"type": "p", "text": "فقالت: أنا الجساسة."}, {"type": "p", "text": "قلنا: وما الجساسة؟"}, {"type": "p", "text": "قالت: اعمدوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق."}, {"type": "p", "text": "فأقبلنا إليك سراعًا، وفزعنا منها، ولم نأمن أن تكون شيطانة."}, {"type": "p", "text": "فقال: أخبروني عن نخل بيسان^3."}, {"type": "p", "text": "قلنا: عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال: أسألكم عن نخلها، هل يثمر؟"}, {"type": "p", "text": "قلنا له: نعم."}, {"type": "p", "text": "فقال: أما إنه يوشك أن لا تثمر."}, {"type": "p", "text": "فلما أخبرناه بذلك، وثب^4 وثبة كاد أن يخرج من الجدار"}, {"type": "p", "text": "ثم قال : أما لو قد أذن لي في الخروج"}, {"type": "p", "text": "لوطئت البلاد كلها غير طيبة^5، ثم نظر إلينا بعد أن هدأ من وثبته وقال:"}, {"type": "p", "text": "قال: أخبروني عن بحيرة الطبرية.^6"}, {"type": "p", "text": "قلنا: عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال: هل فيها ماء؟"}, {"type": "p", "text": "قالوا: هي كثيرة الماء."}, {"type": "p", "text": "قال: أما إن ماءها يوشك أن يذهب."}, {"type": "p", "text": "فقال: أخبروني عن عين زغر^7."}, {"type": "p", "text": "قالوا: عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال: هل في العين ماء؟ وهل يزرع أهلها بماء العين؟"}, {"type": "p", "text": "قلنا له: نعم، هي كثيرة الماء، وأهلها يزرعون من مائها."}, {"type": "p", "text": "فلما أخبرناه عن شأنها وثب أيضا وثبة كاد أن يخرج من وراء الجدار."}, {"type": "p", "text": "قال: أخبروني عن نبي الأميين ما فعل؟"}, {"type": "p", "text": "قالوا: قد خرج من مكة ونزل يثرب."}, {"type": "p", "text": "قال: أقاتله العرب؟"}, {"type": "p", "text": "قلنا: نعم."}, {"type": "p", "text": "قال: كيف صنع بهم؟"}, {"type": "p", "text": "فأخبرناه أنه قد ظهر على من يليه من العرب وأطاعوه."}, {"type": "p", "text": "قال لهم: قد كان ذلك؟"}, {"type": "p", "text": "قلنا: نعم."}, {"type": "p", "text": "قال: أما إن ذلك خير لهم أن يطيعوه."}, {"type": "p", "text": "وإني مخبركم عني، إني أنا المسيح^8، وإني أوشك أن يؤذن لي في الخروج، فأخرج فأسير في الأرض، فلا أدع قرية إلا هبطتها في أربعين ليلة، غير مكة وطيبة."}, {"type": "p", "text": "فهما محرمتان علي كلتاهما، كلما أردت أن أدخل واحدة أو واحدًا منهما استقبلني ملك بيده السيف صلتًا^9 يصدني عنها، وإن على كل نقب منها ملائكة يحرسونها."}, {"type": "divider"}], "section": "front"}, {"id": 3, "title": "تقدمة", "paras": [{"type": "p", "text": "تلك كانت قصة ذلك المخلوق الغريب؛ هي فقط البداية التي ستحيل كل شيء إلى عالم من الغموض."}, {"type": "p", "text": "عندما يؤذن له بالخروج المهيب سيفسد في الأرض إيما إفساد، لتكون فتنة من أعظم فتن الدنيا مذ خلق الله الأرض ومن عليها، خروجه معدود من علامات الساعة والملاحم وانتهاء الدنيا، لذا كان لزاما أن نبدأ قصتنا به ."}, {"type": "p", "text": "ليفهم الناس مدى خطورة فتنته العصيبة، على المعتقد والنفس، لنقرأ باهتمام وندرس قصته للوقوف على حقيقته؛ لكي نتقيه إذا ما خرج."}, {"type": "p", "text": "ها أنا ذا أسمعك عزيزي القارئ وأنت تفكر وتقول بلسان غير عابئ:"}, {"type": "p", "text": "وأين أنا من ذلك الدجال؛ وهو من علامات اخر الزمان؟!!."}, {"type": "p", "text": "ولكن احذر ولا تظن أن زمنه بعيد؛ فلربما كان قريبًا وأنت لا تدري؛ فقد اقتربت الساعة وانشق القمر، وهي يومئذ أقرب منا ونحن في غفلة معرضون، ما يأتينا من قولٍ إلا كنا له تاركين."}, {"type": "p", "text": "رحلة عبر التاريخ الإسلامي"}, {"type": "p", "text": "نترك قصة الدجال ها هنا في بحر الشام، في جزيرته، ونسافر إلى أنقرة، إحدى مدن تركيا، لنتعرف على بعضا من شخصيات قصتنا؛ منصور وأمير والشيخ علاء الدين؛ سيقوم ذلك الشيخ بتولي دفة الحديث وسرد تفاصيل نهاية العالم والملحمة الكبرى؛ فكن مستعدًا، عزيزي القارئ، لتغوص في عمق التاريخ."}, {"type": "p", "text": "ستبدأ رحلتنا من أرض الصحابة لنمر بمحنتهم يوم وفات رسول الله - صلى الله عليه وسلّم- وكيف تحملوا ذلك النبأ العصيب، ولنمر مرور الكرام على لمحات من التاريخ حيث نرى ونشاهد تفاصيل الطاعون في أرض عمواس، ذلك الوباء الفتاك ونرى صمودهم وإيمانهم وكيف تغلبوا على المصاعب."}, {"type": "p", "text": "فتح بيت المقدس"}, {"type": "p", "text": "سوف تشاهد الصحابي الجليل عمر بن الخطاب «الفاروق» وهو يفتتح بيت المقدس بعدما دام لسنين في يد الرومان، ثم لنأخذك في رحلة أخرى عبر التاريخ، لنتجاوز زمن الصحابة والخلفاء الأربعة، لنتوقف عند العهد الأيوبي ونرى القائد العظيم صلاح الدين الأيوبي وهو يعيد أمجاد الخليفة عمر بن الخطاب مرة أخرى في فتح بيت المقدس في هذه الفتراة، سنستمتع ونتعلم الدروس والعبر والعظات والشجاعة والتضحيات التي قدمها المسلمون."}, {"type": "p", "text": "العصر الذهبي للخلافة الإسلامية"}, {"type": "p", "text": "نرتحل عبر التاريخ لنصل إلى فترة من فترات عهد الخلافة الإسلامية كانت من أكثر الفترات رخاءً، سنروي قصة الخليفة الخامس عمر بن عبد العزيز وكيف فاض المال في عهده لدرجة أنه قال: \\\"أنثروا الحب على رؤوس الجبال\\\"."}, {"type": "p", "text": "لكن، لا تفرح كثيرًا، عزيزي القارئ، فكثرة المال تعقبها فتن كقطع الليل المظلم؛ والقابض فيها على دينه كالجالس على حفرة من نار؛ مثل فتنة لا يبقى بيت من العرب إلا دخلته، ودهيماء أشد وطأة من ظلال الغيم، والسراء التي تسر العداء، وسنتعلم من هذه الفترة أهمية العدالة والاعتدال، وأهمية العدل والقيم، وخطر الفتن وحرقتها."}, {"type": "p", "text": "الواقع والحاضر"}, {"type": "p", "text": "بعدها، ننتقل للحاضر في رحلة إلى الأرض المقدسة لنرى قوة الإيمان والعزيمة في رباط أهل غزة، سنرى كيف يصمدون رغم كل التحديات والمصاعب."}, {"type": "p", "text": "ثم نسافر إلى المستقبل لنكشف عن أحداث قادمة، لا محالة ستقع، سنجعلك تطلع على قبضة من أثر المستقبل الذي بات ماضيًا وتدرك أمور ستأتي قريبًا؛ لتكون مستعدًا إذا واجهتك، سنكشف عن علامات الساعة التي قد تكون قريبة منا أكثر مما نعتقد."}, {"type": "p", "text": "رؤية المستقبل بعيون الماضي"}, {"type": "p", "text": "لترى المستقبل بعيون الماضي، وترى عجائب الدنيا قبيل الساعة، وتلك الحروب الصغيرة وما يتبعها من هدن، لنقف معًا، عزيزي القارئ، على عتبات الملحمة الكبرى ونشاهد تفاصيلها التي ستروعك في أحيان وتُسرك في أحيان أخرى. ستشعر وكأنك تعيش هذه الأحداث بنفسك."}, {"type": "p", "text": "بداية النهاية"}, {"type": "p", "text": "عندها تبدأ بداية النهاية والأحداث العظام. سترى المسيح الدجال وكيف سيفتن الناس عن دينهم، وتشاهد ما جعل الله له من قدرة رهيبة وفتن عظيمة؛ ستراه يقتل إنسانًا ويحييه مرة أخرى بقدرة الله ، يحيي أبوين ميتين لرجل ليصدقه بأنه إله، يقول للسماء أن تمطر فتمطر، وللأرض أن تنبت فتنبت، ستشعر برعب هذه الفتن وكأنك تعيشها."}, {"type": "p", "text": "النهاية والنصر"}, {"type": "p", "text": "ولكنك ستفرح عندما تشاهد نهايته، وترى المهدي والنبي عيسى عليه السلام قد نزلوا ليحاربوا اليهود، ستشاهد بنفسك كيف يقاتلهم المسلمون حتى ترى النصر الذي كنت تحلم به وتتمنى أن تراه عيانًا؛ قد أصبح حقيقة وواقعًا، ثم ترى الخطر الكبير، فتنة أخرى؛ خروج يأجوج ومأجوج وكيف تصرف السيد المسيح عليه السلام مع هذا الخطر. سترى تفاصيل الحكاية كلها وكأنك تشاهد هذه الأحداث بعينيك."}, {"type": "p", "text": "جنة الدنيا"}, {"type": "p", "text": "وها أنت الآن، عزيزي القارئ، تعيش أجمل 40 عامًا من تاريخ الحياة. ستشاهد فيها وترى جنة الدنيا على الأرض بعد انتهاء الشر، وكيف عاش المسلمون تلك المدة بدون ظلم وفتن، وفي سلام دائم وأمان عظيم، ستشعر بروعة هذه الفترة وتعيش تفاصيلها، ثم تأتي ريح الموت الطيبة فتأخذ المؤمنين؛ لترى بنفسك الدين وهو يتبدل ويتحرف ويضيع، وتعود الناس لسابقة أمرها من الفساد، سترى الكعبة تُهدم أمام عينيك حجرا حجرا ، في محضر من الناس وهم لا يحركون ساكنًا، ولا يبقى إلا شرار الخلق وعليهم تقوم الساعة، وتنتهي الدنيا."}, {"type": "p", "text": "قد تتساءل، عزيزي القارئ، ما علاقة كل تلك الأحداث ببعضها؟ فدعني أخبرك : ببساطة، كل حدث منها يُعد علامة من علامات الساعة ونبأ يسبق الملحمة الكبرى أو يتأخر عنها."}, {"type": "p", "text": "فإذا أردت أن تشاهد الملحمة الكبرى وترى أشراط الساعة الصغرى والكبرى، فلتتابع القراءة؛ لتحصل على إجاباتٍ لتساؤلاتك وترى كيف ترتبط هذه الأحداث بشكل كبير."}, {"type": "divider"}], "section": "front"}, {"id": 4, "title": "مدينة أنقرة التركية: (1/3)", "paras": [{"type": "p", "text": "حيث انتهت الحضارة؛ من هنا نبدأ النهاية."}, {"type": "p", "text": "كان السوق الكبير مكتظ بالناس ويعج بالنشاط في وقت ظهرٍ صيفي شديد الحر، والبسطات والأكشاك منتشرة في كل اتجاه على ظهر البسيطة تحت طول السماء الزرقاء ذات الصفاء الهادي كلوحة مدهشة."}, {"type": "p", "text": "رائحة الأشياء تختلط ببعضها في نسيج متداخل على الأنوف من كل اتجاه، بينما أصوات الباعة والمشترون تتخلل الأجواء، والناس تتجول بين الطرقات والمحلات التجارية يتفاوضون في الأسعار ويختارون أنسب المبيع."}, {"type": "p", "text": "وسط هذا الزحام يقف الصديقان منصور وأمير بجانب بسطتهما ويبتسمان للزبائن،"}, {"type": "p", "text": "منصور بشعره الأسود المموج وعينيه اللامعتين، كان يرتدي جلبابا أبيض يبرز ملامحه الواثقة."}, {"type": "p", "text": "وأمير كان يرتدي قميصا بلون ازرق كلون السماء وسروالا بسيطا، وكان يبدو عليه الهدوء، وبعض الحماس لما يتحدث عن البضاعة."}, {"type": "p", "text": "تعرض البضاعة متنوعة في كل ركن وجانب؛ أقمشة ملونة تتدلى من فوق البسطات بشكل ساحر، وتلك الحلي الذهبية والفضية التي تلمع تحت أشعة الشمس، أوانٍ فخارية مزينة بأبهى النقوش البديعة."}, {"type": "p", "text": "كان أمير يشير إلى بعض الأقمشة الفاخرة، يشرح للزبائن عن نوعيتها ومصدرها، بينما منصور يعرض الحلي بأسلوب مقنع، يدعو الناس لتجربة ارتدائها."}, {"type": "p", "text": "السوق يعج بالحياة والفوضى وبعض النظام، أطفال تجرى بين البسطات، أصوت الضحكات تتناغم مع صخب المكان، النساء يختبرن الأقمشة، وأيديهن تتلمس نعومة وجودة خامات القماش، وكأنهن يتسامرن بجزء من تاريخ هذا السوق العتيق. .."}, {"type": "divider"}, {"type": "p", "text": "وقفت امرأة تتفحص قماشة بعناية، ثم سألت بلهجة ممزوجة بالحيرة: \\\"هل تعتقد أن هذا السعر مناسب لهذه القماشة؟\\\""}, {"type": "p", "text": "ابتسم أمير بثقة، مجيبًا: \\\"بالطبع، إنه عرض خاص اليوم فقط يا سيدتي.\\\""}, {"type": "p", "text": "من جانبه، نظر منصور إلى الزبون بفخر وقال: \\\"أتعلم؟ هذا السوق موجود منذ أكثر من مائة عام.\\\""}, {"type": "p", "text": "تفاجأ الزبون وابتسم قائلاً: \\\"حقًا؟ لم أكن أعلم ذلك.\\\""}, {"type": "p", "text": "أمير، دون أن يفقد ابتسامته، أشار إلى قلادة براقة، وقال: \\\"انظر كيف تلمع تحت ضوء الشمس. ستكون رائعة عليك.\\\""}, {"type": "p", "text": "ثم استدار منصور نحو الزبون الذي كان يتحسس الأقمشة بعناية، وسأله: \\\"هل أعجبتك هذه الأقمشة؟\\\""}, {"type": "p", "text": "أجاب الزبون بإعجاب: \\\"نعم، إنها جميلة جدًا.\\\""}, {"type": "divider"}, {"type": "p", "text": "في وسط هذه الزحمة والفوضة؛ كان منصور واقفًا في بسطته، يتحدث ويبتسم للزبائن، حتى لمح بطرف عينه من بعيد حركة سريعة تحدث فجأة في المكان بين الأكشاك الملونة والأصوات العالية؛ كان هناك ولدًا يجري مسرعاً، متعبٌ ووجهه شاحب وعينيه يملئهما الخوف والقلق."}, {"type": "p", "text": "كاد الفتى يسقط لولا أن أمسك به رجل ضخم الجثة كان واقفا يتفحص البضاعة، ثم وقف الولد بعد ما سقط وأخذ يهندم ثوبه، ثم اقترب وهو يتنفس بصعوبة وبصوت متهدج ويديه ترتعشان ثم قال:"}, {"type": "p", "text": "عمي منصور...... عمي منصور.....؛ والدك...."}, {"type": "p", "text": "ما إن سمع ذلك حتى اختفت ابتسامة منصور وتحولت عينيه تحديقا وقد ارتسمت عليهما معان القلق، ثم انحنى للولد وسأله بصوت خافت؛ كأنه توجس خيفة من سماع الإجابة:"}, {"type": "p", "text": "ماذا به ابي؟!"}, {"type": "p", "text": "تردد الولد لحظة ثم استجمع أنفاسه وقوته وهمس بتلك الكلمات التي غيرت حياة منصور للأبد:"}, {"type": "p", "text": "والدك..... يلفظ أنفاسه الأخيرة؟؟."}, {"type": "p", "text": "طرئت لحظة من الصمت القاتل خيمت على المكان؛ وكأن الزمن توقف، شعر منصور بثقل الهواء من حوله، والأصوات خافتة، وأحس ببرودة تسري في جسده، وفقدت يديه قوتهما؛ لتسقط من يده قطعة من الحلي كان يحملها في يده على الأرض محدثة صوتاً معدني رنان."}, {"type": "p", "text": "عادت لحظات من حياته السبقة قبل أن يستعيد منصور توازنه، وكانت عينيه تبحث في وجه الصبي عن ملامح نفي لما سمعه، ولكن تعابير وجه الولد كانت صادقة وواضحة بحيث لم تترك مجالاً للشك."}, {"type": "p", "text": "أخذ منصور نفس عميق، ثم حاول ابتلاع تلك الغصة التي في حلقه، رفع رأسه للسماء وأغمض عينية للحظة يستجمع فيها شتات نفسه وشجاعته، ولما فتح عينيه مرة اخرى كانت ملامحه تعكس ذلك الحزن المفاجئ، وأيضا الإصرار على مواجهة المصاعب."}, {"type": "p", "text": "ربت منصور على رأس الولد برفق ثم قال بصوت هادئ لكنه لا يخلُ من الحزن: شكرا لك يا بني..... سأذهب الأن."}, {"type": "p", "text": "التفت منصور ببطء ونظر إلى بسطته المليئة بالبضاعة والتي أصبحت فجأة بلا قيمة لديه؛ جمع ما استطاع مسرعا ومن غير أن يتكلم مع أحد بدأ يمشي متجه لبيته، وهو يعلم أن هناك حياة كاملة بالتغيير تنتظره، ليواجه هذه الفاجعة الجديدة."}, {"type": "divider"}, {"type": "p", "text": "عندما دخل البيت، وجد أباه في لحظات الموت الأخيرة. نظر إليه فلم يتمالك نفسه من البكاء، وأحس بشعور الندم والألم والتقصير. أمسك بيديه ثم قال: \\\"سامحني يا أبي، ما كنت على قدر الطاعة، وما أحسنت يومًا أن أكون لك ابنًا، ولكني ما علمت أنني عاق إلا في هذه الساعة.\\\""}, {"type": "p", "text": "تمالك الأب أنفاسه بعد أن تحامل على شفتيه ليتكلم ثم قال: \\\"يا بني، آخر وصيتي لك وأنا على فراش الموت، لا تدع شيطانك يعميك عن حقيقتك التي لا مفر منها، فالقبر مثواك الأخير. لا تترك روحك تنثني عن السمو وتتعلق بالدنيا الفانية. ضع أخلاقك تسمو، كن مع الله يكن الله معك."}, {"type": "p", "text": "روحك لن تجد صفاءً إلا إذا أقبلت بقلبك وتأملت بعقلك وجعلت بصيرتك تسمو فوق بصرك. لم يساعدك على ذلك إلا صديق، فابحث عنه بين الجميع. يا بني، احذر الفتن فإنها قادمة. اقرأ كتاب الله واعمل بما فيه، ولا تنسينك الدنيا. فإن الفتن إذا جاءت عصفت بالجميع، ولا حامي إلا قوة العقيدة. إياك وفتن الساعة، إياك وأشراط الساعة، إياك وفتن الساعة.\\\""}, {"type": "p", "text": "كررها مرارًا."}, {"type": "p", "text": "مسح منصور على وجه أبيه ثم ودعه في حزن وألم وحيرة من أمره."}, {"type": "divider"}, {"type": "p", "text": "توقف منصور للحظة، مسترجعًا كلمات والده الأخيرة:"}, {"type": "p", "text": "\\\"احذر فتن الساعة، وابحث عن صديق يعينك.\\\""}, {"type": "p", "text": "ما الذي كان يقصده والده بالضبط؟ هل كانت تلك تحذيرات عامة، أم أن هناك أمرًا محددًا كان يخشاه؟ ومن هو هذا الصديق الذي يجب أن يبحث عنه؟"}, {"type": "p", "text": "كانت الأسئلة تتزاحم في ذهن منصور كأمواج عاتية، كل واحدة منها تحمل معها عبء الغموض والتساؤل."}, {"type": "p", "text": "هل كان والده يعلم شيئًا لم يخبره به؟ وهل كان هذا التحذير مرتبطًا بماضيهم، أم أنه ينبئ بمستقبل غامض ومخيف؟! كل تلك الأسئلة سنعرف إجاباتها فيما هو قادم عزيزي القارئ، فلتحتسي كوب قهوتك الجميل قبل أن يبرد ولنتابع القراءة."}, {"type": "divider"}, {"type": "p", "text": "وهنا في قونيا إحدى مدن تركيا الجميلة نجد ذلك الشيخ ذو الوقار يجلس بعد انتهاء الصلاة ليعطي الناس دروس في مسجد قونيا الكبير، فهو بطل حكايتنا وهو من سيتولى الحديث عن ملاحم أخر الزمان؛ لذا فكن مستعدا لتبدأ رحلتك انتقالاً عبر التاريخ؛ فلن تقف عند محطة واحدة، وكن مستعدا لبداية النهاية."}, {"type": "p", "text": "أرض ألله المقدسة"}, {"type": "p", "text": "اقتربت السفينة من الشاطئ في جوٍ غائم، حيث تتلاطم الأمواج كجبالٍ شاهقة، والسفينة تتأرجح كريشة فوق سطح الماء. الرياح كانت شديدة، وكأنها سيلٌ جارفٌ قادرٌ على قذف كل من يقف في وجهه إلى أعماق اليم."}, {"type": "p", "text": "حتى إذا هدأت العاصفة، وارتخت الأمواج، وسكنت الأصوات، ولم يُسمع سوى همساتٍ خافتة، خرج القوم من مخابئهم ليستقلوا السفينة."}, {"type": "p", "text": "عجبًا، كلٌّ يفكر في غداة يوم جديد، لعلّ كل واحدٍ منهم يصيب غايته، بيننا من كان متوجسًا خيفةً، ومن لا يرغب في الخروج، وكلٌّ منهم غارق في أفكاره، يحمل في داخله أمواجًا من الهموم أعلى تلاطمًا من تلك التي شهدوها في البحر."}, {"type": "p", "text": "لا ضير في ذلك، فذلك يوم عجيب جمعنا له؛ وجمع لنا من أنبائه ما تبشر به مقدمته."}, {"type": "p", "text": "حتى إذا تجهزنا بجهازنا، قال قائل منا: \\\"أيتها العير، أأنكم لمستعدون؟!\\\"."}, {"type": "p", "text": "ها أنا ذا ودعت بيتي، وحملت زادي، وانطلقت بين الركب، ناظرا لمستقبل مجهول، ومؤمل بلوغنا للضفة الأخرى..."}, {"type": "p", "text": "مدينة أنقرة التركية:"}, {"type": "p", "text": "وفي مكان أخر؛ بعيداً عن تلك الأجواء المزدحمة، في مدينة أنقرة التركية؛ كانت الشمس تقترب من المغيب، والسوق الكبير هناك كان يشهد تحولا تدريجيا بالانفضاض، الحركة بدأت في الخفوت لحظة بعد لحظة، والضوضاء العالية التي كانت تغشى الأماكن قد أصبحت همسات متهدجة، والمشادات الكلامية العالية باتت حوارات هادئة، كان التجار يغلقون أكشاكهم ويجمعون بضائعهم بعناية؛ استعداداً للرجوع لبيوتهم بعد يوم طويل من البيع والشراء."}, {"type": "p", "text": "في وسط المشهد كان أمير واقفاً بجانب بسطته، يلملم ما تبقى من بضاعته بعناية، كان يضع الحلى الذهبية والفضية في صناديق صغيرة مبطنة بالقطن، وكان شديد التركيز على ترتيب كل قطعة بحرص في أماكنها؛ نظر أمير على السوق الذي أصبح فارغاً إلى حدٍ كبير، وشعر بالهدوء الذي يأتي بعد ضوضاء الزحام، وكأن السوق يلفظ أنفاسه الأخيرة قبل أن يغلق أبوابه لليوم."}, {"type": "p", "text": "تلك الأرض المرصوفة التي كانت مليئة بالناس أصبحت الان شبه فارغة، مع بقايا الورق والأكياس المتناثرة هنا وهناك، أصوات أقدام الناس العاجلة قلت، وضجيج المساومات قد اختفى، ولم يبقى إلا بعض التجار لا يزالوا يغلقون بسطاتهم وأكشاكهم وهم يتبادلون التحيات والابتسامات المتعبة"}, {"type": "p", "text": "نظر أمير إلى السماء التي بدأت تتلون بألوان الغروب الدافئة، ثم قال:"}, {"type": "p", "text": "\\\"يبدو أن اليوم كان قاسيًا على منصور، يا ترى ما الذي حدث له؟!\\\""}, {"type": "p", "text": "وأخذ يتساءل ما ذلك الخبر الذي جعله يترك كل شيء هكذا ويذهب."}, {"type": "p", "text": "وقد جمع آخر صناديقهما، وحملها على عربتهما الخشبية المتهالكة، وبدأ يسير عبر الأزقة الضيقة التي كانت تفيض بالحياة قبل ساعات قليلة، الآن تملؤها السكينة والهدوء، كانت أقدامه تتناغم مع صوت العربة التي تجر خلفه، وكل خطوة تقربه من نهاية يوم آخر في السوق."}, {"type": "p", "text": "أثناء سيره، تبادل الأحاديث الهادئة، مع أحد التجار الذين كانوا بالسوق، واستعادا بعض المواقف الطريفة التي مرت عليهم خلال اليوم....."}, {"type": "p", "text": "لِمَ أراك تعود لبيتك بمفردك اليوم وأين صديقك الدائم، أتفرقتما بعد طول طريق؟!"}, {"type": "p", "text": "قالها ذلك الرجل الخمسيني ذو البشرة السمراء بلسان سؤول مستفهِم؟!"}, {"type": "p", "text": "فأجاب أمير بلسان النفي قائلا:"}, {"type": "p", "text": "كلا؛ وأنى لي برفقة كرفقته إن افترقنا!؟."}, {"type": "p", "text": "قد قلت ذلك في نفسي، وأنا الذي عهدتكما صديقين منذ رأيتكما في هذا السوق وهذا ما دعاني للسؤال:"}, {"type": "p", "text": "قالها ذلك التاجر ليرد عليه أمير بلسان ثقيل وشعور حزين:"}, {"type": "p", "text": "لا أدرى؛ لقد لمحته وأنا منشغل في فصال بيني وبين زبون أطال علي في السعر، أن طفل أتاه فحدثه بحديث لم أسمع منه شيء ثم وبلا سابق إنذار رأيته فجأة وقد لملم بعض أشيائه راحلاً."}, {"type": "p", "text": "كان السوق بالنسبة لهما أكثر من مجرد مكان للعمل؛ كان ملاذًا يجمع بين الأمل والتحدي، ويحتضن ذكرياتهم وأحلامهما."}], "section": "story"}, {"id": 5, "title": "مدينة أنقرة التركية: (2/3)", "paras": [{"type": "divider"}, {"type": "p", "text": "Top of Form"}, {"type": "p", "text": "Bottom of Form"}, {"type": "p", "text": "كانت الشمس قد انطلقت في رحلتها نحو المغيب تاركةً مهمة الضياء للقمر ليتطوع في جمالا لينير عتمات الأفق، فالنهار ولى والليل أتى بجنوده لنستقبل ليلة سامرة لعشاق النجوم والسهر، ونسائم الهواء العليل المتداخل في ثناياه بعض البرودة."}, {"type": "p", "text": "تلك الحجارة المرصوفة، عبر الأزقة والطرق المتفرعة حول المباني والأسطح الحمراء والشرفات الساطعة بلمحة شعاع الغروب، تلك النباتات المتسلقة حول جدران المنازل وتلك الحدائق الصغيرة التي تملأها الزهور الملونة."}, {"type": "p", "text": "رائحة الطعام المنبعثة من نوافذ البيوتات، وأصوات الناس تقترب أكثر فأكثر وهم يتجاذبون أطراف الحديث من النوافذ والباحات، الأطفال يلعبون في كل ركن والنساء أمام بيوتهن يتبادلن الأحاديث."}, {"type": "p", "text": "ها قد أتى أمير وقد جمع ما تبقى من بضاعتهما ثم عاد إلى بيته ومشاعر القلق والتواتر بادية على وجهه، تتساقط على فؤاده سهام الفكر، وقف امام منزل منصور ونادى عليه."}, {"type": "p", "text": "بعد النداء بقليل خرج منصور وهو يجر ثوب الحزن والألم فلما سأله عما حدث اجهش بالبكاء وقال: قد مات ابي."}, {"type": "divider"}, {"type": "p", "text": "انقضى أسبوعان على موت الحلاج، وكأنما تلك الأيام تحولت إلى دهور، تمرّ كالجبال الشاهقة على قلب المنصور الذي مزّق الفقدان قلبه."}, {"type": "p", "text": "انعزل في منزله، مكتئبًا، غارقًا في الحزن، لا يخرج إلى عمله، ولا يتواصل مع أحد، في تلك اللحظات التي يجلس فيها أمام البيت وحيدًا، كان صديقه يأتيه أحيانًا، يتحسس نبضه وينظر في عينيه بعطف، ليطمئن على حاله."}, {"type": "p", "text": "\\\"هكذا هي الدنيا تنسينا همومها ومشاغلها أن اخر المطاف لابد أن نرحل ولا يبقى لنا من الدنيا شيء سوى ما نعمل من العمل الصالح .\\\""}, {"type": "p", "text": "\\\"ومهما طالت الدنيا فهي قصيرة، ومهما بَعُد الموت فهو قريب، نلهُو في هذه الدنيا وننسى اننا على موعد مع الرحيل قريبا إلا اذا باغت الموت احدنا فجأة. \\\""}, {"type": "divider"}, {"type": "p", "text": "في صباح يوم هادئ بدت الشمس المشرقة تتسلل خلال أوراق الشجر الملونة بألوان الطيف صانعة رسومات من الظل والضوء كلوحة فنية على الأرض، وأصبح الضوء ينتقل شيئاً فشيئاً على المبان والحجارة، والزهور أخذت في التفتح بألوانها الزاهية التي تعطي للعصافير لوائح من النغمات الموسيقية لتتلوها في الطبيعة."}, {"type": "p", "text": "وبدأ الناس يخرجون من بيوتهم لبداية يوم جديد، والأطفال يتسابقون ويلعبون في أمام البيوتات، ورائحة خبز الفطور الطازج والقهوة تملأ الهواء والمخابز."}, {"type": "p", "text": "في ثنايا ذلك قد جلس منصور امام البيت يتأمل نسيم الصباح وهدوء الطريق عندها تذكر الماضي يوم ان كانت امه على هذه الدنيا حية ترزق.......:"}, {"type": "p", "text": "قالت الام: يا بني الم يحن الوقت لكي تتزوج فانا اخاف عليك ان تبقى وحيدا بعد موتي، لا احد يعينك ولا من احد ليطمئن عليك."}, {"type": "p", "text": "قال منصور: اطال الله في عمرك يا اماه ارجو ارجوك لا تقولي ذلك ابدا، ثم ان موضوع الزواج فانا لا افكر في ذلك الان فكل ما يشغل تفكيري هو كيف أجمع لنفسي مالا يغنيني، فاليوم اقوم بتوزيع بضاعتي واتحصل على الاموال، فإذا انشغلت بالزواج الان فلن أوفق بينهما."}, {"type": "p", "text": "قالت الام: والزواج يا بني."}, {"type": "p", "text": "قال منصور: فالزواج امر سهل ان شاءلله، عن ما قريب؛ فقط تتيسر معي الأمور سوف انظر في ذلك لا تقلقي علي."}, {"type": "divider"}, {"type": "p", "text": "اذا رجعنا للماضي بعض الاعوام بعد تذكر ذلك الحدث وبالتحديد قبل موت ام منصور ببضع سنين وجدنا ان هناك ما ينبئ عن قصه حب كانت من طرف واحد حيث كانت سلمى بنت عم المنصور والتي تبلغ من العمر 16 عاما كانت تهوى منصور بل وتحبه ولكنه كان غير متقبل للفكرة، والتي ربما وافق عليها ابتغاء رضا والدته ولكنه لم يقدر على ان يحبها."}, {"type": "p", "text": "\\\"لن تعطينا الدنيا كل ما نريد بل لابد من ان نتحمل الصعاب في سبيل الحصول على ما نريد، ولن نحصل على ذلك بطريقه كامله فانه لا كمال في هذه الحياة؛ وان الامر يتوقف علينا لكي نجعله كاملا برضانا.\\\""}, {"type": "p", "text": "باتت كل محاولات سلمى في الايقاع بقلب منصور بالفشل حيث انها كلما حاولت التقرب منه وجدته يتهرب منها ولقد حدث ذلك كثيرا الى ان واجهته بقولها:"}, {"type": "p", "text": ": ما الامر يا منصور؟!"}, {"type": "p", "text": "فأجاب منصور قائلا: ماذا هنالك يا ابنت عمي؟"}, {"type": "p", "text": "فقالت له: أراك تتهرب مني ولا تلقي لي بالا أو انتباه فهل أنا ثقيلة على قلبك إلى هذا الحد أم لديك ما يشغل تفكيرك بل يكاد يطغى على قلبك فلا تستطيع الحديث أم هل أنسى كذلك الكلام من الأساس."}, {"type": "p", "text": "قال منصور: أنت لا تفهمين عليَّ."}, {"type": "divider"}, {"type": "p", "text": "مرت الأيام والليالي وقلب سلمى ينفطر أكثر وأكثر فهي في حيرة من أمرها لا تدري ماذا أصاب منصور فقد تغير كثيرا وهي لم تعد تفهم، لِمَ ذلك."}, {"type": "p", "text": "بعد مرور خمسة أيام على هذا اللقاء الأخير بينهما قررت أن تذهب إلى أم منصور لتخبرها بما يجري، ذهبت إلى منزلهم فوجدت أم منصور وأبيه فسلمت عليهما ثم جلست على انفراد، افتتحت الموضوع معها بجديه على غير عادتها المرحة."}, {"type": "p", "text": "فقالت: يا أمي إنك لا تفهمين ما أشعر به، إن قلبي يكاد ينفطر وإن ابنك لا يفهم ولا يشعر بما في داخلي حتى أنه لا يخرجني من حيرتي به."}, {"type": "p", "text": "قالت الام: غلبتني يا ابنتي كفاك بكاء ارجوك وحدثيني بكل شيء."}, {"type": "p", "text": "مسحت بيديها قطارات الدموع ثم قالت بتهنيده وحرقه:"}, {"type": "p", "text": ": انه ابنك لا يحبني وهو لا يريدني شريكة له."}, {"type": "p", "text": "فقالت الام: هدئي من روعك لماذا تقولين ذلك."}, {"type": "p", "text": "فقالت سلمى: انه يتجاهلني تماما كلما حدثته يتهرب مني."}, {"type": "p", "text": "فقالت الام: يا ابنتي ربما معه شيء في عمله يجعله كذلك ألا تعرفين أنه حتى معي تلك الأيام معاملته متغيرة، فلا تقلقي سوف أحدثه بشأنك."}, {"type": "p", "text": "في اثناء حديثهما بذلك الشأن وفجأة يدخل منصور عليهما فتراه هي فتحاول ان تداري كل شعور تجاهه."}, {"type": "p", "text": "ثم دخل إلى غرفته وكانه لم يرى أحد قامت هي وانصرفت إلى منزلها في استعجال."}, {"type": "p", "text": "لم تذهب أمه اليه بعد تلك المقابلة مباشرة بل تركته ينام إلى الليل وعلى العشاء افتتحت معه الموضوع."}, {"type": "p", "text": "قالت: يا بني ما الأمر لماذا تشتكي منك سلمى، فانت لم تعد تهتم بها فما الامر."}, {"type": "p", "text": "نظر اليها في صمت وحزن وقال:"}, {"type": "p", "text": "هل تريدين يا أمي ما ينهي ذلك الموضوع ام تريدين ان يتكرر مجيئها اليك في كل مره."}, {"type": "p", "text": "ردت عليه الأم في استعجال تريد نفي كلامه فقالت:"}, {"type": "p", "text": ": يا بني هي لا لم تقل لي شيء عما تقول فقال منصور اذا لماذا جاءت الان ولما صمتت عندما دخلت عليكم؟"}, {"type": "p", "text": "سكنت الام قليلا فباغتها وبقوله: اماه ارجوك كل شيء واضح، هل اخبرك بما ينهي هذا الامر."}, {"type": "p", "text": "نظرت إليه الام في تعجب وذهول مما يقول!!"}, {"type": "p", "text": "يا أمي اخبريها أنني ما قدرت على أن أجعل قلبي يميل إليها ولو بشق تمرة، حقا حاولت تحت رغبتك ، ولكني لم استطع؛ أتريدين أن اتزوج بها لأظلمها معي كلا لن افعل."}, {"type": "divider"}, {"type": "p", "text": "قد انتهى ذلك الحوار الذي دار ما بين سلمى ومنصور، ومرت الايام؛ وقد انتهى ما كان بينهما ولم تعد هي تأتي لمنزلهم، إلا في جل المناسبات او بعضها."}, {"type": "p", "text": "حزن منصور على تعطل التجارة في قريته بسبب سوء الأحوال الاقتصادية، فقرر ان يذهب الى مدينة «أنطاليا» التي تقع على امتداد الساحل الجنوبي الغربي لتركيا، وهي من أكبر مدن القسطنطينية «استنبول» التي تبعد عن مدينتهم أنقرة بحوالي 322 ميل تقريبا."}, {"type": "p", "text": "كانت المدينة ذات اسوار عالية وحراس كثير، ما ان تفرغ من باب حتى يباغتك حراس الباب الثاني، فكان هذه المدينة كلها ابواب."}, {"type": "p", "text": "ها قد وصل منصور وامير اخيرا الى المكان الذي سوف يضعون فيه بضاعتهم في وسط السوق بعدما دلهم عليه احد الحراس بعد انقضاء النهار."}, {"type": "p", "text": "وبعد ان فرغ السوق من التجار والباعة قام الاثنان بفرش الأمتعة الخاصة بهما لكي يناما بجوار البضاعة، وبعد منتصف الليل كان منصور مستيقظا يشاهد النجوم وما ابدع الخالق سبحانه وتعالى في هذا الكون البديع وفي اثناء انشغاله بالتأمل والتفكير اذ فجأة هجم بعض اللصوص على بضاعتهما."}, {"type": "p", "text": "بالفعل استطاع اللصوص اخذ بعض البضائع وقاموا بالهرب فلحق بهم منصور وهو يجري وراءهم؛ لكنه لم يستطع الإمساك بهم غير انه استطاع كشف هوية أحدهم بعد جذب الوشاح عن وجهه، التقط منصور انفاسه من التعب بشده بعدما لم يستطع اللحاق بهم، فرجع أدراجه خائبا فلقيه امير فقال له:"}, {"type": "p", "text": ": لماذا كنت تجري واين ذهبت؟!"}, {"type": "p", "text": "رد عليه منصور بعد ان التقط انفاسهم وقال له:"}, {"type": "p", "text": ": لا شيء؛ فقط بعض اللصوص قد سرقوا بعض الأمتعة."}, {"type": "p", "text": "قال امير بوجه متعجب وبنبرة فيها من الحزن ما فيها:"}, {"type": "p", "text": ": كيف ذلك وماذا حدث."}, {"type": "p", "text": "رد عليه منصور قائلا: لا شيء، لم أستطع اللحاق بهم."}, {"type": "p", "text": "قال امير: والبضاعة يا منصور، ما جئنا لأجله وتحملنا المشاكل والصعاب."}, {"type": "p", "text": "رد عليه منصور وقال: لا تجزع كما ان الله يسر لنا امورنا فلن يتركنا بعد ذلك انما كل شيء بقدر ونحن لم نفعل أي جرم، ولم نهمل وعسى أن يكون ذلك خير."}, {"type": "p", "text": "قال أمير: غدا سوف نذهب إلى رئيس هذه البلدة فنحن ضيوف لديهم وقد سرقنا عندهم ونحن في أول يوم فماذا سوف نفعل بعد ذلك إن لم نضع حدا لذلك الأمر من اوله."}, {"type": "p", "text": "لم يرد عليه منصور وتركه في حيرته وذهب إلى النوم."}, {"type": "divider"}, {"type": "p", "text": "\\\"هكذا هي الغربة سوف تنال قسطا من التعب النفسي والجسدي، وتهوى نفسك الرجوع لموطنك؛ ولكن ما حملك على الذهاب هو هدفك الذي ترحلت من أجله ولا تحزن إن جدت لك أمور ما كانت بالحسبان؛ فأنت في الأخير لست بدارك.\\\""}, {"type": "p", "text": "فإن حدث لك ما حدث لهذان الرجلان وتعرضت للسرقة فاحرص على ألا تتعرض لذلك مرة اخرى."}, {"type": "divider"}, {"type": "p", "text": "> مدينة قونيا التركية"}, {"type": "p", "text": "في مدينة قونيا التركية، حيث تركنا مدينة أنقرة وراءنا في رحلة لنستمع لذلك الشيخ ونستأنف معه قصة هؤلاء الثلاثين رجلا وما حدث معهم."}, {"type": "p", "text": "ومع ذلك، حتى الآن، لا نعرف من هو ذلك الشيخ وما هي شخصيته بالضبط، ولكن لا تقلق، عزيزي القارئ، سنكشف معاً عن ملامح شخصيته قريباً؛ لذا فلتحضر فنجان قهوتك المعتاد ولتتابع القراءة..."}, {"type": "p", "text": "في بلاد الشام -- فلسطين:"}, {"type": "p", "text": "يراني أهل بيتي على غير العادة يتأملون من بعيد، ويبدو أن قلوبهم تدرك ما سيحدث لنا من أقدار."}, {"type": "p", "text": "كنا ثلاثين نفراً من بني لخم وجزام^10، أعرف كل واحد منهم أو أغلبهم، ولكن لدى نظرتي إلى وجوه الناس، تبدو مختلفة عما كنا نعرف، فالأبسطية التي نعتاد عليها قد غابت، والمزاج ليس هادئاً كما السابق، فكل فرد في همومه مشغول."}, {"type": "p", "text": "> تحركت السفينة لتشق عباب البحر....."}, {"type": "p", "text": "نسمات الهواء في جو السماء رطبة، وهدوء الليل جميل"}, {"type": "p", "text": "اخرجت فرشا من متاعي وجعلته تحتي واستلقيت على ظهري أنظر السماء فوقي وحولي، لست ممن قدر على وصف السماء الصافية قبل هذا وما كنت انعت الأشياء بالقول الحقيق فيها، كنت أرتجل في بعض الأحيان في وصف مزرعة المنزل وشاطئ البحر."}, {"type": "p", "text": "لطالما جلست أفكر وأتدبر في هذا الكون العظيم؛: كيف خلق بهذا الإبداع المتقن وكنت اتعجب وتسقط بعدها تلك الأفكار الوجودية تترا إلى مخيلتي كلما جلست أنظر السماء."}, {"type": "p", "text": "كنت اتعجب من خلق السماوات والارض وما بينهما ولكن أقول بعدها فيما العجب ولهذا الكون إله خلق فهدى ومهد فأخرج المرعى وأنبت من السماء رزقا ليحيي به أنعاما وأناسي كثيرا."}, {"type": "p", "text": "الاله العظيم القادر المقتدر الخالق المبدع لا يعجزه شيء في مخلوقاته فكل ذلك هين عنده وبقدر ومقدار خلق، وعلى وتبارك."}, {"type": "p", "text": "كانت تأخذني وأنا في حالتي تلك سنة من التفكير في اولئك المنكرون وجود الخالق العظيم كلما فكرت وتدبرت في عظيم قدرة الله."}, {"type": "p", "text": "اتذكر أقوالهم وأبتسم ثم أتضاحك قليلا:"}, {"type": "p", "text": "كيف يستقيم لأحدهم وهو يعلم في قرارة نفسه أن هناك قوة خفية عظمى هي من أوجدت الكون، ومنهم من يقول بالصدفة"}, {"type": "p", "text": "كيف للصدفة أن تصنع ذبابة واحدة بكل ما فيها من أتقان، فإذا ما قلنا لصاحب لب الآن أن هذه السفينة التي نحن على ظهرها صنعت نفسها بنفسها أو وجدت صدفة من غير صانع"}, {"type": "p", "text": "فلن يقتنع بذلك إلا مجنون."}], "section": "story"}, {"id": 6, "title": "مدينة أنقرة التركية: (3/3)", "paras": [{"type": "divider"}, {"type": "p", "text": "يا سيد تميم يا بني عبد الدار أما تستيقظ وهذه الشمس طالعة نحو الأفق."}, {"type": "p", "text": "قالها رجل من بني لخم إني لأعرفه جيدا وأعرف من أي القبائل هو."}, {"type": "divider"}, {"type": "p", "text": "قمت وشعاع الشمس الضئيل يحوطني، وتلك الزرقة في السماء تقول ان هذا اليوم يبدو هادئ."}, {"type": "p", "text": "بعد أن قضينا حواجنا من طعام ومتاع واخذنا إعداد بعض أمر السفينة وهي تشق البحر وكان اتجاهنا شرقا"}, {"type": "p", "text": "ذلك الهدوء وهذا الجو الصافي خالج أفكاري أنه هدوء ما قبل العاصفة."}, {"type": "p", "text": "بعد أن انتهينا جلست أحدث القوم حديثا، بعض القصص عمن كان قبلنا، فقد كنت راهبا مسيحيا متعمقا في المسيحية وأخبار السابقين، ولي من القصص وغيرها ما تأتي به العجائب."}, {"type": "divider"}, {"type": "p", "text": "- سيد تميم هل تذكر لنا بقصة السابقين ممن كان مثلنا يطوف البحار"}, {"type": "p", "text": "- إني أحدثكم حديثا عجبا فاسمعوا واعوا...."}, {"type": "divider"}, {"type": "p", "text": "وبينما جلوس نحن على أحوالنا تلك اذ بنا بريح شديدة، وإن السفينة لتميل ميل الركوع وما السجود منها ببعيد، وإنا كنا نقعد منها مقاعد للتثبيت فمن لم يوطن نفسها بأرض السفينة ويجعل من قدميه وتدًا يتثبت به لسقط في البحر كما يسقط الرذاذ في كل مكان."}, {"type": "p", "text": "تشق الفلك البحر شقا، والريح تشتد والعواصف"}, {"type": "p", "text": "كنت ساندا قدماي بظهر صندوق خشبية به من المعدات من يؤمل الاستناد عليه، وكنت ممسكا بإحدى أعمدة السفينة خوف الانزلاق، والكل على هذه الحال إلا من بعض طاقم السفينة يحاولون السيطرة على الوضع ولكن دون جدوى فالموج عال والبرق شديد."}, {"type": "p", "text": "كنت أسمعهم يقولون في خوف وفي هلع:"}, {"type": "p", "text": "- لقد أضلنا الموج وضللنا وجهتنا وإنا لغائبون."}, {"type": "p", "text": "- ماذا نفعل الان وقد ضيعنا أمرنا، وليست السماء صافية حتى نهتدي بالنجوم، فماذا نحن بفاعلين."}, {"type": "p", "text": "قلت لهم وقد رأيت الخوف يسري في دمائهم:"}, {"type": "p", "text": "دعوة الله خير لنا وما لنا بدا في الأسباب، وقد انقطعت أسباب الأرض ولكن الله معنا، فاطمئنوا عسى الله أن يظهر لنا من أمرنا فرجا."}, {"type": "p", "text": "\"كلما كان الإنسان أشد تمسك باليقين رغم انعدام الأمل كان قويا لا يخشى التحديات؛ يرى بنور الحق من ظلماء الضياع. \\\""}, {"type": "divider"}, {"type": "p", "text": "ماذا نخشى والله معنا؛ ما دمنا قد أخذنا بالأسباب وتوكلنا على رب الأسباب ومسببها، ومن يملك الأمر وبيده مقاليد الكون إلا هو، ومن يرانا ويسمع حثيث قلوبنا في الليلة الظلماء؛ حيث يفتقد البدر؛ يكون الضياء بنور الله فيهدينا لعبور النهر."}, {"type": "p", "text": "لا نشقن على أنفسنا بما ليس لنا قدرة عليه، لم يطلب الله منا سوى السعي والأخذ بالأسباب والتوكل عليه؛ وأما النتيجة فليس لنا منها حظ لأنفسنا وإنما نصيبنا ما قدره الله لنا؛ وما وقع رضينا به لأنه محض غير وابتلاء؛ فمن رضي له الرضا ومن سخط فليس له من الأمر إلا ما قدره الله؛ فالرضا حق."}, {"type": "divider"}, {"type": "p", "text": "انتهى الشيخ من درس اليوم بعدما قال تلك الكلمات الوعظية، وترك رواد المسجد في فضول لمعرفة ما حدث مع هؤلاء القوم، وقام منصرفا لبيته."}, {"type": "p", "text": "نترك ذلك الشيخ وتلك المدينة لنعود لمدينة أنقرة التركية لنعرف ما حدث مع أمير ومنصور"}, {"type": "divider"}, {"type": "divider"}], "section": "story"}, {"id": 7, "title": "أنقرة _تركيا.", "paras": [{"type": "p", "text": "في صباح باكر، حيث يسود السكون وتتخلل الطرقات خيوط أشعة الشمس، ترتفع أصوات العصافير محلقة فوق أغصان الأشجار، ملبية الأجواء بنغماتها العذبة. تنتشر الشجيرات الصغيرة برقة على التلال، مثل نقاط خضراء تزين الطبيعة بألوانها الزاهية، الضوء الدافئ يلامس البيوت برقة، يمنحها سحرًا خاصًا، وفي هذا الهدوء العميق يتحرر النفس من الهموم، تغتسل براحة تامة، ومن أعماق العزلة تنبعث صفاء الروح، كاشفًا عن جوهرها الأصيل."}, {"type": "p", "text": "في هذا الجو الجميل استيقظ امير صباحا باكرا لكي ينتهي من العمل ويجد متسع من الوقت ليذهب إلى قضاء المدينة ليقص الامر على الحاكم."}, {"type": "p", "text": "عندما وصلا إلى عتبة القصر، استقبلهما حراس بوجوه جامدة، لكنهم أفسحوا لهما الطريق باحترام. عبر البهو الفسيح، كانت خطواتهما تصطدم بأصوات أقدامهم المترددة، وصوت المياه المنسابة في الجداول يزيد المكان روعةً وهدوءًا."}, {"type": "p", "text": "تلك المساحة الكبيرة التي تكسوها الخضرة تفتح ذراعيها لمنصور وأمير، وقد أحاطت بهما حدائق مترفة تمتد على مدى البصر. تحت أقدامهما، تبدو المروج الخضراء كأنها بساط من الحرير، يتناغم مع زهور يافعة ذات مناظر جذابة تنمو على طول الطريق المؤدي إلى القصر. البهو الجميل أمامهما يكتظ بالكراسي الموزعة في كل ركن، وكأنها تنتظر حضورًا كريمًا لتحتفي به. هنا، تعزف الطبيعة لحنًا هادئًا من خلال جداول الماء التي تهمس بلطف في كل زاوية، وأشجار باسقة تصطف كحراس مخلصين لبساتين خضراء ممتدة."}, {"type": "p", "text": "كان منصور وأمير يمشيان بترددٍ لا يخفيهما، يتبادلان النظر بينهما وبين تلك المناظر البديعة التي تبدو كأنها عالم آخر. القصر الذي يقف شامخًا أمامهما، ببواباته المزخرفة ونوافذه المطلة على حدائق ملكية، كان ملاذًا للملوك ومكانًا حيث تُرفع الشكاوى وتُستعاد الحقوق. في خطاهما المتأنية نحو البهو، كانا يحملان في قلوبهما ثقل سرقة بضاعتهما، وآمالهما معقودة بأن يجدان عند الملك نصرة وعدل."}, {"type": "p", "text": "عندما اقترب من بهو القصر اشار اليهما حارس البهو الى الدخول من الباب الخلفي لان الباب الامامي غير مسموح بالعبور إلا للساده المهمين لدى الحاكم فلا يعبر منه سائر الناس."}, {"type": "p", "text": "عندما دخل من الباب الخلفي اشار اليهما الحارس بالاستمرار في العبور إلى اخر الطرقة ثم الانتظار لحين السماح لهما بالدخول."}, {"type": "p", "text": "في اثناء عبورهما تلك الطرقة كان امير ينظر الى جمال الزخارف والنقوش على جدران واعمده الطرقة التي يغلب عليها الطراز الهندسي، كان امير كلما مر بشيء أعجبه اشار به إلى منصور رغم صمته الغير اعتيادي، واستمر في ذلك إلى أن وصل نهاية الطرقة ثم وجدا في النهاية باباً وحارس يقف عليه وبعض من المقاعد للجلوس، جلس كما أشار اليهما الحارس."}, {"type": "divider"}, {"type": "p", "text": "وفي نفس الوقت على الجانب الاخر ومن بعيد حيث نستمع لصوت خطوات الأرجل في كل مكان وفي وسط قرية صغيرة بمدينة أنقرة تدعى «إيلا» قريبة من المدينة، وفي ركن هادئ نسمع تلك الأصوات العالية والصراخ."}, {"type": "p", "text": "وقف رجل عظيم الجثة ذو ملامح تؤذن بالشر وبصوت جهوري يصرخ بفتاة ويقول بصوت مرتفع بعض الشيء:"}, {"type": "p", "text": "ايتها الحمقاء ماذا اصابك هل جننت، قد كشف امرنا بسببك وبسبب غبائك."}, {"type": "p", "text": "قال ذلك زعيم اللصوص لتلك الفتاه التي كشف وجهها بسبب منصور بعد ان لحقهم."}, {"type": "p", "text": "ثم هددها قائلا: ايتها الساقطة ان اعترفت علينا فسوف اقتلك فاحذري جيدا"}, {"type": "divider"}, {"type": "p", "text": "في بهو القصر وقف الاثنان بعدما تم السماح لهما بالمثول بين يدي الملك، دخلا يتمشيان ببطء وهما ينظران ما تسقط عليه أعينهما؛ تلك الجدران المهيبة ذات النقوش الزخرفية التي سقطت عليها أشاعة الشمس القادمة من اعلى فتحات سقف القصر في وقت تعامد الشمس فوق ساحته، ذلك العرش العظيم الذي يبدو كقطعة أثرية من أزمان سحيقة، موضع استراحة اليدين منه كفروة نمر قطبي لامعة، وذلك اللون الذهبي الذي يزين حواف العرش، سماع صوت ستائر النوافذ الخشبية الكبيرة ذات الطراز الهندسي عندما تهب الرياح التي امتزجت مع رائحة العطر الفخمة المصاحبة لخطوات الأرجل القادمة من الداخل، تلك البهرجة اللامعة في الأعين تبعث في النفس شعور الطمأنينة والراحة رغم شعور القلقة والتوتر لما وصل ذلك الرجل..."}, {"type": "p", "text": "وقف جميع من في المجلس احتراما وتبجيلا لدخول الملك."}, {"type": "p", "text": "وأثناء ذلك يدخل عليهما رجل ضخم الجثة عريض الاكتاف يحمل فوق كتفية فروه الدب القطبي الابيض، رجل بلا شعر، اصلع ويحمل في يده اليمنى عصاه وفي الاخرى يرتدي الحلي في اصابع يديه."}, {"type": "p", "text": "جلس الملك وجلس الحضور ونادى مسؤول المجلس على من يحمل شيء يود عرضه على الملك مع وضع الشروط التي منها: ان كان ما جاء به المدعي تافها وامرا غير مهم فحكمه السجن بل والقتل احيانا على حسب ما جاء به."}, {"type": "p", "text": "قدم امير ما جاء من اجله وعرضه على الحاكم فلم يسر الحاكم ما سمعه من امير وامر بأحضار كل من المشتبه بهم، وبعد مضي ساعة من الوقت وصل كل المشتبه بهم وقد كانت نفس الفتاه من بينهم فقد تمكنوا من القبض عليها بسبب سابقة ما عليها من قضايا."}, {"type": "p", "text": "اصطف المشتبه بهم امام منصور كان منصور يحدق بالفتاة ويتذكر ما حدث."}, {"type": "p", "text": "ثم بغته القاضي او الوزير بقوله:"}, {"type": "p", "text": ": أي من هؤلاء قد تسبب في سرقه متاعكم."}, {"type": "p", "text": "بعد لحظات من الصمت تحدث منصور وقال: ليس من هؤلاء من سرق متاعنا يا سيدي."}, {"type": "p", "text": "رد عليه الوزير وقال: هل انت متأكد مما تقول اليس من بينهم من فعل فعلته فأجاب عليه بالنفي مره اخرى."}, {"type": "p", "text": "وقف الملك من مجلسه فصمت الجميع، وعم الهدوء المكان وخيم الاستماع على اذان الجميع سيستمعون كلمه الملك:"}, {"type": "p", "text": "يا هذا ماذا هنالك فهل انت واثق مما تقول."}, {"type": "p", "text": "قالها الملك لمنصور بجديه وحزم وباهتمام لمعرفه الجاني، ثم اطرق قائلا:"}, {"type": "p", "text": ": انظر، فقد احضرنا لك من هم مشتبه بهم افلا يكن الجاني واحد منهم اذا كنت متأكدا؟!"}, {"type": "p", "text": "فرد عليه منصور قائلا:"}, {"type": "p", "text": "يا سيدي اني لمتأكد مما اقول فليس منهم من فعل ذل."}, {"type": "p", "text": "اشار الملك اليه بان يكف عن الكلام بعد ان توجه نحو عرشه ثم جلس عليه وقال:"}, {"type": "p", "text": ": الا تدري ان عقوبة من يستهين بحكم الملك وحاشيته البقاء في السجن حتى الموت؟!"}, {"type": "p", "text": "أجاب المنصور: قد علمت ذلك قبل الدخول ولو كنت قد اتيت لأستهين بكم وبحكمكم ما كنت لأتجرأ على الدخول عليكم بعد علمي بالعواقب."}, {"type": "p", "text": "ثم اطرق قائلا وان كنت تود ان تلقي القبض عليَّ فأنا رهن مشيرتك فافعل ما تراه صائبا، وما جئنا هنا الا بحق، وما جئنا لنفسد في الارض."}, {"type": "p", "text": "تعجب الملك من مقالته وقال:"}, {"type": "p", "text": "يبدو انك رجل فطن وذو حكمة، وانك لا تدعي الكذب وانك صادق لذا فاذهب في اي مكان من مدينتنا شئت واي وقت شئت ولن يتعرض لك احد مطلقا بعد اليوم ان شاءلله، فإنما قد يسوئك ما يسوئني، فاذهب في سلام ولك مني وعد على اعاده ما سرق منك ومعرفه المتسبب في ذلك ان امكن."}, {"type": "p", "text": "وقبل خروج منصور وامير من القصر اخذهما الحارس الخاص واعطاهم ما يثمن بضاعتهم ثم انصرفوا."}, {"type": "p", "text": "هل أنت جاهز عزيزي القارئ لنسافر عائدين لمدينة قونيا لنستمع مع الناس بقية قصة تميم الداري وبني لخم وجزام؛ لنعرف تفاصيل الحكاية فلتكن مستعدا للانطلاق فهناك تفاصيل أخرى لم تحكى بعد ."}, {"type": "divider"}, {"type": "p", "text": "تحت سماء زرقاء صافية، انطلقت رحلتنا إلى مدينة قونية الجميلة، حيث كانت الرياح العليلة تداعب وجوهنا ونحن نسير عبر الطرق المعبدة بأحجار قديمة تروي حكايات الزمن."}, {"type": "p", "text": "على جانبي الطريق، تزينت الأشجار بأوراقها الخضراء الوارفة، وامتدت حقول الزهور بألوانها الزاهية كأنها بساط سحري يفترش الأرض."}, {"type": "p", "text": "عبرنا بساتين الفواكه المورقة، حيث كانت أشجار التفاح والرمان تتراقص في نسيم الصباح العليل، وفاحت رائحة الأزهار البرية في الهواء النقي، ازدادت جمال المناظر الطبيعية كلما اقتربنا من قلب المدينة، حتى ظهرت أمامنا قونية بكل بهائها ورونقها، مدينة تمتزج فيها عبق التاريخ مع حيوية الحاضر."}, {"type": "p", "text": "مع وصولنا إلى المسجد الكبير في قونية، بدت مآذنه شامخة في السماء، وزخارفه المعمارية تحكي قصصًا من الفن الإسلامي العريق، كان المسجد يتحلى بأبهى حلله، تحيط به حدائق غناء تحتوي على أزهار متنوعة تتفتح بألوانها المختلفة، مكونة لوحة فنية بديعة."}, {"type": "p", "text": "دخلنا إلى ساحة المسجد، وكانت تعج بالناس الذين جاءوا من كل حدب وصوب للاستماع إلى الشيخ، كانت الساحة مليئة بالحركة والحياة، الجميع يتبادلون الأحاديث بروح مفعمة بالحماس والانتظار، ارتفعت تكبيرات المصلين ودعواتهم، مكونة سيمفونية روحانية تملأ المكان بالسكينة والطمأنينة."}, {"type": "p", "text": "دخلنا إلى قاعة المسجد الفسيحة، حيث كان النور يتسلل من النوافذ المزخرفة، مضفيًا جوًا من الهدوء والقدسية، الأرض مفروشة بسجاد فاخر يتناغم مع الزخارف الجدارية المدهشة التي تحكي قصصًا من التراث الإسلامي، كان الرجال والنساء يجلسون في صفوف منتظمة، يتحدثون بصوت خافت وينتظرون بلهفة بدء درس الشيخ."}, {"type": "p", "text": "في وسط المسجد، كان هناك منبر خشبي متقن الصنع، عليه نقوش وأشكال هندسية رائعة، وقف الشيخ بملابسه التقليدية البيضاء، مهيبًا ووقورًا، يقرأ في كتاب قديم، بين الحين والآخر، كان يرفع عينيه ويلقي نظرة محبة على الحضور، وكأنه يطمئن على استعدادهم للاستماع."}, {"type": "p", "text": "حان الوقت، وبدأ الشيخ في الحديث بصوت عذب وقوي، يخترق القلوب والعقول. \\\"أيها الأخوة والأخوات، اليوم نستكمل قصة الثلاثين رجلًا الذين كانوا في السفينة البحرية وضللهم موج البحر عن سبيلهم...\\\" كانت كلماته تحملنا إلى عالم آخر، حيث تتجلى الحكمة في كل جملة يرويها."}, {"type": "p", "text": "تسمّرت الأنظار على الشيخ، وعمّ الصمت القاعة، وكأن الزمن قد توقف ليستمع الجميع إلى هذه الحكاية التي تنتقل من جيل إلى جيل. الأطفال كانوا يجلسون بالقرب من آبائهم، عيونهم الواسعة مفعمة بالفضول والإثارة، يستمعون بإنصات وكأنهم يخشون أن يفوتهم أي كلمة."}, {"type": "p", "text": "في هذا المكان، تحت سقف المسجد الكبير في قونية، تلاقى الناس من مختلف الأعمار والخلفيات، يجمعهم حب المعرفة والتعلم، والتوق إلى سماع حكم الحياة والتاريخ، وحب ذلك الشيخ....:"}], "section": "story"}, {"id": 8, "title": "بحر الشام 628 _ م", "paras": [{"type": "divider"}, {"type": "p", "text": "لقد أضلنا الموج عن الطريق بعد أن كنا في هدى عن الوصول"}, {"type": "p", "text": "وحال بيننا الموج فكنا من التائهين، ضرب بنا البحر والموج أياما لا ندري أين نحن، ولا إلى أين غايتنا بعد هذا."}, {"type": "p", "text": "هكذا مر الاسبوع الثاني ونحن ما زلنا في عرض البحر، نرى ونسمع ظواهر الطبيعة من برق ورعد وأمواج عاليات."}, {"type": "p", "text": "وبينما أنا جالس رافع بصري نحوى السماء إذ أتاني نفر من قومي فسألوني عن ما نحن فيه وأكثروا علي من السؤال وأنا اقول الله اعلم:"}, {"type": "p", "text": "- ألست يا سيد تميم راهبا عندك من العلوم والمعرفة ما يجعلك متبصر بالنوازل"}, {"type": "p", "text": "- قد يعلم الجاهل شيئا غاب عن العالم، ويفتح الله عليه، ولسنا ممن يدعون معرفة بكل المجريات، والحق انا لا ندري أشر أريد بنا أم خيرا ونرجو أن يكون الاخير، والله أعلم"}, {"type": "p", "text": "- ألا تسأل لنا نفر من الجن فقد سمعنا بانهم هاتفوك قبل وكنت بهم أبصر."}, {"type": "p", "text": "- من أخبركم هذا؟!"}, {"type": "p", "text": "- لا علم لنا سوى ما سمعنا متداولا في بعض جنبات القرية."}, {"type": "p", "text": "- هذا حديث واهم، وانما حلم قد رأيت، أذكر أني قد خرجت إلى الصحراء ذات يوم ونمت فيها فسمعت هاتفًا من الجن يقول:"}, {"type": "p", "text": "\\\"قد خَرج رسول الأُميين^12، رسول الله، وصلينا خلفه بالحَجُون^13، وأَسْلَمنا واتَّبَعْناه، وذهب كيد الجن، ورُمِيَتْ بالشُّهُب."}, {"type": "p", "text": "قلنا: وما رسول الأميين."}, {"type": "p", "text": "قلت: رسول من العرب يخرج فيهم، ويظهر عليهم ويكون لرسالته نبأ عظيم، وتبلغ رسالته ما بلغ الليل والنهار."}, {"type": "p", "text": "قلنا: أوما كنت مصدق هذه الرؤيا"}, {"type": "p", "text": "قلت: بلى والله مصدقها"}, {"type": "p", "text": "قلنا: كيف وأنت على المسيحية."}, {"type": "p", "text": "بالطبع، سأحاول تطبيق الملاحظات لتعزيز النص بمزيد من التوتر والتشويق، وإضافة التفاصيل التي تبرز التباينات بين الشخصيات، بالإضافة إلى التعمق الفلسفي والرمزي. لنقم بتعديل النص بناءً على ذلك:"}, {"type": "p", "text": "\\\"أما وقد سألتم فإن بها نبأ عن هذا النبي، وما كنت مصدق الرؤيا لولا أن عندنا ذكرا عن نبي اخر الزمان، ولكن كان في نفسي شيء، إذ إني لا أصدق الجن وإن أقسموا، ولعمري أن حدثت بها أحدهم ليقولن:"}, {"type": "p", "text": "إنما هو كاهن في كهف لا راهب في كنيسة، إنما يعلمه جان، فهو يأخذ ويروى عنهم نبأ من كان قبلهم ونبأ ما بعدهم، وآثرت أن يصلني خبر أراه رأي العين ولربما.\\\""}, {"type": "divider"}, {"type": "p", "text": "\\\"انتهى الشيخ سريعًا من درسه اليوم واعتذر من رواد المسجد بسبب أن زوجته طلبته لأمر مهم، انصرف بسرعة، تاركًا الحضور يتساءلون عن سر اعتذاره، وهو يخفي داخله توترًا لا يمكنه التخلص منه.\\\""}, {"type": "divider"}], "section": "story"}, {"id": 9, "title": "مدينة أنقرة التركية: (1/3)", "paras": [{"type": "p", "text": "\\\"عاد منصور وأمير إلى مدينة أنقرة، حاملين معهما ليس فقط بضاعتهما بل أيضًا أحلامهما المتعثرة وتوتراتهما الداخلية، يتعمق كل منهما في رحلته الشخصية، يبحثان عن معنى الحياة والإيمان، فيما يشهدان التباينات الثقافية بينهما تزيد من تعقيد علاقتهما.\\\""}, {"type": "divider"}, {"type": "p", "text": "وفي أثناء انشغال منصور وأمير بالبيع، فجأة وقفت أمام منصور تلك الفتاة بمظهر محتار، وتنبأ هو برغبتها في معرفة السبب وراء تصرفه."}, {"type": "p", "text": "زمرد تقدمت إلى السوق حيث كانت تعلم أن منصور يعمل هناك. تظاهرت بشراء بعض البضائع، لكنها كانت ترغب في معرفة السبب الحقيقي وراء سلوكه."}, {"type": "p", "text": "\\\"لماذا لم تعترف علي وأنت تعلم أنني الفاعلة؟\\\" قالت بحزن واضطراب، في انتظار الرد، لكن منصور لم يرد وظل صامتاً، فتابعت قائلة:"}, {"type": "p", "text": "\\\"لماذا لم تقل أنني الفاعلة؟ حتى لو كنت تعرف أنه يمكنك الإبلاغ عني وسجني، لماذا كنت مستعداً للتضحية بهذا؟\\\""}, {"type": "p", "text": "بعد لحظات من الصمت، أخيراً فتح منصور شفتيه وقال بهدوء:"}, {"type": "p", "text": "\\\"لأني شعرت بأن هناك سبباً وراء أفعالك، ولم أكن أرغب في تدمير حياتك."}, {"type": "p", "text": "شعرت بالرغبة في مساعدتك بعدما رأيتك، وذلك أيضاً أنني لاحظت ببعض الشبه بينك وبين أمي في بعض الصفات والملامح.\\\""}, {"type": "p", "text": "زاد الصمت قليلاً، ثم حرك منصور شفتيه مجدداً وأكمل:"}, {"type": "p", "text": "\\\"أنا أؤمن بأن الخير يكمن في الأشخاص حتى لو كانوا يبدون بمظاهر أخرى، ولذا قررت أن أعطيك الفرصة لتظهري الجانب الحقيقي الذي فيك.\\\""}, {"type": "divider"}, {"type": "p", "text": "في ليلة هادئة تنعم بالنسيم والهواء النقي، كان منصور مستيقظاً يفكر في أمر تلك الفتاة، حتى غلبه النعاس، وفجأة؛ دخلت فتاة الغرفة بسرعة وأيقظته من نومه، ثم طلبت منه المساعدة لحمايتها من لصوص قتلة اعترفت عليهم؛ استجاب منصور على الفور وانطلق لحمايتها."}, {"type": "p", "text": "بينما كانا يحاولان الهروب، تقدم اللصوص نحوهم بأسلحتهم، فقام أحدهم بالجري نحو منصور وهاجمه بسكين، لكن منصور تصدى له بلا حماية وأوقعه قتيلاً!"}, {"type": "p", "text": "استيقظ منصور بصدمة، فقد كان كابوساً مروعاً، بعد رؤيته لتلك الكوابيس، بدأ يخشى على زمرد من خطر اللصوص الذين قد يعتبرونها تهديداً بعد إدلائها بالشهادة ضدهم."}, {"type": "p", "text": "ذهب يبحث عن زمرد وسأل الجيران حتى عرف مكان إقامتها، عندما وجدها، شاركها بمخاوفه ونصحها بالابتعاد عن الأماكن العامة حتى يتم القبض على اللصوص."}, {"type": "p", "text": "وبعد أسابيع من البحث، تم القبض على اللصوص وأُحيلوا إلى السجن، أصبحت زمرد حرة وآمنة، لكنها تعلقت بمنصور بشدة بعد مساعدته لها، ومن جهته، بدأ منصور يشعر بمشاعر قوية تجاه زمرد بعد مرور شهرين في تلك البلدة."}, {"type": "p", "text": "لم يتمكن أحد من إعاقة منصور بعد أن ألقى الملك القبض على اللصوص، ومع ذلك، كان زعيم العصابة لا يزال حراً ويخطط للانتقام."}, {"type": "p", "text": "\\\"لا بد أن يدفع هؤلاء الأغبياء ثمن أفعالهم، خاصة تلك الفتاة التي خانتنا وكشفت عنا للشرطة.\\\" قال زعيم العصابة وهو يفكر في الانتقام."}, {"type": "divider"}, {"type": "p", "text": "علم منصور بالخطر المحدق بزمرد بعد إدلائها بالشهادة، وحاول أن يكون دائماً بجانبها لحمايتها، فقرر الابتعاد عن التجارة والعودة إلى بلده أنطاليا، وأخبر أمير بقراره."}, {"type": "p", "text": "انتهى الأمر برحيل منصور عن التجارة وبقاء أمير في تجارته، ورغم ذلك، فإن حب منصور لزمرد بقي قوياً وثابتاً حتى بعد مغادرته للمكان إلى مسقط رأسه أنطاليا^14 ؛ فقد قرر أن يساعدها ومن ثم يرحل عائدا لموطنه."}, {"type": "divider"}, {"type": "p", "text": "ونعود نحن إلى قونيا حيث نستأنف قصتنا مع الصحابي تميم الداري والثلاثون رجلا الذين سوف يستأنف لنا قصتهم الشيخ."}, {"type": "p", "text": "وها نحن الان على مشارف المدينة وننظر من بعيد فنرى الناس تتجمع للصلاة من كل حدب وصوب ليشهدوا ما سوف يقص عليهم من نبأ عظيم؛ حيث بدأ الشيخ يتلوا آيات من القرءان قبل أن يبدأ ثم استأنف القصة :"}, {"type": "p", "text": "في عرض البحر:"}, {"type": "p", "text": "528 للميلاد."}, {"type": "p", "text": "\\\"في سكون البحر العميق، بدأت الشمس تتسلل ببطء من وراء حدود الأفق، ملونة السماء الباسقة بألوانها البرتقالية النديّة والأزرق العميق. كأنها فنانة ماهرة، غمرت الشمس بريقها الذهبي الدافئ السفينة المتأرجحة، وصقلت بأشعتها الخافتة طاقم الرحلة الصامت، مذهلة الجميع بسحرها الخفي وسط هذا المحيط الهادئ الذي لا يعرف عنه الإنسان سوى أنه هادئ حين يهدأ، ولكنه لا يعلم ما الذي يخبئه هذا الهدوء المطلق من عاصفة قوية قادمة ليدمر كل ما يقف أمامه في البحر."}, {"type": "p", "text": "ها نحن ذا على متن السفينة وقد هدأ كل شيء، وبتجاه مكان غريب لا ترى ملامحة من بعيد يوجد دخان كثيف، بعد دقائق من الاقتراب قد اتضح ان المكان جزيرة نائية في البحر."}, {"type": "p", "text": "رست السفينة على الشط وكان في وقت المغيب، جلسنا في أقرب السفينة ننتظر ما عسانا نفعل ونتفكر ونتساءل ما هذا المكان:"}, {"type": "p", "text": "- هل نحاول العودة أم ننتظر حتى الصباح هنا ثم نغادر صباحا"}, {"type": "p", "text": "قال ذلك أحد الرجال، فأجاب بعضهم:"}, {"type": "p", "text": "- لعلنا لن نستطيع الذهاب في هذا الجو وفي هذا الظلام"}, {"type": "p", "text": "- نستريح في هذه الجزيرة ونتبلغ بالزاد لغد."}, {"type": "p", "text": "لما قرروا الدخول أحطوا رحالهم ثم توجهوا إلى الداخل رغم توجسهم خيفة من المكان؛ فدخلوا إليها يلتمسوا الماء."}, {"type": "p", "text": "ما أشد غرابة تلك الجزيرة، إنها لنائية والطريق إليها غير واضح المعالم، نزعم أنه ما من أحد سبقنا إلى هنا قبل وما كان لأحد بعد غاية فيها."}, {"type": "p", "text": "الأرض لها رائحة غريبة، دخان في كل مكان، رأينا مدخل ذلك الكهف في الجزيرة من بعيد، ونحن إذ بنا نحط خطانا إذ تستقبلنا ذلك الشيء؛ كائن غريب لا ندري ما كينونته ولا يعرف قبله من دبره؛ لا ندري أين رأسه من قدميه."}, {"type": "p", "text": "انتهى درس اليوم وأنصرف ذلك الشيخ علاء الدين بطل قصتنا إلى منزله."}, {"type": "p", "text": "رجل يبلغ من العمر 55 عام قد قضى جلها، في خدمة الدين وإيصاله للناس، ولد في مدينة بلخ^15 إحدى مدن أفغانستان، ثم انتقل منها ورحل إلى قونيا إحدى مدن تركيا طلبا للعلم وروية تاريخ وأثار المدينة والتي بها متحف جلال الدين الرومي؛ والذي يشبه شخصيته في كثير من الأمور منها الترحال من بلده إلى قونيا أيضا بسبب الغزوات المغولية،"}, {"type": "p", "text": "ثم استقر في قونيا."}, {"type": "p", "text": "قد انهى حفظ القرءان الكريم في طفولته، ودرس الفقه والحديث وبعض العلوم على يد مشايخه في بلده ثم رحل لاستكمال رحلته العلمية، ورغم كونه قد حصل من العلوم الكثير لم يكتفي بذلك، وذلك من ضمن الأسباب التي جعلته يتقلد منصب إمام مسجد قونيا الكبير."}, {"type": "p", "text": "وفي سن ال 32 سافر إلى بغداد عاصمة العراق؛ والتي كانت موطنا للعديد من العلماء والفلاسفة، وكانت مكان زاخرا بالعلوم والمعارف حيث تتلمذ على إيدي الشيوخ والعلماء، ثم عاد ليستقر في مدينة قونيا مرة أخرى ويمسك منصب إمامة مسجد قونيا الكبير."}, {"type": "p", "text": "هو رجل ما بين الطول والقصر وشعر رأسه بنيا ناعما كموج مياه، منسدل حتى كتفيه، قد خالطه بياض الشيب وعيناه كأنها سماء مظلمة في ليلة صافية شديدة الضياء، ذو جسد نحيل وفي وجهه خال عند عينه اليمنى."}, {"type": "p", "text": "كان رجلا يتحلى بالشجاعة والذكاء، والهدوء والقيادة، قد نشأ في بيئة بسيطة، ولكنه كافح حتى حصل العلوم والمعارف من شتى الأماكن."}, {"type": "p", "text": "وكان رجلا محبا للخير، يساعد الاخرين ويأثرهم على نفسه."}, {"type": "divider"}, {"type": "p", "text": "نترك قونيا ذهابا لأنقرة لنتعرف على بطل قصتنا الثاني منصور حيث يمكث في مسقط رأسه أنقرة ."}, {"type": "p", "text": "منصور:"}, {"type": "p", "text": "رجل في منتصف الثلاثينيات من عمره، يبلغ طوله حوالي 180 سم، ذو بنية قوية وملامح حادة."}, {"type": "p", "text": "بشرته داكنة قليلاً، وشعره قصير ومجعد بلون أسود، وعيناه بنيتان داكنتان تعكسان ذكاءً وعمقًا داخليًا."}, {"type": "p", "text": "لديه ندبة صغيرة على حاجبه الأيمن، ذكرى لحادثة في طفولته."}, {"type": "p", "text": "منصور يتمتع بشخصية جذابة وقوية؛ فهو شجاع ومصمم على تحقيق أهدافه، لكنه أيضًا يتمتع بلطف ورقة عند التعامل مع الآخرين."}, {"type": "p", "text": "يحب مساعدة من حوله، خاصة الفئات الضعيفة والمهمشة، مما يكسبه احترام وتقدير الجميع."}, {"type": "p", "text": "وهو يتمتع بذكاء حاد وسرعة بديهة، لكنه يميل أحيانًا إلى التفكير الزائد والتحليل العميق، مما يجعله مترددًا في اتخاذ بعض القرارات."}, {"type": "p", "text": "نشأ منصور في حي شعبي مكتظ بالسكان، وسط عائلة صغيرة ومعيلة."}, {"type": "p", "text": "منذ صغره، كان يعمل بجد لدعم أسرته، مما زرع فيه روح الاجتهاد والتفاني."}, {"type": "p", "text": "بفضل إصراره وعمله الشاق، تمكن من الحصول على صفقة تجارية ببلاد أنقرة التركية في إحدى فئات التجار المرموقة، حيث تاجر لفترة كبيرة، وأصبح ناجحًا وذا خبرة."}, {"type": "p", "text": "في مهنته كتاجر، عُرف منصور بنزاهته وحرصه على إيصال الحق لإصحابه."}, {"type": "p", "text": "غالبًا ما كان يدافع عن المظلومين، ويدافع ويساعد المحتاج."}, {"type": "p", "text": "على مر السنين، تطور منصور من شاب طموح إلى قائد ملهم."}, {"type": "p", "text": "نراه يواجه تحديات كبيرة، سواء على المستوى المهني أو الشخصي. يمر بمواقف تجبره على إعادة تقييم مبادئه وأولوياته، ولكنه في النهاية يخرج منها أقوى وأكثر حكمة، يصبح منصور رمزًا للشجاعة والصمود، وقدوة يحتذى بها الكثيرون."}, {"type": "divider"}, {"type": "divider"}, {"type": "p", "text": "نترك مدينة أنقرة التركية عائدين إلى قونيا حيث نتابع تطور الأحداث مع الشيخ علاء الدين وماذا حدث بعد ذلك، لذا عزيزي القارئ فلتحصر مشروبك المفضل ولتتابع الرحلة."}, {"type": "p", "text": "مدينة قونيا التركية"}, {"type": "p", "text": "على إحدى الحانات في أحياء قونيا الشعبية في تمام التاسعة مساءً."}, {"type": "p", "text": "رياح شديدة تهب من جهة الشمال، أوراق الأشجار تتساقط كحبات المطر، غبار كثيف ملأ كل مكان خاصة تلك الشرفة المطلة الطريق المتجه لشارع المقاهي، وهناك عند الحانة يجلس ذلك الرجل رث الثياب ذو البشرة السمراء والشعر المجعد، وفي يده زجاجة النبيذ."}, {"type": "p", "text": "ومن بعيد نرى ذلك الشيخ علاء الدين قد خرج باتجاه مسجد قونية الكبير."}, {"type": "p", "text": "وبينما هو يمشي ومر من أمام الحانة إذ راه ذلك السكير؛ فما أن رآه إلا وخرج يستهزأ به، ولسان حال الشيخ يقول في صمت:"}, {"type": "p", "text": "سلاما لا نبتغي الجاهلين."}, {"type": "p", "text": "كان الشيخ ذاهبا لصلاة العشاء ولدرس ما بعد الصلاة."}, {"type": "p", "text": "كان ذلك السكير كلما مر من أمام المسجد وسمع الشيخ يتحدث عن علامات الساعة وذكر ملاحم اخر الزمان كان يستهزأ بما يقول ولم يسمح لنفسه في التعرف على صدق ذلك، ولكن ذلك الشيخ اخلاقه ودينه أبدا ما سمحا له بأن يرد له ما يفعل لعل يوما يأتي ويكتب له الله الهداية لما يرى من الحق وكان كلما رآه قال:"}, {"type": "p", "text": "متى تكون الملحمة مولانا؟."}, {"type": "p", "text": "ولا يجيب الشيخ إلا بسلام لا نبتغي الجاهلين."}, {"type": "p", "text": "في أنقرة، تلك المدينة التي تمتد بين صفحات التاريخ والحاضر، كانت الشمس تتسرب ببطء من وراء الأفق، تنثر أشعتها الذهبية على قلعة أنقرة القديمة التي تعلو التلة كحارس أمين، يحرس أسرار الزمن وأمانات الأجيال."}, {"type": "p", "text": "المدينة تستيقظ على وقع خطى ساكنيها، تحمل في طياتها رائحة القهوة الطازجة المنبعثة من المقاهي الصغيرة المنتشرة في الأزقة."}, {"type": "p", "text": "عند الفجر، عندما تبدأ المدينة في التنفس بعمق، تتسلق أشعة الشمس جدران المباني في حي كيزيل آي، تتسلل إلى النوافذ الضيقة لتداعب وجوه النائمين، وتوقظهم بلطف من أحلامهم."}, {"type": "p", "text": "في ذلك الحي، حيث تتعانق الأبنية الحديثة مع لمسات التاريخ، تعبر الأشعة الأولى فوق رؤوس المآذن العالية، تتراقص فوق القباب، ترسم ظلالًا طويلة على الأرصفة. صوت المؤذن يرتفع من جامع حاج بيرم^16، يختلط مع زقزقة العصافير، يشكل سيمفونية صباحية تبعث في النفوس سكينة وطمأنينة."}, {"type": "p", "text": "الشوارع الضيقة تفتح ذراعيها للعابرين، الباعة المتجولون يبدؤون في ترتيب بضاعتهم، ورائحة الخبز الطازج تملأ الهواء، تعلن بدء يوم جديد مليء بالأمل والعمل."}, {"type": "p", "text": "الميادين العامة تحتضن تماثيل مصطفى كمال أتاتورك، تقف هناك بشموخ، تراقب المدينة التي استنهضها من رمادها."}, {"type": "p", "text": "وفي حدائق جينتشليك باركي^17 التي تزين قلب أنقرة، تنتشر الورود بألوانها الزاهية، تستقبل نور الصباح بفرح، وكأنها تحتفل ببداية يوم جديد. الأطفال يركضون بين الأشجار، ضحكاتهم ترن كأجراس صغيرة، تملأ الجو ببهجة خالصة."}, {"type": "p", "text": "تستعد أنقرة ليوم آخر من العمل والحياة، مدينة تحمل في طياتها روح الماضي وجسارة المستقبل، كل حجر، كل زاوية، يحكي قصة، ويشهد على حياة تتجدد كل صباح مع شروق الشمس."}, {"type": "p", "text": "وفي يوم تتجدد فيه الحياة بالنشاط، وتتبدل فيه ملامح الأمس عن اليوم، تتفتح فيه الزهور الناضرة من أغصانها كتيجان الملائكة لتتدلى على قارعات الطرق والمباني، وتلك الأشجار المتقطعة على أطراف الجبال، والشجيرات الكثيفة المتناثرة في وسط الحقول، وتلك البنايات التي يغلب عليها الطراز عثماني، الذي تتسلل أشاعة الشمس من خلالها تسقط على الشوارع والحقول والقصور."}, {"type": "p", "text": "وبعد شروق الشمس قام منصور بحمل ما استطاع من البضاعة فلمَّ حضر عند التل في تمام الوقت كما أخبره زعيم العصابة بعدما اختطف زمرد، ولما وصل للمكان اذ خرج عليه زعيم العصابة وعدد من الافراد."}, {"type": "p", "text": "فقال منصور: اين الفتاة فقد اتفقنا؟!"}, {"type": "p", "text": "قال زعيم العصابة: نعم لقد اتفقنا وهي بالحفظ والصون لكن دعهم يأخذون البضاعة اولا."}, {"type": "p", "text": "قال منصور: كلا لن يقترب أحد من بضاعتي إلا برؤيه زمرد."}, {"type": "p", "text": "طبعا لم يعجبه هذا الكلام فأمر جنوده بأخذ البضاعة عنوة، ثم بعد ذلك قاموا بإطلاق سراح الفتاة فوجدها منصور خارجة من وراء تلك الصخر الكبيرة التي خرجوا على منصور منها فجأة بدون أن يشعر بهم، وتركوا الفتاة وهموا بالرجوع من حيث أتوا."}, {"type": "p", "text": "وبينما زعيم العصابة يُؤَمِّن على ما تم نهبه من منصور، نظر إليه وهو يبتعد عنه خطوة فخطوة أمام ناظريه، ثم نظر إليه نظرة غضب وقال في حزم:"}, {"type": "p", "text": "اياك ان تخبر احدا او حتى جنود الملك لأنك لو فعلت لم تسلم مني أبدا يا هذا؛ إياك."}, {"type": "p", "text": "عاد منصور إلى مكان البضاعة ثم جمع أمتعته لكي يرحل ويترك المدينة نهائيًا بلا رجعة، وذلك بعد أن أوصل «زمرد» إلى مكان مبيتها واطمئن انها بأمان."}], "section": "story"}, {"id": 10, "title": "مدينة أنقرة التركية: (2/3)", "paras": [{"type": "divider"}, {"type": "p", "text": "زمرد:"}, {"type": "p", "text": "فتاة في منتصف العشرينيات، يبلغ طولها حوالي 165 سم، ذات بنية رشيقة وملامح دقيقة، بشرتها بيضاء تشوبها لمسة من السمرة، وشعرها طويل ومسترسل بلون أسود حالك، ينسدل حول وجهها البيضاوي بشكل جذاب. عيناها خضراوان كالجواهر، تعكسان ذكاءً وحذرًا دائمين. لديها وشم صغير على معصمها الأيمن، يمثل رمزا غامضا لا يعرف معناه إلا القليل."}, {"type": "p", "text": "زمرد تتمتع بشخصية معقدة ومتعددة الأوجه؛ فهي ذكية ومبدعة، لكنها أيضًا ماكرة وتتمتع بقدرة فائقة على التلاعب بالأحداث والناس من حولها. تعرف كيف تستخدم جمالها وسحرها لتحقيق أهدافها، ولكنها تحمل في داخلها جانبًا مظلمًا نتيجة لتجاربها الصعبة. زمرد تتميز بسرعة بديهة وقدرة فائقة على التفكير السريع تحت الضغط، مما يجعلها أحد أهم أفراد العصابة."}, {"type": "p", "text": "نشأت زمرد في ظروف صعبة، في حي فقير تسوده الجريمة والعنف. فقدت والديها في سن مبكرة، مما جعلها تعتمد على نفسها للبقاء على قيد الحياة. تعلمت فنون السرقة والخداع من صغرها، وانضمت إلى العصابة كوسيلة لحماية نفسها وتأمين مستقبلها. رغم ظروفها القاسية، حصلت زمرد على تعليم ذاتي من خلال قراءة الكتب ، مما زاد من معرفتها وقدراتها."}, {"type": "divider"}, {"type": "p", "text": "- العشاء السري:"}, {"type": "p", "text": "وفي ذات ليلة، دعا منصور زمرد لتناول العشاء في مكان هادئ بعيدًا عن أعين الناس، جلسا تحت سماء مرصعة بالنجوم، وتحدثا عن أحلامهما وتطلعاتهما."}, {"type": "p", "text": "وكانت زمرد تكتشف جانبًا جديدًا من منصور، رجل مليء بالأمل والتفاؤل."}, {"type": "p", "text": "وفي أحد الأيام، بدأ المطر يهطل بغزارة فجأة، احتميا معًا تحت سقف صغير، ضحكا وهما يحاولان الابتعاد عن البلل، شعر كل منهما بدفء الآخر، وكانت تلك اللحظة الأولى التي شعرت فيها زمرد بأنها في مأمن من العصابة بشكل كامل مع منصور، فأخيرًا قد ألتقت بمن سوف يكون سببا في حمايتها، واستنقاذها من وحل القذارة التي أوقعت نفسها فيه، فحمدت الله على أن جعل لها منصور سبب من الأسباب التي تعينها على الحياة."}, {"type": "p", "text": "وفي ليلة هادئة، أثناء تجولهما معًا، توقفا عند حافة نهر يعكس ضوء القمر،"}, {"type": "p", "text": "واعترفا بحبهما لبعضهما البعض، وكانت الكلمات مليئة بالصدق والعاطفة."}, {"type": "p", "text": "نظر منصور في عيني زمرد وأخذته سنة من التفكير حتى قاطعته بقولها:"}, {"type": "p", "text": "ماذا بك يا منصور تحدق بي ولا تتكلم؟!"}, {"type": "p", "text": "فقال منصور في هدوء:"}, {"type": "p", "text": "تشبهين القمر في تمامه يا زمرد، فما أجملك وأنت في هذا المشهد؛ كالقمر المضيء في سماء مرصعة بالجواهر والحلي."}, {"type": "p", "text": "لم تستطع زمرد أن ترد على كلامه وقالت في خجل وتلعثم مغيرة الموضوع:"}, {"type": "p", "text": "ماذا تنوي أن تفعل؟"}, {"type": "p", "text": "فأجاب في ود:"}, {"type": "p", "text": "لن أفعل شيء سوى البقاء بجانبك."}, {"type": "p", "text": "فقالت: نعم أرى ذلك في عينيك؛ أن لا يحول بيننا شيء إلا الموت، وأنا الأخرى أتمنى ذلك."}, {"type": "p", "text": "صمتت لبرهة بينما تنظر في عينيه نظرات توحي بالحب والقلق في ان واحد ثم أردفت قائلة:"}, {"type": "p", "text": "ولكني قصدت أمرًا أخر."}, {"type": "p", "text": "فقال: وما هو؟!"}, {"type": "p", "text": "قالت: ما تنوى أن تفعل بعدما حدث معك؟!"}, {"type": "p", "text": "فنظر نظرة من يتساءل وقال:"}, {"type": "p", "text": "وما ترين أنت أن أفعل؟!"}, {"type": "p", "text": "أجابت وقد لمعت في عيناها دمعة حزن قائلة: تقصد الرحيل؟!"}, {"type": "p", "text": "قال: نعم."}, {"type": "divider"}, {"type": "p", "text": "كان يشعر منصور أن وراء الحب ألم والتعلق فراق، وتلك سنن من سنن الله في كونه، فالفراق أمر لا تنكره العقول، ولكنها تتحايل على أسبابه ظنا منها أن الوقت يطول وبطوله تُنسى لحظة الفراق الحاسمة، فأحبب من شئت فإنك حتما ستفارقه."}, {"type": "p", "text": "ولكن ليس هذا ما يجعله حزينا ولكن ما يشغل تفكيره أنه يعلم في قرارة نفسه أنه ما كان ينبغي أن يصاحب أي فتاة في تجارته ، فليست هذه تعاليم دينه وما تربى عليه من عادات وتقاليد، ولكن كان مبرره هو أنه لا يريد أن يفارق زمرد، بل ولقد أوطن في نفسه عن يقين أنه سوف يتزوج بها، وهذا ما يجعله يبرر لنفسه الخروج معها ولكنه كان في تأنيب دائم لنفسه، وخوفا من أن يحدث حادث في قادم الأيام يفرقهما."}, {"type": "p", "text": "وهو لا يدري كيف بهذه السرعة قد ألف وجودها في حياته، واعتاد على رؤيتها، ربما لكونها تشبه والدتها في حنانها وشخصيتها وبعضًا من ملامح وجهها."}, {"type": "p", "text": "وقلقه كان في محله؛ فماذا لو قد فرق بينهما شيء، هل يتركها بعدما علقها به وتعلق بها، وما ذنبها، ولكنه كان يجاهد في الدعاء لعل الأقدار تتجه نحو شاطئ ما تمناه يوما، وتخيم الغيوم على أحلامه فيجد ظلالها في يوم حارق تظله بحقيقتها."}, {"type": "p", "text": "وقد عزم وقرر أنه سيرحل ويأخذها معه ويتزوجا في مسقط رأسه وموطنه الذي تربى فيه، ولكن كان للقدر حدث أخر؛ فهل سيتزوجها ام هناك إحداث أخرى تُحيل اجتماعهما إلى فرقة أبدية؟!؛ فهذا ما سوف نعرفه فيما هو قادم عزيزي القارئ"}, {"type": "p", "text": "وأشعر أنك قد تعبت من السفر والترحال في مشارق الأرض ومغاربها وما بين الماضي والحاضر لذا فلتأخذ قسط من الراحة ولتستأنف القراءة، ولكن لا تنسى كوب قهوتك اللذيذ عندما ترجع."}, {"type": "divider"}, {"type": "p", "text": "وفي طرق المدينة القديمة وسط الأزقة وحواري البيوت؛ ونحن نتمشى نستمع لأصوات الأطفال التي تلعب أمام المنازل، ونشتم رائحة الشواء المنبعثة من نوافذها المنخفضة والعالية، تتلمس إيدينا تراب الحوائط التي اتخذ الغبار والعنكبوت بيوت له بين أركانها، وننظر في وجوه الناس لنرى تفاصيل المكان وعمقه، ومدى انشغال الناس وهمومها؛ ذلك الرجل العجوز الذي قعد واضع راحة يده اليمنى تحت ذقنه وهو ينظر لرضيع تركته إمه يأكل من خشاش الأرض بينما ذهبت هي تحدث جارتها المطلة عليها من نافذة بيتها الذي في قبالة بيت زمرد حيث خرجت هي الاخرى تناظر جو الصباح المبكر وتتذكر كل تفاصيل تلك اللقاءات التي جمعتها بمنصور وهي تقول لنفسها:"}, {"type": "p", "text": "لقد شعرت بالحرية لأول مرة من رباط قد قيد عنقي في طاحونة حياةٍ ما تذوقت فيها طعم الحياة، لم يكن منصور كبقية الرجال الذين قد عرفتهم طيلة حياتي؛ كان مختلفا جدا في كل شيء؛ في تصرفاتها وأفعاله وطبعه، قبل أن يكون مختلفا في شكله، وما جذبتني هيئته بقدر ما جذبتني روحة الطيبة."}, {"type": "p", "text": "تراني أهيم به وتمنعني أوهام الحب والإعجاب عن الحقيقة؛ وما هي إلا أوقات قلائل وتتكشف حقيقة تلك المشاعر بالتدرج، لا أدري ولعلي لن أدري حتى أقع فريسة لقلبي، ولا أتمنى ذلك، فيكفيني ما مررت به."}, {"type": "p", "text": "طال الوقت بها وهي تنظر الناس والأطفال في الزقاق ويكأنها تتحدث مع النساء وتلعب مع الأطفال ولكن تفكيرها وقلبها مشغول بمنصور؛ وهي تدرك تمام الإدراك أنه سيرحل، وترحل معه تلك المشاعر المؤقتة؛ فهي في تردد وحيرة من الذهاب معه، وتطوف الموانع بعقلها كسراب الحمائم، وهي تقول في نفسها:"}, {"type": "p", "text": "آهٍ؛ ويلي ما خرجت من إصرٍ إلا لأدخل في ثانٍ."}, {"type": "p", "text": "وهي تقصد عبء ماضيها الملوث ببكتيريا الجرائم، وحاضرها المليء بالحب والتعلق ومستقبلها المترقب لأسباب الفقد والألم."}, {"type": "divider"}, {"type": "p", "text": "اكتشفت العصابة أن زمرد تتواصل مع منصور من حين لأخر وتجمعهما اللقاءات ، فأجبروها على الابتعاد عنه، فشعرت بالخطر عليه، فقررت تحذيره بطريقة ما، ولم تكترث لتهديدهم."}, {"type": "p", "text": "وفي مضي الليل وعتمته، وخسوف القمر وظلمت السماء ولمع النجوم، وفي تحسس الطرقات والأزقة الملتوية والطريقات الوعرة وخلو الأماكن من الخلق والأصوات فلا تسمع إلا رياح الشمال تدب دبيبها في الليلة الظلماء شاهدة ومتقصية آثار وطء أقدامها وهي تترجل بين الطرق تبغي الوصول وكلما تقدمت خطوة زادت نبضات قلبها في الخفقان، حتى إذا تمكنت من لقاء منصور سراً أخبرته عن تهديد العصابة، فوعدها أن يحميها، وأن يبذل قصارى جهده لإبقائها بأمان."}, {"type": "p", "text": "وقد أعدا الخطة؛ خططا لهروبٍ جريء من المدينة، مستخدمين معرفتهما بالسوق والمناطق المحيطة، كانت هناك لحظات من التوتر والخوف، ولكن كان الحب الذي بينهما والثقة الكبيرة هو الدافع الأقوى لاجتياز أي عوائق في الطريق."}, {"type": "p", "text": "ها هما يسرعان بقلب متشوق للعيش بمكان خال من المنغصات والشر، يطمحان في عالم تسوده الطيبة والهدوء والجمال، كل خطوة تقابلها لمحة من القلق، نبضات القلب تتسارع، وأنفاسهما متهدجة أثناء الهروب."}, {"type": "p", "text": "ولكنهما قد حوصرا من قبل العصابة، فأظهر منصور شجاعة وبراعة في الدفاع عنهما، بينما كانت زمرد تقف بجانبه بقوة، متحدة معه في مواجهة الخطر."}, {"type": "p", "text": "قد استطاع منصور التصدي لتلك اللصوص وهو يعلم الخطر المترتب على ذلك وهذا ما جعله يجد السير وزمرد حتى انتقلا إلى مدينة جديدة، حيث بدأ كل منهم حياة جديد؛ ا
