ن سميت فيه."}, {"type": "p", "text": "فبايعه رجلًا رجلا وتفرقوا."}, {"type": "p", "text": "وقال رجاء: فأتاني عمر بن عبد العزيز فقال:"}, {"type": "p", "text": "أخشى أن يكون هذا أسند إلىَّ شيئاً من هذا الأمر، فأنشدك الله وحرمتي ومودتي إلا أعلمتني إن كان ذلك حتى أستعفيه الآن قبل أن تأتي حال لا أقدر فيها على ذلك."}, {"type": "p", "text": "قال رجاء: ما أنا بمخيرك «حرفا»"}, {"type": "p", "text": "قال: فذهب عمر عني غضبان."}, {"type": "p", "text": "قال رجاء:"}, {"type": "p", "text": "ولقيني هشام بن عبد الملك فقال: إنَّ لي بك حرمةً ومودة قديمة وعندي شكر فأعلمني بهذا الأمر فان كان إلى غيري تكلمت والله عليَّ ألا أذكر شيئا من ذلك أبداً."}, {"type": "p", "text": "قال رجاء: فأبيت أن أخبره حرفا، فانصرف هشام وهو يضرب بإحدى يديه على أخرى ويقول:"}, {"type": "p", "text": "فإلى من إذا نُحيِّت عنيِّ؟ أتخرج من بني عبد الملك؟"}, {"type": "p", "text": "قال رجا: ودخلت على سليمان فإذا هو يموت فجعلت اذا أخذته سكرة من سكرت الموت حرفته إلى القبلة فيقول حين يفيق:"}, {"type": "p", "text": "لم يأن بعد."}, {"type": "p", "text": "ففعلت ذلك مرتين أو ثلاثا فلما كانت الثالثة قال:"}, {"type": "p", "text": "من الآن يا رجاء ان كنت تريد شيئا، أشهد أن لا إله إلا الله وأشهد أن محمداً رسول الله."}, {"type": "p", "text": "فحرفته فمات، فلما غمَّضته وسجَّيته وأغلقت الباب أرسلت إلى زوجته فقالت:"}, {"type": "p", "text": "كيف أصبح؟"}, {"type": "p", "text": "فقلت: هو نائم قد تغطى."}, {"type": "p", "text": "ونظر إليه الرسول متغطيا فرجع فاخبرها فظنت انه نائم،"}, {"type": "p", "text": "قال: فأجلست على الباب من اثق به وأوصيته ألا يبرح ولا يترك أحداً يدخل على الخليفة."}, {"type": "p", "text": "قال فخرجت فأرسلت إلى كعب بن جابر فجمع أهل بيت سليمان فاجتمعوا في مسجد دابق."}, {"type": "p", "text": "فقلت: بايعوا."}, {"type": "p", "text": "فقالوا: قد بايعنا مرة."}, {"type": "p", "text": "قلت: وأخرى، هذا عهد أمير المؤمنين."}, {"type": "p", "text": "فبايعوا الثانية."}, {"type": "p", "text": "فلما بايعوا بعد موته رأيت أني قد أحكمت الأمر فقلت:"}, {"type": "p", "text": "قوموا إلى صاحبكم فقد مات."}, {"type": "p", "text": "قالوا: إنا لله وانا اليه راجعون."}, {"type": "p", "text": "وقرات الكتاب فلما انتهيت إلى ذكر عمر بن عبد العزيز"}, {"type": "p", "text": "قال هشام: لا نبايعه والله أبداً."}, {"type": "p", "text": "قلت: اضرب والله عنقك، قم فبايع."}, {"type": "p", "text": "فقام يجر رجليه."}, {"type": "p", "text": "قال رجاء: فأخذت بضبعَيْ عمر بن عبد العزيز فأجلسته على المنبر، وهو يسترجع لما وقع فيه وهشام يسترجع لما أخطأه فبايعوه."}, {"type": "p", "text": "وغسل سليمان وكفنا وصلى عليه عمر بن عبد العزيز ودفن."}, {"type": "p", "text": "فلما دفن أُتي عمر بمراكب الخلافة ولكل دابة سائس."}, {"type": "p", "text": "فقال: ما هذا؟"}, {"type": "p", "text": "فقيل: مراكب الخلافة."}, {"type": "p", "text": "قال: دابتي أوفق لي."}, {"type": "p", "text": "ركب دبته وصُرفت تلك الدواب، ثم أقبل سائرا"}, {"type": "p", "text": "فقيل له: أمنزل الخلافة؟"}, {"type": "p", "text": "فقال: فيه عيال أبي أيوب «يعنيع سليمان»، وفي فسطاطي كفاية حتى يتحولوا."}, {"type": "p", "text": "فأقام في منزله حتى فرغوا."}, {"type": "p", "text": "قال رجاء: فأعجبني ما صنع في الدواب ومنزل سليمان."}, {"type": "p", "text": "ثم دعا كاتبا فأملى عليه كتاباً واحداً وأمره أن ينسخه ويسيْره إلى كل بلد."}, {"type": "p", "text": "وبلغ عبد العزيز بن الوليد وكان غائبا عن موت سليمان ولما يعلم ببيعة عمر، فعقد لواء ودعا إلى نفسه، فبلغه بيعة عمر بعهد سليمان، وأقبل حتى دخل عليه،"}, {"type": "p", "text": "فقال له عمر:"}, {"type": "p", "text": "بلغني أنك بايعت من قِبَلك وأردت دخول دمشق!"}, {"type": "p", "text": "فقال: قد كان ذاك وذلك أنه بلغني أن سليمان لم يكن عهد لأحد فخفت على الأموال أن تنهب."}, {"type": "p", "text": "فقال عمر: لو بايعت وقمت بالأمر لم أنازعك فيه ولقعدت في بيتي."}, {"type": "p", "text": "فقال عبد العزيز ما أحب أنه ولي هذا الأمر غيرك وبايعه، وكان يرجى لسليمان بتوليته عمرو بن عبد العزيز وترك ولده."}, {"type": "p", "text": "فلما استقرت البيعة لعمر بن عبد العزيز قال لامرأته فاطمة بنت عبد الملك:"}, {"type": "p", "text": "إن أردت صحبتي فردي ما معك من مال وحلي وجوهر لبيت مال المسلمين، فإنه لهم فإني لا أجتمع أنا وانت وهو في بيت واحد."}, {"type": "p", "text": "فردته جميعه."}], "section": "story"}, {"id": 26, "title": "عمر بن الخطاب (4/4)", "paras": [{"type": "divider"}, {"type": "p", "text": "فلما توفى عمر وولي أخوها يزيد رده عليها وقال:"}, {"type": "p", "text": "أنا اعلم أن عمر ظلمك."}, {"type": "p", "text": "قالت: كلا والله."}, {"type": "p", "text": "وامتنعت من أخذه وقالت:"}, {"type": "p", "text": "ما كنت أطيعه حيًا وأعصيه ميتاً."}, {"type": "p", "text": "فأخذه يزيد وفرقه على أهله."}, {"type": "divider"}, {"type": "p", "text": "ومن حرص عمر على الوقت أنه كان لا يعرف تأخير عمل اليوم إلى الغد، فيومه كله عمل. وعندما لاحظ عليه بعض أهله مظاهر الإرهاق من كثرة العمل تقدم إليه قائلاً: \"يا أمير المؤمنين، لو ركبت -- في نزهة -- فَتَرَوَّحْتَ. أجابهم: فمن يجزي عني عمل ذلك اليوم؟، قال: تجزيه من الغد. أجاب عمر: فَدَحَني عمل اليوم، فكيف إذا اجتمع عليَّ عملُ يومين\"."}, {"type": "p", "text": "فقد كتب إلى عامله على المدينة: \" أن قَسِّمْ في ولد علي بن أبي طالب عشرة آلاف دينار. فكتب إليه: إن عليًّا قد وُلِدَ له في عدة قبائل من قريش، ففي أي ولده؟، فكتب إليه: لو كتبت إليك في شاة تذبحها لكتبت إليَّ: أسوداء أم بيضاء؟. إذا أتاك كتابي هذا فاقسم في ولد علي من فاطمة -- رضوان الله عليهم -- عشرة آلاف دينار فطالما تخطتهم حقوقهم\"."}, {"type": "p", "text": "ولم يكن عمر يكتفي بحسن الاختيار بعد الابتلاء، بل كان يتابع عماله ويرسم لهم المنهج الذي ينبغي عليهم أن يطبقوه ليقيموا العدل بين الناس."}, {"type": "p", "text": "فقد كتب إلى عامله على الكوفة عبد الحميد بن عبد الرحمن بن زيد بن الخطاب: \"سلام عليك، أما بعد فإن أهل الكوفة قد أصابهم بلاء وشدة وجور في أحكام الله، وسنة خبيثة استنها عليهم عمال السوء، وإن قوام الدين العدل والإحسان، فلا يكونن شيء أهم إليك من نفسك فإنه لا قليل من الإثم، ولا تحمل خراباً على عامر، ولا عامراً على خراب. انظر الخراب فخذ منه ما أطاق، وأصلحه حتى يعمر. ولا يؤخذ من العامر إلا وظيفة الخراج في رفق وتسكين لأهل الأرض، ولا خراج على من أسلم من أهل الأرض. فاتبع في ذلك أمري، فإني قد وليتك من ذلك ما ولاني الله. ولا تعجل دوني بقطع ولا صَلْب، حتى تراجعني فيه، وانظر من أراد أن يحج من الذرية فعجِّل له مائة يحج بها. والسلام\"."}, {"type": "p", "text": "وتوفى عمر بن عبد لعزيز في رجب سنة إحدى ومائة، وكانت شكواه عشرين يوما ولما مرض قيل له:"}, {"type": "p", "text": "لو تداويت."}, {"type": "p", "text": "قال: لو كان دوائي في مسح أذني ما مسحتها، نعم المذهوب إليه ربي."}, {"type": "divider"}, {"type": "p", "text": "قال سفيان السوري: الخلفاء خمسه؛ أبو بكر وعمر وعثمان وعلي وعمر بن عبد العزيز."}, {"type": "p", "text": "قالت فاطمة امرأته: دخلت عليه وهو في مصلاه ودموعه تجري على"}, {"type": "p", "text": "لحيته فقلت: قد أُحدث أمرا"}, {"type": "p", "text": "فقال: إني تقلدت أمر أمة محمد فتفكرت في الفقير والجائع والمريض الضائع والغازي والمظلوم والمقهور، والغريب الأسير والشيخ الكبير وذوي العيال الكثير والمال القليل."}, {"type": "p", "text": "ان ربي سيسألني عنهم يوم القيامة، وأن خصمي دونهم محمد صلى الله عليه وسلّم، إلى الله المشتكى، فخشيت ألا تثبت حجتي عند الخصومة، فرحمت نفسي فبكيت."}, {"type": "p", "text": "هو ذا عمر الذي قال: انشروا الحب على رؤوس الجبال كي لا يقال جاع طائر في بلاد المسلمين."}, {"type": "p", "text": "فلقد ازدهرت البلاد في عهده لما عمل عليه من رضى الله في الرعية، فوفقه الله لما فيه نفع الأمة، فرضي الله عن عمر بن عبد العزيز خامس الخلفاء الراشدين."}, {"type": "p", "text": "ثم قام الشيخ علاء الدين مغادرا المسجد بعد ما فرغ من قصة عمر بن عبد العزيز لوجود بعض الضيوف في منزله."}, {"type": "p", "text": "نعود لمدينة أنقرة حيث نجد تلك الغابات الكثيفة التي تعرف بغابات بلغراد وهي منطقة في تركيا:"}, {"type": "p", "text": "أنقرة- تركيا"}, {"type": "p", "text": "غــابــات بلغراد"}, {"type": "p", "text": "على شاطئ المدينة القديمة، يمتد البحر بلا نهاية كمرآة تعكس ألوان السماء وسحر الغروب. تتلاطم الأمواج بلطف على الرمال الذهبية، ترسم الشمس الذهبية آثارها البرتقالية على سطح المياه المتلألئة."}, {"type": "p", "text": "تجلس الفتاة الشابة على حافة الشاطئ، تنظر بعيون مليئة بالحلم إلى الأفق البعيد. تضم الكتاب إلى صدرها، تستريح قدميها في رمال دافئة، وتتنفس نسمات الهواء العليلة المنعشة. تطوف أفكارها بين زمن الماضي ورغبات المستقبل، في حالة تأمل وسلام تملأ الجو حولها."}, {"type": "p", "text": "عند النهر في وسط البلدة جلست «سلمى» بحزن شديد وآسى تتذكر من أحبت وفقدت، وإذ بها كذلك لم تنتبه لوجود شقيقتها الكبرى واقفة عند رأسها، ربتت على كتفها ثم قالت لها:"}, {"type": "p", "text": ": إلى متى سيستمر كل ذلك الحزن يا أخية؟!"}, {"type": "p", "text": "- إلى أن يعود."}, {"type": "p", "text": ": وإن لم يعد؟"}, {"type": "p", "text": "- فعند ذلك فالموت هو السبيل الوحيد للنجاة من براثن ذلك الجفاء الذي يساكن قلبي، أحيانا هناك أشياء لن تشفى إلا بالموت، وأحيانا علينا أن نضحي في هذه الحياة."}, {"type": "p", "text": ": هيا بنا لنعود للمنزل فهناك أمور أن نفعلها."}, {"type": "p", "text": "فقامتا تتحركان باتجاه المنزل وكلاهما خزلان كل بحاله."}, {"type": "divider"}, {"type": "p", "text": "ها قد عاد اليوم منصور من خلوته بعد مرور 40 يوما، في ثنايا رحلة اختلى فيها بنفسه يناجي خالقه ويتأمل الكون المنظور وما أبدع الخالق العظيم وهو يقرأ صفحات الكون وما وراءه."}, {"type": "p", "text": "بداية الطريق:-"}, {"type": "p", "text": "وفي احدى طرق العودة للقرية ومن بعيد نرى تلك الجلبة وذلك الجمع من الناس الواقفون خارج المسجد انتظارا لشيخ المسجد."}, {"type": "p", "text": "لما اقترب قليلا من المسجد رأى رجلان واقفان بجانب الطريق بعيدا عن المسجد قليلا فسألهم عن ما يجري!!"}, {"type": "p", "text": "أجابه أحدهم قائلا:"}, {"type": "p", "text": "نحن جماعة من تلاميذ الشيخ حسين والشيخ النارودي، وقد اجتمعنا للخروج من القرية اتجاه مدينة قونية، ونحن أيضا جماعة رحالة لا نمكث في بلدة إلا شهور معدودة؛ فنحن دائمي التنقل، وقد انتهينا من مكوثنا في بلدكم."}, {"type": "p", "text": "- أو علمت أني من هذه البلد"}, {"type": "p", "text": ": نعم أحسب أني قد رأيتك مع الشيخ النرودي قبل."}, {"type": "p", "text": "- ولما الترحل؟!"}, {"type": "p", "text": "> : في الرحلة فوائد جمة للمريد، لاكتمال أسرار الحكمة والاغتراب من > العلم ومعرفة احوال الناس والبلاد مما يسمو بالمنزلة."}, {"type": "p", "text": "أجاب منصور بنظرة رضا عن ما سمع."}, {"type": "p", "text": ": لقد تأخرنا عن الجماعة إلى اللقاء."}, {"type": "divider"}, {"type": "p", "text": "يا شيخي لقد رأيت القوم فحدثت نفسي بالذهاب معهم، أريد أن اترك هذه البلدة وأذهب مع أولئك."}, {"type": "p", "text": "إجابه الشيخ:"}, {"type": "p", "text": "يا منصور إني لأحب بقائك بجانبي، مما رأيت منك من محبة وود للعبادة"}, {"type": "p", "text": "فأنت من الذين هم زاد لحياة الاخرين وأنيسا للعابرين؛ ولولا أن الإفادة في الرحلة جمة كبيرة لأبقيتك معي."}, {"type": "p", "text": "ثم نظر إليه نظرة مودع وقال:"}, {"type": "p", "text": "ولكن؛ هكذا هي الدنيا تأبى إلا أن تفرق بين المتحابين، وفيها من الصعاب والمشقات ما يجعل الإنسان يكاد ينسى من يحب."}, {"type": "p", "text": "لقد حان الوقت لكي يذهب ويترحل مثلهم."}, {"type": "divider"}, {"type": "p", "text": "لم يذهب منصور وراء القوم مباشرة بل كان لابد أن يجلس لبعض الأيام قبل رحيله لقونية؛ حيث يودع تلك الأرض التي حملته حتى شب وكبر."}, {"type": "p", "text": "وفي ذات نهار في اليوم الثاني بعد عودته لقريته يخرج منصور ليتجول في القرية لكي يودع كل ركن فيها ومن أجمل الأماكن التي يحبها قلبه ذلك النهر الذي دائما ما كان يأوي إليه كلما اشتدت به العواصف."}, {"type": "p", "text": "لما وصل النهر ومن بعيد رأى فتاة جالسة عند الصخرة على طرف النهر حتى إذا نظرت وجدته منصور؛ فكانت فرحتها بعودته لا حدود لها ولكنها رغم ذلك كتمت كل شعور بالحب والفقد اتجاهه."}, {"type": "p", "text": "انها سلمى التي أحبته حبا كبيرا، ولكن الظروف فرقت بينهما."}, {"type": "p", "text": "عندما اقترب منها حياها فردت عليه التحية ثم قال بعد أن سألها عن أحوالها:"}, {"type": "p", "text": "لماذا تجلسين وحدك هنا يا سلمى"}, {"type": "p", "text": "> فأجابته قائلة: > > لقدت أعتدت على ذلك يا منصور منذ أن رحلت، اعتدت على الوحدة وكأن لا > حياة تستأهل أن اعيشها. > > فقال منصور: هل كل ذلك حزنا على زمن مضى كنا على اجتماع فيه، ولكن هذه > هي الدنيا، وحقا أني لأشعر بالأسف على كل ما فعلت في حقك، وأطلب منك > السماح اليوم، لوجه الله؛ فإني ذاهب لبلد أخرى ولا أدري أأعود أم > لا. > > فقالت سلمى: يكفي يا منصور؛ ما أردتك أن تتأسف أو تشعر بلوم الضمير، > فأنا المسئولة عن ذلك وأنا من يجب أن يتحمل أخطاءه، كنت أعرف من البداية > أنك لم تخلق لي ولكني كنت أكابر وأفرض نفسي عليك تحت تأثير والدتك، ولكن > الحمد لله؛ وهذا الألم في قلبي جزاء ما اقترفت. > > ثم أردفت قائلة: > > لا أدري كيف صارحتك بكل ما في قلبي، يبدو أن الفقد يجعل الإنسان لا > يتحمل إذا ما رأى من يحب إلا أن يصارح."}, {"type": "p", "text": "نترك مدينة أنقرة تاركين وراءنا ما حدث لسلمى تلك الفتاة وما تكابده حزنا على فراق منصور لننتقل إلى قونيا حيث الجمال والأصالة والعراقة:"}, {"type": "p", "text": "> ........."}], "section": "story"}, {"id": 27, "title": "مدينة قونيا", "paras": [{"type": "p", "text": "نحن الان في «قونيا» أحدى مدن تركيا، بل وأقدم مدن منطقة الأناضول، كيف يمكن لك أن تتخيل ما مدى جمالها وهي من المدن التي تجعلك تشعر أن التاريخ والعراقة، والروحانية السامية، والسلام النفسي والنمو الروحي يحيط بك من كل جانب ومن كل بقعة في تلك الديار."}, {"type": "p", "text": "ولن يتأتي لك عزيزي القارئ ذلك الجمال وإدراك عظمته إلا إذا أخذناك في رحلة إلى ثنايا تلك المدينة؛ رحلة تجعلك تشعر بعراقة وروحانية ذلك المكان إذا ما طفت بين جنباته."}, {"type": "p", "text": "كما أن تلك المدينة هي عاصمة السلجوقيين والمتصوفين، ويسميها الأتراك مدينة مولانا جلال الدين الرومي، حيث يرقد بها وهو شاعر وعالم صوفي، وصاحب الحكمة والرسالة العالمية والتي تخاطب كافة الحضارات في العالم، وبالتأكيد تلك الرسالة هي سماحة الاسلام وحسن خلقه."}, {"type": "p", "text": "ولن نتطرق عزيزي القارئ لشخصية جلال الدين التي كان لها القدر الكبير من الجدل ما بين مؤيد لأفكاره ومعارض، ونحن هنا لا نتبنى كل أرائه إلا ما وافق رسالة الإسلام العالمية وكتاب الله وسنة نبيه؛ وما خالف من أراء فمردها للعلماء تفصل وتحلل مقاصده من ورائها، فليس لي ولا لك أن نحكم عليه إن حكمه إلا لله."}, {"type": "p", "text": "وقد أسس جلال الدين الرومي بهذه المدينة طائفة الدراويش المولوية وقد جعلها ذلك مدينة روحية دينية بالنسبة للكثير."}, {"type": "divider"}, {"type": "p", "text": "كما أن قونيا تعد من أكبر المدن التاريخية وأجملها ومن أقدم المدن حيث يرجع تاريخها نحو 7000عام ق. م"}, {"type": "p", "text": "وفي ليلة شتوية ساكنة، لا رياح فيها ولا أصوات سوى بعض نسيم الهواء الجميل، وفي وسط جنوب تركيا وبالتحديد عند متحف «مولانا» خرج «علاء الدين» وهو ذلك الشيخ الذي ولد بهذه المدينة، ومن يتولى أمامة مسجدها الكبير « مسجد قونيا»."}, {"type": "p", "text": "رجل يبلغ من العمر 45 عام، ذو لحية خالط سوادها البياض قليلا، جسده ما بين الطول والقصر، ذو وجه تبدو عليه ملامح الشباب، ولكن عيونه تحكي قصص القدامى، له شعر منسدل يقترب من كتفيه، يرتدي دائما رداء وفوقه عباءة والعمامة ذات اللون البني فوق رأسه لا تكاد تفارقه في كل مجلس."}, {"type": "p", "text": "هو ذلك الشيخ الفقيه العالم والمعلم والمربي وهو الذي كنا نتحدث عنه سابقا ولم نعرب عن شخصيته."}, {"type": "p", "text": "كان منذ فترة اتخذ في كل أسبوع يومين لدروس علامات الساعة والملاحم مما نهل من علم بكتاب الله وبحديث رسول الله."}, {"type": "p", "text": "قد خرج علاء الدين ليلا قبيل الفجر بعد أن استيقظ من نومه، خرج باتجاه قبر «شمس الدين التبريزي» وهو يتفكر في أمر ذلك الصوفي وكيف كانت حياته وما قصته، وهو رجل صوفي شاعر ينسب إلى مدينة تبريز وهو يعتبر المعلم الروحي لجلال الدين الرومي الذي قد قرأ عنه وعن سيرته وعن لقاءه بالتبريزي ذلكم اللقاء الذي غير تفكير وطريق جلال الدين."}, {"type": "p", "text": "لقد حان موعد الفجر فانطلق علاء الدين إلى المسجد لصلاة الفجر."}, {"type": "p", "text": "ثم بعد الصلاة جلس يحدث الناس بحديث رسول الله صلى الله عليه وسلم عن اشراط الساعة:"}, {"type": "p", "text": "فقال: ومن ضمن أشراط الساعة وملاحم الساعة؛ فتنة لا تدع بيتا إلا دخلته."}], "section": "story"}, {"id": 28, "title": "ثم فتنة؛ لا تدع بيتا إلا دخلته (1/4)", "paras": [{"type": "p", "text": "قال رسول الله صلى الله عليه وسلم:"}, {"type": "p", "text": "«ثم فتنة تكون لا تدع كل بيت إلا دخلته»."}, {"type": "p", "text": "كان مما عدده رسول الله صلى الله عليه وسلم ان هناك فتنة كبيرة لا تدع بيت من العرب إلا دخلته وقد وقع ما أخبر به، فمن فتش الان في وقتنا الحاضر عن الفتن ليجدن منها في بيته، فربما تمثلت هذه الفتنة في وسائل التكنولوجيا الحديثة؛ كأمثال الهاتف الخلوي والتلفاز، فما من بيت اليوم إلا وفيه هذا الجهاز الذي يبث عليه كل صالح وفاسد حتى غلب الفساد فيه على أمور المنافع فاصبح فتنة؛ فتنت الناس والشباب والأطفال."}, {"type": "p", "text": "وأيضا ذلك الهاتف الخلوي الذي أصبح واقع نعيشه ولا تخلو يد منه لصغير أو كبير، فقد دخلت كل بيت وكل مكان، تلك الفتنة التي تفتح أبواب الشر من كل صنف ولون على ممسكه إلا من رحم الله ممن أستعمله في ما هو نافع وفي خدمة هذا الدين ولكنه قليل."}, {"type": "p", "text": "فلقد عمت البلوى واستشرت، وبلغت مبلغ لا يدان على إيقافها."}, {"type": "p", "text": "ومقصد النبي صلى الله عليه وسلم انها تدخل كل بيت هو ذلك الذي نعيشه؛ فأنت تجد في كل مكان تلك الوسائل وتقتحم بصرك بغير إرادة منك لو كنت غير راغب، فتواجها في كل مكان ولكن ينبغي للإنسان أن يصرف نفسه عن مواطن الفتن."}, {"type": "p", "text": "وليس المقصد هذه الفتنة بالضبط بل كل ما كان على شاكلتها مما يستشري ويدخل حياة كل مسلم، وكل بيت."}, {"type": "p", "text": "والفتن إلى قيامة الساعة كثيرة منها:"}, {"type": "p", "text": "فتنة الأحلاس، السراء، الدهيماء، ثم الفتنة الكبرى؛ الدجال."}, {"type": "p", "text": "وكلها أخبر عنها المصطفى صلى الله عليه وسلم، ويقص على مسامعنا الشيخ علاء الدين تفاصيل تلك الفتن بأسلوب مشوق كما لو كنا جالسين مع الصحابة والنبي عليه الصلاة والسلام يسرد لنا تلد الفتن:"}, {"type": "divider"}, {"type": "p", "text": "كان النهار يميل إلى الغروب، وأشعة الشمس الحمراء تلوح في الأفق كأنها تودع الأرض بقبلة من نار، كنا جلوسًا عند رسول الله صلى الله عليه وسلم، نستمع إلى كلماته التي كانت كأنها تخرج من عمق قلبه، تحمل حكمة السماء إلى قلوبنا العطشى. تحدث النبي عن الفتن، وأخذنا في رحلة عبر الزمان، نرى من خلالها ما يخبئه المستقبل من محن."}, {"type": "p", "text": "بدأ بذكر فتنة الأحلاس، حين سأل أحدنا بلهفة:"}, {"type": "p", "text": "يا رسول الله، وما فتنة الأحلاس؟."}, {"type": "p", "text": "فرد النبي بحكمة، كأنه يروي لنا قصة قديمة مليئة بالدموع والآلام: \\\"هي هَرَبٌ وَحَرْبٌ.\\\""}, {"type": "p", "text": "تخيلنا المشهد، الناس يهربون من بيوتهم، المدن تتحول إلى ساحات معارك، والأخ يصبح عدوًا لأخيه، إنها فتنة تجعل القلوب تهرب من بعضها البعض، فيعيش الناس في خوف دائم، لا يجدون ملاذًا آمنًا."}, {"type": "p", "text": "ثم تحدث النبي عن فتنة السراء، وقال:"}, {"type": "p", "text": "\\\"دَخَنُهَا مِنْ تَحْتِ قَدَمَيْ رَجُلٍ مِنْ أَهْلِ بَيْتِي يَزْعُمُ أَنَّهُ مِنِّي وَلَيْسَ مِنِّي وَإِنَّمَا أَوْلِيَائِي الْمُتَّقُونَ.\\\""}, {"type": "p", "text": "في ظاهرها تبدو كنعمة وسعادة، لكن تحت هذا القناع البراق، يختبئ الدخان والشر. كأنها فاكهة ناضجة من الخارج، لكنها فاسدة من الداخل. سيظهر رجل يدعي الانتماء إلى أهل بيت النبي، لكنه في الحقيقة بعيد كل البعد عن جوهر الدين، فالولاء الحقيقي يكون بالتقوى والعمل الصالح، وليس بمجرد النسب."}, {"type": "p", "text": "ثم وصف النبي زمنًا يصطلح الناس فيه على رجل \\\"كَورِكٍ عَلَى ضِلَعٍ\\\". كان هذا التشبيه يصف حالة من الصلح الهش، مثلما يحاول المرء الجلوس على ضلع غير مستقر، مملوء بالتوترات والخلافات الخفية."}, {"type": "p", "text": "كأن الأمة تتماسك بخيوط واهية، على وشك الانهيار في أي لحظة. سيتحالف الناس، لكن هذا التحالف لن يدوم، وستظل الفتنة تترصد من خلف الستار."}, {"type": "p", "text": "ثم جاء النبي بوصف فتنة الدهيماء، حيث قال:"}, {"type": "p", "text": "\\\"لَا تَدَعُ أَحَدًا مِنْ هَذِهِ الْأُمَّةِ إِلَّا لَطَمَتْهُ لَطْمَةً.\\\""}, {"type": "p", "text": "تخيلنا هذه الفتنة كعاصفة سوداء تجتاح الأمة بأكملها، لا تترك أحدًا إلا وقد مسته، الناس يتقلبون بين الإيمان والكفر في يوم واحد، \\\"يُصْبِحُ الرَّجُلُ فِيهَا مُؤْمِنًا وَيُمْسِي كَافِرًا\\\"، فتنة تجعل القلوب في دوامة من الحيرة والاضطراب، كالتيه في صحراء لا نهاية لها."}, {"type": "p", "text": "وفي هذا الزمن، ستتغير أحوال الناس بشكل سريع ومربك، سيصبح الرجل في الصباح مؤمنًا، وفي المساء كافرًا، يتقلب بين الشك والإيمان، كأنما حياته أصبحت مرآة تعكس تناقضات العصر. سيظهر أشخاص يدعون الحق، لكنهم يغرقون في النفاق، ويظل الصالحون متشبثين بالإيمان كالغريق الذي يتمسك بحبل النجاة."}, {"type": "p", "text": "ستستمر الفتنة حتى ينقسم الناس إلى معسكرين واضحين، \\\"فُسْطَاطِ إِيمَانٍ لَا نِفَاقَ فِيهِ وَفُسْطَاطِ نِفَاقٍ لَا إِيمَانَ فِيهِ.\\\" سنرى الأمة تتشقق، حيث لا مكان للرمادية، إما أن تكون مع الإيمان الخالص أو تغرق في النفاق. ستبرز فئة تتمسك بالإيمان بكل إخلاص، تعيش في واحات من النور، بينما يغرق الآخرون في مستنقعات النفاق، محاطين بظلماتهم."}, {"type": "p", "text": "وأختم النبي حديثه بتحذير نبوي:"}, {"type": "p", "text": "\\\"فَإِذَا كَانَ ذَاكُمْ فَانْتَظِرُوا الدَّجَّالَ مِنْ يَوْمِهِ أَوْ مِنْ غَدِهِ.\\\""}, {"type": "p", "text": "كانت كلماته كناقوس يدق في آذاننا، يحثنا على أن نكون مستعدين للفتن الكبرى، متمسكين بإيماننا، منتظرين لحظة قدوم الدجال في أي وقت. كانت كلماته تشير إلى اقتراب النهاية، وإلى ضرورة البقاء على أهبة الاستعداد، متسلحين بالإيمان والصبر."}, {"type": "p", "text": "كانت كلمات النبي كفصول من رواية ملحمية، ترسم لنا صورة مستقبلية مليئة بالتحديات، تعلمنا كيف نواجه الفتن بصبر وإيمان، وكيف نبحث عن النور في أحلك الظروف، متمسكين بحبل الله ومتسلحين بالتقوى. كأننا نعيش في عالم خيالي، تتداخل فيه الفترات الزمنية، وننتقل بين مشاهد الماضي والحاضر والمستقبل، نرى التاريخ يعيد نفسه، وندرك أن الإيمان هو النور الذي يضيء لنا طريقنا وسط الظلمات."}, {"type": "divider"}, {"type": "p", "text": "انتهى الشيخ من درس اليوم ثم قام وانصرف لمنزله، دعنا الان عزيزي القارئ نترك مدينة قونيا لنذهب في رحلة لمدينة أنقرة حيث نكمل الطريق مع منصور...:"}, {"type": "p", "text": "مدينة أنقرة التركية:"}, {"type": "p", "text": "في ليلة سادها الصمت وظلل عليها الهدوء والسكينة، ليلة تلمع بها النجوم كحبات اللؤلؤ؛ فلا أصوات ولا بشر."}, {"type": "p", "text": "في ذلك الانسجام الروحي كان منصور جالسا في شرفته، لا يفكر في نوم ولا يباغته؛ ربما كان سبب سهره أنها أخر ليلة سوف يقضيها هنا، في قريته."}, {"type": "p", "text": "ودع شيخه وجهز نفسه، وقد حزم أمتعته وتوجه إلى مسجد المدينة للقاء شيخه النرودي ليودعه، ولكن قد فات الاون؛ فعندما وصل علم أن شيخه قد مات."}, {"type": "p", "text": "ذلك الشيخ الذي تربى على يديه تربية روحية في فترة وجيزة تعادل حياته كلها، شيخ قد بلغ من العمر ال73 عام، قضى حياته في العلم والتعليم، وبعد هذا العمر الحافل بالعلم ارتحل وترك أثاره في القرية، يتذكرها بها الناس بعد رحيله."}, {"type": "p", "text": "فمن هو «النارودي»"}, {"type": "divider"}, {"type": "p", "text": "النارودي:"}, {"type": "p", "text": "شيخ جليل ورجل علم ودين، تتجلى في ملامحه الحكمة والوقار. بطول فارع وجسد نحيف، يلفت الأنظار بحضوره الهادئ والمهيب. له لحية بيضاء طويلة تضفي على وجهه مهابة ورزانة، وعينان سوداوان عميقتان تنطقان بحكمة السنين وتجارب الحياة. دائمًا ما يرتدي عباءة بيضاء نظيفة وعمامة كبيرة، ما يزيده هيبة واحترامًا بين الناس."}, {"type": "p", "text": "يُعرف النارودي بين أهل قريته برزانته وتفانيه في خدمة المجتمع. فهو ليس مجرد إمام لمسجد ، بل هو أيضًا معلم ومربي، يقضي جل وقته في تعليم الشباب ونشر العلم. منصور، تلميذه النجيب، يحظى بمكانة خاصة في قلبه، إذ يرى فيه الأمل للمستقبل."}, {"type": "p", "text": "في سلوكه، يتميز النارودي بالهدوء والصبر. يتحدث بصوت هادئ ورخيم، يجذب السامعين ويدعوهم للتفكير والتأمل. خطبه في المسجد مليئة بالحكمة والنصائح القيمة، ويستخدم فيها أمثلة من القرآن والسنة وقصص الأنبياء لتوضيح مبادئ الدين وأخلاقه."}, {"type": "p", "text": "النارودي يعيش في بيت صغير بالقرب من المسجد، محاط بحديقة مزهرة يعتني بها بنفسه. يحب الخلوة والتأمل فيما أبدع الخالق العظيم، ويقضي ساعات طويلة في القراءة والدراسة. ومع ذلك، فهو دائمًا متاح لأهل القرية، يقدم لهم المشورة والنصح بحب واهتمام."}, {"type": "p", "text": "داخل قلبه، يحمل النارودي إيمانًا عميقًا بالله وحبًا كبيرًا للعلم. مشاعره متوازنة بين الهدوء والسكينة، وبين القلق والمسؤولية تجاه تلاميذه، وخاصة منصور."}, {"type": "p", "text": "يرى فيه شابًا واعدًا ويأمل أن يصبح عالماً وداعية يخدم المجتمع كما فعل هو."}, {"type": "p", "text": "نشأ النارودي في أسرة متدينة تهتم بالعلم والدين. منذ صغره، كان يظهر نبوغًا وتفوقًا في الدراسة، ما جعله يتلقى تعليمًا دينيًا مكثفًا. ارتحل إلى عدة مدن بحثًا عن العلم، حتى أصبح مرجعًا دينيًا ومعلمًا محترمًا."}, {"type": "p", "text": "في تعامله مع الآخرين، يظهر النارودي رقة ولطفًا، مما يجعله محبوبًا بين الناس. يتفاعل مع تلاميذه بحب واهتمام، وينصحهم ويوجههم كأب حنون. ومع منصور، يكون أكثر حزمًا وصرامة، مؤمنًا بأن هذا الشاب لديه قدرات كبيرة ويحتاج إلى توجيه سليم لتحقيقها."}, {"type": "p", "text": "خلال السنوات، تطور النارودي من طالب علم صغير إلى عالم كبير ومعلم محترم. تعلم من تجاربه كيف يكون صبورًا وحكيمًا، وكيف يقدم علمه بحب وتفانٍ. رغم تحديات الحياة، لم يفقد النارودي أمله في أن يرى مجتمعه ينمو ويتقدم بفضل العلم والدين."}, {"type": "divider"}, {"type": "p", "text": "كان النارودي يشعر بالقلق وهو يراقب منصور يتقدم في سلوك الطريق واتباع نهج العلم، عيناه العميقتان تنظران إليه بحب وحزم، مدركًا أن هناك مسؤولية كبيرة على عاتقه."}, {"type": "p", "text": "ولكن كيف ستتغير الأمور بعد هذه اللحظة؟"}, {"type": "p", "text": "يذكر منصور تلك الذكريات التي جمعته بالشيخ النارودي ومن بينها تلك:"}, {"type": "p", "text": "مع اقتراب صلاة الفجر، بدأ النارودي في تحضير درسه الجديد. لم يكن يعلم أن هذا اليوم سيحمل معه أحداثًا غير متوقعة، وأن منصور سيواجه تحديًا جديدًا. وبينما كانت أصوات المصلين تتردد في المسجد، بدأ النارودي يشعر بأن هناك شيئًا أكبر ينتظرهما. كان عليه أن يكون مستعدًا لما سيأتي، لأن هذه الرحلة كانت فقط بداية لما سيحدث لاحقًا."}, {"type": "p", "text": "في تلك اللحظة، في مكان بعيد، كان المسيح الدجال يراقب كل خطوة يقوم بها النارودي ومنصور."}, {"type": "p", "text": "عيناه المتوهجتان تلمعان بالشر، وجسده محاط بهالة من الغموض والرهبة."}, {"type": "p", "text": "كان يعلم أن النارودي كان على وشك اكتشاف السر الذي خبأه لقرون. ولكن، هل ستكون الحكمة والمعرفة كافيتين لمواجهة الشر القادم؟"}, {"type": "p", "text": "لقد أخبرتك عزيزي القارئ من قبل ان الحياة ستفاجئك كثيرا، فلابد أن تكون مستعد."}, {"type": "p", "text": "فقد كان هناك سر غامض يحمله النارودي ولم يفصح عنه وأنت ظننته رجل مر مرور الكرام، ولم يكن له تأثير في مجريات الأحداث، ولا ندري ربما كان محور القضية، وسر كبير، ربما هو ما أودى بحياته في ظروف غامضة، فالمسيح الدجال رغم قيده تصله جميع الاخبار؛ فالدابة التي تدعى الجساسة تتجسس لتنقله الاخبار من أي مكان، ولكن بعض الأشياء لم يكن لتصل إليها يده ومن ضمنها شيء ما خبئه الشيخ النارودي وأضمره مخافة أن ينكشف،"}, {"type": "p", "text": "فهل سنعرف ذلك الشيء مستقبلا؟"}, {"type": "p", "text": "وما علاقة النارودي بالمسيح الدجال؟"}, {"type": "p", "text": "ولماذا انتهت حياته في غموض؟!"}, {"type": "p", "text": "لعلنا نعرف إجابة تلك الأسئلة عما قريب عزيزي القارئ؛ فلتحضر فنجان قهوتك ونكمل القصة مع الشيخ علاء الدين في مدينة قونيا:"}], "section": "story"}, {"id": 29, "title": "ثم فتنة؛ لا تدع بيتا إلا دخلته (2/4)", "paras": [{"type": "divider"}, {"type": "divider"}, {"type": "p", "text": "قونيا"}, {"type": "p", "text": "وفي صباح يوم جديد كانت الطرقات مزدحمة جدا والباعة أطراف الطريق في كل ركن وجانب؛ وكان هناك بعض الرجال الذين يرتادون ثيابا تبرهن على أنهم دراويش."}, {"type": "p", "text": "كانوا يتجهون ناحية المسجد للاستماع إلى علاء الدين وهو يعطي الدروس عن الملاحم والفتن، وكان الناس يجتمعون عليه من مشارق الإرض ومغاربها."}, {"type": "p", "text": "ها قد انتهى درس اليوم وهم الجميع بالخروج إلا رجل واحد ظل منتظرا لعلاء الدين وعندما فرغ المسجد من الناس إلا قليلا جاء ذلك الرجل وجلس بين يديه وألقى عليه السلام فرد عليه السلام في ترحيب وسأله عن حاله فأجابه قائلا:"}, {"type": "p", "text": "أنني لا تائه في أحوالي ومشتت وضائع، أريد التقرب من الله ولكي لا ادري كيف أسير، لقد قصرت كثيرا في العبادة؛ تهت وتاهت مذاهبي."}, {"type": "p", "text": "علاء الدين: الله أقرب لك من حبل الوريد، ادع الله كثير بالثبات على الطريق، والزم كتاب الله وسنة نبيه ولن تضل ابدا."}, {"type": "divider"}, {"type": "p", "text": "خرج علاء الدين من المسجد وقرر أن يطوف حول المدينة؛ وعندما وصل النهر جلس بجوار شجرة أمام الشط، وأخذ يتأمل البحر حتى غلبه النعاس، فرأى في نومه أنه في صحراء شاسعة ومن بعيد ينظر ضوء يتجلى حتى أقترب منه."}, {"type": "p", "text": "وعندما كان قاب قوسين أو أدنى منه تضائل الضوء حتى ظهر رجل عجوز واقترب منه فقال له:"}, {"type": "p", "text": "يا علاء هناك من يبحث عنك ليرتوي من بحر صحبتك."}, {"type": "p", "text": "فقال علاء: ومن يكون ذاك الذي يبحث عني."}, {"type": "p", "text": "فرد عليه قائلا: إنه ذلك الذي تبحث عنه؛ فما تبحث عنه يبحث عنك."}, {"type": "p", "text": "وفجأة اختفى الضوء حتى اختفى، ثم استيقظ من نومه على صوت بعض أطفال يلعبون؛ ثم قام من مكانه وذهب لمنزله."}, {"type": "divider"}, {"type": "p", "text": "في وسط البلدة وفي الشارع الخلفي حيث الأصوات الصاخبة والرجال تترنح خارجة من حانة قديمة في المنطقة وفي خضم تلك الفوضى نسمع بعض الكلمات التي تخرج من الزبائن أمثال:"}, {"type": "p", "text": ": هات كأسان من النبيذ إيها النادل فنحن عطشى."}, {"type": "p", "text": "وكان هناك رجل جالس في ركن بعيد، يجلس وحيدا وبيده زجاجة النبيذ التي قارب على الانتهاء يطلب غيرها، حتى أحضر له النادل واحدة اخرى فقال له الرجل:"}, {"type": "p", "text": "خذ هذا البقشيش وضعه في أغواه هؤلاء الثرثارون، أريد أن أجلس طيلة بهدوء؛ يا هذا حذرهم فأنا لم أقتل طيلة نهار اليوم."}, {"type": "p", "text": "لقد ذهب النادل لطاولة هؤلاء الرجال وأخبرهم أن يخفضوا أصواتهم لكي لا يزعجوا من في الحانة."}, {"type": "p", "text": "لقد انتفض بعضهم لم سمع من النادل ذلك وصاحوا أكثر وقد وجهوا الشتائم لكل الموجودين بالحانة ."}, {"type": "p", "text": "زادت الضوضاء والثرثرة فاشتد غضب ذلك الرجل؛ فقام وذهب إلى زعيمهم ثم وبلا مقدمات صفعه على وجهه، فقاموا جميعهم يتعاركون معه ولكنه قدر عليهم."}, {"type": "p", "text": "كان ذلك هو الرجل السكير الذي كان كلما قابل الشيخ علاء الدين سخر منه ولكنه في الآونة الاخيرة أصبح هادئ ولا يتكلم كثيرا فقد تغير فجأة"}, {"type": "p", "text": "وذلك عندما حدث له ما جعله يستشعر صدق الشيخ وصدق كلامه وذلك لأحداث ومواقف حدثت معه بعدها، فاثر الصمت من حينها وشعر بالذنب تجاه الشيخ."}, {"type": "p", "text": "ولقد كان الدافع الكبير على شعورة بالذنب هو سماحة أخلاق الشيخ وطول باله، فلم يرد عليه إلا بقوله سلاما لا نبتغي الجاهلين."}, {"type": "p", "text": "نعم فهو الان يعرف أنه كان جاهلا؛ ولكنه الان يريد أن يتعرف على الشيخ أكثر."}, {"type": "p", "text": "«إياز» رجل سكير لا مأوى له ولا مستقر، ينام نهارا ويهيم ليله بالحانات ليتسكع، رجل طويل ذا نحف، يقارب الثلاثين من العمر، ذا بشرة بيضاء تميل للحمرة بعض الشيء، غالبا ما يجلس وحيدا في كأبه وحزن، فلا أحد يعرفه ولا هو يعرف أحد من الناس، توفي أبويه وهو صغير ولم يرهما فقبع في ملجأ المدينة ثم لما شب قليلا هرب منه؛ نتيجة القسوة التي لقيها في صغره هناك، ثم استقر في قريته قونيا بالقرب من مكان علاء الدين."}, {"type": "p", "text": "لما كبر وترعرع في تلك القرية قابل فتاة وأحبها وكان يعمل ليل نهار لكي يتزوج بها، ولكنها تركته من أجل شخص أخر؛ يقال إن ذلك هو السبب الذي جعله سكير لا هدف له سوى السكر والتجوال. ---"}, {"type": "divider"}, {"type": "p", "text": "وصل الشيخ المسجد وبعدما صلى بالناس استأنف القصة؛ ويشرح حديث النبي صلى الله عليه وسلم الذي يتكلم عن عمود الكتاب."}, {"type": "p", "text": "فماذا يكون عمود الكتاب وما علاقته بأرض الشام؟"}, {"type": "p", "text": "حتما سنكتشف إجابات الأسئلة في السطور القادمة فلتحضر فنجان قهوتك اللذيذ ولتكمل القراءة."}, {"type": "p", "text": "الإيمان بأرض الشام"}, {"type": "p", "text": "ها نحن الان نعيش ما اخبر عنه نبينا الكريم من كثرت الفتن، إنها كقطع الليل المظلم، يمسى الرجل مؤمنا ويصبح كافرا، فما نشهده اليوم لدليل دامغ على صدق النبوة وهو دليل آخر على طيب أرض الشام وبالأخص فلسطين تلك الأرض المقدسة، فما نشهده اليوم من القتال والمقاومة على الثغور والدفاع عن الوطن والأرض، لهو ان شاء لله اللبنة الاولى لعودة الايمان الكامل لتلك البلاد ولا شك في ذلك فقد ذكر الرسول صلى الله عليه وسلم أن بلاد الشام هي بلاد الإيمان."}, {"type": "p", "text": "فهي لا شك أرض الأنبياء ومهبط الرسالات فعدنها أبتدأ الأمر وعندها سوف تنتهي النهاية؛ فقد خصها الله بمناقب عظيمة، وشرفها أيما تشريف."}, {"type": "p", "text": "فها نحن ننظر إلى مسجد قونيا الكبير والناس قد اجتمعوا من جميع النواحي حيث يستمعون ما يسكبه ذلك الشيخ من عسل مصفى من الأفكار والمعرفة في كؤوس عقولهم المتلهفة للعظة والإرشاد والعلم فبدا وقورا وبدأ يسرد لنا من ذلك عبرة:"}, {"type": "p", "text": "بينما كان النهار ينسحب ببطء، ونحن جلوس عند رسول الله صلى الله عليه وسلم، تلك اللحظات التي تمتلئ بأسرار السماء وأحاديث النور. جلسنا نستمع إلى النبي الذي كان يروي لنا رؤيا رأتها عينه المباركة في المنام، رؤيا تحمل في طياتها إشارات ودلالات عميقة."}, {"type": "p", "text": "قال النبي بصوته الهادئ الذي ينبض بالحكمة: \\\"إنِّي رَأيتُ كأنَّ عَمودَ الكِتابِ انتُزِعَ مِن تَحتِ وِسادتي، فأَتبَعْتُه بَصري، فإذا هوَ نورٌ ساطِعٌ، عُمِدَ به إلى الشَّامِ.\\\" كانت كلماته كقصيدة تروي لنا مشهدًا من عالم آخر، حيث الكتاب، أي القرآن والإيمان، ينتقل من موضعه تحت وسادة النبي، مشعًا بنور ساطع، متجهًا إلى الشام."}, {"type": "p", "text": "توقف النبي للحظة، ثم واصل حديثه، موضحًا ما رآه: \\\"إنَّ عَمودَ الكِتابِ\\\" -أي الإيمان أو الدين كله، العمود الذي يُعتمد عليه، وهم حَمَلة الكتاب والقائمون به- \\\"انُتْزِعَ\\\"، مما يشير إلى قوة وعزم في الأخذ، \\\"من تَحْتِ وِسادَتي، فأتْبَعْتُه بَصَري\\\"، راقبه النبي بعينه الكريمة حتى يرى إلى أين يذهب، \\\"فإذا هو نورٌ ساطِعٌ، عُمِدَ به إلى الشامِ\\\"."}, {"type": "p", "text": "كانت الشام في تلك الرؤيا مقصد النور، المكان الذي سينتقل إليه الإيمان في زمن الفتن. الشام التي تضم سوريا والأردن وفلسطين ولبنان، ستصبح عقر دار المسلمين حين تعصف الفتن ببقية البلاد. وهذا يعني أن الإيمان سيجد ملاذًا في الشام، حيث سيستقر الأمن والإيمان في آخر الزمان."}, {"type": "p", "text": "ثم أكمل النبي، محذرًا ومنبهًا: \\\"ألَا وإنَّ الإيمانَ -إذا وَقَعَتِ الفِتَنُ- بالشامِ.\\\" في هذا الكلام إشارة إلى أن الإيمان سينتقل إلى الشام عندما تعم الفتن بلاد المسلمين، كأنها دعوة لنا جميعًا للتوجه إلى ذلك الملاذ الآمن عند اشتداد الأزمات."}, {"type": "p", "text": "وفي حديث النبي هذا، نجد البيان الواضح لعلامات القيامة والفتن التي ستسبق اليوم الموعود. إنه حديث يحمل في طياته تحذيرات ودروسًا، يرشدنا إلى التمسك بالإيمان والبحث عن النور في أوقات الظلام. كان النبي يعطينا مفتاح البقاء والثبات في وجه الفتن، مشيرًا إلى الشام كحصن للإيمان، ملاذ للمؤمنين الذين سيجتمعون هناك في نهاية الزمان."}, {"type": "p", "text": "كانت كلماته كضوء القمر في ليلة مظلمة، ترشدنا وتضيء لنا الطريق، تجسد لنا الشام كأرض مقدسة، ملاذ آمن، ومعقل للإيمان، حين تصبح الدنيا مسرحًا للفوضى والفتن. وبذلك، كان النبي صلى الله عليه وسلم يضع لنا خارطة النجاة، ويعلمنا كيف نواجه الأيام القادمة بقلب مطمئن ونفس مؤمنة، نبحث عن الأمان حيثما يكون الإيمان."}, {"type": "divider"}, {"type": "p", "text": "كل ذلك وغيره دل حتما على أن الشام هي موطن الإيمان عندما يقل ويضمحل في العالم تدريجيا."}, {"type": "divider"}, {"type": "p", "text": "لقد انتهى الشيخ علاء الدين اليوم وذهب لمنزله كما العادة ولكنه في أثناء الطريق قد غير وجهته اليوم وذهب لمنطقة متحف مولانا^48 لكي يجلس هناك عند ضريح جلال الدين الرومي."}, {"type": "p", "text": "ثم لنذهب نحن في رحلة لمدينة أنقرة مسقط رأس منصور لنرى ماذا حدث فإذا كنت متشوقا عزيزي القارئ لمعرفة الأحداث فأنصحك بكوب قهوة معد على مهل يجعل تركز لتستأنف القراءة."}, {"type": "p", "text": "مدينة أنقرة:"}, {"type": "p", "text": "لم يسافر منصور بعدما علم بموت شيخه بل بقي لمدة ثلاث ليال قبل أن يغادر صوب قونيا، وقد كان حزينا على موت شيخه جدا؛ الذي قضى معه من الوقت ما أكسبه الكثير، وتعلم منه أكثر، وقد كان مرشده الروحي في تلك الخلوة التي أخذت 40 يوما؛ لن ينسى منصور تلك الذكريات ابدا."}, {"type": "p", "text": "قد تذكر بعض من كلام شيخه له حيث قال ذات مرة:"}, {"type": "p", "text": "إنما هذه الحياة ما هي إلا رحلة تتزود منها لرصيدك الروحي؛ يا منصور إن أردت أن تدرك حقيقة ذلك الكون وما فيه من بعض أسراره فعليك أن تفتش في ذاتك فإذا وصلت لكنهها أدركت كينونة ذلك الكون البديع؛ فأنت العالم المصغر، والكون عالم أكبر، كما قال الإمام علي \\\" وقد انطوى ليك العالم الأكبر\\\"."}, {"type": "p", "text": "ها قد ودت منصور دياره بحزن واستعد ليفتح صفحة جديدة من صفحات الحياة في مكان أخر، لقد خرج من تلك البلدة التي عاش بها صغره، جميع الذكريات هنا؛ حلوها ومرها، جميع اللحظات الممتعة، أولئك الطيبين الطاهرين الذين قابلتهم، وهؤلاء الفسقة، الخير والشر، تلك الأماكن والحواري، مساجدها وروادها؛ جل تلك الذكريات لن ينسى."}, {"type": "p", "text": "كانت الشمس تغرب في عين حمئة وكانت الصحراء كبحر من الرمال لا يرى أخره، غربت الشمس وجن الليل وتطوع القمر لينير عتمة الأماكن والطرقات."}, {"type": "p", "text": "قرر منصور أن يتوقف هنا، في ذلك المكان الذي خيم الليل عليهم فيه هو وهذان الرجلان اللذان ذهب برفقتهما."}, {"type": "p", "text": "من بعيد وجدوا شجرة على جانب الطريق ففرشوا أمتعتهم هناك وكانت بجانب بركة مياه عذبة، فحمدوا الله على ذلك، ولما شربوا وملئوا قربهم ذهبوا للنوم."}], "section": "story"}, {"id": 30, "title": "ثم فتنة؛ لا تدع بيتا إلا دخلته (3/4)", "paras": [{"type": "divider"}, {"type": "p", "text": "ما أن وضع منصور رأسه على وسادته حتى تذكر الماضي؛ صديقة أمير، وتلك الذكريات التي قضوا معظمها في الترحال والتواجد بالصحاري."}, {"type": "p", "text": "فتذكر عندما قال له:"}, {"type": "p", "text": "يا منصور هل تظن أن يأتي وتفرقنا الدنيا ومشاغلها قبل الموت؟!"}, {"type": "p", "text": "نظر إليه منصور في ملامح هادئة وقال:"}, {"type": "p", "text": "يا أمير إن كانت القلوب مترابطة برباط الود فلن نفترق ولو فرقت الماديات بيننا؛ فإن تباعدت الأبدان فالقلوب عند بعضها."}, {"type": "p", "text": "بعدها تنهد منصور وأخذ شهيقا وهو ينظر للنجوم ثم أشار إلى نجمتين متجاورتين ثم قال:"}, {"type": "p", "text": "أنا وانت كمثل هاتين النجمتين؛ إن باعد بيننا النهار فإن الليل يطوينا تحت رايته."}, {"type": "p", "text": "وإذ به في غمرات التفكير هذه باغته أحد أولئك الرجلان فجأة بندائه:"}, {"type": "p", "text": "يا منصور؛ لمَ أراك شارد الذهن هكذا فلا أنت بنائم ولا بمستيقظ؟!"}, {"type": "p", "text": "فرد عليه منصور قائلا: لا شيء، فقط تذكرت صديقا لي كان مرافقا لي في كل أسفاري."}, {"type": "p", "text": "قال الرجل: لا بئس عليك؛ تذكره بقلبك تطمئن وخذه في دعائك."}, {"type": "p", "text": "قال منصور: أفعل دائما ولكن الذكريات تؤلم"}, {"type": "p", "text": "قال ذلك الرجل بنبرة إشفاق:"}, {"type": "p", "text": "لا ضير، فإن ألم الفراق له حلاة؛ وحلاوته أنه يذكرنا إلا نتعلق إلا برب الناس، وإننا مهما أحببنا، فحتما يوم سيأتي ونفارق."}, {"type": "p", "text": "نظر إليه منصور في أسى وقال:"}, {"type": "p", "text": "\\\" أحبب من شئت فإنك مفارقه\\\""}, {"type": "p", "text": "ثم قال الرجل:"}, {"type": "p", "text": "نقيم هنا الليلة من الغد باكرا بعد الفجر ان شاءلله."}, {"type": "divider"}, {"type": "p", "text": "جلس إياز وقد أرهقه التعب وأسند رأسه إلى حائط وفي يده زجاجة الخمر، فغلبه النعاس ونام للحظات خلف الحانة، قبل أن يستيقظ على صوت أحد الجيران؛ رجل عجوز يسكن بذلك المنزل خلف الحانة ويكره تلك الحانة ومن بها من رائحة الخمر النتنة التي تصل لأنفه كل مساء عندما يجلس في شرفته فكان يلقي ببعض القاذورات وبقايا الطعام ويصيح على إياز قائلا :"}, {"type": "p", "text": "أذهب من هنا أيها السكير"}, {"type": "p", "text": "رد عليه قائلا:"}, {"type": "p", "text": "لو قمت لأهشم رأسك بتلك الزجاجة إيها العجوز."}, {"type": "p", "text": "ولما زاد صياح العجوز أكثر أشتد غضب إياز وأمسك بزجاجته وألقاها نحو نافذة الرجل، فارتطمت بالحائط؛ فسكت الرجل وأغلق نافذته وذهب للداخل فورا ذلك."}, {"type": "p", "text": "بعدها قام إياز وانطلق إلى الحانة."}, {"type": "p", "text": "طال السفر بمنصور ومن معه، وقد قضوا في رحلتهم تلك ثلاثة إيام بلياليها ولم يصلوا بعد."}, {"type": "p", "text": "عندما أدركهم التعب والعطش أراد أحدهم أن يتوقفوا في مكان كان به بعض الشجيرات التي تظلهم من الشمس ولكن ذلك المكان لم يكن به أي أبار؛ فأقترح منصور أن يتحاملوا على أنفسهم قليلا لمكان به بئر يبعد من هنا تقريبا ميل"}, {"type": "p", "text": "لعلمه بذلك مسبقا عندما كان يتاجر في البلاد ويخرج للصحاري ويتعامل مع الخلق فعرف بالتقريب مكان بئر الماء، أو على الأقل يجدوا مكانا به سكن."}, {"type": "p", "text": ". لقد ظلوا يسيرون إلى أن وصلوا عن أهل قرية طيبين رحماء، لما رأى القوم ما بهم من فاقة وعطش، قد أحضر لهم الماء حتى ارتووا وملئوا قربهم جميعا، وقرروا البقاء هنا حتى الصباح."}, {"type": "p", "text": "جن الليل وخيم الظلام على أهل القرية وبينما يجلس منصور رافعا بصره اتجاه السماء يدع الله بتيسير الحال وأن يصلوا بسلام، ثم أخذ يحدث نفسه قائلا:"}, {"type": "p", "text": "من ذا يكون ذلك الرجل الذي بت الان أشعر بدنوه مني أكثر، تراه من يكون ولما يأتيني في حلمي دائما وقد زاد ذلك أثناء تلك الرحلة."}, {"type": "divider"}, {"type": "p", "text": "لنعود مرة ثانية للشيخ علاء الدين في قونيا :"}, {"type": "p", "text": "وعلى الجانب الاخر حيث نسيم الهواء العليل في ليلة هادئة كان علاء الدين جالسا في خلوته، ويكأنه يستمع لكلام منصور فيقول:"}, {"type": "p", "text": "حتى أنا لا أري من أنا، وليس الناس فحسب، أجلس أحيانا بالساعات أفكر، ما يكون ذلك الهاجس الذي يراودني، هل لذلك الأمر من تفسير!؟"}, {"type": "p", "text": "فيقول منصور: لا اعلم كيف يشتاق القلب لهذا الحد لكيان لا أعلمه، كل ما أعلمه الان أن ذلك يستحق أكثر من مجرد السفر."}, {"type": "p", "text": "خرج علاء الدين لانتظار صلاة العصر، ثم لما انتهى أخذ يحدث الناس عن ما بدأ وقد أستأنف مبتدأ ببيت المقدس، فتحدث عن تاريخه ورجاله وبعض الإحداث التاريخية، ويحاول أن يربط الماضي بالحاضر وأسقاط التاريخ على الواقع لأخذ العبرة والعظة؛ وتحدث عن أهل غزة وذلك الرباط العجيب وتلك الرسائل الايمانية التي يرسلونها لكل الدنيا ."}, {"type": "p", "text": "رباط اهل غزة"}, {"type": "p", "text": "وسر ذلك الثبات العجيب."}, {"type": "p", "text": "ها أنت تنظر من بعيد لتسمع دوي القنابل الموقوتة على رقعة جغرافية"}, {"type": "p", "text": "صغيرة تبلغ 365 كم مربع، مساحة صغيرة تسع لـ٢ مليون إنسان،"}, {"type": "p", "text": "تحملتهم تلك الأرض الطيبة، ذلك الشعب العجيب الذي ضرب لنا أروع الأمثلة في الثبات واليقين والعقيدة، تقف على شواهد الإبادة فترى بعينيك وتسمع كل رجفة طفل فقد أمه، كل أب وأم فقدا أبنائهما، كل عائلة تحطمت وتشردت، جماعة أفراد لا يبقى منهم سوى أنسان."}, {"type": "p", "text": "كيف لشخص فقد كل عائلته أن يفرح وبأي شيء يفرح، لا شيء؛ فالدار تهدمت والعمل فقد والعائلة ماتت."}, {"type": "p", "text": "نرى ونسمع صوتهم من تحت الأنقاض، ما أقسى القلوب، وما أشد نفورها، فنحن في زمن يعدو فيه الأخ على أخيه لأجل داية زائفة دنية."}, {"type": "p", "text": "ولا استغراب بعد ذلك أن فتك بك الغريب، فعندما وقفت لتشاهد مصرعه وهو يناديك بعلو صوته:"}, {"type": "p", "text": "يأ أخا العروبة والدين إين أنا من إيمانك، لأن فرطت فيَّ وبعتني لكلاب الأزقة والحواري، بل ألقيت بي في بئر الضياع وما شاهدت شفقت منك للرحم والعرض والشرف والنخوة......... والعروبة؛ يا أخا العرب."}, {"type": "p", "text": "ها أنت ذا تملك القرار ولكنك عاجز، بل تظن نفسك مالك امرك وأنت مملوك فقد بعت نفسك واشتريت عارك ليلزمك أبدا الحياة حتى الموت، وبعد البرزخ يفصل بيننا ربنا وهو العدل العزيز."}, {"type": "p", "text": "يا أخي عندما تمشي على قدميك وتسمع تلك الأصوات التي مصدرها الأنقاض ألا تشعر بوخزة في قلبك، منا من غطا النقض حتى انحبست أنفاسه، ومنا من سقط الردم على رأسه فمات فورها، والأشد من ينتظر ليأتي أحدهم مادا يد النجدة لكي ينتشله من بين الركام."}, {"type": "p", "text": "ومنا من مات جوعا وعطشا."}, {"type": "p", "text": "كل ذلك وما حدث وما سيحدث وما تجد على ألسنتهم إلا الثبات العظيم على العقيدة."}, {"type": "p", "text": "لقد أخبر النبي عن صلى الله عليه وسلم، عن رباط أهل غزة وفلسطين:"}, {"type": "p", "text": "حَدَّثَنَا أَحْمَدُ بْنُ النَّضْرِ الْعَسْكَرِيُّ، ثنا سَعِيدُ بْنُ حَفْصٍ النُّفَيْلِيُّ، ثنا مُوسَى بْنُ أَعْيَنَ، عَنِ ابْنِ شِهَابٍ، عَنْ فِطْرِ بْنِ خَلِيفَةَ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: أَوَّلُ هَذَا الْأَمْرِ نُبُوَّةٌ وَرَحْمَةٌ، ثُمَّ يَكُونُ خِلَافَةً وَرَحْمَةً، ثُمَّ يَكُونُ مُلْكًا وَرَحْمَةً، ثُمَّ يَكُونُ إِمَارَةً وَرَحْمَةً، ثُمَّ يَتَكادَمُونَ عَلَيْهِ تَكادُمَ الْحُمُرِ فَعَلَيْكُمْ بِالْجِهَادِ، وَإِنَّ أَفْضَلَ جهادِكُمُ الرِّبَاطُ، وَإِنَّ أَفْضَلَ رباطِكُمْ عَسْقَلَانُ. ....."}, {"type": "p", "text": "وغزة بالنسبة لعسقلان كالمدينة للولاية، فغزة جزء من عسقلان وعسقلان جزء من فلسطين."}, {"type": "p", "text": "فهنا يخبر النبي صلى الله عليه وسلم أن أفضل الرباط رباط عسقلان وصدق فيما أخبر عن ربه فقال وقوله حق."}, {"type": "p", "text": "دعنا ننتقل لمنصور لنعرف الأحداث فقد أنطلق ذاهبا لمدينة قونيا تاركا كل شيء عرفه خلف رأسه؛ وفي طريقهما احداث كثيرة واناس وبلدان وأماكن لم يعرفها من قبل."}, {"type": "p", "text": "فإذا كنت تفضل معرفة تلك التفاصيل فتابع القراءة في ذلك الفصل وإن لم تكن مهتما فمررها مرور الكرام:"}, {"type": "divider"}, {"type": "p", "text": "جيحان- تركيا"}, {"type": "p", "text": "جيحان هي أحد المدن التابعة لمنطقة أضنة في تركيا وأحد الموانئ المهمة على البحر المتوسط."}, {"type": "p", "text": "يقدر عدد سكانها بحوالي 178000 نسمة."}, {"type": "p", "text": "وهي مسماة على اسم النهر الشهير الذي يمر فيها وهو نهر جيحان أحد الأنهار التي هي من الجنة كما ورد في الحديث الشريف :"}, {"type": "p", "text": "عن أبي هريرة -رضي الله عنه- قال: قال رسول الله -صلى الله عليه وسلم-: \\\"سيحان وجيحان والفرات والنيل كل من أنهار الجنة\\\""}, {"type": "divider"}, {"type": "p", "text": "اشرقت الشمس وقام الناس كلٌ في معايشه، وكان من بين أولئك القوم رجل يدعى «عزيز» وهذا الرجل له أرض بتلك القرية، وهو يقتات منها حيث هي مصدر الرزق بالنسبة له، وتلك الأرض التي جلس منصور ومن معه قربها، فلما رآهم ألقى السلام ثم قال:"}, {"type": "p", "text": "ممن القوم وما الغاية."}, {"type": "p", "text": "نظر إليه منصور ثم أجابه قائلا:"}, {"type": "p", "text": "نحن من أنقرة وكنا قاصدين قونيا."}, {"type": "p", "text": "بعد ما سمع منهم انهم يريدون مدينة قونيا أخبرهم أنها قريبة منهم سوف يصلون في غضون يومين إن جدوا السير."}, {"type": "p", "text": "كان ذلك الرجل طيب القلب فرحب بهم وحلف عليهم إلا ينزلوا ببيته."}, {"type": "p", "text": "اشرقت الشمس وقد استيقظ عزيز ثم جاء فجرا يوقظهم لصلاة الصبح، ولكن كعادة منصور فهو لا ينام الليل إلا قليلا."}, {"type": "p", "text": "نظر إليه عزيز وقال له:"}, {"type": "p", "text": "ألا توقظ أصدقائك للصلاة؛ أنت الوحيد الذي أراك مستيقظا وهم نائمون."}, {"type": "p", "text": "أجاب منصور:"}, {"type": "p", "text": "بلى قد قاموا وصلوا ثم ناموا وبقيت."}, {"type": "divider"}, {"type": "p", "text": "في وسط النهار تخرج تلك الفتاة الجميلة التي تدعى «أسمراء» ابنت عمدة بلدية المقاطعة التابع لها تلك المدينة؛ وذلك في سوق البلد المزدحم بالناس والتجار والباعة والبضائع من كل صنف ولون."}, {"type": "p", "text": "قد تقابل خلال اليوم أكثر من مرة صدفة، فسألته عن ما يكون؟!"}, {"type": "p", "text": "نظر إليها منصور ولم يتحدث ثم أمسك ببعض الورد وأعطاها لها وقال:"}, {"type": "p", "text": "أنا سيدتي تلك الزهور المهجرة من بساتينها قلبا وعقلا وتاهت وتشتت جزء منها في كل بستان اخر."}, {"type": "p", "text": "نظرت هي إليه نظرة أعجاب بكلامه البليغ ثم قالت:"}, {"type": "p", "text": "ما اسمك؟"}, {"type": "p", "text": "فأجاب منصور: اسمي منصور يا سيدتي..... أتمنى ألا أكون قد أزعجت مولاتي من غير قصد"}, {"type": "p", "text": "فقالت: لا داعي لقول ذلك ان حللت ضيفا عندنا، استمتع بإقامتك ورحلتك."}, {"type": "p", "text": "ثم همت بالرحيل، أعجب منصور بحسن تعاملها وزوقها وأدبها في الحوار؛ لم تك تلك هي عادات القرية التي ولد بها فإن النساء لا يخاطبن الرجال، ولكن هنا الأمر مختلف؛ وقد قسم مجتمع جيحان إلى طبقات، العبيد والعمال، والوجهاء والسادة والملاك، والنساء أيضا تقسم فهنا يوجد الشريفات العفيفات ويجد الإماة والبغايا."}, {"type": "p", "text": "لكل مكان عاداته وتقاليده، وأيضا سياسته."}], "section": "story"}, {"id": 31, "title": "ثم فتنة؛ لا تدع بيتا إلا دخلته (4/4)", "paras": [{"type": "divider"}, {"type": "p", "text": "أكمل منصور متجولا بين الأسواق والأزقة واذ به يرى زحاما شديدا وكثير من الجنود، بعد قليل اتضح أنه موكب لعمدة المقاطعة التابع لها تلك المدينة."}, {"type": "p", "text": "ولكن ليس ذلك الشيء الغريب؛ الذي راه بعدها؛ بعضا من الجنود ممسكين بفتاة، وبعض الرجال مكبلون بالحبال."}, {"type": "p", "text": "سأل منصور إحدى الرجال الواقفون بجانبه فقال له:"}, {"type": "p", "text": "هؤلاء قد تأمروا على العمدة، فكانوا يريدون قتله وهم إيضا ليس من المدينة بل من خارجها."}, {"type": "p", "text": "فكر منصور قليلا وقال في نفسه، ربما يبحثون عن كل عابر قد دخل المدينة من غير أهلها يشكون فيه للتحقيق معه اذا نحن في غنى عن ذلك كله علينا بالمغادرة فورا وإن لا سيتحتم علينا التأخر عن الذهاب للمدينة في الوقت المحدد."}, {"type": "p", "text": "أكمل منصور طريقه وكان كلما مرة بزاوية رأى من الغرابة والعجائب مالم يره قبل ذلك، هنا أماكن لم يكن يعتقد بوجودها."}, {"type": "p", "text": "كان من ضمن ما رأى ذلك النادي الذي يلهوا الناس فيه ويتجرعون الخمر وغيرها."}, {"type": "p", "text": "قد ابتعد منصور عن مكان تجمعه متاعه فقرر العودة محاولا اتخاذ طريق مختصر واخبار الرجلان معه إنهما لابد أن يجد السير الان."}, {"type": "p", "text": "وفي أثناء مسيرة إذ رأى من بعيد تلك الحانة على طرف الطريق وذلك الرجل النائم على الارض بجوار الباب لم يلفت انتباهه هذا المكان بقدر ذلك الرجل الذي قد أمد جسده على الأرض وقد غاص بنوم عميق، لا هو بمتسول حتى ينام في الطرقات ولا هو برجل يشبه أولئك السكارى ليتخذ زاوية كهذه ينام فيها، فيبدو عليه بأنه ليس بشحاذ، وكان يبدو عليه التعب والانهاك."}, {"type": "p", "text": "رجل طويل ذا بشرة بيضاء للصفرة، ملابسه ليست مهترئة ولكنها ليست نظيفة، نظر إليه فاستعطف حاله، فقرر أن يتحدث إليه ليفهم قصته؛ فلما أراد الاقتراب منه ولكن فجأة سمع أحدا يناديه من ورائه، فلما التفت وجد أحد الذين معه ينادي عليه يا منصور:"}, {"type": "p", "text": "التفت إليه منصور بانتباه، فلما اقترب اخبره بأن الجميع قد تجهزوا للمغادرة وينتظرون قدومه."}, {"type": "p", "text": "تجهز الجميع وانطلقوا للذهاب، اقترح عليهم منصور الذهاب من نفس طريق الحانة لعله يقابل ذلك الرجل."}, {"type": "divider"}, {"type": "p", "text": "قونيا"}, {"type": "p", "text": "ماذا دهاك يا إياز فإنك لم تشرب اليوم كعادتك؟!"}, {"type": "p", "text": "قال ذلك نادل الحانة بعد أن راه على غير عادته من اللهو والمرح والافراط في الشراب."}, {"type": "p", "text": "رد عليه إياز قائلا:"}, {"type": "p", "text": "أريد أن استفيق، أن أوقظ نفسي وروحي، فقد غرق الجسد في التيه والضلال ولو أن الروح تجاهد في كد لأن تستيقظ من غيبوبة التخبط والضياع هذه."}, {"type": "p", "text": "قال النادل: لم أفهم أصبحت غريبا اليوم إياز!! ماذا أصابك هل فقدت عقلك؟!"}, {"type": "p", "text": "نظر إليه إياز وقال له في نبرة صوت يملئها الهدوء والطمأنينة:"}, {"type": "p", "text": "بلى قد كنت فاقدا عقلي طيلة حياتي إلا الساعة."}, {"type": "p", "text": "ثم قال في تنهيد:"}, {"type": "p", "text": "لا عليك ذلك أمر لا يهمك."}, {"type": "divider"}, {"type": "p", "text": "المسجد الكبير"}, {"type": "p", "text": "عشاء يوم الجمعة"}, {"type": "divider"}, {"type": "p", "text": "جلس الشيخ علاء فافتتح حديثه بدرس وعظي لخمس دقائق ثم استأنف ما كان حدثهم عنه من قبل:"}, {"type": "p", "text": "عودة الخلافة في القدس"}, {"type": "p", "text": "ان النصر وان تأخر فهو قادم وإنه لنصر عزيز، ستتمكن فيه الأمة من جديد وتعود الخلافة لأرض للقدس كما أخبر رسول الله صلى الله عليه وسلم"}, {"type": "p", "text": "عن عبدالله بن زغب قال: نزل علي عبد الله بن حوالة الأزدي فقال لي بعثنا رسول الله صلى الله عليه وسلم لنغنم على أقدامنا، فرجعنا فلم نغنم شيئاً، وعرف الجهد في وجوهنا فقام فينا وقال: اللهم لا تكلهم إلي فأضعف عنهم، ولا تكلهم إلى أنفسهم فيعجزوا عنها ولا تكلهم إلى الناس فيستأثروا عليهم، وثم وضع يده على رأسي أو قال: أعلى هامتي، ثم قال: يا ابن حوالة إذا رأيت الخلافة قد نزلت الأرض المقدسة، فقد دنت الزلازل والبلابل والأمور العظام، والساعة يومئذ أقرب من الناس من يدي هذه من رأسك."}, {"type": "p", "text": "هذا الحديث يبشر أمة محمد صلى الله عليه وسلم بالفتح والنصر القريب في مستقبل أيامها حيث ستكون الخلافة في بيت المقدس مقرا للخلافة الاسلامية في الأيام القادمة."}, {"type": "p", "text": "وفي التعقيب على هذا الحديث يقول العلامة المرحوم الشيخ سعيد حوى: \\\"الظاهر أن الحديث في خلافة تكون عاصمتها القدس وإلى القدس يذهب المسيح عليه السلام بعد نزوله في دمشق وهذا يشير إلى أن فلسطين بيد المسلمين، وأن دولة اليهود الحالية ذاهبة منتهية. فإذا كان المراد في الحديث خلافة المهدي، وهو الاتجاه الأقوى عند العلماء؛ فهذا يدل على أن بيننا وبين المهدي عليه السلام أمداً."}, {"type": "p", "text": "والدليل على أن المراد بالحديث خلافة مقرها فلسطين وعاصمتها القدس؛ أن القرآن الكريم وصف فلسطين بالأرض المقدسة، فقال على لسان موسى عليه السلام (يا قوم ادخلوا الأرض المقدسة التي كتب الله لكم)."}, {"type": "p", "text": "فالأرض المقدسة التي رفضوا دخولها كانت فلسطين، وأن يوشع بن نون لما بدأ تنفيذ أمر سيدنا موسى كان ذلك مرتبط بدخوله أرض فلسطين."}, {"type": "p", "text": "وبلاد الشام إنما تأخذ قدسيتها من كونها محيطة بالمسجد الأقصى، وقال تعالى (سبحان الذي أسرى بعبده ليلاً من المسجد الحرام إلى المسجد الأقصى الذي باركنا حوله)."}, {"type": "p", "text": "فالظاهر من قوله تعالى ان المكان المبارك هو المسجد الأقصى وأن ما حولة مبارك كذلك وله قدسية كبيرة، ولذلك قد حملنا المراد من الحديث على أنه خلافة تكون عاصمتها القدس وقاعدتها أرض فلسطين، ومثل ذلك لم يكن من قبل."}, {"type": "p", "text": "والذي يظهر من ذلك انه سابق على نزول المسيح عليه السلام فالمسيح عليه السلام يأتي للقدس عندما ينزل وهي بأيدي المسلمين، ثم يصلي بها ثم يخرج لمقاتلة الدجال."}, {"type": "p", "text": "وأكثر جنده من اليهود القادمين من الخارج بدليل الحديث الصحيح يخرج مع الدجال سبعون ألفاً من يهود أصبهان عليهم الطيالسة،"}, {"type": "p", "text": "فهؤلاء اليهود القادمين من أصبهان هم الذين سيقاتلون المسلمين وذلك كما في الحديث، وسوف ينهزموا ويفروا اختباءً خلف الحجر والشجر. ولكن الله أنطق عليهم كل شيء إلا الغرقد، وذلك الوقت يكون وقت اخر الزمان وفيه من الخوارق الكثير."}, {"type": "p", "text": "فهذا كله وغيره كثير يدلنا على أن دولة اليهود الحالية غير مستمرة إلى وقت نزول المسيح كما يظن كثيرون، ومما يدل على ذلك أن الحديث الصحيح يبشر بفتح روما، ولم تفتح روما حتى الآن، مما يدل على أن دولة عالمية للإسلام ستقوم، وهذا لم يحدث، ووجودها يتنافى مع بقاء دولة اليهود الحالية في قلب أقطار الأمة الإسلامية، والأمر كله بيد الله تعالى، وإذا أراد الله شيئاً هيأ أسبابه، أما متى تكون هذه الأمور فغيب لا يعلمه إلا الله عز وجل\\\" اهـ."}, {"type": "p", "text": "فلابد أن نعي ذلك الكلام ونستعد لتلك الملاحم، فهذا حديث يجب أن يعلمه كل أنسان مسلم وأن يعلمه أولاده،؛ لكي ننشئ جيل مستعدا لأن يكون في صفوف الإسلام لا في صفوف العدو."}, {"type": "p", "text": "نقول هذا لأننا هذه الأيام وعلى الرغم من حالة الضعف التي نمر بها، وعلى الرغم من كثرة كيد الكائدين لها، وتفريط المفرطين من أبنائها، ويأس اليائسين فيها، وعلى الرغم من استعلاء اليهود واستكبارهم، وعلى الرغم من المكائد الدولية التي تحاك لها من أعدائها، وعلى الرغم من تخاذل المسلمين في هذه الأيام؛ إلا أن رسول الله صلى الله عليه وسلم في هذه الأحاديث الشريفة يبشر الأمة المسلمة بخلافة مسلمة راشدة؛ تكون في فلسطين قاعدتها والقدس عاصمتها، وهذا في الأيام القادمة، وقول رسول الله صلى الله عليه وسلم حق، ووعده أمته صدق، هذا ما أخبرنا به نبينا صلى الله عليه وسلم ونحن نتحدث عنه، وهذا وعد منه صلى الله عليه وسلم للأمة وهو وعد من الله تعالى ولن يخلف الله وعده، ولن تتخلف بشارة الرسول صلى الله عليه وسلم وسيحقق كل ما وعد الرسول صلى الله عليه وسلم في أحاديثه الصحيحة.. هذا ما نقول لأمتنا، وهذا ما نؤمن به، ولا يتم لنا إيمان إلا بذلك، وهو من مقتضى الإيمان بالرسول وتصديقه، فمن صدق خبره فقد آمن به، ومن شكك في خبره فقد شكك في نبوته، والله أعلم."}, {"type": "divider"}], "section": "story"}, {"id": 32, "title": "جيحان- باتجاه قونيا", "paras": [{"type": "p", "text": "وفي وقت ما بعد العصر، وفي جو هادئ تملأه السكينة، الشمس أشاعتها خافتة والغمام يراودها عن ظهور ضوئها المتدلي في خلايا البيوتات وعبر الأزقة والحواري ليرسم لوحة من الجمال والراحة، صوت زقزقة العصافير يداعب اسماعنا ليطربنا بمعزوفة مكتملة الأركان، وننظر إلى ظلال الأشجار المطلة كالغيم المتفرق في الطرق وأمام بعض المنازل، تتلمس أرجلنا حصو وحبيبات التراب المُذْرَات عبر الريح على الأزقة حاملة معها روائح الأطعمة المنبثق من النوافذ."}, {"type": "p", "text": "كنت أمر بين الأزقة مترقبا، فلربما أرى ذلك الرجل فأعرف قصته، وربما نفعه الله بي وأرشده للخير وترك المنكرات لأن شكله لا يوحي بأنه معتاد على ذلك، بل هو الذي أوقع بنفسه وألقى بها في تهلكة الرجز، وأوردها موارد الهلاك، باتباع سبل الضياع؛ بسبب سكرة وابتعاده عن أبواب الايمان."}, {"type": "p", "text": "قد أسأل نفسي لمَ هذا الاهتمام بذلك الرجل، وأنا لا أعرفه كأمثاله من الناس ولكن الشيء الملفت في هذا الرجل:"}, {"type": "p", "text": "هو ذاكم الشعور الداخلي الذي يجمع القلوب، ويجعلك تشعر بتقبل أحدهم لأول مرة لا لشيء قد فعله؛ وإنما لجمال الروح وطيبها رغم قسوة الظروف التي لا تبقى ولا تزر، وعلى العكس من ذلك تماما، عدم تقبل شخص ما بلا جريرة فعلها."}, {"type": "p", "text": "ها قد تجاوزت الحانة ولم ألاحظه، فقلت في نفسي إن كان هناك من أمر قدره الله فسيقع وسوف أراه، ثم أكملنا طريقنا نحو قونيا."}, {"type": "divider"}, {"type": "p", "text": "قد لمح ذلك الرجل الذي راه منصور نائما أمام الحانة هو ومن معه ومعهم متاعهم فانطلق وراءهم يريد أن يعرف إلى أين مقصدهم."}, {"type": "divider"}, {"type": "p", "text": "في ليلة صيفية، هوائها جميل، يدب السكون في أرجائها، والهدوء قد عشعش فوق أغصان الشجر، وتلك الأشجار المظللة على منزل له شرفة مطلة على مساحة خضراء، والأشجار ذات الألوان البديعة وتلك العصافير التي تنشد لحن الجمال."}, {"type": "p", "text": "حتى إذا اقتربنا سمعنا صوتا أنثويا يبعث الطمأنينة في قلب علاء الدين؛:"}, {"type": "p", "text": "انها زوجته «لؤلؤ» تبلغ من العمر 35 عام، قد عاشت طيلة حياتها مع منصور في سعادة، حتى أوقات الحزن والفراق كانت قليلة، فالود ما بينهما متسعه كبير."}, {"type": "p", "text": "- مالي أراك في طبع متغير يا علاء، لمَ يبدو وجهك هكذا ظاهرة عليه علامات التحير؟!"}, {"type": "p", "text": "تلفت لها وقد كان منشغل التفكير ثم قال:"}, {"type": "p", "text": "أشعر بحيرة كبيرة وتشتت، لا أدرى لم أنا كذلك."}, {"type": "p", "text": "ثم نظر ناحية السماء وقال:"}, {"type": "p", "text": "يأتيني هاجز قوي من حين لأخر يشعرني أن هناك شخص ما في مكان ما يريد صحبتي ، كنت اعتقد بأنه حلم لكن بات الان أمرا مستمرا."}, {"type": "p", "text": "ربتت على يديه ثم قالت في حنان وعطف:"}, {"type": "p", "text": "لا تقلق؛ فلعله خير ان شاءلله."}, {"type": "divider"}, {"type": "p", "text": "بويوكايجيك^49:"}, {"type": "p", "text": "الجو شديد الحر، والصحراء قاحلة صفراء فاقع لونه لا تسر الناظرين الماشين فوقها، رياح كأنها تهب من كل مكان لسرعتها الشديدة، في الظهيرة وشعاع الشمس الحارق المتدلي فوق الرؤوس مهاتف حبيبات الحرق المتصبب على الوجوه، النفوس متعبة، تتعجل الطريق وتتمنى الوصول قبل أن تضل معالم السبيل."}, {"type": "p", "text": "لقد اشتد التعب بمنصور ومن معه وأصبحوا غير قادرين على المسير، ولكن ما يحثهم على الصمود هو ذاته الحر الشديد؛ وهم يأملوا أن يصلوا قبل نفاد المياه التي معهم."}, {"type": "p", "text": "ها قد غربت الشمس حتى خيم الليل زوايا المكان على أرجاء تلك المدينة، وقد كان ذلك السكير الذي أتى وراءهم قد أتعبه المشي وشدة العطش والجوع، وأخذت الشمس منه مأخذا فمرض وأغمى عليه فما فاق إلا أن غربت الشمس؛ فلما أفاق نظر حوله فتملكه الخوف بادئ أمره ولكن فطن لأمر هذا الرجل الذي يتبعه."}, {"type": "p", "text": "كان منصور جالسا يتلوا بعضا من آيات القرءان، ثم لما انتهى أخذ يتأمل في النجوم وبديع صنع الله، فقال إني سقيم من هذه الرحلة الشاقة الطويلة، ليس تعبا بقدر ما هو حزن على الماضي:"}, {"type": "p", "text": "قد تذكرت صديقي الذى كان بمثابة أخي الذي لم تلده أمي، ولكن هكذا الدنيا تقول بكل فيها"}, {"type": "p", "text": "حذاري حذاري من فرقتي وخصامي."}, {"type": "p", "text": "تذكرت لما قال صديقي:"}, {"type": "p", "text": "ألا تظن أن يأتي يوم ونفترق؟!"}, {"type": "p", "text": "وها قد أتى اليوم يا أمير، أينك الان يا صديق الطفولة!"}, {"type": "p", "text": "اهٍ فذكرى شغلت تفكيري وأشعلت علي ذكريات الماضي، أبي وأمي، تلك الفتاة التي كنت أحبها؛ كلها باتت ذكريات:"}, {"type": "p", "text": "كنت جالسا أمام البيت بعد نهار من العمل شاق، ثم أتى أبي فلما راني قال:"}, {"type": "p", "text": "يا ولدي لقد أتعبت نفسك وما كدت تمدد جسدك حتى ترتاح إذ بك تقوم ولأن بقيت على حالك تلك لتفقدن نفسك، أما آن لك أن تتزوج وتستقر، فقد تعبت ومرضت وكبر عظمي وبت والقبر يناديني، أريد إن أطمئن عليك وأن أرى أطفالك قبل موتي."}, {"type": "p", "text": "أجاب منصور في عطف:"}, {"type": "p", "text": "أطال الله بقائك، يا أبتي إنما شغلت بأعباء البيت قبل أن أحمل هم زوج، فكيف بي لما أتزوج، وما زلنا نحن بهذه الحال اليسيرة بعد أن كنا ميسوري الحال، بعد تدهور التجارة؛ ان شاءلله لتعتدلن حالنا قريبا ولأفرحك يا أبي."}, {"type": "p", "text": "قال له أبيه:"}, {"type": "p", "text": "بني إنما يدبر الله أمر كل شيء قبل أن يوجد، ألا يدبر أمرك!!"}, {"type": "p", "text": "قال منصور: بلى والله"}, {"type": "p", "text": "فقال أبيه:"}, {"type": "p", "text": "إنما كل شيء بقدر الله، ففكر في نفسك من الان ولا تقلق فالله هو المدبر وهو يدبر الامر من السماء إلى الارض."}, {"type": "divider"}, {"type": "p", "text": "تذكرت إيضا تلك الكلمات التي قلتها لأمير عن الأهل والوطن لما كنا في سفرنا:"}, {"type": "p", "text": "هل اشتقت إلى وطنك إلى جلوس وسط النهر واخرى قضيت بها وقتا وحن قلبك الميال للماضي إلى ذات نهار يعج بفوضى الأهل والأقارب، إلى وطن يحن إليه القلب."}, {"type": "p", "text": "فقال أمير: لقد اعتصر قلبي الحنين الى الديار وأمي التي ما ودعتها حق الوداع، إلى تلك التي انتظرتني حتى أعود وما عدت."}, {"type": "divider"}, {"type": "p", "text": "ثم أخذ منصور يشير بأصابع اليدان إلى الوطن وكأنه يرسل إشارات الترحيب والوداع، حتى قاطع استرسال نظراته أحد الرجلان يقول هون عليك."}], "section": "story"}, {"id": 33, "title": "قونيا", "paras": [{"type": "p", "text": "فجأة غضب الشيخ وارتفع صوته في حديثه ويكأنه أمام المشهد الان، وهو يمثل مشهد اشتباك الحق والباطل، اشتباك المؤمنين والكافرين،"}, {"type": "p", "text": "حرب ضروس أشعلتها الفتن واخمدت بانتصار المسلمين:"}], "section": "story"}, {"id": 34, "title": "حدوث اشتباكات بين الحق والباطل", "paras": [{"type": "p", "text": "من المؤكد عندما تعود الخلافة لأرض القدس لن يترك الغرب الامر يحدث إلا بقتال واشتباكات ومعارك بيننا وبين الغرب اي الروم وهذه المعارك سيعقبها الهدنة، فهم لن يتركوك بسهولة تقيم خلافة وتحاول هزيمة اليهود لأنهم يعلمون أن نهاية اليهود هي نهايتهم، فتقوم بعض المعارك بين المسلمين وبينهم"}, {"type": "p", "text": "ثم بينما الغرب وهم كذلك اذ يرون أن هناك جبهة أخرى قد انفتحت عليهم، يحاربون عدو أخر من ورائهم وهذا العدو أيضا مشتركا بيننا وبينهم فلا يجدون بدا الا من عمل هدنة وصلح لكي يشتركوا في مجابهة عذا العدو الذي من ورائهم ووراء المسلمين."}, {"type": "p", "text": "ولكن يا ترى من يكون ذلك العدو الذي لم يسمه رسول الله صلى الله عليه وسلم؟"}, {"type": "p", "text": "وكيف ستكون الأحداث بعد ذلك؟"}, {"type": "p", "text": "وهل ستكون الغلبة لذلك العدو أم أن للمعركة أحداث أخرى؟!"}, {"type": "p", "text": "سنكتشف ذلك في السطور القادمة فلا تتعجل ولا تنسى فنجانك المفضل ولتتابع الأحداث."}, {"type": "p", "text": "لم يحدد في الروايات من يكون ذلك العدو ولكن هناك استنتاجات كثيرة عن كينونته، نعم لم يذكره رسول الله في أي من أحاديثه الشريفة ولكنه اشار إليه بدون الأعراب عنه."}, {"type": "p", "text": "وهذا العدو في ضوء الأحداث الراهنة من الممكن أن يكون الروافض أي الشيعة وغيرهم ممن يحملون نفس النهج وذلك لعدة وجوه."}, {"type": "p", "text": "ان الشيعة يعادون كل الأحزاب والطوائف والشرائع حتى دين وشريعة الإسلام."}, {"type": "p", "text": "فهم يعادون المسلمين من أهل سنة النبي وجماعة المسلمين المتبعين لنهج الصحابة والسلف"}, {"type": "p", "text": "قوم يدعون تحريف القرءان، ويسبون الصحابة ويحلون ما حرم الله"}, {"type": "p", "text": "فهم بهذا أعداء للإسلام والمسلمين، وما هم منهم في شيء، فمن أنكر شيء معلوم من الدين بالضرورة فهو خارج عن الاسلام. فكيف لا وهم يدعون ان من القرءان ما هو محرف، ويؤذون صحابة رسول الله صلى الله عليه وسلم، ويخوضون في عرض أم المؤمنين عائشة؛ فكيف يكون من يدعي ذلك أنه مسلم وبأي حق يكون."}, {"type": "p", "text": "ومن ناحية أخرى هم أيضا يعادون النصارى واليهود، وليعلم القارئ العزيز ان هذا التخمين يبقى مجرد اقتراح من ضمن المقترحات المبنية على الواقع المعاش والأحداث الضاربة في هذه الفترة، ونحن لا نستطيع أن نجزم بذلك، ولكننا نحاول أن نقارب التخمينات بناءً على ما يظهر من أحداث وظواهر؛ والعلم عند الله جل وعلى."}, {"type": "p", "text": "ومن الممكن أيضا أن يكون هذا العدو على مستوى الإحداث الراهنة؛ بلاد الصين."}, {"type": "p", "text": "فالصين في هذه الأحداث المعاصرة متحفزة للقتال، فنشهد تلك الأحداث المتصاعدة بين الصين وتايوان، وربما تتدخل أمريكا كطرف في النزاع."}, {"type": "p", "text": "فالذي يظهر من خلال القراءات ان هذا العدو مكانه أقرب ما يكون إلى أسيا الشرقية، قد تكون حينها متمثلة في الصين أو إيران أو غيرها من بلاد أسيا الشرقية."}, {"type": "p", "text": "ومن الممكن أن يكون قوة غير موجود الأن ثم تظهر كمثل التتار عندما ظهروا."}, {"type": "p", "text": "نخن لا نستطيع أن نجزم من يكون ولكن بناء على الواقع الحالي نجد أن أقرب ما يكون من ذلك العدو المشترك هم الروافض، أو بلاد الصين، اي منطقة أسيا الشرقية فمن هناك حتما يخرج ذلك العدو المشترك."}, {"type": "p", "text": "وعندما نرجع لأحاديث النبي صلى الله عليه وسلم نجد أنه أخبر ان المسيح الدجال سيخرج من قبل أصبها من قرية يهودية ويتبعه سبعون ألفا، وأصفهان هذه واقعة في قلب إيران معقل التشيع والبدع والروافض، فالواقع يقول إنهم سيكونون حلف كبيرة وتكتل ربما مع الصين لكي يحاربوا أمريكا واوروبا، وعندها يكون تكتلهم أقوى من أمريكا وحده مما يضرها ذلك لأن تعقد هدنة مع المسلمين آنذاك لمواجهتهم."}, {"type": "divider"}], "section": "story"}, {"id": 35, "title": "أوشاك - قونيا", "paras": [{"type": "p", "text": "هي مدينة في منطقة بحر إيجة الوسطى في تركيا ، ويبلغ عدد سكانها في عام 2022 / 236366."}, {"type": "p", "text": "يحتوي على حي تاريخي ، ومتحفه الذي يضم كنوز ليديان والأودية والآثار في المناطق الريفية المحيطة."}, {"type": "p", "text": "يطلق على أوشاك اسم \\\"بحر إيجة\\\" ولكنها تبعد 240 كم عن الساحل ، ومناخها أشبه بالأناضول."}, {"type": "p", "text": "إنه مركز نسيج قديم ، بأسلوب مميز من السجاد تم تصديره منذ فترة طويلة إلى أوروبا ، حيث أصبح Ushak مصطلحا إنجليزيا لمثل هذه السجاد."}, {"type": "p", "text": "تظهر لوحة فيرمير The Procuress أوشاك عرضت جنبا إلى جنب مع الأشياء الجيدة الأخرى لشراء الجنس."}, {"type": "p", "text": "وتشمل الصناعات الحديثة المواد الغذائية وبلاط الحمامات."}, {"type": "p", "text": "كما أن لديها جامعة ، وهناك ضجة طلابية في المركز."}, {"type": "p", "text": "يقع مسجد كيرك ميناري على بعد 100 متر شمال غرب المسجد الكبير ، وهو مبنى منخفض قصير يعود إلى عام 1826."}, {"type": "divider"}, {"type": "p", "text": "كان الصباح قد أقبل بجنوده والليل ولى هاربا وأنبجس شعاع النور لينير عتمة الليل، وهب الناس إلى مصالحهم ومشاغلهم، تلك الدينة الجميلة وما بها من أثار تاريخية، حقا أن وطننا هذا يحمل الكثير من التاريخ والأثار والعراقة:"}, {"type": "p", "text": "فإذا نظرنا وجدنا تلك المنطقة التي كانت مستوطنة من قبل الرومان"}, {"type": "p", "text": "انها (فريجيا) على بعد 34 كم جنوب شرق أوشاك."}, {"type": "p", "text": "إنها أطلال متقطعة لمستوطنة رومانية سميت تكريما للإمبراطور أوغسطس."}, {"type": "p", "text": "وذلك الجسر المسمى «جسر سيلاندراس» على بعد 38 كم جنوب أوشاك كانت قناة بناها الفريجيون حوالي 500 قبل الميلاد لتزويد مدينة بيبوزا، إنه قوس واحد بطول 24 مترا عبر وادي اسمه «خور باناز»."}, {"type": "p", "text": "وتلك المنطقة « بيوباذا» على بعد 2 كم غربا عن طريق دربه خشن من القرن الثاني الميلادي، كان مركز المونتانية، وهي طائفة مسيحية، الذين يعتقدون أن المسيح سوف ينزل على جبل قريب."}, {"type": "p", "text": "ثم اختفت الطائفة على أي حال ، مع عدم وجود علامة على المسيح على أي جبل في العالم المعروف."}, {"type": "divider"}, {"type": "p", "text": "وهنا عن الثغور وقبيل المدينة كنا نلملم متاعنا لكي نكمل الطريق فقد اوشكنا على الوصول إلى قونيا."}, {"type": "p", "text": "من بعيد ينظر أحد الرجلان فإذ به برجل ملقى على الأرض فذهب إليه ثم تبعه الاخر وكانت في رقبته معلقة قربة من الماء فارغة وفي جيبه زجاجة خمر صغيرة فارغة، ففطنوا إلى أنه قد اشتد به العطش ولم يقدر على المشي فسقط، حملاه ثم توجها به إلى مكان منصور، فلما راه أيقن أنه هو ذاته الرجل السكير الذي قد راه قبل عند الحانة، فقال في نفسه:"}, {"type": "p", "text": "أنها أقدار الله ومشيئته التي وسعت كل شيء، فقد قلت إن كان قدره أن نلتقي فلن نفترق إذا أبدا."}, {"type": "divider"}, {"type": "p", "text": "جلسوا جميعا في مظلة قبيل قونية وبعد صلاة العصر قعد منصور في اتجاه من معه ثم حمد الله وأثنى عليه بما هو أهله ثم قال:"}, {"type": "p", "text": "فليأخذ كل منا من دنياه لأخرته وليعمل بصفاء قلب ولمن له حق عليه ولا يحملنه شيء من الفرقة على الانتقاص من حقه شيء، أو أخذ حق ليس بحقه منه."}, {"type": "p", "text": "فكلنا عائدون لمستقر رحمة الله ان شاءلله وداره، وهناك لا مكان سوى جنة فليحمد الله داخلها او غير ذلك فلا يلومن انسان إلا نفسه."}, {"type": "p", "text": "واذكركم ونفسي بتقوى الله عز وجل في جميع الامور، ونسأل الله عز وجل الثبات حتى الممات."}, {"type": "p", "text": "وان يرحمنا برحمته الواسعة وان يخرجنا من هذه الدنيا الظالم أهلها إلى دار العزة والرفعة."}, {"type": "divider"}, {"type": "p", "text": "كان الوقت يقبل مسرعا نحو المغيب وكان الجو حارا قليلا، وكان منصور مهتما جدا بذلك الرجل حتى استغرب منه الرجلان؛ فما بدا لهم أكثر من كونه رجل شريد سكير لا مأوى له."}, {"type": "p", "text": "سأله منصور عن اسمه فأجاب:"}, {"type": "p", "text": "أرسلان؛ تدري أنني أعلم نظرات هذان فهم يرون أني مشرد سكير لا مأوى له والحق كذلك ما توحي نظراتهم."}, {"type": "p", "text": "ولكن إلا من شيء لم يعلماه؛ عن سبب كوني كذلك، وهي قصة قديمة لا أحب أن أذكرها ولكن إن أردت سردتها لك."}, {"type": "p", "text": "ولكني الان ومذ رأيتك قادما نحوي شعرت بانسجام إليك وكأني أعرفك من قبل، فلا أكترث لشيء الان سوى اكتراثي بأن أتغير، وإن لي في الناس خبرة في الوجوه لكثرة الخلطة وإني أيقنت فيك ما يسر، فعزمت السير وراءكم."}, {"type": "p", "text": "نظر له منصور نظرة من لامس فيه الخير ثم قال يطمئنه:"}, {"type": "p", "text": "لا عليك، هدئ من روعك وأبدأ حياتك الجديدة، فلا تثريب عليك يغفر الله لك ان شاء ما مضى ويهديك لما هو آت."}, {"type": "p", "text": "نظر إليه الرجل مبتسما وقال:"}, {"type": "p", "text": "لقد اراحني كلامك."}, {"type": "divider"}], "section": "story"}, {"id": 36, "title": "في مدينة قونيا -- تركيا", "paras": [{"type": "p", "text": "بعد أن أثنى على الله وحمده وصلى على النبي صلى الله عليه وسلم قال الشيخ علاء الدين:"}, {"type": "p", "text": "فيقوم رجلٌ من الروم فيَرفع الصليبَ، ويقول: غَلَب الصليبُ، فيقوم إليه رجلٌ من المسلمين فيَقتله، فيغدر القومُ وتكون الملاحِم......"}, {"type": "p", "text": "ثم أخذ يحدثهم عن أحداث الملحمة الكبرى والتي تسمى «هر مجدون» في التورات والتي تعني جبل منطقة مجدون بالشام:"}], "section": "story"}, {"id": 37, "title": "ما قبل الملحمة: (1/5)", "paras": [{"type": "p", "text": "ها قد باتت الأرض في جو مليء ببوادر الحروب، أصبح العالم على مقربة من الملحمة الكبرى، فبعد أن ظهر عداء تلك القوة الجديدة على الساحة والتي تهدد الروم في ذلك الوقت وأيضا هي مصدر خطر للمسلمين، فلا يجد الروم إلا عمل هدنة وصلح مع المسلمين لكي يوجهوا طاقاتهم مجتمعة لذلك العدو المشترك الذي يهدد الكتلتين الاسلامية والرومية"}, {"type": "divider"}, {"type": "p", "text": "بعد عمل الصلح يقوم ذلك الجيش العظيم المكون من المسلمين والروم لمواجهة ذلك العدو المشترك، ويذهب إليه مكانِه الموجود فيه ويواجه."}, {"type": "p", "text": "لم يقوى ذلك العدو على المواجهة، فينهزم ويفوز المسلمين والروم في تلك المواجهة على ذلك العدو"}, {"type": "p", "text": "فيسلما ويغنما المسلمون والروم، وذلك دلالة على أنَّه لا يصيب جنود هذا الحِلف أذى ، وأيضا هناك دلالة على قصر أمَد تلك المواجهة وانتهاءِ هذه الحَرب مع هذا العدوِّ بشكلٍ سريعٍ، وإلاَّ فلو كان طويلا لكن هناك خسائر من الطرفين."}, {"type": "p", "text": "عن ذي مخبر الحبشي، عن النبيِّ صلى الله عليه وسلم قال:"}, {"type": "p", "text": "((ستصالحون الرومَ صُلحًا آمنًا، فتغزون أنتم وهم عدوًّا من ورائهم فتَسلَمون وتَغنمون، ثمَّ تنزلون بمَرج ذي تلول فيقوم رجلٌ من الروم فيَرفع الصليبَ، ويقول: غَلَب الصليبُ، فيقوم إليه رجلٌ من المسلمين فيَقتله، فيغدر القومُ وتكون الملاحِم، فيَجتمعون لكم فيأتونكم في ثَمانين غاية مع كلِّ غاية عشرة آلاف))؛"}, {"type": "p", "text": "فبعد أن يتحقق الانتصار تَنزل الجيوشُ بأرضٍ فسِيحة ذات نبَات منتشِر على مساحةٍ كبيرة، وفيها مرتفعات ليسَت شاهِقة الارتِفاع، وهي أُولى أمارات هذه الحَرب الوارِدة في الحديث وهي التي تسمى ذي «بمرج»،"}, {"type": "p", "text": "فيقوم رجلٌ من الرُّوم فيَرفع الصليبَ، ويقول: غلَب الصليبُ، فذلك القول إشارة على أنَّها حرب صليبيَّة في باطِنها ضد هذا العدو، وفيه من الدلالَة على أنَّ الروم سيكونون أصحابَ قولٍ وصوت، والتحدُّث بعد المعركة من نصيبهم، وهذه ثاني أَمارة من أمارات هذه الحرب الوارِدة في الحديث."}, {"type": "p", "text": "فيقوم إليه رجلٌ من المسلمين فيَقتله، وهذه ثالث أمَارة من أمارات هذه الحرب الوارِدة في الحديث؛ وهي مَقتل هذا المتحدِّث الذي سيقول: غلبَ الصَّليب."}, {"type": "p", "text": "وعند إذ يَغدر القومُ وتكون الملاحِم؛ وهذا دلالة على بَدء حروب متتالِية وليسَت حربًا واحدة."}, {"type": "p", "text": "وينزل الروم بدابق وهو ذلك المكان الذي ستتقابل فيه الجيوش استعدادا للملحمة الكبرى، وذلك للقاء جيش المسلمين كما أخبر النبي-صلى الله عليه وسلّم- في الحديث، حيث ستشهد تلك الرقعة من الأرض أضخم وأعظم الحروب على مر التاريخ، فكيف ستسير الأحداث؟!"}, {"type": "p", "text": "وما مصير الجيشان؟ وإلى من ستكون الغلبة؟"}, {"type": "p", "text": "وما النتائج المترتبة على ذلك؟!"}, {"type": "p", "text": "كل ذلك سنكتشفه في ما هو قادم فلا تتعجل عزيزي القارئ ولتتابع بصحبة فنجان قهوتك اللذيذ."}, {"type": "p", "text": "ولكن قبل ذلك دعنا نعود لمدينة قونيا حيث ننظر لسير الأحداث مع منصور وأرسلان....."}, {"type": "divider"}, {"type": "p", "text": "مدينة قونيا التركية:"}, {"type": "p", "text": "ننتقل إلى قونيا لنكمل قصة منصور وأرسلان ووصولهم إلى مدينة قونيا تلك المدينة التي تتميز بروح البساطة في جميع شئون الحياة اليومية، فهذه المدينة تشتهر بتقاليدها وثقافتها الإسلامية الصوفية التي تحض على التواضع والزهد؛ ويمكننا أن ندرك ذلك من ملاحظة تلك السمات الشخصية في اسلوب المدينة وفي النشاطات الثقافية التي تقام."}, {"type": "p", "text": "ها قد وصل منصور ومن معه وأرسلان إلى مدينة قونية أخيرا بعد مسيرة طويلة دامت لأكثر من شهر."}, {"type": "divider"}, {"type": "p", "text": "قال أرسلان: يا منصور إن لهذه البلدة رائحة جميلة وبها راحة نفسية، فلا أدرى هل عقلي يوهمني أو أن ذلك حقيقة، ولكن ما أعرفه أنني أشعر براحة البال."}, {"type": "p", "text": "قال منصور: معك حق أنا الاخر أشعر بذلك."}, {"type": "divider"}, {"type": "p", "text": "انطلق أرسلان في رحاب المدينة وقد ترك الجميع وذلك بعد أن وصلوا بوقت قليل، فهو شخص يحب استكشاف الأماكن."}, {"type": "p", "text": "أخذ يتمشى في نواحيها، ينظر في وجوه الناس، يمشي مسرعا تارة وتارة يبطئ، ينظر لتلك الفتيات الصغيرات التي تقف على حافة النهر، يمشي بجانب طفل صغير كان متجه لمنزله، ودعه بابتسامة."}, {"type": "p", "text": "يصعد مرتفعات وتلال خضراء، ووديان، بحيرات صغيرة متناثرة، فما أجمل المناظر الطبيعية ها هنا، ولما أتعبه المشي جلس بقرب نهر في منتصف المدينة."}, {"type": "p", "text": "لما نظر وراءه وجد أنه قد ابتعد كثيرا عن جماعته؛ ولكنه كان غير قلق فهي عادته التي أكسبته الخبرة بكيفية التصرف في الأماكن الجديدة عليه."}, {"type": "p", "text": "اذن لصلاة العصر فقام أرسلان من مكانه وذهب باتجاه المسجد بعد أن عرف مكانه."}, {"type": "p", "text": "وعلى الجانب الأخر كان منصور ذاهبا لأقرب مسجد منه، صلى ثم جلس قليلا يذكر الله...:"}, {"type": "p", "text": "اللهم أنت السلام ومنك السلام تباركت يا ذا الجلال. الإكرام، اللهم أعنا على طاعتك والهمنا سبل الرشاد، فإنا بك لنا قوة وعزما وإن تركتنا لأنفسنا تفرقت بنا السبل؛ فاهدنا لما اختلف فيه من الأمر، وأرنا الحق واضحا وجنبنا الفتن ما ظهر منها وما بطن، وجنبنا اللهم الفتن، جنبنا اللهم الفتن؛ فهي كقطع الليل المظلم."}, {"type": "p", "text": "وهناك حيث انتهى أرسلان من الصلاة، قعد ليستمع لشيخ المسجد، ولقد أثر فيه شكله وهيئته ووقاره قبل منطقه؛ وعندما تحدث كان كلامه جميلا لدرجة أنه أحس بقرب ذلك الشيخ منه ويكأنه لقيه في مكان ما قبل ذلك وشعر بأنه يعرفه وأن روحه تألفه."}, {"type": "divider"}, {"type": "p", "text": "كان ذلك الشيخ علاء الدين أحسنت عزيزي القارئ فقد ظننت أنك قد ربط وجود الشيخ علاء الدين بقونيا وهو أمام مسجدها الكبير، فهو مفتيها، وله من العلم اتساع ومن المنطق حلاوة؛ رجل مبارك وعالم جليل."}, {"type": "p", "text": "فقد أصغى له وهو يستأنف كلامه عن هر مجدون «الملحمة الكبرى» حيث أكمل كلامه عن بداية الملحمة:"}, {"type": "p", "text": "نبوءة دابق ^50"}, {"type": "p", "text": "تطوع القمر لينير عتمة الطريق، الجو في خفوت وهدوء تام، كل الأماكن مظلمة إلا من ضوء القمر الخافت، وفي منتصف الليل يتطرق إلى سمعك أصوات حوافر الخيول والأقدام، تهتز الأرض معلنة عن ولادة حالة من الغبار الكثيف، فذلك هدوء ما قبل العاصفة؛ إنه جيش عظيم، تعداد جنوده فوق الثمانمائة ألف."}, {"type": "p", "text": "قد اهتزت الأرض من كثرة الخطى، يزحف أولئك الجنود القادمين تقريبا باتجاه فلسطين تحديدا ينزلون بمكان اسمه دابق «الأعماق»^51 وهو بالقرب من حلب بشمال سوريا جيش كبير يتكون من ثمانين راية تحت كل راية اثنا عشر ألفا، قد تجهزوا لقتال المسلمين بعدما غدروا وذلكم عندما كانا يحاربا في صف واحد، ولكن كل فريق كان يقاتل باسم معتقده، وان أبطنوا ذلك وصرحوا بالصلح ولكن تبقى نية المرأ هي غايته والمعول عليها."}, {"type": "p", "text": "فيَجتمعون للمسلمين، ويأتون في ثمانين غَاية^52، مع كلِّ غاية اثنا عشر ألفا."}, {"type": "p", "text": "فيجتمع هؤلاء لمقاتلة أهل الإسلام بجيش كبير كله من الروم، فالأمر بات الان منقسم لفسطاطين كما أخبر رسول الله صلى الله عليه وسلم."}, {"type": "divider"}, {"type": "p", "text": "ترى الجيوش قادمة من بعيد في حالة تأهب واستعداد، فلا شك في ذلك فهم نقضوا عهد الهدنة بعد أن انتصروا على عدوهم، فأعلنوا ما في باطنهم من نوايا فكانت حربهم وهدنتهم يومئذ في باطنها حرب رومية."}, {"type": "p", "text": "وذلك عندما رفع جندي رومي الصليب بعد أن أتم الله علينا النصر على ذلك العدو المشترك؛ عادوا لعهدهم وأظهروا بواطنهم ليقول رجل منهم:"}, {"type": "p", "text": "غلب الصليب، غلب الصليب، غلب الصليب."}, {"type": "divider"}, {"type": "p", "text": "عند ذلك تكون النوايا قد أصبحت معلنة، والأهداف واضحة، والغايات منكشفة، ولا شك في ذلك فهم أبدا لن يقاتلوا بما يقاتل لأجله المسلمون، ولكنهم اجتمعوا في جيش واحد للتخلص من عدوٍ كان من الممكن أن يقضي عليهم إذا ما واجهوه بمفردهم؛ فألجأتهم الضرورة والحيلة للصلح."}, {"type": "p", "text": "وقف الرجل المسلم الغيور على دين الله، واستشنع ذلك الانتساب؛ ان ينسب الغلبة والانتصار للصليب وليس لله وحده وأخذته الحمية، فقام للصليب ودقه^53."}, {"type": "p", "text": "فماذا يفعل هؤلاء وقد كسر صليبهم غير ما يجدون من قتل؛ فتكاثروا على ذلك الرجل فقتلوه، فتشابك معهم المسلمون ممكن كانوا في هاتين الفرقتين بهذا المكان، حيث لم يكن ذلك الجيش كله بل فرقة من الجيش."}, {"type": "p", "text": "وبعد تلك المعركة أخذت الحرب منحى أخر بعد أن كان القتال معًا أصبح ضد."}, {"type": "p", "text": "ثم يغدرون ليجتمعوا في جيش كبير يبغون قتال المسلمين؛ فيعودون لأصل العداوة وما كان قبل من قتال بينهم، فهم في أصل كل ذلك يكرهون هذا الدين وأهله وإنما ألجئهم ما يسوس الحروب من المعاهدات والهدنة؛ فالهدنة أمر عارض؛ ثم يجمعون لأهل الاسلام ويجمع لهم أهل الإسلام."}, {"type": "divider"}, {"type": "p", "text": "توقف الشيخ جلال الدين فجأة لما رأى رجلان كانا قاعدين يستمعان وإذ بهما يقومان بلا استأذنا من المجلس، فنظر إليهما وقال في رفق لبعض الجالسين نادوا عليهما."}, {"type": "p", "text": "رجعا لمكانهما ووجههما يتساقط خجلا ثم قالا معتذرين:"}, {"type": "p", "text": "نحن أسفان على المقاطعة."}, {"type": "p", "text": "فأجاب عليهما بصوت هادئ يبدو عليه التودد والنصح والإرشاد فقال:"}, {"type": "p", "text": "يا أبنائي الأعزاء اعلموا رحمني الله وإياكم أن من أداب مجلس العلم ألا تقوم وشيخك يتحدث أو يقرأ من كتاب عليك أو يتلوا، فينبغي على طالب علم ان يحترم وقت جلست العلم، ولا يذهبن من نفسه إلا اذا كان هناك ما يلزم، ويستأذن، فمجالس العلم يتعلم فيه الأدب والآداب قبل تعلم العلوم، وقد تجد في الكتب ومن البحث ما تجده هنا ولكنك أبدا لا تجد فيها رقائق الأدب وفنونه."}, {"type": "p", "text": "وكان الاثنان ينظران إليه وإلى الحضور في استحياء، فسألهما إن كان هناك ما هو ضروري للذهاب فقالا:"}, {"type": "p", "text": "نحن أخوان وقريتنا بعيدة قليلا وأمنا متعبة قعيدة، وكنا قد تجولنا اخذين على عاتقنا شراء الدواء لها والعودة، ولما اذن للصلاة دخلا وصلينا فلما اسمعنا لكم أعجبنا حديثكم؛ ولكنا تذكرنا أمنا فهممنا بالخروج، ولم نستطع الاعتذار للوقت والمسجد مزدحم."}, {"type": "p", "text": "فنظر إليهما في لطف وتحزن وقال:"}, {"type": "p", "text": "لا بئس عليكما، وشفى الله أمكما شفاء لا يغادر سقما."}, {"type": "p", "text": "وأخذ يدعو لهما وقال للناس ادعو لأخيكم قضاء حوائجه، وسمح لهما بالذهاب ثم عاد مستكملاً حديثه قائلا:"}, {"type": "p", "text": "لقد هاجت ريحٌ حمراءُ بالكوفةِ، فجاء رجلٌ ليس له هجِّيرى^54 ينادي على عبد الله بن مسعود:"}, {"type": "p", "text": "إلاَّ يا عبدَالله بنَ مسعودٍ، جاءت الساعةُ."}, {"type": "p", "text": "فقعد وكان مُتَّكئًا وقال:"}, {"type": "p", "text": "إنَّ الساعةَ لا تقومُ، حتى لا يُقسَمَ ميراثٌ، ولا يُفرح بغنيمةٍ."}, {"type": "p", "text": "ثمَّ قال بيده هكذا ونحَّاها نحو الشَّامِ فقال:"}, {"type": "p", "text": ": عدوٌّ يَجمعون لأهل الإسلامِ ويجمع لهم أهلُ الإسلامِ\\\"."}], "section": "story"}, {"id": 38, "title": "ما قبل الملحمة: (2/5)", "paras": [{"type": "divider"}, {"type": "p", "text": "فيكون معسكر المسلمين بأرض الغوطة^55 بمدينة يقال لها دمشق؛ وهي خير منازل المسلمين يومئذ كما قال عليه الصلاة والسلام."}, {"type": "p", "text": "فقد ذُكر مكانها في حديث أبي الدَّرداء رضي الله عنه، أنَّ رسول الله صلى الله عليه وسلم قال: ((فُسطاطُ المسلِمين يوم المَلْحمَةِ الكُبرى بأرضٍ يُقال لها: الغُوطَة، فيها مَدينةٌ يُقال لها: دِمشق، خير منازلِ المسلِمين يومَئِذٍ))."}, {"type": "divider"}, {"type": "p", "text": "في هذا الحَديثِ يُخبِرُ النَّبيُّ صلَّى اللهُ عليهِ وسلَّم عن حدَثٍ يقَعُ مُستقبَلًا؛ وهو فتْرَةٌ يكونُ فيها بين المسلِمين والرُّومِ صُلْحٌ، ثمَّ يَقومُ القِتالُ بين المسلِمين والرُّومِ بعد نقْضِهم العهْدَ الَّذي بينهم وبين المسلِمين."}, {"type": "divider"}, {"type": "p", "text": "\\\"فيَثورُ المسلمون إلى أسلِحَتِهم فيَقتَتِلون مع الرُّومِ، فيُكرِمُ اللهُ جماعَةَ المسلِمين الَّذين يُقاتِلون الرُّومَ بالشَّهادَةِ في سَبيلِه."}, {"type": "divider"}, {"type": "p", "text": "انتهى علاء الدين من بعض أحداث الملحمة الكبرى «نبوءة دابق»، ثم عاد لبيته، ولكنه ما إن وصل للبيت حتى وجد بعضا من جنود المقاطعة، يطلبون منه المثول بين يدي رئيس المقاطعة."}, {"type": "p", "text": "لما راه قائد الجند قال له في نظرة حازمة:"}, {"type": "p", "text": "لم نشأ أن نأخذك من المسجد وسط تلاميذك يا شيخ فقد رأينا أن ذا منافيا للأدب."}, {"type": "p", "text": "فرد عليه قائلا:"}, {"type": "p", "text": "ونعم الأدب يا سيد الجند"}, {"type": "p", "text": "ثم أمر الجنود لكي يأخذوه إلى مركز القضاء."}, {"type": "divider"}, {"type": "p", "text": "على الجانب الأخر نجد أرسلان قد عاد إلى منصور ثم أخبره بذلك الشيخ وما كان من حديثه، فلم أخبره بصفاته أبتهج لشيء كهذا وقال لأرسلان:"}, {"type": "p", "text": "إذا كنا من الغد فخذنا إليه ودلنا على مسجده وبيته."}, {"type": "p", "text": "تفكر أرسلان قليلا ثم أخبره بالذي حدث معه، فقال له منصور:"}, {"type": "p", "text": "ولماذا يقبضوا عليه ما الذي فعله؟!"}, {"type": "p", "text": "فقال له أرسلان: لا أدري ولكن أعتقد أن الأمر له علاقة بما يلقيه من دروس في مسجده."}, {"type": "p", "text": "قال منصور: وما طبيعة الدروس ؟!"}, {"type": "p", "text": "فرد عليه أرسلان وقال: أحسب أن لها علاقة بالأمور السياسية وتكشف عن مخططات لدول عظمى."}, {"type": "divider"}, {"type": "p", "text": "ها قد ودع هاذان الرجلان الذين كانا مع منصور وأرسلان وذهبا لتجارتهما، فقد كان تاجرين من بلاد الشام وبالتحديد من سوريا."}, {"type": "divider"}, {"type": "p", "text": "لقد مر يوم كامل والشيخ علاء الدين منتظر لأطلاق سراحه، وزوجته جوهر تنتظره خارج غرفة التحقيق."}, {"type": "p", "text": "لما انقضى الأمر خرج فأمسك بيدها ثم ذهبا للمنزل."}, {"type": "p", "text": "وبعد يوم طويل وبعد المغرب قبيل صلاة العشاء كانا جالسين يتناولان الطعام فافتتحت جوهر موضوع مركز المقاطعة وسألت عن ما جرى"}, {"type": "p", "text": "فأجابها قائلا: لا شيء لا تزعجي نفسك."}, {"type": "p", "text": "قالت: كيف أفلا أعرف عنك ما حدث ألست زوجتك."}, {"type": "p", "text": "فقال لها: لما وصلت للمركز ودخلت غرفة التحقيق جاءني ضابط وسألني عدة أسئلة من ضمنها:"}, {"type": "p", "text": "هل لك علاقة بأي طائفة أو تنتمي لمذهب، أو تنظيم سياسي أو حزبي"}, {"type": "p", "text": "فأجبته قائلا: طيلة مدة حياتي في مسجدي هذا لم يعرف عني الناس شيئا مما تقول، وأن لم تكن مصدق فسل من تشاء من رواده."}, {"type": "p", "text": "فقال الضابط: تعرف أين من الجهات العليا أو الدولية أو تعرف حقائق قد تكون مثلا مصدر خطر لأحد؟!"}, {"type": "p", "text": "فأجاب علاء الدين: أنا يا سيدي فلا أتحدث في ما يخص السياسة ولا يعنيني أمرها؛ وكل ما أذكره فهو من كتاب الله وسنة نبيه صلى الله عليه وسلم، فهل في كتاب الله والسنة ما يهدد أحدا!!"}, {"type": "p", "text": "فقال الضابط: من المؤكد لا."}, {"type": "p", "text": "ثم طرئت لحظات من التفكير وهو ينظر إلي جلال ويرمقه بعيون حادة مكتوب عليه تساؤلات عدة، ثم أردف قائلا:"}, {"type": "p", "text": "ما هذا الكلام الذي كنت تحدث الناس به هل لديك مخطط."}, {"type": "p", "text": "فرددت عليه بأن ما أقوله
